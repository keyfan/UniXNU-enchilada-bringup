findings = ["schema_version = 2 was evaluated and rejected for this round: config.py:137-156 and profiles.py:22-34 move the output tree to out/enchilada/<os_profile>/<config>/ and require a UniXNU-sdm845-common SoC feed (profiles/ is absent), while kernel-unixnu-build.yml:73,160-188,256,272,281,292 hard-code out/enchilada/...; migrating would break the only working CI build.", "os_profile is nevertheless recorded in [board] because porting-record.py:65 requires device.os_profile == board.board.os_profile; grep confirms all os_profile reads are inside the schema_version == 2 branch, so the key is inert under format 1.", "iOS 16 migration (NOTES-ios16.md) is deferred: 21H461 is the only device-verified OS asset; switching invalidates the prelink pin, trust cache, Data seed, ADT and every evidence revision."]
completion = ["board.toml, defconfig, XNU patch series and CI inputs all resolve to a reproducible kernel; kernel_sha256 of the downloaded kernel.macho equals payload.json; the record checker passes."]
limits = ["Format 1 board.toml with no [components] include: the selected-component coverage check is trivially satisfied; upstream feeds are pinned by commit rather than by the schema-2 profile system.", "Local git HEAD c3bed61 predates the staged working tree; the CI builds from the GitHub Git Data API push, not from local git history."]
next_action = ["After all 8 stages are implemented, plan a separate milestone to add UniXNU-sdm845-common (soc.toml + dts/sdm845.dtsi + configs + patches/xnu/series), convert to schema_version = 2 and update the CI output paths together."]
