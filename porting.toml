  { kind = "source", reference = "package/EnchiladaBacklightProbe.cpp", result = "Stage 3 layer 3b: enchilada-backlight=3 FIRST-WRITE mode added; mode 1 (st=3, device-verified) and mode 2 (st=4 Bypass, device-verified) byte-for-byte unchanged per static diff vs f566e737. Mode 3 allocates a 64-byte low IOBufferMemoryDescriptor DMA buffer (Dwc3Gadget.cpp:204-218), maps 0xae94004, supplies dc civac+dsb sy clean + CPU-spin delay, and calls msm_dsi_brightness_send() ONCE (level 512). The 32-bit DMA_BASE gate decides on-device (st=5 OK / st=-2 AddrTooHigh / st=-4 timeout). No IOService subclass, no late-object objcopy. Includes <kern/task.h> + IOKit headers for real CI XNU SDK." },
  { kind = "source", reference = "https://github.com/keyfan/unixnu-build/actions/runs/42378048594", result = "CI run #210 (completed success): Build kernel step success, 20/20 archive logs with 0 error:/warning:, archive-20-build-enchilada-msm-dsi.log -> PASS: libEnchiladaMsmDsi.a (6 objects, sha256 88035f4e1eeb4bef); kernel.macho sha256 5022f801045973055c422bfd23b93c78a05d7b51791034b37871dd3d3482c1b3 == payload.json kernel_sha256, and the binary contains msm_dsi_brightness_send / msm_dsi_brightness_publish / ioDelayUsSpin / cleanDma / gTransmitDone / IOBufferMemoryDescriptor (mode-3 shim force-loaded end to end)." },
  { kind = "device", reference = "evidence/backlight210mode3.md", result = "CI #210 kernel (c745da6776d4) flashed with enchilada-backlight=3: 510 boot-log L rows all st=5 (Tx), lvl=512, dma_len=8, dma_addr_lo=0xae01a000 (physical, BELOW 4 GiB), rc=0, sent=1, addr_high=0, dma_err=0. The FIRST real DCS brightness packet was committed ONCE to the DSI0 CMD-DMA engine and completed; the 32-bit REG_DSI_DMA_BASE gate PASSED so no stage-1 SMMU IOVA fallback is needed. Two independent verifiers PASS (packed decode + raw-field re-derivation, max(sent+addr_high+dma_err)=1 one-shot); fresh boot_id 551969512; controls console206 st=0 / backlight208 st=3 / backlight209mode2 st=4 unchanged. Does NOT prove a measured brightness change (no readback) nor continuous control (one-shot level 512) nor any OS-facing AppleARMBacklight IOService.", command = "python scripts/test-cycle.py backlight210mode3 --wait-return 900", revision = "c745da6776d4d36d02b272689e6b77e7a05d1626" },
  { kind = "source", reference = "scripts/check-enchilada-applearmbacklight-metaclass.py", result = "Stage 3 layer 3d prerequisite HOST verifier (read-only, reproducible, CHECK_EXIT=0): byte-scan of stock iPad7,1 kernelcache + CI #210 built kernel for AppleARMBacklight / backlight-control / IODisplayParameters / IOClass personality / method symbols / site.AppleARMBacklight records, plus four device ADT copies for a backlight nub. Settles metaclass-exists and no-instance-clash risks before writing the IOService." },
  { kind = "source", reference = "evidence/applearmbacklight-metaclass.md", result = "Layer 3d prerequisite finding (host-verified, static, no flashing): AppleARMBacklight metaclass EXISTS in both the stock kernelcache and the CI #210 booted kernel (13 hits, 3 site records), the built-in class is fully implemented, and the device ADT has no backlight nub so no instance clash. Proves / Does NOT prove (runtime getMetaClassWithName, IOObjectConformsTo, CoreBrightness, backboardd, brightness readback all still need layer-3d CI + device verification)." },
