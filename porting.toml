  { kind = "source", reference = "NOTES-touch.md", result = "Touch/probe design notes." },
  { kind = "device", reference = "evidence/console206.md", result = "Boot log line B st=0 irq=0 rep=0 ... documents the input probe; the boot completed with userland running.", command = "python scripts/test-cycle.py console206 --wait-return 900", revision = "7eeda1e01aa906ff3b2ac5fa58fdcfd244701c59" },
  { kind = "device", reference = "evidence/stage4-welcome.md", result = "CI #211 kernel (23d2428b69d5) flashed as stage4welcome with enchilada-backlight=4 + full dataswipe touch chain (995/1000 B): 510 L rows all st=7 (backlight Published, max=0x3ff) AND [touch edge] installed=1 contacts=4 from_edge=4, TOUCH HID touch-reports=337 result=0, [touch] strokes=4 extent x 1522..1522 y 0..2031 in ONE fresh boot (boot_id 548302479, uptime 898 s, slots 1737, write_errors 0). FT5 hid up1 chk897 rep337 res0 n337 edge1/4/4 svc897 open1 eso1 uc1 tdm- pub1 mapL1080x2280. The flash command returned CYCLE_EXIT=1 only because enchilada-deadline=900 made the watchdog auto-return land at ~941 s beyond the 900 s wait window; the phone did return to recovery and the log window was collected READ-ONLY (no reboot, no reflash). Two independent device verifiers PASS; controls console206 st=0 / backlight208 st=3 / backlight209mode2 st=4 / backlight210mode3 st=5 / backlight211mode4 st=7 unchanged. Does NOT prove first-run Setup Assistant advance (no Setup process line, no optical readback) nor CoreBrightness acceptance (req=0); the CoreImage GLContext crash has no literal log evidence (244 logs scanned, real CRASH rows are PerfPowerServices sig6) - see evidence/stage4-welcome.md for the honest Proves / Does NOT prove list.", command = "python -X utf8 oneplus6-ios/scripts/test-cycle.py stage4welcome --wait-return 900", revision = "4bd917b8a6d4d7c64bafac286b3e1a5be26d8f87" },
