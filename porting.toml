  'ROUND 20 + ROUND 21 REFINED BLOCKERS (replacing the old "three signed A630 firmware blobs / Turnip compiler support" and the WRONG "GPU SMMU SID/mask UNVERIFIED (DTS 404)" wording): (a) the public linux-firmware blobs are not sufficient - the signed ZAP .mdt/.b00/.b01 MDT segment chain and TrustZone PAS auth (GPU_PAS_ID 13) are device-vendor-only; (b) a NEW A6XX_GEN1 kernel backend is still required: legacy GMU HFI v1 (a6xx_hfi.c version 1.10, flat-ITCM load, SPTPRAC 0x778000, RPMh/PDC pdc_address_offset 0x30080), A6XX CP/IRQ/ring (upstream versions are A7XX-only), and a replacement for the GEN2 ShengGmu.h cold-start layer; (c) the UniXNU wire ABI is generation-independent, so the OS Metal/IOSurface ABI + Turnip/IR3 compiler are NO LONGER generation blockers; (d) there is NO chip-id register - chipid is a DT equality. The GPU SMMU SID/mask/context bank are now VERIFIED AT BOARD LEVEL (Round 21, dedicated kgsl SMMU 0x5040000, single-cell SIDs 0/2,1/4/5) - the earlier "UNVERIFIED because the board DTS could not be fetched" is RETRACTED. Until (a)+(b) exist AND a device read confirms the kgsl SMMU is live, stage 5 cannot become device-verified.',
