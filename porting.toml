  "ROUND 178（rail-on 握手形状）: #285 / run 44115787915（分支 r178-rail-on，commit e4546974）；kernel 191c69c52f65c685ffff315aef31e064fd29779762536db21a21fe3cc8e962d2，CI payload 65338ecca680f74777476ba9b916a1c8607fb4ff9a663d09ce7f34e7d8e98718；键 22 NEW LOG boot_id 547712722 窗口 b1e28fee…，行 gmurail=pre=00000000 ack=0 polls=400000 post=00800000 slumber=00000000 hfipre=00000000 hfi=00000000 ok=0；键 23 NEW LOG boot_id 547212046 窗口 bd352d04…，行 gmurail2=… polls=1000 ok=0；结论：HFI_CTRL_INIT=1 本身不致死，致死的是「握手之前」的那次 store；固件仍 ack=0 / CM3_FAULT=00800000 / HFI 未初始化；下一个缺口是上游第一件事 a6xx_rpmh_start()（RSCC REQ/ACK/SEQ_BUSY），本仓库从未实现。",
  "ROUND 179（rpmh_start + sptprac）: #286 / run 44200606987（分支 r179-rpmh-start，commit 8ecde9d2）；kernel 92f76066dafa9f9359a83621048086d0ff7187dba7a5d6e4399e8b74a7356d2c，CI payload c66dffccba2afacfaacfc9e4f075ae81f2147e3aee6c081ebc84680a8aa9d691；键 24 NEW LOG boot_id 552735802 窗口 d401f8c0…，行 gmurpmh=pre=00000000 ack=00000000 apolls=400000 busy=00000000 bpolls=0 ok=0；键 25 NEW LOG boot_id 561907766 窗口 e5d46018…，行 gmusptp=pre=000000d4 stat=000000d4 polls=400000 ok=0；两轮 gmurail2=ack=0 post=00800000；结论：两组写操作安全但无效；新线索是 enchilada.dts 有 qcom,cmd-db@861e0000，可读出 gfx.lvl 算 arc vote，不必猜电压档。",
  "ROUND 180（只读 RSC 页）: #287 / run 44216700269（分支 r180-rscc-read，commit f11228fc）；kernel 7b575e84241c8c1a402377b651b7f7f8ca533b7da199b34ed8e7d5ea18ae2067，CI payload 977648f43ec4220998b71a250da53ddcae68ba869f913d24e5ef920a7b976783；键 26 NEW LOG boot_id 584538485 窗口 574dfc99…，行 gmursc=ack=00000000 busy=00000000 mem0=00000000 st0=00000000 ovr=00000000 tcs0=00000001 fwinit=babeface reset=00000000 sptp=000000d4 intr=00000000 ok=1；结论：RSC 页有背衬（tcs0 非零），但 ACK 仍不置、CM3 仍 babeface；排除地址错/窗口未实现/CM3 死亡三条，arc vote 缺失成为首选假设；并更正 R179 关于 rd32 offset 的错误判断。下一步读 qcom,cmd-db@861e0000 算 vote。",
  "evidence §二十九..§三十二：cmd-db 两候选全否（R181/R182）、配齐再脉冲使 CM3 干净（R183）、干净状态下 HFI_CTRL_INIT 致死（R184）",

