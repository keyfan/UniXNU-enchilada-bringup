  { kind = "device", reference = "evidence/backlight208.md", result = "CI #208 kernel (2ba47b86853b3b1d) flashed with enchilada-backlight=1: 510 boot-log L rows all st=3 (Mapped), req=336..600 (1 Hz polls), live DSI0 registers CTRL=0x1f5 (CMD_MODE_EN, 4 lanes), CMD_DMA_CTRL=0x14000000 (FROM_FRAME_BUFFER|LOW_POWER), TRIG_CTRL=0x4 (TRIGGER_SW), CMD_CFG0=0x100008 (RGB888), CMD_CFG1=0x13c2c (0x2c/0x3c, INSERT_DCS), CLK_CTRL=0x23f (ENABLE_CLKS) — every row matches mainline dsi_ctrl_enable() command-mode programming, 0 violations. Control console206 has 510 all-zero L rows. Proves XNU maps/reads firmware-owned DSI0 at 0xae94004; no register write and no DMA in this stage.", command = "python scripts/test-cycle.py backlight208 --wait-return 900", revision = "2ba47b86853b3b1d0348daf0a8b549dc881700aa" },
