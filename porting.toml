  '[ROUND 63 2026-11-12, HOST-VERIFIED] The round-62 executor finally has a producer for its MMIO triple. AdrenoGpuccWindowV1 is the bounded window adapter (the shape sheng uses, with A630 content): Bind(base, bytes) + SetDelay(cookie, fn) kept separate so read-only callers need not invent a delay, Resolve(byte_offset, out) enforcing three bounds, Mmio(w, out) refusing when no delay was supplied because round-62 apb_poll delays on every iteration, and Verify(44 checks). THE FINDING: the device tree node for gpucc@5090000 declares reg = <0x0 0x9000> and round 61 carried that size, but gpucc-sdm845.c registers its regmap with max_register = 0x8008, so the last ~4 KiB of the node is not driver-addressable. Usable size is therefore derived as min(bytes, max_register + 4) = 0x800c and is computed in the C, not written as a literal; bound 2 (offset + 4 <= bytes) cannot catch this because 0x800c..0x9000 is inside the mapping, which is exactly why bound 3 exists. Constants derive from ADRENO_CLK_CTL_V1_GPUCC_MAX_REG / _GPUCC_SIZE so rounds 61 and 63 cannot drift. Second finding, recorded because it is a live trap: AdrenoGmuBusV1Resolve takes WORD offsets (word_offset << 2 at AdrenoGmuBusV1.c:27) while the round-61 clock plans take BYTE offsets (0x1120 means GPUCC+0x1120); the header states the byte convention and the integration test asserts the parked CFG word 0x0602 arrives at 0x1124, so crossing the two conventions fails loudly. Verification: 18 host suites / 0 failures with the new 91-check suite, GPUCC_WINDOW_V1_CROSS PASS (30 checks, re-derives min(0x9000, 0x8008+4) in Python and asserts the production code holds no 0x800c literal), strict freestanding arm64 Mach-O exit 0 / 1368 bytes / magic 0xfeedfacf / cputype 0x100000c / 6 exports, check-enchilada-probe.py 18/18, archives-linked PASS 7, check_hardware_claims.py at its 21-problem baseline with zero new hits. Also corrected round-62 record drift: AdrenoPowerUpBackendV1 was missing from build-enchilada-adreno.py source_sha256 despite being recorded as added; both it and the new module are now in the object list and that set. STILL NOT BUILT: libEnchiladaAdreno.a cannot be produced here because build/xnu/ios-obj is absent, so the archive is wired but unbuilt, and the strict compile is the substitute. No device evidence: adb shows 27f4f45d in TWRP recovery with no /dev/mem, no /dev/kmem, empty /sys/kernel/debug, no regmap debugfs, no /proc/config.gz and kptr_restrict=2, so there is no safe userspace way to read a GPUCC register. NEXT: the IOKit caller - an IOService that owns the mapping, calls AdrenoGmuCallerV1Precheck first (the round-22/28 gate, which this module deliberately does not enforce), then AdrenoGpuccWindowV1Bind, then AdrenoPowerUpBackendV1Make/Up; without that caller these layers still exist but are never connected.',
