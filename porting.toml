AS REPORTED EARLIER THIS ROUND AND DID NOT RECUR: it PASSES 24/24 rc 0 here, as it does in the full sweep, so it was TLS flakiness against the GitHub API and not a defect. Counts re-derived from source rather than quoted: build units 31 = 1 cpp_rec + 30 c_rec, host TESTS 31, host SOURCES 30, verify-*.py 71. The zap-auth cross verifier is at 306 checks (its ROUND 107 baseline was 281), the increase being the new Domain A12 block. CONFIG_XNU_NATIVE_ADRENO stays n, ArmCpu.cpp stays 60624 B, and no verify-ci-*.py was modified. INDEX HYGIENE, RECORDED BECAUSE IT BIT THIS PROJECT TWICE: at the start of the integration 8 files had an index that no longer matched the worktree, which this push mechanism turns into SILENT data loss rather than an error, since the script takes the PATH LIST from the index and the CONTENT from the worktree. All 8 were restaged and each verified with git ls-files -s against git hash-object before the push; the index is now 520 files with zero work/ paths. HONEST BOUNDARY UNCHANGED: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0, and none of this unblocks stage 5. Correcting a call shape is not calling anything: the secure world has still never been asked, and the three-stage chain has still never run. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and the token file location; recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 107 2026-11-14, HOST-VERIFIED / SURVEY + CONTRACT, NOTHING EXECUTED] ROUND 107 answers one question and closes one compliance gap: WHERE the signed ZAP chain would be loaded, HOW MANY BYTES it really needs, and WHY the kernel cannot reach the blobs at all today. NO SMC issued, NO PAS executed, NO MMIO, NO firmware loaded, NO memremap, NO flash, NO reboot, no device-state change, NO CI dispatch. FOUR SUBSTANTIVE RESULTS. (1) THE ZAP RESERVED REGION IS QUANTIFIED FOR THE FIRST TIME. The values below had ZERO hits across every evidence document and this file before ROUND 107 (verified by grep for 8c415000 over evidence/*.md, porting.toml and README.md, which returned nothing), so they are recorded here in full rather than by reference: the node is /reserved-memory/gpu_region@0x8c415000, base 0x8c415000, size 0x2000 = 8192 B, property no-map, compatible removed-dma-pool, phandle 0x2a7; it is REFERENCED by the qcom,kgsl-hyp node through memory-region = <0x2a7>, and that same node carries qcom,pas-id = <0x0d> = 13 and qcom,firmware-name = a630_zap. Anchors, all in notes/mu-silicium/enchilada.dts: the region node at :25180-25185, the kgsl-hyp properties at :23612 (pas-id), :23613 (firmware-name) and :23614 (memory-region), and the reserved-memory path alias pil_gpu_mem at :26557. NOTE THE NODE-SHAPE FACT THIS EXPOSES: the region, the pas-id and the firmware-name all hang off qcom,kgsl-hyp, NOT off a zap-shader child of qcom,kgsl-3d0, which is the mainline shape the eight-step chain assumes - so S2 remains absent while S3/S4 now have real NUMBERS instead of just existence. (2) CAPACITY IS ADJUDICATED AGAINST THE REAL BLOB, NOT AGAINST A SIZE ESTIMATE. Parsing the actual a630_zap.mdt (6684 B, ELF32 EM_HEXAGON machine 0xa4, phnum 3, phentsize 32) gives exactly ONE PT_LOAD segment: ph[2] with p_offset 0x3000, paddr 0x5000, filesz 1968, memsz 1968, so filesz == memsz and NO zero-fill is required. ph[0] and ph[1] are PT_NULL and contribute nothing to a load plan. Therefore the RELOCATABLE single-segment requirement is 1968 B and the 8192 B region is sufficient with 6224 B to spare, so the Mu-Silicium DT region size does NOT have to change. The competing accounting is the trap worth recording: a naive split-bin sum of a630_zap.b00 148 B + a630_zap.b01 6536 B + a630_zap.b02 1968 B = 8652 B, which EXCEEDS 8192 B by 460 B and would wrongly imply the region is too small. 8652 counts the same payload twice plus the hash segment, so the split sum is the wrong metric for a relocatable load. (3) THE DECISIVE NEW BLOCKER IS THE FILESYSTEM, NOT THE SIGNATURE. The blobs live on the phone vendor_a partition, which is ext4 (scripts/data/adreno-a630-device-firmware.json:8 records vendor_a -> /dev/block/sde16 (ext4)), and this XNU port has NO ext4 reader: ext4_inode, ext4_group_desc, ext4_super and the 0xEF53 signature return ZERO hits across the whole device tree EXCEPT one, drivers/NativeUfs/RootLayout.h:26, which is a uint32_t ext4Magic probe field used only to report what the partition looks like in panic text and reads no filesystem. There is likewise no FAT/MSDOS/vfat implementation in the kernel (the only FAT hits in the tree are documentation and HOST-side tooling: README.md:287 and scripts that drive mformat/mcopy), so the kernel cannot mount the payload volume either. CONSEQUENCE, stated plainly: mount then open then read of a630_zap.mdt from inside XNU is NOT AVAILABLE today by either route, and this is now the single load-bearing fact blocker on the K3 wiring path rather than the OEM signature, which ROUND 105 already established is satisfiable with blobs this device already holds. What is NOT excluded: reading raw sectors, because CONFIG_XNU_NATIVE_UFS=y is real and the UFS driver does read the root volume with zero failures. (4) THE SCM TRANSPORT IS NOW A CONTRACT, AND THE TRANSPORT/PLANNER SPLIT IS THE POINT. adreno_zap_pas_execute() takes a struct adreno_zap_transport of CALLER-SUPPLIED function pointers and orchestrates the three stages in ascending order 0x01 init_image then 0x02 mem_setup then 0x05 auth_and_reset, RETURNING on the first failure so the order cannot be rewritten by a caller; it refuses up front on a missing transport (kAdrenoZapExecNoTransport), a base failing adreno_zap_smc_base_gate (kAdrenoZapExecBadBase, which is what rejects an owner-1 base such as 0xC1000000) and a NULL region (kAdrenoZapExecNoRegion), and it initialises the report BEFORE any branch so no return path leaves stale stack bytes that could be misread as a result. This unit contains ZERO ASSEMBLY (grep for __asm__ or asm in AdrenoZapAuthV1.c returns 0), so the planner is host-testable and the one privileged instruction stays in one audited place. THE EXPORT PLAN: the existing static ScmResult scm() at drivers/ArmCpu/ArmCpu.cpp:126 already performs the real smc #0 with x0..x5, is already DEVICE-PROVEN (ROUND 105 counted 509 device snapshots of executed EL1 SMC calls with no -99 sentinel), and wrapping it is a pure ADDITION that does not touch its body, so it does not regress the watchdog work that depends on it. It also does not trip the CI READ-ONLY guard, and the reason matters because it is easy to get backwards: scripts/verify-ci-246-adreno.py:204-206 forbids the mangled symbols _qcom_scm_call and adreno_zap_shader_load, i.e. the LINUX names, and an exported armcpu_scm_call matches neither. RECORDED AS A RULE, NOT A SUGGESTION: do NOT weaken that CI assertion to accommodate a new symbol. The guard is the only mechanical proof that the image contains no executable SCM path, and loosening it to admit one would delete the evidence that none was added. If a future round genuinely needs a callable transport in the image, that round must change the assertion DELIBERATELY and record the decision, not relax it quietly. (5) A REAL DEFECT REGISTERED IN THE REFERENCE TREE, WHICH THE PORT DOES NOT COMPILE. notes/dt/sdm845-oneplus-common.dtsi:483 declares an overlay on &gpu_zap_shader, but that label is DEFINED NOWHERE in the workspace (a grep over every .dts and .dtsi returns exactly this one line) and the pinned upstream sdm845.dtsi contains zero occurrences of zap, gpu_zap_shader or a630, so the reference compiles only if something outside the tree defines the label. The port is NOT affected: no build step consumes notes/dt at all (zero hits for notes/dt across scripts/ and .github/), notes/ is not tracked in the device repository, and the DTB the port actually uses is Resources/DTBs/enchilada.dts. So this is an error in a reference document, not a build failure, and it must not be reported as one. (6) COMPLIANCE GAP CLOSED. The .gitignore did not cover the firmware directory, .mdt files or .b0N files, so 5 of the 7 blobs would have been committable had the directory been copied inside the worktree, contradicting the manifest note that says the bytes live in a gitignored directory. Fixed by adding /work/tmp/a630-device-fw/, *.mdt and *.b0[0-9]; *.elf was deliberately NOT added because the suffix is too common among ordinary build products, and the directory rule already covers the one .elf in this firmware set. Verified 7/7 ignored, no tracked file affected (520 before and after, identical list). A CORRECTION TO THE OBVIOUS READING OF THAT FIX: on this host the firmware directory is OUTSIDE the repository worktree entirely (it lives at ONEPLUS/work/tmp/a630-device-fw while the repo root is ONEPLUS/work/UniXNU-enchilada, and ONEPLUS is not itself a repository), so git check-ignore on the REAL paths returns outside repository rather than ignored. The real files are protected by being physically outside the worktree, and the new rules are the belt for the case where someone copies the directory in. Both layers are now in place; neither alone was. VERIFICATION THIS ROUND, ALL RE-RUN: probe 18/18 rc 0; host 31/31 suites rc 0 with the banner still reading without sanitizers because this host clang fails the sanitizer self-test, which is a toolchain limitation and not a code defect; all 71 scripts/verify-*.py PASS with rc 0. THE 71/71 BASELINE IS NOT 70/71 AND NOT A BY-DESIGN FAILURE: verify-enchilada-gmu-caller-v1-record.py takes one 40-hex revision and compares it against the revision recorded for its evidence document, so feeding ead5834edce79b4b3ceb5108d6dca6e57496ee90 gives PASS (28 checks, 0 failures) while feeding the branch head fails. Zero drift confirmed by re-deriving the numbers from source rather than quoting them: build units 31 = 1 cpp_rec + 30 c_rec, host TESTS 31, host SOURCES 30, verify-*.py 71. CONFIG_XNU_NATIVE_ADRENO stays n and drivers/ArmCpu/ArmCpu.cpp stays 60624 B, so nothing was enabled and the device-proven SMC path was not edited. HONEST BOUNDARY UNCHANGED: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0, and none of this unblocks stage 5. Knowing where the region is, that 1968 B fits in it, and that the kernel cannot read the filesystem holding the blob is a sharper map of the wall, not a hole in it. The cheapest genuine advance remains the device experiment ROUND 105 scoped behind the stage-6 gate, and the cheapest HOST-side advance is still the I1 LPAE page table with coherent_walk=1 therefore b5100080. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository and still deliberately unpublished because it quotes local absolute Windows paths and the token file location; it is recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 106 2026-11-14, HOST-VERIFIED / CONTRACT ONLY, NOTHING EXECUTED] HOST-SIDE PAS CONTRACT + MDT LOAD-PLAN + BOTH VERIFIERS EXTENDED (evidence/stage5-gpu-zap-auth.md and evidence/stage5-gpu-mdt-parser.md, ROUND 106 addenda). WHY: ROUND 105 re-classified K3 from BLOCKED to CONDITIONALLY FEASIBLE and named the two bounded next options; this round takes the first half of option (ii) - writing the CALL SHAPE down as code - without crossing into the device experiment, which remains a separate gate. WHAT WAS ADDED (11 files, all pure LF, no BOM; NO new C unit, so the archive count stays 30 C units and the host runner stays 31 suites): AdrenoZapAuthV1.h/.c gained the THREE-STAGE ORDERED PAS CONTRACT - enum adreno_zap_pas_stage {InitImage=0, MemSetup=1, AuthAndReset=2, Count=3} derived from mdt_loader.c:226-252, with struct adreno_zap_pas_call carrying stage/svc/cmd/arginfo/arg_count/owner/args0/fnid/x0/args1_kind plus the three booleans required/is_metadata_call/carries_size_arg, struct adreno_zap_pas_region {phys, bytes} and struct adreno_zap_pas_result {transport_ret, secure_result, transport_ok, secure_ok, is_success}; and the new entry points adreno_zap_scm_fnid (P3:69 fnid = ((svc & 0xFF) << 8) | (cmd & 0xFF)), adreno_zap_smc_base_derived (0xC2000000, labelled derived), adreno_zap_smc_base_owner ((base >> 24) & 0x3F), adreno_zap_smc_base_gate (refuses an owner that is not SIP or a base without SMC_64), adreno_zap_smc_base_provenance (always derived-unpinned), adreno_zap_pas_call, adreno_zap_pas_stage_required, adreno_zap_pas_required_count, adreno_zap_pas_stage_name, adreno_zap_pas_stage_anchor, adreno_zap_pas_sequence, adreno_zap_pas_order_allows, adreno_zap_pas_done_bit, adreno_zap_pas_judge and adreno_zap_pas_verify. AdrenoMdtV1.h/.c gained the LOAD-PLAN SHAPE (struct adreno_mdt_segment, struct adreno_mdt_plan, adreno_mdt_plan, adreno_mdt_plan_verify, adreno_mdt_bins_are_split, adreno_mdt_relocatable, adreno_mdt_min_paddr) on top of the existing ELF32 EM_HEX