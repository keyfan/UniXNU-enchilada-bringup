]
inputs = [
  "STAGE 7 DEVICE-VERIFIED (2026-11-09) via a read-only bq27xxx probe: the gauge answers at 0x55 on SE10 / i2c10 (0x00a88000, QUP wrapper 0x00ac0000, 100 kHz), reached through the same device-verified NativeGeniI2c transport as the stage-4 RMI4 touch. No proprietary firmware, no DSP and no closed OS ABI are involved.",
  "MODEL CONFLICT RESOLVED ON HARDWARE (not by assumption): both bq27xxx register-map families are implemented and BOTH are read every probe. The verdict line reports family A (mainline ti,bq27411 map: SOC 0x1c / VOLT 0x04 / TEMP 0x02 / AI 0x10 / FCC 0x0e) as physically sane at pl=6/6, while family B (vendor ti,bq27541 map: SOC 0x2c / VOLT 0x08 / TEMP 0x06 / AI 0x14 / FCC 0x12) decodes to impossible values at pl=3/6 (soc=3161, t=-2059). The selection is therefore measured, not guessed.",
  "Official power guide (section 1), verbatim: the transport, the device protocol and the OS service are implemented separately; a board with a directly connected I2C gauge implements the chip register protocol, a board with a DSP battery manager implements its message protocol. sheng ShengBattmgr.h is the SM8550 PMIC GLINK message protocol and is NOT this I2C gauge.",
  "battery: simple-battery 3300000 uAh / 3.4-4.4 V and the bq27xxx fuel gauge on i2c10 @0x55; PMI8998 charger; PM8998/PMI8998/PM8005 RPMH regulators; 8 CPU clocks.",
  "GCC clock vote for SE10 = BIT20 (m_ahb) | BIT21 (s_ahb) | BIT24 (S2), with halt bits at 0x1800c / 0x18010 / 0x18274 and the S2 RCG at 0x18278; pinmux GPIO55 (SDA) / GPIO56 (SCL) as qup10 function 1 on the NORTH tile (0x03400000 + 0x00500000 + 0x1000 * n)."
]
configuration = [
  "drivers/NativeBattery/BqGaugeProbe.h/.c: freestanding pure C read-only orchestrator (own integer formatting, no libc) that reads the 7 standard commands for BOTH register-map families and scores them for physical plausibility.",
  "package/EnchiladaGaugeBoard.h + package/EnchiladaGaugeProbe.cpp: thin C++ shim that maps GCC / wrapper / SE / pins with armcpu_map_physical, votes the three clock bits, writes the two pin CTLs, initialises and clocks NativeGeniI2c, then calls the pure-C core. Gated by the boot arg enchilada-gauge=<stage> (1 = survey only, 2 = enable and probe); absent means the probe never runs.",
  "scripts/build-enchilada-gauge.py builds libEnchiladaGauge.a and it is force-loaded from CONFIG_XNU_EXTRA_LD_ARCHIVES in configs/enchilada_defconfig, so the weak_import hook in package/BootProgress.c resolves to the strong definition.",
  "The probe never writes CONTROL / CONFIG / unseal or data-flash: only the standard command register address byte plus a 2-byte little-endian read appear on the bus. Clock voting and pinmux writes are controller bring-up, exactly as the stage-4 touch driver does.",
  "enchilada-gauge=2 in the payload boot args; the poll is 1 Hz from the existing package/BootProgress.c monitor thread; the verdict text is replayed every tick so it survives the 128 KiB msgbuf ring overwriting early boot output."
]
procedure = [
  "Verification 1 (host): python scripts/check-enchilada-gauge-probe-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe (decoder 11 groups + read-only orchestrator 7 groups) and a CI-equivalent clang++ -std=c++20 -Wdeprecated-volatile -Werror -fsyntax-only of the shim.",
  "Verification 2 (host, different method): strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow -O2 -ffreestanding on BqGaugeProbe.c plus an independent program that drives the core through a fake I2C file and re-derives the printed verdict.",
  "Verification 3 (device): python -X utf8 scripts/test-cycle.py gaugereplay --wait-return 400 flashes the payload, waits for the deadline auto-return, then work/tmp/collect_gaugereplay.py pulls the 32 MiB window read-only and decodes it.",
