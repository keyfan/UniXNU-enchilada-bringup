inputs = [
  'Stage 6 (2026-11-08) HOST-VERIFIED audit: enchilada Wi-Fi is WCN3990 = ath10k ATH10K_BUS_SNOC (memory-mapped qcom,icnss membase 0x18800000, 12 Copy Engine IRQs, QMI/WLFW firmware + SCM/TrustZone MSA permissions), NOT sheng WCN7850 = ath12k PCIe0 endpoint 17cb:1107 + MHI BHI/BHIE. Four independent research passes: https://unixnu.com/zh/porting/network, vendor DTB Mu-Silicium/Resources/DTBs/enchilada.dts, Linux v6.12 ath10k/snoc.c + hw.h + qmi.c, sheng package/WifiPcieTables.h + MhiBoot.h + workspace/246-log inventory.',
  'Vendor DTB :7908-7924 qcom,icnss@18800000: compatible=qcom,icnss, reg=<0x18800000 0x800000 0xa0000000 0x10000000 0xb0000000 0x10000>, reg-names membase/smmu_iova_base/smmu_iova_ipa, 12 CE interrupts SPI 414..425, qcom,wlan-msa-memory=<0x100000>, 5 vdd-* supplies, qcom,smmu-s1-bypass. NO PCIe endpoint and NO 17cb:1107. :6850 wcn3990 = qcom,btfmslim_slave and :25057 bt_wcn3990 = qca,wcn3990 are Bluetooth SLIMbus, not the Wi-Fi MAC.',
  'CORRECTION (2026-11-08): the old inputs/next_action claim that WCN3990 uses an "MHI boot path" / "ath10k/WCN3990 MHI" was WRONG. MHI belongs only to sheng WCN7850 PCIe. WCN3990 SNOC boots via QRTR/WLFW QMI service lookup + qcom_scm_assign_mem SCM MSA permissions + an SDM845-specific msleep(20) XPU hack (Linux v6.12 qmi.c). Kept as [HISTORICAL, corrected] below for traceability.',
  '[HISTORICAL, corrected 2026-11-08] WCN3990 Wi-Fi (&wifi with vdd-0.8-cx-mx / 1.8-xo / 1.3-rfa / 3.3-ch0 / 3.3-ch1 regulators and qcom,snoc-host-cap-8bit-quirk); ath10k-class, not ath12k; MHI boot path.',
]
configuration = [
  'Stage 6 HOST-VERIFIED module drivers/NativeWcn (WcnChip.h/.c, tests/wcn-chip-test.cpp, scripts/check-enchilada-wcn-host.py) encodes WCN3990 SNOC vs WCN7850 PCIe identity, the 3 WCN3990 firmware roles and a wcn_chip_assess() gate. It is NOT linked into the kernel, maps no register, loads no firmware and joins no network.',
  'No Wi-Fi CONFIG_*=y, no [network] section, no firmware files; /chosen boot args do not enable sheng-wifi. All 16 WCN3990 firmware/board/cal names (board.bin, board-2.bin, firmware-2..6.bin, wlanmdsp.mbn, mba.b00, Data.msc, wlfw, bdwlan.bin, otp.bin, utf.bin, qwlan30.bin, qwlan.bin) are absent from the workspace.',
]
procedure = [
  'Verification 1: python scripts/check-enchilada-wcn-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe --out work/tmp/wcn-host-out (12 test groups, sanitizers when available). Verification 2: strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow -O2 -c WcnChip.c + an independent wcn-dump byte/verdict dump.',
  'Method: four independent research passes BEFORE any code (official network guide, vendor DTB, Linux v6.12 ath10k snoc.c/hw.h/qmi.c, sheng WifiPcieTables.h/MhiBoot.h + 246 decoded device logs + workspace inventory), then a pure-C host module; no CI, no flash, no device verification.',
  '[HISTORICAL, kept for traceability] Follow /zh/porting/network; sheng uses sheng-wifi=5 with Ath12kWifi/WifiProbe/WifiNet/MhiBoot and late-object linkage (PCIe/MHI, not reusable for SNOC).',
