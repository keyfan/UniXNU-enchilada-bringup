findings = [
  '[ROUND 65 2026-11-12, HOST-VERIFIED] Reverse-engineering the upstream Metal establishment chain shows it is TWO layers: generation-independent (versioned kernel/user-client wire ABI NativeAdrenoABI.h, metal2vulkan to Turnip to NIR/IR3 frontend, plugin discovery, owner trust, payload seed) and A740-specific (Adreno740 backend, 3 signed firmware blobs, A7xx hw_init/hwcg/protect, 3 MiB GMEM, chip_id 0x43050a01). docs/porting/gpu.md section 1 is decisive: for another GPU generation implement the matching kernel backend and compiler support BEFORE selecting its frontend, so copying sheng libAdreno740.a is not a valid A630 port. Mesa Turnip upstream already lists GPUId(630) with a6xx_base/a6xx_gen1, so the compiler is NOT the hard blocker. The hard blockers are an A6XX_GEN1 kernel backend, TrustZone PAS auth of the signed ZAP chain (GPU_PAS_ID 13, the 7 blobs are on the device but not authenticated), a real kgsl SMMU stage-1 context at 0x5040000, and a selected OS Metal/IOSurface ABI; every Mach-O/codesign/hdiutil/xcrun frontend step is macOS-Xcode-bound. AdrenoMetalSeamV1 mirrors the generation-independent wire ABI in pure C11 and refuses to invent any of the 8 board-derived DeviceInfo fields (only chip_id 0x06030001, gmem_bytes 0x00100000 and highest_bank_bit 15 are pinned; specified_mask 0x43, BOARD_DERIVED_FIELDS 0x7bc). frontend_allowed(0,1,0,0,0)=0 today.',
  "[ROUND 44] The bus adapter closes the gap between the ordered-op MODEL (AdrenoGmuBootV1) and real MMIO: every GMU/RSCC/PDC access is a word-offset (offset << 2) into a caller-provided window with per-domain byte guards; the RSCC window is derived, not mapped (base gmu+0x23000), matching a6xx_gmu.c:1771. KEY TEST FINDING: PDC_SEQ_START_ADDR 0x1148 is a WORD offset - byte 0x4520; the PDC windows must be >= 8192 words (32 KiB) to cover TCS3_CMD0_DATA 0x15db -> byte 0x576c, and the ENABLE_PDC word offset 0x1140 -> byte 0x4500; upstream writes SEQ_START_ADDR=0 BEFORE ENABLE_PDC=0x80000001 (a6xx_gmu.c:641-643), and the 0x4520 SEQ_START_VALUE belongs to the RSCC PDC_SEQ_START_ADDR (word offset 0x0008) write at a6xx_gmu.c:573, NOT the PDC window.",
  "[ROUND 38] The 3 vendor-signed ZAP blobs were never missing from the DEVICE - only from our workspace tree and canonical public mirrors; they live in /vendor/firmware/ (NOT firmware_mnt/image/, which is empty in TWRP; earlier empty-dir observations were inconclusive because partitions were not mounted). Device builds differ from the one reachable public mirror (endlessm/linux-firmware@master): GMU same size different build, SQE different size, ZAP .elf 14256 B vs .mbn 14256 B same size different content - the device blobs are the ones an on-target loader must use.",
  'STAGE 5 HOST-VERIFIED (2026-11-08): A630 and A740 are different generations. Linux v6.12 a6xx_catalog.c: A630 chipids 0x06030001/0x06030002, family ADRENO_6XX_GEN1, revn 630, gmem SZ_1M, fw a630_sqe.fw + a630_gmu.bin, zapfw a630_zap.mdt; A740 chipid 0x43050a01, family ADRENO_7XX_GEN2, gmem 3*SZ_1M, gmu_chipid 0x7020100, address_space_size SZ_16G, fw a740_sqe.fw + gmu_gen70200.bin. a6xx_gmu_init() marks A630 gmu->legacy = true (HFI v1, SPTPRAC). Firmware, GMU, protect table, GMEM and address space all differ => sheng 6 archives cannot be reused.',
  'ROUND 20 HOST-VERIFIED (2026-11-09): the A6XX GEN1 hw_init register map is now derived by the upstream pin-before-derive method (scripts/derive-a630-hwinit.py, 8 pinned Linux v6.12 sources). 50 A6XX dword offsets, 105 a630_hwcg entries, 32 a630_protect writes, A630 GMU CGC 0x09309 (vs A7XX 0x23b09). Two independent host verifications PASS (extended runner + strict C11/C++17 compile + independent protect re-encoding cross-check). The UniXNU NativeAdrenoABI.h/NativeAdrenoClient.h wire transport is generation-independent (opaque handles + GPU facts as data), so an A630 GEN1 backend can implement the same transport; the A7XX-only CP/IRQ/ring and ShengGmu.h GEN2 cold-start layers cannot be reused.',
  'ROUND 21 HOST-VERIFIED CORRECTION (2026-11-09, load-bearing, see evidence/stage5-gpu-a630-board.md): the Round-20 "GPU SMMU SID/mask unverified (board DTS 404)" claim is WRONG and RETRACTED. The vendored DTB is local in 4 byte-identical copies (sha256 e590ee...275) and is the same DTB behind 3 device-verified stages. enchilada GPU uses a DEDICATED kgsl SMMU arm,smmu-kgsl@5040000 (qcom,smmu-v2, #iommu-cells=1, phandle 0x1ac), NOT apps_smmu @0x15000000 (#iommu-cells=2, phandle 0x29) that flash #8 surveyed. Single-cell context-bank SIDs (NO mask): gfx3d_user=0, gfx3d_secure=2/1, gmu_user=4, gmu_kernel=5; ALL GPU iommus use 0x1ac, NONE 0x29. So "source a stream id/mask before GPU MMIO" is RESOLVED at the board-description level - a stage-1 SMMU context can be designed against 0x5040000. Vendor-vs-mainline: mainline a6xx_gmu.c:1277 msm_iommu_new(gmu->dev, 0) is a generic handle; these named context banks are a downstream KGSL/vendor DTB construct (BOARD facts for this firmware, not mainline constants). STILL HOST-VERIFIED: no device register read, no SMMU context programmed.',
  'ROUND 22 HOST-VERIFIED CORRECTION (2026-11-09, load-bearing, see evidence/stage5-gpu-power-domain.md): the Round-21 next step "then read a safe register (RBBM_STATUS 0x210 / CP_ALWAYS_ON_COUNTER 0x980) on device" is UNSAFE as literally written and is SUPERSEDED. On enchilada the GPU (0x5000000), the GMU (0x506a000) and the dedicated kgsl SMMU (0x5040000) all sit in the collapsible gpu_cx/gpu_gx domain: qcom,kgsl-3d0@5000000 :23666-23668 and arm,smmu-kgsl@5040000 :13967 share the SAME rail vdd-supply 0x1a4 = qcom,gdsc@0x509106c gpu_cx_gdsc, with the second rail 0x2a9 = qcom,gdsc@0x509100c gpu_gx_gdsc. A cold CPU bus read can HANG instead of returning. RBBM_STATUS is no exception: upstream reads it only INSIDE a6xx_hw_init/a6xx_idle, i.e. after the full GMU cold start (CX then GX genpd, 6 clocks, rpmh, fw load, gmu start, gfx rail, SPTPRAC 0x778000, HFI v1). The earlier safe cold survey of apps_smmu 0x15000000 was safe for a REASON: that node has qcom,skip-init and no supply/clocks, so firmware leaves it up. Consequently the power-up sequence is a THIRD prerequisite for stage 5 (alongside the signed ZAP chain and the A6XX_GEN1 backend), and it is itself unimplemented. No device was touched this round (no COM port), so this stays HOST-VERIFIED.',
  'ROUND 20 CORRECTIONS to the 2026-11-08 feasibility record (load-bearing, see evidence/stage5-gpu-a630-registers.md): (1) there is NO chip-id MMIO register - a6xx.xml has no CHIP_ID/HW_VERSION field; mainline find_chipid() and downstream KGSL read the DT qcom,chipid property and match it BY EQUALITY to a6xx_catalog.c chip_ids 0x06030001/2, so "source the exact chip-id register offset" was impossible as written. (2) the three A630 blobs are PUBLIC in linux-firmware (qcom/a630_sqe.fw 34188 B, qcom/a630_gmu.bin 32768 B, qcom/sdm845/a630_zap.mbn 14256 B), but the signed ZAP .mdt/.b00/.b01 segment chain + qcom_scm_pas_auth_and_reset(GPU_PAS_ID 13) is device-vendor-only. (3) Mesa Turnip already supports A630 (GPUId(630), CHIP.A6XX, a6xx_gen1, shared IR3), so the metal2vulkan/SPIR-V/NIR/IR3 compiler path is NOT a generation blocker. (4) kits/AdrenoFirmware/AdrenoHfi.h:23 says "Modern (nonlegacy) GMU HFI only." - that kit explicitly EXCLUDES A630 legacy HFI v1. (5) [SUPERSEDED by Round 21] "GPU SMMU SID/mask unverified (board DTS 404)" - see the Round 21 correction above.',
  'RETROSPECTIVE log analysis: the G st= rows are DWC3 USB-gadget state (dcfg/dctl/dsts), not GPU. a630/GPU hits are backtrace hex noise (1a630f174). Real CRASH rows are PerfPowerServices sig6 (SIGABRT). The exact chip-id REGISTER offset is deliberately NOT asserted: a6xx.xml has no CHIP_ID field, so qcom,chipid=<0x6030001> stays a DT property, not a proven register value.',
  '[HISTORICAL, unverified external inference - NO literal evidence in 246 logs] SpringBoard SIGSEGV (diag2-k158) +[CUIShapeEffectStack sharedCIContext] -> CI::GLContext::GLContext with mach_vm_allocate_kernel / vm_map_enter; CoreImage/GLContext/mach_vm_allocate_kernel/vm_map_enter literal counts are all 0. Kept for traceability; NOT claimed reproduced or resolved.',
  '[ROUND 28 HOST-VERIFIED, see evidence/stage5-gpu-domain-state.md] The Round-22 prohibition is refined into a bounded, testable next step. There IS a GPU-adjacent register readable with the domain collapsed: the GPUCC GDSC status register at 0x05091540 (CX) and 0x05091010 (GX). Two facts make this a correction rather than a restatement. (1) The CX status register is NOT the DTB reg value 0x509106c: that is the control register, and gdsc.c:66-71 prefers gds_hw_ctrl 0x1540 over gdscr precisely for votable GDSCs, which is what the DTB makes CX. (2) The GMU node numerically covers GPUCC, so address-range reasoning alone cannot separate the gated register block from the controller that gates it; the carve-out must be explicit. Consequence for the strict order: the first legal device action in stage 5 is no longer undefined. It is a single read of 0x05091540, gated behind an explicit boot-arg and a watchdog, interpreted as A630 CX domain up or down. GX is not informative in the same way because power_on = gdsc_gx_do_nothing_enable means software cannot raise it, so GX-OFF is the expected steady state.',
  '[ROUND 29 HOST-VERIFIED, see evidence/stage5-gpu-ci-archive.md] Being host-tested is not the same as being buildable by the kernel. Until this round the four NativeAdreno C modules were compiled ONLY by the host runner against stubs, so the kernel own clang had never seen them - a real risk on a port where every discovery costs a flash cycle and there is no macOS/Xcode locally. They are now one of seven -force_load archives, and the wiring is guarded by two independent checks: check-enchilada-archives-linked.py proves every board.toml builder has a matching force_load in the defconfig (adding a builder with no matching load fails it), and check-enchilada-adreno-probe.py proves the objects are arm64 Mach-O with the expected symbol table and no store. Force-loading guarantees linkage, NOT execution: the shim returns immediately unless the boot-arg enchilada-adreno=1 is present, and CONFIG_XNU_NATIVE_ADRENO remains n. [SUPERSEDED 2026-11-10, Round 30] No CI run was dispatched this round, so "compiled by the kernel" is still an inference from the build recipe plus the host type-check, not an observed green run. RETRACTED: CI #217 (42726356348) IS an observed green run - the archive PASS line plus _enchilada_adreno_poll linked in kernel.macho.',
  '[ROUND 30 CI-VERIFIED, see evidence/stage5-gpu-ci-217.md] The Round-29 inference is now an OBSERVATION: the kernel own clang compiled all 5 objects and the linker force-loaded libEnchiladaAdreno.a, because _enchilada_adreno_poll is present in the shipped kernel.macho symbol table next to _enchilada_smmu_poll. This closes the buildability gap without a single flash. It does NOT mean the probe executed: the shim is default OFF (PE_parse_boot_argn enchilada-adreno with stage == 1u), and weak_import plus force_load means the kernel will not fail if it never runs. CONFIG_XNU_NATIVE_ADRENO stays n; there is still no A6XX_GEN1 backend, no CP ring, no GMU/HFI start and no firmware load. A CI green run is a build artifact, NOT a device measurement, so status stays host-verified.',
  '[ROUND 31 HOST-VERIFIED, see evidence/stage5-gpu-hfi-v1.md] The gpu-area blocker (b) named a legacy GMU HFI v1 A6XX_GEN1 backend; upstream AdrenoHfi.h:23 declares MODERN-only nonlegacy HFI and therefore excludes A630, so this was a genuine CODE gap, not a stale record. A630 legacy HFI v1 is now encoded as a source-anchored pure-C transport with 7 exact deltas from the sha-pinned a6xx_hfi.c, host-tested (94 checks) and independently cross-verified (46 checks). This is a wire-protocol MODEL, not a running driver: it has NO kernel caller, maps no coherent 3-page shared extent, owns no GMU IOVA, and has never exchanged a message with real firmware. STATUS STAYS host-verified: a code model plus host tests is NOT a device measurement.',
  '[ROUND 32 CI-VERIFIED, see evidence/stage5-gpu-ci-218.md] The round-31 next_action step (1) - dispatch the kernel CI on this tree and confirm libEnchiladaAdreno.a still builds with the 6th object AdrenoHfiV1.c green - is DONE and OBSERVED, not inferred. CI #218 (42743495901) concluded success: the adreno archive PASS line went from FIVE objects (CI #217, sha256 24b9b6eec7f70413) to SIX objects (sha256 c39ed4de2c954b34), and the shipped 126,017,536-byte kernel.macho contains all nine _AdrenoHfiV1* symbols that were completely absent in the 126,013,440-byte CI #217 image. A linked symbol with no kernel caller is still decisive proof that -force_load and the kernel clang accepted the exact source. STATUS STAYS host-verified: a CI green run is a build artifact, NOT a device measurement; AdrenoHfiV1.c still has no caller, no coherent HFI shared memory, no GMU IOVA, no notify, no firmware and no real HFI exchange.',
  '[ROUND 33 HOST-VERIFIED, see evidence/stage5-gpu-firmware-v1.md] The A630 legacy GMU firmware-load contract is now encoded as a source-anchored pure-C model, closing the generation gap that sheng AdrenoFirmwarePlanGmu() (MODERN 16-byte block_header segmented image) could not cover. a6xx_gmu.c:739-750 proves A630 (gmu->legacy) does ONE flat ITCM bulk write to REG_A6XX_GMU_CM3_ITCM_START with a 0x8000 size cap, NOT a block_header walk; the derived plan_gmu_legacy() reproduces exactly that shape and refuses anything larger, unaligned, empty or NULL. The three public blobs were observed (sizes/sha) from a single reachable mirror with an explicit NON-canonical caveat, and the SQE whereami predicate is implemented as a predicate only because a6xx_ucode_check_version() reads the MAPPED BO after adreno_fw_create_bo() may relocate the image. The signed ZAP .mdt/.b00/.b01 chain (GPU_PAS_ID 13) is still vendor-only, so adreno_fw_v1_ready() is FAIL-CLOSED = 0. STATUS STAYS host-verified: a code model plus host tests plus an arm64 object is NOT a device measurement; there is still NO kernel caller, NO firmware extent, NO GMU IOVA, NO HFI exchange.',
  '[ROUND 35 DEVICE-VERIFIED, see evidence/stage5-gpu-power-domain-device.md] The round-28 open question is answered on real hardware: with the GPU domains collapsed, a gated read of the two GPUCC GDSC status registers RETURNS stable non-garbage values (cx=00005ff4 with BIT(31) clear, gx=00088400 with BIT(15) set) instead of hanging, and the five-predicate safety gate (including the GPUCC carve-out) passes. verdict=cx-DOWN and steps_left=9 confirm the gpu_cx domain is DOWN and gpu_gx is OFF (expected, since gdsc_gx_do_nothing_enable means software cannot raise it), so the round-22 power-up prerequisite is genuinely unimplemented on this boot path. The same msgbuf carries 300 live enchilada-gauge replays and accessoryupdaterd, and latest.txt carries root=1 procs=228 with UFS requests=307742 failures=0, proving the XNU userspace booted. This is ONE physical measurement plus a read-only 1 Hz replay, NOT 300 independent reads. STATUS OF THE AREA STAYS host-verified: closing a power-domain precondition is NOT the official completion criteria (GPU submissions, a rendered image, a Metal client).',
  '[ROUND 42 HOST-VERIFIED, load-bearing] The A630 legacy cold-boot bring-up sequence is now a complete, ordered, testable op-plan: 33 ops (SPTP idle) / 35 ops (SPTP below idle) for PlanCold plus a separate 36-op PlanRpmhInit that must run once before any cold boot (RSC+PDC uCode, TCS1/TCS3, ENABLE_PDC 0x80000001). This closes the third named code gap in the round-35 chain (HFI v1 transport round 31, firmware-load contract round 33, GMU cold-boot sequence round 42); the remaining stage-5 blockers are unchanged: TrustZone PAS auth (GPU_PAS_ID 13), a kernel caller with CONFIG_XNU_NATIVE_ADRENO=y, the CX/GX genpd + 6 clocks power-up, and a real device kgsl SMMU stage-1 context. STATUS STAYS host-verified: a code model plus host tests is NOT a device measurement.',
  '[ROUND 46 HOST-VERIFIED, see evidence/stage5-gpu-gmu-caller-v1.md] The powered-GMU cold-boot caller chain is now encoded as a fail-closed pure-C module on top of the round-42 model + round-44 adapter: precheck refuses BEFORE any GMU traffic (caller-asserted pre, then GPUCC CX/GX cross-check), warm state refuses (GENERAL_7==1) without inventing warm-resume work, cold path replays the upstream op sequence with per-Poll retries; the round-44 adapter bulk contract was extended to serve the cookie-resolved ITCM image (bulk_image) that the model contract sends as NULL values - a genuine cross-round defect caught by the m03546 discipline.',
  '[ROUND 47, CI-VERIFIED] libEnchiladaAdreno.a is now 10 objects (9 -> 10, the 10th being AdrenoGmuCallerV1.c), kernel.macho 126,038,016 B sha256 61b32f0ce819ec7d7fc4a1d4f69f9db787406bb890f15542189ff5b18584ce40; CI #222 green on the round-46 tree; archive sha moved from b84486919884d060 (round 45) consistent with ar rcs member metadata plus the genuinely new 10th object (round-43 root cause stands).',
  '[ROUND 48 2026-11-11, HOST-VERIFIED] The downstream vendor 4.9 kernel in TWRP exposes /dev/kgsl-3d0 (char 233:0) but no debugfs clk and no genpd; TWRP can only observe, it cannot execute the XNU-side caller chain. Honest residual risk logged in the probe: CX up does NOT prove gmu_clk is on (upstream enables clocks between genpd and the GENERAL_7 read; a read-only probe cannot write clock gates), so a powered-but-unclocked read may return data of undefined currency - the raw word, the decode and the caveat are all logged.',
'[ROUND 49 2026-11-11, DEVICE-VERIFIED] Stage-2 DEVICE result: stage-1 verdict cx-DOWN reproduced on new boot 0x20c89316 (550015766) AND the stage-2 row stage2=cx-down-gmu-not-mapped now survives the msgbuf ring via the 1 Hz replay (410 paired consecutive rows, zero MMIO writes, no gmu-read branch).',
  '[ROUND 51 2026-11-11, HOST-VERIFIED] The powered-GMU backend gap is narrowed: AdrenoPowerUpV1.{h,c} is a freestanding C11 MODEL of the exact upstream a6xx_gmu_resume() ORDER (CX genpd -> guarded GX genpd -> core 200 MHz -> A630 hub 150 MHz -> clk_bulk_prepare_enable of the 4 GMU clocks), with reverse-order genpd rollback on every failure and a typed status enum. It fills the round-46 caller gap (AdrenoGmuCallerV1 only ASSERTS the preconditions). Composition with the REAL AdrenoGmuCallerV1Precheck was host-tested using the round-35 device-measured words cx=0x00005ff4 / gx=0x00088400 (CX-down -> CxOff) and a hypothetical CX-up/GX-off state (Ok with strict_gx=0, GxOff with strict_gx=1). GX-off is EXPECTED on enchilada (gdsc_gx_do_nothing_enable), so the GX op is guarded and skipped when gxpd_present=0; AdrenoPowerUpV1PreIsReady documents that an absent GX genpd leaves gx_genpd_on=0 and the round-46 caller NotReady. NO kernel caller, NO MMIO, NO flash: this is a model, not a runtime backend. STATUS STAYS host-verified.',
  '[ROUND 51 CI-VERIFIED] CI #227 (run 42967214353) compiled the round-51 tree on macOS Xcode 26.6: libEnchiladaAdreno.a went from 10 objects (CI #222, 8f503676a8b08541) to 11 objects (61b100b4355376f8), the 11th being AdrenoPowerUpV1.c. kernel.macho stays 126,038,016 B while its sha256 changes from 61b32f0ce819ec7d7... to b5f136e948b71828a4a551854149ae36805f01813968762c7fc398c5271f0c5e -- the new object links without growing the image (round-43 root cause: xcrun ar rcs member metadata plus the genuinely new object, NOT a source regression). Build log holds only the single PASS line, so object inclusion is proven by the count delta 10 -> 11 plus the committed scripts/build-enchilada-adreno.py source list plus the local strict clang compile of the same unit (2072 B). CI-COMPILE-ONLY: no hardware execution, no flash; gpu area STAYS host-verified.',
  '[ROUND 52 2026-11-11, DEVICE-VERIFIED NARROW SUB-RESULT] Flash #12 (CI #228 kernel, payload-stage3probe.img sha 7ad5e16e6eae694020c944b4c78f70e018e78e5dbe4c0a0aef7d630f8908b16d) booted 0x2101566c (553735788, NEW; flash #11 was 0x20c89316), uptime 899 s, slots 1731, write_errors 0. THREE paired 1 Hz replay rows, 176 each, ticks 724..899, strictly consecutive with t2==t1 and t3==t1: S1 verdict=cx-DOWN (round-35 steady state), S2 stage2=cx-down-gmu-not-mapped, S3 stage3=plan steps=5 gxpd_guarded=1 core=200000000 hub=150000000 clocks=4 valid=1 distinct=1 size=5 plan_rc=0 ready=0 mcx=0 mclk=0. This proves the round-51 ordered power-up MODEL is linked into the shipped XNU kernel and that its pure Plan() emits the exact 5-op a6xx_gmu.c :1033-1047 order as DATA on the real machine. Honest boundary: ONE boot plus a READ-ONLY 1 Hz text replay, NOT 176 independent measurements; NO GPU power, clock, regulator, firmware, HFI, SMMU context, CP ring or rendered image; CONFIG_XNU_NATIVE_ADRENO=n; gpu area STAYS host-verified.',
'[ROUND 53 2026-11-11, HOST-VERIFIED] The GPU does NOT use apps_smmu @0x15000000 (phandle 0x29, 2-cell); all four GPU iommus use arm,smmu-kgsl@5040000 (phandle 0x1ac, 1-cell unmasked SIDs 0/2/1/4/5). The GPUCC always-on-rail exception (AdrenoDomainState.c:58-77) does NOT transfer to the kgsl SMMU, which rides gpu_cx. AdrenoKGSLSmmuGateAssess returns RefusedCxDown on the device-measured state; Permitted requires BOTH clocks_enabled and domain_powered.',
  '[ROUND 53 2026-11-11, CI-VERIFIED] CI #229 linked AdrenoKGSLSmmuGate as the 12th archive member and the kernel image GREW by 4096 B (one page) against CI #228 (126038016 -> 126042112 B), the first kernel size change since CI #221. That size delta is the honest evidence the new object is linked rather than dropped: an object that fails to link leaves the image size unchanged. STATUS STAYS host-verified - this is a BUILD fact, not a hardware measurement, and it says nothing about whether the kgsl-SMMU read is safe while gpu_cx is collapsed (round 53 proved it is NOT established safe).',
  '[ROUND 56 2026-11-11, HOST-VERIFIED] The five AdrenoDomainState.h constants are DERIVED, not asserted: CX status 0x05091540 = gds_hw_ctrl 0x1540 (VOTABLE, no POLL_CFG_GDSCR), CX on BIT(31); GX status 0x05091010 = gdscr 0x100c + CFG_GDSCR_OFFSET 0x4 (POLL_CFG_GDSCR set), GX on BIT(16) / off BIT(15). SECOND FINDING: gdsc.c:604 gdsc_gx_do_nothing_enable is the GX power-on callback and does nothing with the GDSC, so the CPU never powers GX up and the device word 0x00088400 (BIT(16) clear, BIT(15) set) is the EXPECTED steady state, not a fault.',
  '[ROUND 57 2026-11-11, HOST-VERIFIED] The CX/GX enable paths are now DERIVED step lists. CX enable = collapse-clear(0x106c, 0) -> udelay(1, gds_hw_ctrl set) -> poll(0x1540, BIT(31)) -> udelay(1): exactly 2 register writes. CX disable = collapse-set(0x106c, 1) -> udelay(500) and NO poll, because gdsc.c:153-161 gives VOTABLE descriptors a no-poll short-cut (the upstream counterpart of the board DTB property qcom,no-status-check-on-disable on gpu_cx_gdsc). SECOND, LOAD-BEARING FINDING: gpu_gx_gdsc.pd.power_on is gdsc_gx_do_nothing_enable and the descriptor has no .supply and no .cxcs, so the CPU side GX enable performs ZERO register writes -- a PROVABLE zero, asserted by adreno_gdsc_verify_gx_enable_writes_nothing(). That is why the device word 0x00088400 sits permanently down-complete: nothing on the CPU side ever turns GX on; the GMU does.',
  '[ROUND 58 2026-11-11 HOST-VERIFIED] The power-up plan guarded flag marks exactly the domain the CPU cannot act on: CX writes 1 register on enable (collapse clear at 0x106c) and merely READS 0x1540, while GX writes 0 because gdsc_gx_do_nothing_enable is a no-op and its descriptor has neither supply nor cxcs. Round 57 stated 2 writes for CX and was wrong.',
  '[ROUND 59 2026-11-11 FINDING, load-bearing] Two findings. (1) CX-OFF IS NOT VERIFIABLE BY THE CPU: the CX disable plan performs no status poll (VOTABLE short-cut gdsc.c:153-161, hardware peer qcom,no-status-check-on-disable in the board DTB), so after pm_runtime_put_sync(gmu->dev) the CPU knows the put was issued, not that CX reached off-complete; GX by contrast DOES poll its derived down-complete bit 0x1010 BIT(15), so the two domains are genuinely asymmetric. Exposed as AdrenoPowerDownV1CxOffIsUnverified() and cross-checked from both sides. (2) THE TWO STEP ENUMS ARE SEPARATE NAMESPACES THAT COLLIDE NUMERICALLY: ADRENO_POWER_UP_V1_STEP_CX_GENPD_ON and ADRENO_POWER_DOWN_V1_STEP_GX_GENPD_OFF are BOTH 0, so comparing an up-step with a down-step is a category error that silently passes; the first host-test run failed on exactly that assertion and both the test and AdrenoPowerDownV1Verify now assert each plan own order plus differing op counts.',
'[HISTORICAL, kept for traceability] The A630 microcode, GMU and SMMU stream setup differ from SM8550; sheng Adreno740 constants cannot be reused without a new firmware/register audit.',
]
completion = [
