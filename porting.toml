inputs = [
  'STAGE 6a (2026-11-09) HOST-VERIFIED scope + feasibility audit. enchilada is a PHONE with a real modem, so the official baseband page shortcut ("Wi-Fi-only tablets without a cellular modem can skip this page. Set the cellular area of porting.toml to not-applicable") does NOT apply: NOT-APPLICABLE WOULD BE A FALSE CLAIM. Five independent research passes: (1) https://unixnu.com/zh/porting/baseband, (2) vendor DTB Mu-Silicium/Resources/DTBs/enchilada.dts, (3) mainline Linux v6.12 sdm845-oneplus-common.dtsi, (4) Linux v6.12 drivers/remoteproc/q6v5_mss.c + drivers/net/ipa/ipa_main.c, (5) the sheng upstream inventory + three decoded device-log sweeps + a workspace firmware inventory.',
  'Vendor DTB facts: :6444-6484 qcom,mss@4080000 compatible "qcom,pil-q6v55-mss", qcom,firmware-name="modem", qcom,pil-self-auth, qcom,qdsp6v65-1-0, qcom,mem-protect-id=<0x0f>, interrupts=<0x00 0x10a 0x01> (GIC SPI 266), mboxes=mss-pil. :7323 qcom,smem@86000000; :7381 glink-smem-native-xprt-modem (label "mpss"); :7504 ipc_router_modem_xprt "qcom,ipc_router_glink_xprt"; :14183 qcom,smp2p-modem@1799000c (remote-pid 1); :7793 qcom,ipa@01e00000 (qcom,ipa-hw-ver=<0x0d>, iommus <0x29 0x720>); :7852 qcom,ipa_fws (pas-id 0x0f, firmware-name "ipa_fws").',
  'CROSS-GENERATION GAP (load-bearing, three references): SDM845 = q6v5_mss.c "qcom,pil-q6v55-mss", SELF-AUTH (MBA authenticated first, then the MPSS image), MPSS PAS id 5, IPA v3.5.1, GLINK/QRTR over SMEM. SM8550 = q6v5_pas.c "qcom,sm8550-mpss-pas", PAS auth_and_reset, pas_id 4 plus a separate dtb_pas_id 0x26 (modem_dtb.mdt), IPA v5.5. SC7180 (Coachz, the QcomBaseband target) = PAS + IPA v4.2. The official component cannot be reused unchanged.',
  'CORRECTION (2026-11-09): this area previously claimed "IPA with qcom,gsid-loader=self". That property DOES NOT EXIST -- the real name is qcom,gsi-loader (Linux v6.12 ipa_main.c:735, qcom,ipa.yaml:135), NEITHER DTB sets it, and mainline sdm845.dtsi leaves &ipa status=disabled with no such property, so the loader is IPA_LOADER_SELF (legacy). Also corrected: the default descriptors are SPLIT images modem.mdt (q6v5_mss.c:2007 `qproc->hexagon_mdt_image = "modem.mdt";`) and ipa_fws.mdt (ipa_main.c:71 `IPA_FW_PATH_DEFAULT "ipa_fws.mdt"`), NOT single .mbn files; mainline sdm845-oneplus-common.dtsi:552-556/:604-610 name the vendor .mbn entry pieces qcom/sdm845/OnePlus/enchilada/{ipa_fws,mba,modem}.mbn. "No eSIM" was not verified (zero esim/eSIM hits in the vendor DTB) and is dropped. "QRTR" was loose: the DTB node is qcom,ipc_router_glink_xprt.',
  'sheng has NO baseband driver at all: no QcomBaseband/IPA/CommCenter; the MHI code is WCN7850 Wi-Fi; the GLINK/QRTR/SMEM/SMP2P/MDT/SCM code is the ADSP audio helper; package/tests/modem_fw_host.c is only a host-side FAT/MDT firmware reader; make-sheng-adt.py:143 says "no SEP or baseband"; the sheng porting.toml has 13 areas and none is cellular. The official QcomBaseband component targets Coachz/SC7180 (IPA v4.2) and must be built with `build-qcom-baseband.py --coachz`.',
]
configuration = [
  'Stage 6a HOST-VERIFIED module drivers/NativeModem (ModemPil.h/.c, tests/modem-pil-test.cpp, scripts/check-enchilada-modem-host.py) encodes the three reference generations as DATA (boot flow, IPA generation, MSS base, IRQ, PAS ids, mem-protect id, smp2p pid, firmware role names), the split-image vs single-file distinction, and a modem_pil_assess() blocker gate. It is NOT linked into the kernel, maps no register, authenticates no image, loads no firmware and performs no modem access.',
  'No baseband CONFIG_*=y, no modem firmware in the payload, no [cellular] section. drivers/NativeModem is a decision record only and is deliberately absent from [kernel] archives and from CONFIG_XNU_EXTRA_LD_ARCHIVES.',
]
procedure = [
  'Verification 1: python scripts/check-enchilada-modem-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe --out work/tmp/modem-host-out (8 test groups: generation gap, split-image names, firmware mask, the blocker set seen today, the generation gate under forced resources, and the not-applicable rebuttal). Verification 2 (different method): strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow -O2 -ffreestanding -c ModemPil.c AND an independent script that re-derives every constant from the vendor DTB / dtsi / q6v5_mss.c / ipa_main.c text rather than from the module own tables (work/tmp/verify_modem_record_2.py).',
  'Method: five independent research passes BEFORE any code, then a pure-C host module; no CI, no flash, no device verification. The first milestone if baseband were ever put in scope is NOT a data call -- it is proving that a signed MBA can be authenticated at all.',
]
findings = [
  'STAGE 6a HOST-VERIFIED (2026-11-09): the full baseband path is BLOCKED four ways, each independently sufficient. (a) FIRMWARE: zero modem images (*.mbn / *.mdt / *.bNN) anywhere in the workspace, and the entire modem image set requires Qualcomm signing. (b) BACKEND: no SDM845 MSS-PIL/IPA generation backend exists locally or upstream (the official one is SC7180 PAS). (c) OS_ABI: ABM / BBUpdater / CommCenter / AppleBaseband* are closed-source and this host has no macOS/Xcode, so CI is the only ABI authority. (d) GENERATION: the vendor DT self-auth flow and the SC7180/SM8550 PAS flow are not interchangeable. Independently, qcom,pil-self-auth plus qcom,mem-protect-id=0x0f require TrustZone/XPU memory assignment (qcom_scm_assign_mem, RMB auth 0x3/0x4) with no iOS equivalent here.',
  'modem_pil_assess(kModemSocSdm845, fw=0, backend=0, abi=0, tz=0) = 0x3e (FIRMWARE|BACKEND|OS_ABI|GENERATION|TRUSTZONE). With a hypothetical matching backend and every resource forced available it would be 0x00, which is why the gate is written as data: it states exactly what would have to become TRUE, and the SDM845 target keeps its GENERATION blocker whenever no matching backend exists.',
  'Status choice: host-verified, NOT not-applicable. The checker accepts not-applicable only with an EMPTY components list, which would erase the fact that this board has a modem; the official skip rule is explicitly scoped to Wi-Fi-only tablets without a cellular modem, so it does not describe enchilada.',
]
completion = [
  'Modem firmware authenticates (MBA then MPSS via the SDM845 self-auth flow), QRTR services enumerate over GLINK/SMEM, and a data call can be established -- or scope is dropped with a documented reason. Neither is achieved here; this area is a feasibility and scope record only.',
]
limits = [
  'NO device verification and NO CI build: drivers/NativeModem is host-only and not linked into any kernel. No modem firmware is present, no signed image was ever authenticated, no IPA/GLINK/QRTR/SMP2P register was touched, and no data call was attempted. The absolute blocker is Qualcomm signing plus the TrustZone/XPU memory-protect flow, neither of which is reproducible here.',
  'The pass/fail facts come from source text and the vendor DTB; the one inferential step (that QcomBaseband targets SC7180) is stated as that component own build recipe (`--coachz`), not measured.',
]
next_action = [
  'Keep as an honest host-verified scope record. If baseband is put in scope later, the first deliverable is a signed-image authentication experiment (MBA only), not a data call; do NOT mark not-applicable, which would be factually wrong for a board with qcom,mss@4080000.',
]
evidence = [
  { kind = "host", reference = "evidence/stage6a-baseband-feasibility.md", result = "HOST-VERIFIED stage-6a baseband scope + feasibility audit (2026-11-09). Pass 1: 8 test groups PASS (generation gap, split-image names, firmware mask, the five blockers seen today, generation gate, not-applicable rebuttal, names). Pass 2 (different method): strict C11 -Wconversion/-Wsign-conversion/-Wshadow/-pedantic compile exit 0 AND every constant re-derived from the vendor DTB / dtsi / q6v5_mss.c / ipa_main.c text. Decision: full baseband path BLOCKED (FIRMWARE|BACKEND|OS_ABI|GENERATION|TRUSTZONE); remaining in scope as a record, NOT not-applicable. No CI / no flash / no device verification.", command = "python scripts/check-enchilada-modem-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe --out work/tmp/modem-host-out", revision = "8f4ca9bf2b386ab8414f7ca9de176d71b4f02ded" },
  { kind = "source", reference = "https://unixnu.com/zh/porting/baseband", result = "Official conditional baseband stage: QcomBaseband by HoshinoYumeka on Coachz/SC7180, talking to iOS ABM/BBUpdater/CommCenter. Its skip rule is explicitly limited to Wi-Fi-only tablets WITHOUT a cellular modem." },
  { kind = "source", reference = "https://cdn.jsdelivr.net/gh/torvalds/linux@v6.12/drivers/remoteproc/q6v5_mss.c", result = "SDM845 MSS-PIL reference (Linux v6.12): self-auth MBA-then-MPSS flow, and :2007 `qproc->hexagon_mdt_image = \"modem.mdt\";` -- the modem image is a SPLIT .mdt descriptor, not a single .mbn." },
  { kind = "source", reference = "https://cdn.jsdelivr.net/gh/torvalds/linux@v6.12/drivers/net/ipa/ipa_main.c", result = "IPA reference (Linux v6.12): :71 `IPA_FW_PATH_DEFAULT \"ipa_fws.mdt\"`, and :735 the DT property is `qcom,gsi-loader` (never `qcom,gsid-loader`); absent in both DTBs means legacy IPA_LOADER_SELF." },
