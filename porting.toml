  { kind = "source", reference = "drivers/NativeMsmDsi/tests/msm-dsi-smmu-test.cpp", result = "10 host test groups (fake-MMIO) assert geometry, Bypass/Translate/S2CR-bypass verdicts, id+mask match, read-only (writes==0, all reads<window), null refusals, 10-slot pack and exact six-stream list -> PASS: enchilada read-only SMMUv2 display-bank survey (10 test groups)." },
