  { kind = "device", reference = "evidence/console206.md", result = "SpringBoard/launchd userland runs (procs=263) and the CPU-rendered boot UI is present; the L row is all zeros, documenting the missing backlight.", command = "python scripts/test-cycle.py console206 --wait-return 900", revision = "7eeda1e01aa906ff3b2ac5fa58fdcfd244701c59" },
  { kind = "device", reference = "evidence/backlight208.md", result = "CI #208 kernel (2ba47b86853b3b1d) flashed with enchilada-backlight=1: 510 boot-log L rows all st=3 (Mapped), req=336..600 (1 Hz polls), live DSI0 registers CTRL=0x1f5 (CMD_MODE_EN, 4 lanes), CMD_DMA_CTRL=0x14000000 (FROM_FRAME_BUFFER|LOW_POWER), TRIG_CTRL=0x4 (TRIGGER_SW), CMD_CFG0=0x100008 (RGB888), CMD_CFG1=0x13c2c (0x2c/0x3c, INSERT_DCS), CLK_CTRL=0x23f (ENABLE_CLKS) — every row matches mainline dsi_ctrl_enable() command-mode programming, 0 violations. Control console206 has 510 all-zero L rows. Proves XNU maps/reads firmware-owned DSI0 at 0xae94004; no register write and no DMA in this stage.", command = "python scripts/test-cycle.py backlight208 --wait-return 900", revision = "2ba47b86853b3b1d0348daf0a8b549dc881700aa" },
  { kind = "source", reference = "drivers/NativeMsmDsi/MsmDsiSmmu.h", result = "Layer-3 prerequisite: read-only SMMUv2 display-bank survey API - SMR/S2CR/CBAR/context-bank offsets, six enchilada display (id,mask) streams, four verdict enums, 10-slot pack. Pure-C extern C header with a single rd callback (no write path)." },
  { kind = "source", reference = "drivers/NativeMsmDsi/MsmDsiSmmu.c", result = "READ-ONLY survey: IDR geometry decode, SMR/S2CR id+mask match (SmmuTakeover.h:68), per-bank SCTLR.M / TTBR0 / TCR / CBAR, returns Bypass (physical OK) / Translate (IOVA) / NotFound / Geometry. Freestanding (no libc). Compiled into force-loaded libEnchiladaMsmDsi.a as a 5th object." },
  { kind = "source", reference = "drivers/NativeMsmDsi/tests/msm-dsi-smmu-test.cpp", result = "10 host test groups (fake-MMIO) assert geometry, Bypass/Translate/S2CR-bypass verdicts, id+mask match, read-only (writes==0, all reads<window), null refusals, 10-slot pack and exact six-stream list -> PASS: enchilada read-only SMMUv2 display-bank survey (10 test groups)." },
  { kind = "source", reference = "https://cdn.jsdelivr.net/gh/torvalds/linux@v6.12/drivers/gpu/drm/msm/dsi/dsi_host.c", result = "dsi_tx_buf_alloc_6g()/dsi_dma_base_get_6g() prove the 6G REG_DSI_DMA_BASE is a display-SMMU IOVA (msm_gem_get_and_pin_iova), not a plain physical address; the physical-address assumption holds only when the matched context bank has SCTLR.M==0." },
  { kind = "source", reference = "package/EnchiladaBacklightProbe.cpp", result = "Stage 3 layer-3 prerequisite mode-2 wiring: enchilada-backlight=2 maps apps_smmu 0x15000000 (window 0x80000) read-only and calls msm_smmu_survey_display(), publishing stage code 4 into native_backlight_stats[10]; mode 1 (st=3, device-verified) kept byte-identical. C++20 -Wdeprecated-volatile -Werror full-shim syntax exit 0 (local pexpert stub)." },
  { kind = "source", reference = "drivers/NativeMsmDsi/tests/msm-dsi-smmu-test.cpp", result = "11 host test groups; the 11th (testPublish) asserts msm_smmu_survey_publish() writes a volatile int32_t[10] L-row (stage 4, poll count in slot 1, verdict in slot 2) and refuses nulls without touching the row." },
  { kind = "device", reference = "evidence/backlight209mode2.md", result = "CI #209 kernel (2b14dc4ad678) flashed with enchilada-backlight=2: 510 boot-log L rows all st=4 (Surveyed), req=337..599, verdict=1 Bypass. Decoded SMMUv2 display-bank state: num_cb=45 global_pages=64, bypass=2 translating=0, first_s2cr=0x0 (TYPE=0 CBNDX=0), first_sctlr=0xe0 (M=0 translation OFF), first_cbar=0x10003, first_ttbr0_lo=0x0, first_stream=0x880 (enchilada MDP, not sheng 0x1c00/0x1c02). Two independent verifiers PASS (packed verdict + raw S2CR.TYPE/SCTLR.M re-derivation); fresh boot_id 554983992; controls console206 all st=0 and backlight208 all st=3 unchanged. DEVICE-CONFIRMS a CPU physical address is safe for REG_DSI_DMA_BASE. Read-only: no register write, no DMA, no brightness change.", command = "python scripts/test-cycle.py backlight209mode2 --wait-return 900", revision = "2b14dc4ad6780e43362f77657c56c656ca14d181" },
  { kind = "source", reference = "https://github.com/keyfan/unixnu-build/actions/runs/42362111447", result = "CI run #209 (completed success): Build kernel step success, 20/20 archive logs with 0 error:, archive-20-build-enchilada-msm-dsi.log -> PASS: libEnchiladaMsmDsi.a (5 objects, sha256 4fdd2b93f72cc3f4); kernel.macho sha256 1597e8bbbc7011b77eee2df326dd58b6615f6b24a9b732ad56c5d4aee8de1f8f == payload.json kernel_sha256, and the binary contains msm_smmu_survey_display / msm_smmu_survey_publish / native_backlight_stats / enchilada_backlight_poll (mode-2 shim force-loaded end to end)." },
  { kind = "source", reference = "drivers/NativeMsmDsi/MsmDsiBrightness.c", result = "Stage 3 layer 3a: pure-C (freestanding, no libc) brightness-transmit orchestrator: 32-bit REG_DSI_DMA_BASE refusal gate (refuse when (phys>>32)!=0 before any register write), clean(va,len) cache-maintenance hook between DMA-buffer fill and trigger, layer-1 dsi_dcs_set_brightness_large -> layer-2 msm_dsi_cmd_prepare/commit/wait_idle/restore, L st=5 publish; CTRL restored even on timeout." },
  { kind = "source", reference = "drivers/NativeMsmDsi/MsmDsiBrightness.h", result = "Stage 3 layer 3a API: msm_dsi_brightness_send()/msm_dsi_brightness_publish(), result/counters structs, stage enums (Tx=5, NoIo=-1, AddrTooHigh=-2, Packet=-3, Dma=-4); documents the two independent verifications (vendor DTS + Linux v6.12; device SMMU bypass) and the dc civac + dsb sy rationale." },
  { kind = "source", reference = "drivers/NativeMsmDsi/tests/msm-dsi-brightness-test.cpp", result = "7 host test groups (fake-MMIO): success low-phys address write sequence, 32-bit gate refuses >4GiB before ANY write/clean with zeroed result and untouched buffer, NoIo refusals, brightness clamp to 1..1023 with exact 0x51 payload bytes, timeout restore + Dma stage, NULL-clean host-only acceptance, and volatile int32_t[10] L-row publish + null refusals." },
  { kind = "source", reference = "package/EnchiladaBacklightProbe.cpp", result = "Stage 3 layer 3b: enchilada-backlight=3 FIRST-WRITE mode added; mode 1 (st=3, device-verified) and mode 2 (st=4 Bypass, device-verified) byte-for-byte unchanged per static diff vs f566e737. Mode 3 allocates a 64-byte low IOBufferMemoryDescriptor DMA buffer (Dwc3Gadget.cpp:204-218), maps 0xae94004, supplies dc civac+dsb sy clean + CPU-spin delay, and calls msm_dsi_brightness_send() ONCE (level 512). The 32-bit DMA_BASE gate decides on-device (st=5 OK / st=-2 AddrTooHigh / st=-4 timeout). No IOService subclass, no late-object objcopy. Includes <kern/task.h> + IOKit headers for real CI XNU SDK." },
