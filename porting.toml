  '[ROUND 35 2026-11-10, DEVICE-VERIFIED SUB-RESULT] The first real-device GPU evidence of this port. User m33324 asked when device verification could happen and authorized the first real-device WRITE of the session (misc + system_b flash, reboot, capture, decode). The phone was in TWRP recovery (27f4f45d, ro.twrp.version 3.4.0-3, uid=0 root, Linux 4.9.179-perf+) with NO XNU CDC-ACM VID_1209&PID_0001 COM port, so the flash channel was the fastboot/test-cycle path and the evidence channel was the persisted SHLOG window. The READ-ONLY GPUCC GDSC probe package/EnchiladaAdrenoProbe.cpp already existed (round 28/29), default-OFF behind PE_parse_boot_argn(enchilada-adreno), five safety predicates before armcpu_map_physical, one volatile 32-bit load per register, ZERO stores. CI #219 (42762559936, success, 7 objects sha256 859f426865f9da2a) built the kernel; a single-variable payload variant gpuprobe219 used the device-verified flash #8 arg line minus enchilada-smmu=1 plus enchilada-adreno=1 (49 items / 988 of 1000 bytes), wdog=3, deadline=900, --no-reset. Two independent PRE-FLASH verifiers PASS (20 checks + source/CI re-derivation). Flash: misc 0.064s, system_b 4.342s, fastboot boot boot-108.img 0.151s, automatic return to recovery after 941s, 32 MiB window pulled read-only, BCB re-armed. NEW boot_id 0x205050d2 (decimal 542134482), uptime 899s, slots 1730, write_errors 0. 300 identical 1 Hz replays: enchilada-adreno: rc=0 GPUCC=5090000 size=9000 cx=00005ff4 gx=00088400 cx_on=0 gx_on=0 gx_off=1 verdict=cx-DOWN steps_left=9 (replay t=600..899 attempt=1). NO refusal line, so all five safety predicates passed on device and the two reads did not hang. Two independent DEVICE verifications PASS: scripts/verify-gpuprobe-device-1.py (25 checks, raw binary + flash log + CI sha chain) and scripts/verify-gpuprobe-device-2.py (36 checks, decoded text + header + source READ-ONLY contract). gpu AREA status STAYS host-verified: this is a narrow power-domain precondition, not a GPU drive