  '[ROUND 77 2026-11-12, HOST-VERIFIED] AdrenoVaMapV1 answers a question rounds 69-76 kept asserting without explaining: WHY the GPU VA map cannot simply be derived from pinned sources the way the catalog, clock and register facts were. THE CHAIN (3 sha256 pins: adreno_gpu.c 29592 B, arm-smmu.c 67693 B, a6xx_gmu.c 48981 B): GPU aperture <- max(16 MiB, aperture_start) .. aperture_end (adreno_gpu.c:224-225) <- (1 << ias) - 1 (arm-smmu.c:828) <- ias = smmu->va_size (arm-smmu.c:735) <- arm_smmu_id_size_to_bits(ID2.UBS) (arm-smmu.c:1904-1905) <- A READ OF THE SMMU ID2 REGISTER AT PROBE (arm-smmu.c:1879). THAT LAST LINE IS THE ANSWER: the value depends on the silicon ID2.UBS field, so a document cannot record it and a DTS cannot declare it - deriving it needs a POWERED SMMU, not another document. Both geometry shapes are encoded: the plain TTBR0 form (end = (1<<ias)-1) and the TTBR1 variant (start = ~0 << ias, end = ~0), selected by IO_PGTABLE_QUIRK_ARM_TTBR1 at arm-smmu.c:824. THE TRAP THIS ROUND MAKES EXPLICIT: a6xx_gmu.c:1283 creates the GMU OWN address space as msm_gem_address_space_create(mmu, "gmu", 0x0, 0x80000000) and :1245 sets range_end = 0x80000000 for its allocations - but that 2 GiB is NOT the GPU aperture, which is created separately at adreno_gpu.c:227 and named "gpu". The module exposes adreno_va_gmu_end_is_gpu_end() as a first-class predicate so a caller cannot substitute one for the other, and the verifier recomputes the TTBR0 aperture for ias in {32,36,40,48} and asserts NONE equals 0x80000000, i.e. the two numbers are genuinely different on this board rather than coincidentally similar. THREE BLOCKERS, named and derived into ready()==0: B1 ID2.UBS unread (a runtime register), B2 no powered SMMU (round 35 MEASURED cx=0x00005ff4 with BIT(31) clear), B3 no page-table walker (round 75 recorded that this port allocates and walks no LPAE table). DEPENDENCY STRUCTURE THIS EXPOSES, which is the useful part for ordering: B1 is blocked on B2, which is the SMMU row own first input - so board-va-map is not merely another missing input, it is DOWNSTREAM of kgsl-smmu-stage1. Round 75 ordering note said CX must come first of the four; this round shows it must come first of FIVE. The admission row moves board-va-map modeled 0 -> 1 (total 8 -> 9), satisfied stays 0, verdict BLOCKED. A defect found in this round own first draft: the test was labelled and asserted 6 groups while it actually contains 7 (clamp, ias, geometry, aperture, GMU trap, blockers, self-check); corrected upward and the verifier now prints the actual function names on a mismatch.',
  '[ROUND 78 2026-11-12, CI-VERIFIED] CI #238 (run 43252926421) compiled and LINKED the 28th archive unit AdrenoVaMapV1 - the GPU VA aperture derivation model - in a real XNU kernel build, the first archive change since CI #237. The archive reported 28 objects sha256 f90f1a3267b71762 (CI #237 was 27 objects a9b461e4f1378731); kernel.macho is 126099456 B sha256 bdfdc5a05881b663b0450d283bbb015c6f8a590eb6e8aa2fe4ffd287d0d90cc5, changed vs CI #237 40d6fe4a5fdde2cd with a ZERO-byte size delta - the 28th object linked without growing the image, which is the rounds 43/45/59 observation holding again, so the load-bearing proof stays the object count, the changed sha256 and the symbol inventory. All 10 AdrenoVaMapV1 exports survived linking alongside the 12 smmu-stage1, 12 mdt, 11 zap-auth, 11 cp-ring, 19 publish, 8 darwin-kmd and 15 earlier names with no regression. An independent llvm-nm check went 70261 -> 70271 defined symbols, exactly +10, LOST_FROM_237=0, and the 10 new names are precisely the AdrenoVaMapV1 exports one-for-one. A VERIFIER DEFECT WAS FOUND BEFORE THIS DISPATCH and is recorded because it is a pattern: verify-enchilada-gen1-backend.py - the round-69 admission-table verifier - had gone stale, still asserting zap-auth modeled=0, exactly six items modelled, a 23-unit archive and an old PASS-string suffix. Rounds 73, 75 and 77 each moved the table one row and round 77 added the 27th C unit, so FOUR of its checks were failing while every other verifier passed. That is the same drift class as round 77 phase 5, and the lesson is that every round adding a unit or moving an admission row invalidates hand-coded counts scattered across older verifiers, and nothing catches it except running the whole set. Fixed to 27 units and nine modelled, with the printed summary line corrected too so the text cannot misreport state.',
  '[ROUND 79 2026-11-12, DEVICE-SOURCED] The vendor kgsl driver is BOUND AND LIVE in TWRP, so for the first time this port read the RUNNING DRIVER OWN view of the A630 rather than a static description of the hardware (rounds 71/74 read the device tree and pulled blobs; this reads /sys/class/kgsl/kgsl-3d0). THE HEADLINE DISCREPANCY: gpu_model reports Adreno630v2, and THAT STRING EXISTS IN NEITHER PINNED SOURCE - the Linux v6.12 catalog has exactly ONE revn-630 entry (a6xx_catalog.c:882-903, chip ids 0x06030001/0x06030002, ADRENO_6XX_GEN1) and the vendored Mesa table has exactly ONE GPUId(630). The v2 suffix is a DOWNSTREAM kgsl naming convention, not a mainline catalog distinguisher; the verifier proves the string is absent from both pins and the doc records that whether v2 implies different register or firmware behaviour is NOT established by this string and is not claimed. The port continues to use the pinned catalog identification. NEW BOARD FACTS never previously recorded: gpu_available_frequencies = 710/675/596/520/414/342/257 MHz (7 levels, max_gpuclk 710 MHz, num_pwrlevels 7, min_pwrlevel 6, max_pwrlevel 0, default_pwrlevel 6). ORDERING TRAP worth keeping: gpu_available_frequencies DESCENDS 710..257 while devfreq/available_frequencies ASCENDS 257..710 - the same seven values in OPPOSITE order, so a port that assumed the two interfaces were interchangeable would index the wrong level; the verifier asserts the SET equality AND the reversal rather than equality of the lists. IDLE-BUT-LIVE STATE, which is the sharpest evidence yet: gpuclk/clock_mhz 257 MHz (the lowest level, under the msm-adreno-tz thermal-aware governor), gpu_busy_percentage 0 %, gpubusy 0/0, gpu_clock_stats SEVEN ZEROS (no time spent at any level), reset_count 0 (never reset on this boot), preemption 0 though preempt_level 0x1, ifpc 1 with ifpc_count 0x0 (inter-frame power collapse ENABLED but never entered), sptp_pc 1, popp 0, idle_timer 80 ms, usesgmem 1, hwcg 1. Together those say the GPU is BOUND AND HEALTHY and has NEVER BEEN DRIVEN - which is exactly the state every earlier round described, now measured from the driver itself rather than inferred. Also recorded: dev 233:0, OF_NAME qcom,kgsl-3d0, OF_FULLNAME /soc/qcom,kgsl-3d0@5000000, OF_COMPATIBLE qcom,kgsl-3d0 + qcom,kgsl-3d, and this kernel reports power/runtime_status unsupported with runtime_active_time and runtime_suspended_time both 0.',
  '[ROUND 80 2026-11-12, DEVICE-SOURCED] Round 79 named the kgsl DEBUGFS tree as the next surface to read; this round read it, through a briefly-mounted debugfs that was then REMOVED and verified removed (before: mount grep -c debugfs = 0 and 0 entries under /sys/kernel/debug; after umount: 0 and 0 again, UMNT_RC=0 - the device is byte-for-byte in its starting state). THE FINDING, and it is the sharpest statement yet of why the VA map is not obtainable: /sys/kernel/debug/kgsl/globals lists 17 global objects with REAL sizes - setstate 4096, gpu-qdss 262144, memstore 32768, scratch 4096, FOUR complete ring sets each of pagetable_desc 4096 + profile_desc 4096 + ringbuffer 32768, and profile 196608 - and EVERY SINGLE ONE has IOVA 0x0000000000000000-0x0000000000000000. The objects exist; the addresses are all zero, and every range is DEGENERATE (start == end). Two facts must not be conflated: (1) the allocation path WORKS on this device - four rings were instantiated and 14 objects allocated with real byte sizes; (2) not one object carries a non-zero GPU virtual address. Also read: /sys/kernel/debug/kgsl/kgsl-3d0/active_cnt = 0 with an EMPTY ctx/ directory (the driver holds ZERO active kernel contexts), five log_level_* knobs all 3, and /sys/kernel/debug/kgsl/debug/strict_memory = 0 (strict memory accounting is OFF, so the all-zero IOVAs are not an artefact of that mode). WHAT THIS ESTABLISHES: a MEASURED confirmation of two things the port had only reasoned about - round 77 derived that the GPU VA aperture comes from the SMMU ID2.UBS read at probe and that without a programmed kgsl SMMU there is no aperture, and the all-zero table is exactly what no-aperture-in-use looks like from the driver own side; round 53 measured the target streams still in firmware BYPASS (Busy=10, id0=4c017e4c), and a bypass stream never reaches translation, consistent with objects allocated but never mapped. Combined with round 79 reset_count 0, gpu_clock_stats all zero and busy 0 %, the picture is now complete and independently sourced: the GPU is bound, its driver allocated everything it needs, and it has never been asked to run anything. WHY THAT MATTERS FOR THIS PORT: rounds 69-79 kept recording board-va-map as the missing input; this shows what the absence looks like at RUNTIME - a port that wanted to COPY a working VA layout from the vendor driver finds nothing to copy, because on this boot the reference implementation is itself sitting at zero. That is sharper than absent: the reference is at zero too. WHAT IT DOES NOT ESTABLISH: why the IOVAs are zero. Two explanations fit the data - the driver defers IOVA assignment until work is submitted and nothing was, OR the kgsl SMMU stage-1 context was never programmed on this boot - and the observation CANNOT distinguish them; deciding would need a submission attempt, which is a state change needing its own authorization. Nor does the table say where GPU addresses WOULD be; the round-77 derivation and its three blockers are unchanged.',
  '[ROUND 82 2026-11-12, DEVICE-SOURCED] This round CORRECTS a claim the port has carried since round 75. AdrenoSmmuStage1V1 recorded I1 as "no page table" and I2 as "no ASID"; reading the SMMU own debugfs and sysfs shows the phrasing was wrong ABOUT THE DEVICE even though the blockers are real FOR THE PORT. THE MEASUREMENTS (debugfs mounted briefly, then unmounted and verified: before 0 mounts / 0 entries, after UMNT_RC=0 / 0 / 0): /sys/kernel/debug/iommu/io-pgtable/pages = 92, i.e. the io-pgtable framework is holding NINETY-TWO live page-table pages; /sys/bus/platform/drivers/arm-smmu/ contains BOTH 5040000.arm,smmu-kgsl and 15000000.apps-smmu, so the vendor kernel ships the mainline arm-smmu driver and has bound it to the dedicated kgsl SMMU at 0x5040000 - the exact device rounds 53 and 75 were written about; the kgsl SMMU modalias is of:Narm,smmu-kgslT<NULL>Cqcom,smmu-v2, confirming the compatible string round 21 derived is what the device matches on; and both the GPU (round 79) and the SMMU report power/runtime_status = unsupported with runtime_active_time and runtime_suspended_time BOTH 0, so those zero counters must NOT be read as never powered - this kernel simply has no runtime-PM accounting for either device. What is NOT there: /sys/kernel/debug/iommu/tests/ holds only the two apps_iommu_*_test_device entries and there is NO kgsl-specific iommu test or per-context node. THE CORRECTION, STATED PRECISELY: I1 was "no page table" and the measurement shows 92 pages exist; I2 was "no ASID allocator" and that remains accurate for this port although the vendor arm-smmu does allocate ASIDs, with no per-context view exposed here to observe it; I3 and I4 are UNCHANGED (round 53 Busy=10 id0=4c017e4c in the firmware BYPASS handoff, round 35 cx=0x00005ff4 with BIT(31) clear). The honest statement is therefore: the PORT has no page table and no ASID allocator; the DEVICE has both, inside a driver this port cannot use. Those are different claims and only the second is supported by measurement. This also re-reads round 80 all-zero IOVA table in a new light: tables existing while every kgsl object sits at IOVA zero is consistent with I3 - the streams are in bypass, so nothing is translated even though a translation regime is present and populated. Round 75 four blocker identifiers and its DERIVED ready() are deliberately left unchanged, so this is a wording correction, not a reversal.',
  '[ROUND 70 2026-11-12, CI-VERIFIED] CI #236 (run 43208981056) compiled and LINKED the round-70 AdrenoCpRingV1 CP ring init/doorbell contract inside a real XNU kernel build on the remote main 134c7a493e57b2a897c2794a35d01fc89ae7a227 (round-70 phase 3, committed before the 11:25:06Z dispatch), so the 24th archive unit and the 24th host suite are CI-COMPILE/LINK-VERIFIED as well as host-verified. The archive reported 24 objects sha256 59e80bd40870c8d8 (CI #235 was 23 objects 588dee59442fc9d9); kernel.macho is 126074880 B sha256 9bd2d93910192a9c5d24c9aa9f297ebec85ce934674d50e5c38eaff9719b609e, CHANGED vs CI #235 d266893097d713ce with a ZERO-byte size delta - observed, never asserted, per rounds 43/45/59. All 11 adreno_cp_ring_* exports survived linking alongside the 16 round-69 gen1-backend, 19 round-67 publish, 8 round-66 darwin and 15 earlier exports with zero regression, which matters here because round 70 EDITED AdrenoGen1BackendV1.c (the cp-ring admission row) as well as adding a unit. An independent llvm-nm check went 70203 -> 70214 defined symbols, exactly +11, matching the 11 cp-ring exports one-for-one, with LOST_FROM_235=0. The boundary holds in the image: no qcom_scm and no adreno_zap_shader_load symbol appeared, and stage3=plan survives with no stage3=exec.',
