  '[ROUND 51, procedure 12/12] Three independent verifications per m03546: (1) host runner scripts/check-enchilada-adreno-host.py (11 suites) -> adreno-power-up-v1: 84 checks, 0 failures, PASS: A6XX_GEN1 ordered genpd + clock power-up (7 test groups), HOST_EXIT=0; (2) cross verifier scripts/verify-enchilada-power-up-v1.py (never compiles/runs the C module; re-derives from the sha-pinned a6xx_gmu.c 48981 B sha c14fbb25... + vendored DTB sha e590ee32... + module text + build/runner wiring) -> POWER_UP_V1_CROSS: PASS (52 checks, 0 failures); (3) strict freestanding clang --target=aarch64-apple-darwin -std=c11 -ffreestanding -fno-builtin -mgeneral-regs-only -O2 -Wall -Wextra -Werror -Wconversion -Wsign-conversion -Wshadow -Wpedantic -> STRICT_C_EXIT=0, object 2072 B. Integration: scripts/build-enchilada-adreno.py gained AdrenoPowerUpV1.c as the 11th archive object and scripts/check-enchilada-adreno-host.py gained the 11th host test.',
