  "Stage 7 scope actually completed: byte-exact bq27xxx decoding for both register-map families (host-verified twice), a read-only on-device probe with two independent device analyses (device-verified), durable evidence records for both, and a read-only six-boot reproduction survey confirming the probe re-reads hardware each boot."
