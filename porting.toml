  '[ROUND 103 2026-11-13, CI-VERIFIED] CI #246 (run 43438540052, device head b04783074d995cf168f7b00ecfa2090c342bae69, workflow_dispatch, completed/success) PROVED the round-102/103 GPU wire-up compiles AND links under the kernel own clang inside a real XNU image. This closed a specific honesty gap: round 102 added the 30th archive unit AdrenoSmmuAsidV1.c and was pushed to remote main but NEVER went through CI; round 103 then extended that SAME unit (ID1.NUMS2CB decoder + adreno_asid_init_from_id1), widened the boot-arg mask to 1..6, wired probe stage 6 into package/EnchiladaAdrenoProbe.cpp and armed enchilada-adreno=6 - all HOST-VERIFIED only. Host -Werror is not a compile proof with XNU headers and the -mgeneral-regs-only archive link, which is the entire reason scripts/verify-ci-246-adreno.py exists. ARCHIVE LINE (derived from the downloaded artifact, not guessed): archive-23-build-enchilada-adreno.log reads PASS: libEnchiladaAdreno.a (31 objects, sha256 901a60db440b9f72). CI #245 was 30 objects sha16 97b3e86684d81c02; the object count rose by ONE and the sha16 CHANGED, which together are structural proof the ASID unit genuinely rebuilt and joined the link - a cached artifact cannot produce that pair. Round 103 itself added NO new C unit, so 30 -> 31 is ENTIRELY round 102, exactly as designed (the deliberate no-new-unit decision that avoids the 8+ verifier unit-count drift). kernel.macho is 126,128,128 B, Mach-O 64 magic cf fa ed fe, sha256 ec629ef24876b6e9e93fb7f2197dccc09325a9e444ecc71afe1abc1f96884318; kernel.log (36,731,089 B) is CLEAN with no Undefined symbols and no Error 1, while kernel-bootstrap.log remains the INTENTIONALLY failing baseline. SYMBOL INVENTORY: scripts/verify-ci-246-adreno.py asserts all 17 round-102/103 adreno_asid_* exports (including the two NEW ones adreno_asid_s2cb_count_from_id1 and adreno_asid_init_from_id1), all 18 round-83 ctx-word exports and all 24 retained ID2 / probe / power-up caller CAMELECASE exports survive linking, that t