  { kind = "source", reference = "drivers/NativeUfs/SmmuTakeover.h", result = "Firmware-bypass validation comparing the observed SMR/S2CR/context-bank values." },
  { kind = "device", reference = "evidence/console206.md", result = "G smmu slot=6 bank=4 plan=80000740/00000004 now=80000740/00000004 cb=000000e0: the DWC3 bypass entry is intact and used for 161323 endpoint commands.", command = "python scripts/test-cycle.py console206 --wait-return 900", revision = "7eeda1e01aa906ff3b2ac5fa58fdcfd244701c59" },
]

