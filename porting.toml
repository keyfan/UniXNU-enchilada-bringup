inputs = ["Vendor DTB notes/mu-silicium/enchilada.dts:6488 qcom,lpass@17300000 compatible qcom,pil-tz-generic, reg <0x17300000 0x100>, IRQ GIC_SPI 0xa2, qcom,pas-id 1, qcom,smem-id 0x1a7, qcom,sysmon-id 1, qcom,ssctl-instance-id 0x14, qcom,firmware-name adsp, mbox adsp-pil, proxy-timeout-ms 0x2710; :6547 slim@171c0000 qcom,slim-ngd; :6570 tavil_codec qcom,tavil-slim-pgd = WCD9340; :3790 max98927@3a maxim,max98927L; :7390 glink-smem-native-xprt-adsp; :23254 sound-tavil qcom,sdm845-asoc-snd-tavil with qcom,tavil-mclk-clk-freq 0x927c00 and qcom,wsa-max-devs 0.", "Linux v6.12 sound/soc/qcom/sdm845.c fixes the single supported format: DEFAULT_SAMPLE_RATE_48K 48000, MI2S_BCLK_RATE 1536000, WCD934X_DEFAULT_MCLK_RATE 9600000, SLIM_MAX_RX_PORTS 13, SLIM_MAX_TX_PORTS 16, rx_ch 144..156, tx_ch 128..143, SNDRV_PCM_FORMAT_S16_LE. 2 ch x 16 bit x 48 kHz = 1536000 Hz is the bit clock exactly.", "The reference port is a different generation, so its audio sources cannot be reused: sheng is SM8550 with qcom,sm8550-adsp-pas (PAS only), SoundWire WCD938x, AudioReach/GPR and a CS35L43 amplifier; this board is SDM845 with TrustZone PIL, SLIMBUS WCD9340, Q6AFE/ASM over GLINK and a MAX98927."]
configuration = ["No audio CONFIG_*=y; no ADSP/audio service archives; BTAudioHALPlugin disabled by text fixup. drivers/NativeAudio is a pure-C feasibility model with no kernel shim, no [kernel] archives entry and no boot argument, so it cannot run on the device."]
procedure = ["python scripts/check-enchilada-audio-host.py --cc <clang> --cxx <clang++> --out <dir> compiles the freestanding C11 core strictly and links 8 C++17 test groups over it.", "python work/tmp/verify_audio_2.py re-parses the vendor DTB nodes and the Linux source, re-derives every constant independently, compiles the core with -ffreestanding -fno-builtin -Wconversion at -O0 and -O2, and checks the exported symbol set is exactly the 11 declared functions."]
findings = ["STAGE 7 AUDIO VERDICT: the board declares ADSP PIL (qcom,pil-tz-generic, pas-id 1, firmware adsp) plus SLIMBUS WCD9340 (tavil) plus a MAX98927 on i2c4 0x3a; the four wsa881x nodes are declared but the card sets qcom,wsa-max-devs 0, so a speaker route must not assume them.", "Three of the four load-bearing assumptions differ from the reference port (DSP release, codec bus, firmware protocol), so AdspProbe/AudioProbe cannot be adapted by renaming. audio_route_assess() keeps the generation bit set for a SLIMBUS board with no matching backend, and a host test asserts the two SoC entries disagree on bus and DSP transport.", "The format is pinned by the DT and by Linux to 48 kHz / 2 ch / S16_LE with a 1536000 Hz MI2S bit clock; the core recomputes 2 x 16 x 48000 and refuses to report a match for any other shape, so the equality is verified rather than asserted.", "Nothing was built that could run: no ADSP loader, no GLINK channel, no AFE/ASM graph, no codec or amplifier driver, no kernel entry point. The blocker set is firmware (adsp image absent from the workspace), backend (no SDM845 Q6AFE transport in this tree), OS ABI (iOS audio is closed with no local Xcode) and generation. 246 decoded device logs contain zero audio/DSP literals."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly. NOT MET: audio is blocked, and no route plays or captures."]
limits = ["0/2 audio components present; no ADSP PIL, no GPR/GLINK, no codec driver, no amplifier driver. The area is host-verified feasibility research only, in the same shape as the gpu, network and cellular areas.", "The MAX98927 is modelled only as a bus address. Its register protocol was not read, because writing it without the ADSP running would produce no sound and would misrepresent the state.", "Powering LPASS and enabling translation are stage 1 concerns and are tracked in the memory area; nothing here votes a clock or touches an MMIO window."]
next_action = ["Close the DSP transport first: load the adsp image through the SDM845 PIL path (pas-id 1, smem-id 0x1a7, mbox adsp-pil), stand up a GLINK channel to qcom,glink-smem-native-xprt-adsp, and only then attempt a tone over QUATERNARY_MI2S_RX at 48 kHz / 2 ch / S16_LE with the WCD9340 DAI configured through SLIMBUS channels 144..156."]
evidence = [
  { kind = "source", reference = "https://cdn.jsdelivr.net/gh/torvalds/linux@v6.12/sound/soc/qcom/sdm845.c", result = "Linux v6.12 SDM845 ASoC card: SLIMBUS WCD9340 rx_ch[13]={144..156}, tx_ch[16]={128..143}, WCD934X_DEFAULT_MCLK_RATE 9600000, MI2S_BCLK_RATE 1536000, 48 kHz / 2 ch / S16_LE." },
  { kind = "source", reference = "https://unixnu.com/zh/porting/power", result = "Official DSP/audio/battery stage, which points at AdspProbe.cpp and AudioProbe.cpp from the SM8550 reference port." },
  { kind = "host", reference = "evidence/stage7-audio-feasibility.md", result = "8 host test groups over a pure-C model of the board audio topology (DTO constants, format arithmetic, SLIMBUS port allocation, TrustZone PIL, generation gap), plus an independent verifier that re-derives every constant from the DTB and Linux source and compiles the core freestanding at two optimisation levels.", command = "python scripts/check-enchilada-audio-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe --out work/tmp/audio-host-out", revision = "93ed8f0b5b82518e10d7ca02d61dd85ffdfea544" },
]
