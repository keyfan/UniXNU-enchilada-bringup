  '[ROUND 66 2026-11-12, HOST-VERIFIED] Round 65 claimed the compiler is not the hard blocker from Mesa main, but adreno-compiler-inputs.json builds the EXACT commit 85fda3b36405bcaea8bffc64aa4f2651dc90770d plus turnip-darwin-kmd.patch. Two independent web_fetch reads (GitLab /-/raw/ and /api/v4/.../raw, both HTTP 200) prove GPUId(630) CHIP.A6XX a6xx_gen1 highest_bank_bit 15 macrotile_mode 0 at that pin, with A740 as a DIFFERENT CHIP.A7XX generation; the Python/urllib egress is blocked by GitLab Anubis anti-bot HTML (recorded, not hidden). turnip-darwin-kmd.patch makes -Dtu-darwin-abi-dir a ONE-HEADER directory contract: it adds exactly +#include NativeAdrenoABI.h and does NOT edit the device table. Therefore the generation-independent wire ABI can be published by an A630 directory, and the pinned Mesa already compiles A630. The remaining blockers are UNCHANGED: A6XX_GEN1 kernel backend, TrustZone PAS auth of the signed ZAP chain (GPU_PAS_ID 13), real kgsl SMMU stage-1 context at 0x5040000, and the OS Metal/IOSurface ABI. frontend_allowed stays 0.',
  '[ROUND 65 2026-11-12, HOST-VERIFIED] Reverse-engineering the upstream Metal establishment chain shows it is TWO layers: generation-independent (versioned kernel/user-client wire ABI NativeAdrenoABI.h, metal2vulkan to Turnip to NIR/IR3 frontend, plugin discovery, owner trust, payload seed) and A740-specific (Adreno740 backend, 3 signed firmware blobs, A7xx hw_init/hwcg/protect, 3 MiB GMEM, chip_id 0x43050a01). docs/porting/gpu.md section 1 is decisive: for another GPU generation implement the matching kernel backend and compiler support BEFORE selecting its frontend, so copying sheng libAdreno740.a is not a valid A630 port. Mesa Turnip upstream already lists GPUId(630) with a6xx_base/a6xx_gen1, so the compiler is NOT the hard blocker. The hard blockers are an A6XX_GEN1 kernel backend, TrustZone PAS auth of the signed ZAP chain (GPU_PAS_ID 13, the 7 blobs are on the device but not authenticated), a real kgsl SMMU stage-1 context at 0x5040000, and a selected OS Metal/IOSurface ABI; every Mach-O/codesign/hdiutil/xcrun frontend step is macOS-Xcode-bound. AdrenoMetalSeamV1 mirrors the generation-independent wire ABI in pure C11 and refuses to invent any of the 8 board-derived DeviceInfo fields (only chip_id 0x06030001, gmem_bytes 0x00100000 and highest_bank_bit 15 are pinned; specified_mask 0x43, BOARD_DERIVED_FIELDS 0x7bc). frontend_allowed(0,1,0,0,0)=0 today.',
  '[ROUND 67 2026-11-12, HOST-VERIFIED] The upstream publish layer splits into TWO parts with different provenance classes: generation-independent policy (seed markers, the IOAcceleratorES -> MetalPluginName -> NSBundle -> initWithAcceleratorPort discovery chain, the NativeAdrenoMetal.publish gate, backboardd render-server routing, the NativeAdrenoMetal.clients per-process allow list with * and trailing-star prefixes, user-client open-type routing 0x4147/0x4148, the connection cap of 8 for non-render-servers, scanout composite) mirrored as pure C; and board/generation-derived GPU address windows (NativeAdrenoPublish.cpp:113-114 kClientWindows: slot0 1 GiB at 0x20000000, slots 1-3 0x0AAA9000 = 178905088 B each, inside the sheng 2 GiB aperture 0x20000000..0x80000000) which are REFUSED for A630: enchilada_publish_windows_a630 returns all-zero windows with a zero specified mask and any nonzero window is rejected by enchilada_publish_windows_consistent. DOC-CONSTANT CORRECTION carried honestly: the docs phrase up to two 256 MiB client windows, but 256 MiB is the per-object cap NativeAdrenoAbiMaxBoBytesShift=28 (NativeAdrenoABI.h:16); the actual sheng client windows are 0x0AAA9000 each and slot0 is 1 GiB. The kernel CI workflow has no frontend build step, so the CI-compilable layer is the policy contract only.',
  '[ROUND 68 2026-11-12, HOST-VERIFIED] CI #234 (run 43181798726, completed/success, created 08:18:01Z) compiled and LINKED the round-67 AdrenoMetalPublishV1 policy contract inside a real XNU kernel build on the remote main 8a6d81c262ef03cde34a15a6bcce23582cabb9cf (committed 08:11:03Z, before dispatch). libEnchiladaAdreno.a reports 22 objects, sha256 8a487d183190a276 (CI #233 was 21 objects a1d20d90bb7a75d2). kernel.macho is 126070784 B, Mach-O 64 magic cf fa ed fe, sha256 d71d6a8b23ed83b321c40af5c68b53d9bdfec13a10f953ae141b705c8fb28acb, CHANGED vs CI #233 18bcb8e25b431b228bc64645f14b38477560063153b0d560c28bcb46a91a09df with a ZERO-byte size delta - a literal confirmation that an extra archive object can link without growing the image, so the load-bearing proof is the object count, the changed sha256 and the symbol inventory. All 19 enchilada_publish_* exports survived linking; an independent llvm-nm defined-symbol count went 70168 (CI #233) to 70187 (CI #234), exactly +19, with LOST_FROM_233=0 and all 21 enchilada_(darwin|metal)_* exports retained, plus the 15 earlier unit names and the stage3=plan / no stage3=exec invariant. kernel.log is clean (no Undefined symbols / Error 1); kernel-bootstrap.log remains the intentionally failing baseline.',
  '[ROUND 69 2026-11-12, HOST-VERIFIED] This round adds AdrenoGen1BackendV1, the A6XX_GEN1 BACKEND ADMISSION contract, as the 23rd unit of libEnchiladaAdreno.a and the 23rd host suite. It adds no thirteenth hardware model; it ADJUDICATES the twelve prerequisites a real A630 backend needs, with two independent columns: `modeled` (a host-verified freestanding model of the item exists in this tree) and `satisfied` (a device-capable backend HOLDS it). Observed today: modeled=5, satisfied=0, verdict BLOCKED - the honest state round 68 recorded in prose, now machine-checkable. The five modelled items are power-path (rounds 51/56/57/58/59/61/62/63/64), gpucc-windows, gmu-cold-boot (round 42), hfi-v1-transport (round 31) and firmware-blobs (round 38, file presence only). The seven NOT modelled are zap-auth, kgsl-smmu-stage1 (round 53 is a fail-closed READ gate, not a context), cp-ring, board-va-map, device-proof, config-on and macos-frontend. LOAD-BEARING CORRECTION: GPU_PAS_ID 13 IS derivable (Linux v6.12 a6xx_gpu.c:17 #define GPU_PAS_ID 13, used at :819; enchilada.dts:23612 qcom,pas-id = <0x0d>), and it is already asserted in five local headers - but the value is NOT inherited from the A740/sheng tree, which contains ZERO PAS/trustzone/zap code and whose only "13" is a PWRUP struct byte offset (NativeAdrenoPwrup.cpp:41). Knowing the constant is therefore NOT having the step: PAS must be implemented fresh against qcom_scm, which is why zap-auth is modeled=0 AND satisfied=0. Three generation traps are now encoded and tested: the A630 GMU dummy page STAYS SZ_4K at IOVA 0x60000000 (the SZ_8K widening at a6xx_gmu.c:1704 lives inside the a660/a7xx branch at :1697-1698 and must NOT be applied), there is NO icache and NO dcache region for a legacy GMU (a6xx_gmu.c:1721-1725 porter NOTE; the four regions are debug/log/hfi SZ_16K at IOVA 0 plus the dummy page, total 0xd000, none executable), and a6xx_has_gbif() is false for A630 but true for every other generation (a6xx_gpu.h:71-77)