  { kind = "host", reference = "evidence/stage5-gpu-ci-231.md", result = "ROUND 60 CI-VERIFIED (2026-11-11) CI #231 run 43043000108: 15-object archive sha256 f0030d424fa6fc81, kernel.macho 126046208 B sha256 9de56c6ac592 (4096 B larger than CI #230, so this time the size moved with the new object), all nine AdrenoPowerDownV1 exports present plus the round-58 symbols, stage3=exec absent; kernel-bootstrap.log baseline failure documented as the differential proof the extra archives are required. CI COMPILE/LINK ONLY - no device run, no flash, gpu stays host-verified.", command = "python -X utf8 scripts/verify-ci-231-adreno.py", revision = "5066a08759b3ddc4e7aa582105fe470699eda4bf" },
{ kind = "host", reference = "evidence/stage5-gpu-clk-ctl-v1.md", result = "ROUND 61 HOST-VERIFIED (2026-11-12) GPUCC clock-control derivation AdrenoClkCtlV1.{h,c}, the CLOCK half rounds 45-60 left opaque. FOUR FINDINGS. (1) There is NO 'hub' clock on SDM845: the GMU node names only gmu/cxo/axi/memnoc (sdm845.dtsi:4941 = enchilada.dts:23890), so msm_clk_bulk_get_clock ('hub' or 'hub_clk', msm_io_utils.c:17-32) returns NULL and clk_set_rate(NULL, 150 MHz) is a SUCCESSFUL no-op (clk.c `if (!clk) return 0;`) - the hub step is dead code here, while the A740 SM8550 node DOES list 'hub' so the same line really programs an RCG there. (2) The resume-time core-rate set is PARKED, not written: a6xx_gmu.c:1044 runs before :1047, so the shared RCG is disabled and clk_rcg2_shared_set_rate takes the :1198-1205 parked branch (ZERO writes); the derived CFG word is 0x0602 (F() stores 2*h-1 so pre_div is 2, and parent_map_0 gives cfg 6; mnd_width 0 means no M/N/D writes and no DUAL_EDGE bit), and the real CFG write lands later inside clk_rcg2_shared_enable. (3) Only 2 of the 4 bulk clocks are GPUCC registers (0x1098 gmu, 0x109c cxo); axi and memnoc are GCC. (4) clk_branch2_check_halt is a DISJUNCTION (CLK_OFF clear OR NOC FSM ON), so the module gives it its own step kind instead of a single-mask poll. Derived writes for the clock legs: 6 GPUCC writes (0 core parked, 0 hub absent, 4 RCG enable, 2 CX_GMU branch). TWO INDEPENDENT VERIFICATIONS PASS: host suite 16 suites / 76 new checks / 0 failures, and CLK_CTL_V1_CROSS: PASS (72 checks, 0 failures) which recomputes every value in Python from 10 sha256-pinned v6.12 sources + the vendored DTB without reading the C table. Strict freestanding arm64 compile exit 0, 2368 B object, 12 exports. 16th archive object + 16th host suite wired. HONEST BOUNDARY: no MMIO, nothing mapped, no domain powered, no clock enabled, no kernel caller, no CI run, no device run, no flash; the round-22/28 prohibitions are unchanged and gpu area STAYS host-verified with CONFIG_XNU_NATIVE_ADRENO=n.", command = "python -X utf8 scripts/verify-enchilada-clk-ctl-v1.py", revision = "5066a08759b3ddc4e7aa582105fe470699eda4bf" },
{ kind = "source", reference = "configs/enchilada_defconfig", result = "CONFIG_XNU_NATIVE_ADRENO=n documents the current absence of a GPU backend." },
{ kind = "host", reference = "evidence/stage5-gpu-power-up-backend-v1.md", result = "AdrenoPowerUpBackendV1 implements all four AdrenoPowerUpV1Bus callbacks against the round-57 GDSC plans and the round-61 clock plans, so the bus can no longer be four return-0 stubs: host suite 17 suites / 0 failures with the new 51-check suite, POWER_UP_BACKEND_V1_CROSS PASS, strict freestanding arm64 object 4968 bytes. Derived traffic: CX 1 write at 0x106c, GX 0, parked core 0 (word 0x0602), absent hub 0, clocks_enable 8, chain total 9. NOT a device measurement; no IOKit caller; the archive was NOT rebuilt because this workspace lacks the recorded XNU ios-obj tree.", command = "python -X utf8 scripts/verify-enchilada-power-up-backend-v1.py", revision = "d131433a29bd6df860428ed7650157e11b7cc9b0" },
{ kind = "host", reference = "evidence/stage5-gpu-gpucc-window-v1.md", result = "AdrenoGpuccWindowV1 supplies the bounded MMIO adapter that round 62 had no producer for: it converts a GPUCC byte offset into a checked pointer and does nothing else (no mapping, no clock, no regulator, no GDSC). Three bounds, the third being the one that matters: the DTB node claims 0x9000 but gpucc-sdm845.c registers its regmap to max_register 0x8008, so the usable window is min(bytes, 0x8008+4) = 0x800c, not 0x9000 - bound 2 alone could never catch that because the offending offsets are inside the mapping. Constants are derived from AdrenoClkCtlV1.h rather than retyped. Host suite 18 suites / 0 failures, new suite 91 checks (44 of them from the module Verify), GPUCC_WINDOW_V1_CROSS PASS (30 checks) re-deriving the usable size in Python, strict freestanding arm64 Mach-O 1368 bytes magic 0xfeedfacf cputype 0x100000c with 6 exports, probe shim 18/18 PASS, archives-linked PASS 7. The integration test drives the real round-62 executor through this window and asserts the parked CFG word 0x0602 lands at 0x1124 (CMD+4), which fails if the byte-vs-word convention is ever crossed; it serves its own hardware emulation because a plain memory window cannot model the self-clearing 0x1120 CMD register, and every one of its accesses still passes through the real Resolve. NOT a device measurement; the archive was NOT rebuilt because this workspace lacks the recorded XNU ios-obj tree; this round also fixed round 62 record drift by adding AdrenoPowerUpBackendV1 to the source_sha256 set it had been recorded as being in.", command = "python -X utf8 scripts/verify-enchilada-gpucc-window-v1.py", revision = "d131433a29bd6df860428ed7650157e11b7cc9b0" },
  { kind = "host", reference = "evidence/stage5-gpu-caller-v1.md", result = 'AdrenoCallerV1 fixes an ordering impossibility that round 63 left in its own next_action. The round-63 plan said the IOKit service would call Precheck, then Bind, then Make/Up; but AdrenoGmuCallerV1Precheck refuses unless pre->cx_genpd_on, pre->gx_genpd_on and pre->clocks_enabled are all non-zero, and those three fields are produced by AdrenoPowerUpBackendV1Up. A gate consuming the power-up output cannot run before it, so Precheck runs last, after the MMIO. The consequence is that the first GPUCC access of any real bring-up is a WRITE (the CX enable plan collapse clear at 0x106c), whereas every device-verified result this port holds (rounds 35, 49, 52) began with a READ of 0x1540/0x1010. Instead of faking the three bits, the module brackets the executor with real observations: OBSERVE 0x1540+0x1010, POWER via AdrenoPowerUpBackendV1Up, OBSERVE again, then VERDICT via Precheck. Two guarantees are tested: the first MMIO attempt of a run is a read, and an unreadable window costs ZERO writes; and UpOk is a different verdict from PrecheckOk, because round 35 measured cx=00005ff4 with BIT(31) clear and nothing proves the collapse clear raises it. CX-down on the pre-observation is deliberately NOT vetoed, since writing gpu_cx_gdsc control register is how a collapsed domain is raised and that register is in always-on GPUCC. Host suite 19 suites / 0 failures, new suite 77 checks (35 from the module Verify), CALLER_V1_CROSS PASS (48 checks) re-deriving in Python that Precheck really gates on the three produced fields, that Run observes before it powers, and that the caller has no write path of its own; strict freestanding arm64 Mach-O 3072 bytes magic 0xfeedfacf with 3 exports; probe shim 18/18 PASS; archives-linked PASS 7. NOT a device measurement. The archive was NOT rebuilt because this workspace lacks the recorded XNU ios-obj tree, and the IOService that will own the mapping is still unwritten - this round is the ordering layer it will call.', command = "python -X utf8 scripts/verify-enchilada-caller-v1.py", revision = "d131433a29bd6df860428ed7650157e11b7cc9b0" },
]

