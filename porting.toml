limits = [
  '[ROUND 281 2026-11-24, DEVICE-VERIFIED] Two thousand ctl polls do NOT produce the zero window; twenty samples inside that loop are all healthy; a pure wait dies between 15 and 20 ms. Key 205 repeats key 202's shape with the ten-millisecond wait DELETED and one read straight after the loop: boot_id 585441584, window a64f4028..., 4/4 rows landed - p2 read ctl=00000000 latched=0 polls=2000 init=00000001 info=00000000 qi=00000000 qa=ad975000 st=000000d4 gd=00222001 cf=00088400 fw=babeface sr=00000000, so the zero window of R280 key 202 did NOT reproduce. Key 206 writes the same two stores but samples INSIDE the two thousand polls (twenty points a hundred polls apart): boot_id 585630472, window c3982a9f..., four head rows plus twenty samples all landed and every sample byte-identical and healthy, and the post-loop read is healthy too - no zero window anywhere in the loop. Key 207 does NO polling at all, only a pure wait of 10/15/20 ms with one read per step: boot_id 584937401, window 49dcb88a..., six rows but only FOUR landed - the 10 ms and 15 ms steps both read a healthy window (st=000000d4 qi=00000000 qa=ad970000 fw=babeface sr=00000000) and the 20 ms step landed nothing, so a pure wait is sufficient to end the round and the death point is 15 to 20 ms after the INIT store itself. HFI_CTRL_STATUS bit 0 never latched in any of the three keys and GPU_CC_GX_GDSCR+4 bit 16 stayed 0 throughout, so HFI startup is still not accepted and GX is still unpowered. The shape hypothesis 'store, 2000 ctl polls, read' is WITHDRAWN (it is intermittent); the one surviving reading of the zero window is that it is what the round reads just before it dies.',
  '[ROUND 280 2026-11-23, DEVICE-VERIFIED] A ten-millisecond wait reaches its read; a fifty-microsecond sampler never sees the zero window. Key 202 repeats R279 key 200 with the wait HALVED to 10 ms and a single read afterwards: boot_id 585610819, window 8c26e086..., all FIVE ROWS LANDED - p2 again showed the all-zero window (st/gd/cf/qa all 00000000, init=00000001, latched=0 ctl=00000000 polls=2000) and p3 read back waited=100 ctl=00000000 info=00000000 fw=babeface sr=00000000 qi=00000000 qa=ad972000 st=000000d4 gxoff=1 gd=00222001 cf=00088400. So the ten-millisecond wait did not end the round, the zero window had already recovered by then, and HFI_CTRL_STATUS bit 0 still never latched. Key 203 is key 201's order with a row printed BEFORE the INIT store (real CM3 reset, print, then INIT without clearing the descriptor) and gave a ZERO-BYTE boot again (window still 8c26e086..., boot_id still 585610819, all four rows absent) - even the census row from before the reset did not land, so the death of keys 201/203 is EARLIER than the INIT store and is still not located. Key 204 repeats key 199 with twenty samples about 50 us apart: boot_id 585373308, window b9343375..., three head rows plus ALL TWENTY SAMPLES landed, every sample byte-identical and the FIRST sample already non-zero (st=000000d4 gd=00222001 cf=00088400 qi=00000000 qa=ad971000 ctl=00000000 fw=babeface sr=00000000). So 'the window reads zero the instant the INIT store lands' is REFUTED; the zero reading tracks the shape 'store, then two thousand ctl polls, then read' rather than the store alone. The descriptor store's only visible consequence is qi; qa keeps its value throughout.',
  '[ROUND 279 2026-11-23, DEVICE-VERIFIED] The zero window is INTERMITTENT, and the 20 ms wait ends the round. Key 199 repeats R278 key 196 exactly (clear HFI_QTBL_INFO, write HFI_CTRL_INIT=1) and then samples the whole window ten times at about 3 ms a sample: boot_id 585000873, window 73bb0026..., qi 00000001->00000000 with qa still ad971000, and ALL TEN SAMPLES IDENTICAL (st=000000d4 gd=00222001 cf=00088400 qi=00000000 qa=ad971000 ctl=00000000 fw=babeface sr=00000000). So the all-zero window that R278 recorded after the INIT store did NOT reproduce here, although the two stores are byte-identical, while fw/sr stayed put (the store did not restart the firmware). Key 200 runs the same sequence and then waits another 20 ms before reading: boot_id 584708042, window f7d86854..., and only THREE OF FIVE ROWS LANDED - p2 again shows the all-zero window (st/gd/cf/qa all 00000000, init=00000001, latched=0 ctl=00000000 polls=2000) but p3 (after_wait) and the tail row never printed. So the 20 ms wait did not reach a read-back, and 'never latched is the steady state' gains NO evidence this round; what it does establish is that waiting longer is itself able to end the round. Key 201 reverses key 197 (real CM3 reset, then write INIT WITHOUT clearing the descriptor) and gives a ZERO-BYTE boot (window still f7d86854..., boot_id still 584708042, all four rows absent) while the flash, the key-block read-back (enchilada-pas-exec=201) and the system_b head 8 MiB sha all matched, so it is not a failed flash. With R277 key 195 and R278 key 197 that is the THIRD zero-byte boot with the descriptor set, but the order variable itself is NOT proven: nothing printed, so it may have died in the reset stores. Correction to R278: probe rows land in SLICES, not as one commit - key 200 printed p0-p2 and then stopped - so 'zero bytes' only means the round died before its first flush.',
  '[ROUND 278 2026-11-23, DEVICE-VERIFIED] The lethal half of the INIT store, bisected in one build. Key 196 clears the queue-table DESCRIPTOR (HFI_QTBL_INFO=0) and keeps the address, then writes HFI_CTRL_INIT=1: boot_id 584895190, window 54304372..., qi 00000001->00000000, qa still ad96f000, init=00000001, latched=0 ctl=00000000 polls=2000, info=00000000. It SURVIVES (4/4 rows) and both stores landed, so the round is not merely surviving because nothing happened. Key 197 clears only HFI_QTBL_ADDR and keeps the descriptor, then writes the same INIT: TWO ZERO-BYTE BOOTS (window still 54304372..., boot_id still 584895190) although both flashes succeeded, the key block read back byte-identical and the system_b head 8 MiB matched the payload. With R277 key 195 (both words intact) also 2/2 zero bytes, the bisection is clean: writing HFI_CTRL_INIT=1 is lethal iff HFI_QTBL_INFO != 0, independent of the address. Key 198 does a6xx_gmu_start()'s CM3 reset first (fw=babeface after 3 polls, sr=00000000), then clears the descriptor, then writes INIT, then rings the MSGQ doorbell ONLY if the start latched: 6/6 rows, init=00000001, latched=0 ctl=00000000 polls=20000, ack=0 skipped=1 info=00000000. So restarting the firmware is not the missing step either. Two consequences: (a) 'the table is described' is a REMOVABLE lethal condition while 'the firmware does not accept an HFI start' is a SEPARATE gap that this round did not close; (b) after the INIT store the whole GMU/GPU_CC window reads zero for a while (st/gd/cf and even the untouched qa read 00000000) and in key 198 it comes back on its own with no store in between (p4 reads st=000000d4 gd=00222001 cf=00088400 again), while in key 196 it is still zero at the tail row. The zero window is registered as an observation, NOT attributed: its length was not measured and fw_init_result/sysreset were not read across it.',
  '[ROUND 277 2026-11-23, DEVICE-VERIFIED] The firmware's own identity and its HFI message ring, asked instead of another doorbell. Key 193 writes nothing and reads ver=00000000 ctl=00000000 hv=00000000 sfr=06030100 mmap=00000000 qinfo=00000001 qaddr=ad970000 init=00000000 sr=00000000 fw=babeface st=000000d4 gxoff=1 gd=00222001 cf=00088400: the version word a6xx_gmu_start() reads at GMU_CM3_DTCM_START + 0xff8 is ZERO, so the documented '<= 0x20010004 means use 0xbabeface' branch is vacuously true here and 0xbabeface is NOT evidence of a firmware revision; HFI reports nothing but a described queue table (qinfo=1) with an address. Key 194 rings the HFI MESSAGE doorbell (MSGQ, bit 0 of HOST2GMU_INTR_SET) with the CM3 untouched: ack=0 polls=100 info=00800000, qaddr unchanged, cf bit16 still clear - so the message ring is nobody's business either, and the same info bit 23 (CM3_FAULT per the upstream xml) rises from a message doorbell just as it did from out-of-band ones. Key 195 writes HFI_CTRL_INIT=1, waits up to 2000 ticks for HFI_CTRL_STATUS bit 0, then rings the same message doorbell: TWO ZERO-BYTE BOOTS. The window sha is still key 194's 33e8ed83... and the SHLOG boot_id is still 585406562 while both flashes report flash system_b OK and TWRP comes back clean, so the round died before its commit rather than failing to flash. Against R239 key 83 (QTBL_INFO cleared first, then INIT=1, 4/4 survived) the lethal condition narrows to the COMBINATION 'table described + writing INIT', not 'writing INIT' on its own. Neither mainline GX entry (out-of-band gfx_rail_on, HFI hfi_start) is serviced by this firmware. The bit-23 name is EXTERNAL evidence; AdrenoGmuBootV1.h has the offset only.',
  '[ROUND 276 2026-11-23, DEVICE-VERIFIED] The out-of-band doorbell itself, asked with a message that has nothing to do with boot-slumber: GMU_OOB_GPU_SET (set bit 16, acknowledge bit 24, per the pinned upstream a6xx_gmu_oob_bits[] table). Key 190 takes the resting census (bs=00000000 gx=00000000 mx=00000000 st=000000d4 gxoff=1 ao=00000000 fn=00000000 rp=0000000f gd=00222001 cf=00088400 info=00000000), rings that doorbell with the CM3 untouched, and reads ack=0 info=00800000 polls=100 with st/gd/cf/gx/mx bit-for-bit unchanged: so it is NOT only BOOT_SLUMBER that goes unanswered, the whole HOST2GMU_INTR_SET request block is nobody's business. Key 191 reads the words mainline reads around a GMU fault either side of the same doorbell and decodes the four AO sources: wdt=0 ahb=0 fen=0 vdr=0, fn=0, so info bit 23 (CM3_FAULT per the upstream xml) has no hardware fault behind it - the CM3 is refusing, not crashing. Key 192 writes BOOT_SLUMBER_OPTION=1 (the only non-zero value the upstream ever writes, 'about to slumber'), rings the same doorbell, and reads ack=0 with GPU_GMU_CX_GMU_RPMH_POWER_STATE = 0000000f throughout; by a6xx_gmu_notify_slumber() that value means the GMU considers itself already slumbered, which is why it neither answers 'wake up' nor takes part in the declare/acknowledge/confirm handshake. gx_on stays 0 in all three keys. The gate for GX power-up now narrows to ONE question: does this firmware implement out-of-band request service at all? The bit-23 name is EXTERNAL evidence (upstream xml); AdrenoGmuBootV1.h has the offset only.',
  '[ROUND 275 2026-11-23, DEVICE-VERIFIED] The out-of-band rail doorbell, taken verbatim from the pinned upstream a6xx_gmu_gfx_rail_on(): clear GMU_BOOT_SLUMBER_OPTION, write GMU_GX_VOTE_IDX and GMU_MX_VOTE_IDX, ring HOST2GMU_INTR_SET bit 22, then wait for GMU2HOST_INTR_INFO bit 30. Key 187 (read only, zero stores, census taken twice) reads bs=00000000 gx=00000000 mx=00000000 sp=00000000 st=000000d4 gd=00222001 cf=00088400 fw=babeface info=00000000 and both reads are bit-for-bit identical: the resting state is stable and BOTH arc votes are zero, so the firmware has never taken a rail vote. Key 188 (the five upstream stores, CM3 untouched) leaves bs/gx/mx/gd/cf completely unchanged and then polls: bit 30 of GMU2HOST_INTR_INFO NEVER RISES in a 10 ms window (ack=0, polls=100), yet info goes 00000000 -> 00800000, which by the pinned upstream registers/adreno/a6xx_gmu.xml is bit 23 = CM3_FAULT. Key 189 restarts the CM3 first (clear the init latch, pulse CM3_SYSRESET, wait for 0xbabeface - it returns on its own after 4 polls, so the firmware really did re-run) and then rings the identical doorbell: same ack=0, same info=00800000, same gx_on=0. So the silence is not a firmware that has not started yet. gx_on (cfg & 0x10000) is 0 in all three keys: the last step of GX power-up is still missing, but the candidate gate now narrows from vote values / gfxcc clocks / firmware liveness to the out-of-band interrupt path itself. The bit-23 name is EXTERNAL evidence (the upstream xml); this tree's AdrenoGmuBootV1.h defines only the offset 0x5192 and no bitfields.',
  '[ROUND 274 2026-11-23, DEVICE-VERIFIED] GX power domain measured directly for the first time. Key 184 (read only, clocks off) reads gdscr=00222001 cfg=00088400 clamp=00000001 cx=80001fe0 cxgmu=00004ff1 cxo=00000001 gx_on=0: cfg bit 16 (POWER_UP_COMPLETE) is 0, so the GX domain is genuinely off at rest and the poll is meaningful. Key 185 enables the two gfxcc branch clocks and walks the four GX GDSC writes (clamp on, clamp off, gdscr clear bit 0) then polls bit 16: gdscr goes 00222001 -> 08222000 (bit 27 power-up SETS, so GDSC accepted the power-up request), cfg goes 00088400 -> 01080400, but 01080400 & 0x10000 = 0 and polls=20000 - POWER_UP_COMPLETE never sets. Key 186 is the control: same four GDSC writes WITHOUT the clocks, and its post-write state is bit-for-bit identical to key 185 (gdscr=08222000 cfg=01080400 bit16=0 polls=20000). So the gfxcc clocks are NOT the gate for bit 16 - powering the domain up with or without the clocks yields the same result. cx/cxgmu/cxo stay constant across all three keys. This is gap G1 of notes/GX-power-domain-status.md: something other than the clocks gates POWER_UP_COMPLETE. Keys 184/185/186 are a flat self-contained block (no CM3 restart, no SMMU table build), so they answer the GX power question only, not the firmware-start question.',
  '[ROUND 273 2026-11-23, DEVICE-VERIFIED] The 0x5180 bit 0 a start word writes is a LATCHED STATE, not a clearable event: after the start word is accepted (control 00000001, pol=1) key 181 writes GMU2HOST_INTR_CLR to clear the interrupt latch, and 0x5180 still reads 00000001 with bit 0 still set. This is the opposite of R253 key 120, where clearing the same CLR dropped bit 23 of 0x5192; 0x5180 bit 0 and 0x5192 bit 23 are not the same register bit. Key 182 reads the whole 32-bit control word (00000001) plus every neighbour 0x517f/0x5181/0x5183/0x5184/0x5185/0x5186 = 0 0 0 1 ad980000 1 - no neighbour carries the 0xfe shape, so the 0xfe seen in R267/R270/R271 is the control word's own value, not neighbour leakage. Key 183 reproduces key 177's exact order (start then hand clear) and reads a clean 00000000, so the 0xfe was a one-off residual state, not a product of that order. All three keys show no translation fault (fsr=00000400, far=0).',
  '[ROUND 272 2026-11-23, DEVICE-VERIFIED] The 0xfe control-word value seen in R271 key 177 is written by that key's own start word, not left by the CM3 reset. Restarting the CM3, clearing nothing and sending NO start word at all leaves the control word at 00000000 (bit 0 clear) and the four status words 0x5180..0x5183 at 00000000 00000000 06030100 00000000 (key 179); the same shape plus a single start word turns the control word into 00000001 and 0x5180 into 00000001 while 0x5181/0x5182/0x5183 do not move (key 180). So a start word the firmware accepts writes bit 0 of 0x5180 - the first time 0x5180 has been seen to carry the acceptance bit. Key 178 - hand clear the word, restart, then send the start word - still reads 00000001 / pol=1, so the acceptance path itself is not broken by a restart; key 177 failed only because its hand clear came AFTER its start word. All three keys show no translation fault (fsr=00000400, far=0).',
  '[ROUND 271 2026-11-23, DEVICE-VERIFIED] A CM3 restart does NOT put the acceptance back. Clearing HFI_CTRL_STATUS by hand, restarting the CM3 and then sending NO start word at all leaves the control word at 00000000 through the whole 200000-poll watch while the init result still returns to babeface (key 175); reading the word right after a restart, before any hand clear or start word, reads 00000000 with bit 0 clear (key 176). Only the start word sent after the watch turns it into 00000001 (key 175 p2, key 176 p3). So the one R270 saw after a restart was written by the following start word, not restored by the reset. The once-per-boot acceptance therefore lives in the control word itself. Key 177 - hand clear, restart, then two start words with no clear between them - did NOT answer whether the limit counts firmware runs or boots: the first start word returned 000000fe (bit 0 clear) for the full 200000 polls, the second the same, so the word stuck in a non-zero 0xfe state instead of accepting; this is registered as an unresolved anomaly (the 0xfe shape matches R267 key 165 and R270), not attributed.',
  '[ROUND 270 2026-11-23, DEVICE-VERIFIED] The CM3 can be restarted inside one boot and the firmware really re-runs: each restart writes QTBL_ADDR and INFO, pulses CM3_SYSRESET, clears PWR_COL_CP_RESP and polls, and the init result word comes back from a cleared 00000000 to babeface after 5 polls, four times over (keys 172 and 174). After such a restart the control word reads 00000001 again and the bank records no translation fault (fsr=00000400, far=0). Re-arming the queue table onto a fresh page (b3500000) before the second start does not by itself refuse anything: no new fault, and the machine came back normally (key 173). Boundary, and this is the whole gap of the round: a restart puts a one back in the control word, but the second and third starts of keys 172 and 173 never had their word cleared, so the one may simply be the bit the first start left behind, and key 174 - which does clear by hand and reads 00000000 before restarting - still sees 0 polls after the restart. So this round cannot say whether a restart restores the acceptance or merely leaves the old bit standing.',
  '[ROUND 269 2026-11-23, DEVICE-VERIFIED] Four start words inside ONE boot: the first is accepted (ctl=00000001 after 1 poll), the control word is then written back to zero by hand (reads 00000000), and the next three start words - one right after that clear, one with no clear at all, and one after a second clear - all wait 200000 polls and stay 00000000 (key 169). So the once-per-boot limit is positive now, not just inferred. The word is genuinely readable and writable by hand: writing 1 reads 00000001, still 00000001 after a delay, writing 0 reads 00000000, and a real start word sent afterwards is still accepted (key 170), so the hand write does not consume the one acceptance. Clearing the word by hand leaves the other firmware words untouched: fwinit=babeface, cpmsg=ad983000, cpresp=0, info=0 and gfsr=0 read identically before and after the clear (key 171). No translation fault in any key (fsr=00000400, far=0). Boundary: the three refusals are a full-window silence in the register ledger, not a firmware-reported rejection, and what differs between polls=1, 0 and 103 still has no functional meaning.',
  '[ROUND 268 2026-11-22, DEVICE-VERIFIED] Six cycles of header write, dc civac, bank fault status clear, mask and start word inside ONE boot all read the control word back as 00000001 (key 166, 22 rows, twice). The four status words around each cycle (key 167, 0x5180/0x5181/0x5182/0x5183) show only 0x5180 bit 0 moving; 0x5181 and 0x5183 stay zero and 0x5182 stays 06030100, the chip id, so no second status word explains the missing wait. Key 168 starts once, writes HFI_CTRL_STATUS back to zero by hand (the read returns 00000000), clears the fault status, masks and starts again: after 200000 polls the control word is still 00000000. So bit 0 is a once-per-boot latch: software can clear it, but the start word does not set it again inside the same boot, and every polls=0 after the first cycle reads the earlier latch rather than a fast accept. That narrows section 91 judgement 1. No translation fault in any of the three (fsr=00000400, far=0, fsynr0=0); info stays 0, so acceptance is still a register-bookkeeping fact only.',
  '[ROUND 267 2026-11-22, DEVICE-VERIFIED] Three cycles of write, dc civac, mask and start word inside ONE boot were all accepted: key 163 on the header words 4..7 went 3 of 3 and key 164 on the safe words 64..67 went 3 of 3, each cycle reading its four written words back. The control word latches at 00000001 once set and writing the start word again does not clear it, so polls=0 on a later cycle reads the previous latch and not a fast accept. Key 165 writes no pattern, cleans once, writes only the mask and no start word: bit 0 stays clear through the full 200000 polls (ctl=000000fe, the same unexplained value as one R260 boot). No translation fault in any of the three (fsr=00000400, far=0, fsynr0=0). Acceptance still does not mean the firmware processed the request: info=0, no message and no interrupt, and the 223-poll first cycle versus the 1-poll first cycle of 164 is not attributed.',
  '[ROUND 163 2026-11-16, PIPELINE EXONERATED + BISECT A DISPATCHED] Control build #264 (device_ref = the throwaway branch r163-ctl-ci258 at 3f1de2be, the ci258 tree) produced payload sha256 d6660eae5e, and on the device it booted and wrote a full log: window cd2e4c1b80, boot_id 584678385, 8 enchilada-adreno rows, complete stage7. So the workflow, toolchain and packaging are not the cause and the four silent boots (R159-R162) are all attributable to our own source delta. The remaining binary geometry delta is small: __cstring +136 B, __text +1024 B, __DATA,__common +24 B (three new globals), __DATA,__bss +344 B (gGpuStateReplay[340] + gHaveGpuStateReplay), __LINKEDIT filesize +472 B; the BSS growth shifts every other BSS symbol in __DATA (armcpu_scm_busy #0x90 to #0xa8, armcpu_wdog_live #0x20 to #0x38). Bisect A is dispatched (CI #265, branch r163-b-armcpu-new = 3f1de2be with only the R162 ArmCpu.cpp swapped in). Admission is still modeled=9 / satisfied=0 / BLOCKED and the GPU still has not rendered a frame. Do not call the pipeline question settled for anything other than boot observability.',
  "[ROUND 162 2026-11-16, DEVICE RESULT -- FOURTH SILENT BOOT] R162 was built (CI #262) and booted once: gate PASS, flash system_b OK, fastboot boot OK, back in recovery after 38 s, window sha256 96f0d6556742fb17 equals the R160 control window byte for byte, boot_id 629517746, gputate absent, and the system_b read back head hash 8a478034 equals the payload head so the flash did take. The binary was checked before the run: _armcpu_scm_call is 24 instructions and identical to ci258 except the busy-lock BSS address, ArmCpu::start is 2672 bytes / 668 instructions / 9 smc in both kernels, the module constructor is identical, and the payload container shares its first 4 KiB and its kernel offset 952320. So the early SCM shape is restored and the boot is still silent, which falsifies the third hypothesis as well. No cheap post-mortem is available: ro.boot.bootreason is empty and /sys/fs/pstore is empty. Before any further source hypothesis, the pipeline itself has to be cleared by rebuilding the tree that produced the booting ci258 payload.",
  '[ROUND 162 2026-11-16, HONEST BOUNDARY] THE R160/R161 ATTRIBUTION IS FALSIFIED AND R162 IS NOT A FIX. R161 set the re-issue cap to zero and the kernel was still silent: the window was byte-identical to the R160 control window (sha256 96f0d655.., boot_id 629517746), so a running re-issue loop is not a sufficient cause, and both older entries below that name the loop as the culprit are superseded. Byte comparison of ArmCpu::start (ci258 0xfffffff00bf71220 vs R161 0xfffffff00bf7174c, both 1130 instructions, 9 vs 18 smc sites) leaves only three early deltas: (a) an extra mov x6,#0 before each smc; (b) an armcpu_scm_retries_capped atomic increment on the positive-a0 path; (c) one read of armcpu_scm_retry_cap. Delta (c) is the dangerous one: the cap is a zero-initialised global in __DATA,__common (BSS), its zero exists only after the loader zero-fills vmsize minus filesize (3932160 minus 442368 bytes) of __DATA, ArmCpu::start runs much earlier, and nothing on this platform has shown that the fill is complete at that point, while the ci258 early path never touched BSS at all. R162 therefore restores the device-proven early shape: struct ScmTriple { a0, a1, a2 }; scm5 does a single smc with six plus-r operands and x6 only in the clobber list, no cap, no counters, no loop; scm4 and scm are thin ScmTriple wrappers; armcpu_scm_call, _call5 and _call5_r use ScmTriple; scmDisableCrashdump keeps its meaning because it only reads a0 and a1. The retry machinery (per-iteration reload, cap, both counters, ScmResult{a0,a1,a2,a3,a6,retries}) now lives only in scm5Retry, whose only caller is armcpu_scm_call_full, the stage-7 shmbridge probes that run after the log writer. Verification so far is host-only: stage6 314 checks (was 299, +15 for early purity and late preservation), k3 76, host suites 31, probe 26/26, full sweep 71/71. Admission table unchanged at modeled=9 satisfied=0 BLOCKED; CONFIG_XNU_NATIVE_ADRENO=n; the GPU has never rendered; gputate= has never been read.',
  '[ROUND 161 2026-11-16, DEVICE RESULT + HONEST BOUNDARY] THE R160 FIX WAS INSUFFICIENT AND A CONTROL RUN FOUND THE REAL DELTA. Three readings, one boot each, same phone, same boot-r16.img, same procedure: (a) the R160 payload (#260, retry loop with the per-iteration input reload) produced a 32 MiB window with sha256 2f513143... and boot_id 935335677 and ZERO gputate= rows - byte-identical to the R147/R159 window, so XNU again never reached the log writer at about 31 s; (b) the control, the ci258 payload (pre-R152, NO retry loop, head 8 MB 9897785c...), produced a NEW window sha256 96f0d655... with boot_id 629517746, first timestamped line t=30.72 s (kprintf initialized ... NativeUfs OS volume ready) and eight enchilada-adreno rows at t=31.79-32.06 s (verdict=cx-DOWN, stage2=cx-down-gmu-not-mapped, stage5=run up=0 up_fail=5). Flash, payload handoff, kernel load and log pipeline were therefore all WORKING; what kills the early boot is the SCM re-issue path itself, NOT the missing input reload, because the reload was fixed and the boot was still silent. The commit pair makes the delta narrow: 4a786a39 (R158, source of #259 and #260) has parent 3f1de2be (R145-146, source of ci258) and the only early-executed difference is the retry loop in scm5 - every probe-side gputate= / rt= statement runs in the poll stage>=4 branch, after 31.8 s. R161 therefore gates the re-issue behind armcpu_scm_retry_cap, DEFAULT 0 = never, while KEEPING the loop, the rt= report and the per-iteration reload so that a future per-call-site enable still sends the same call. NOT PROVEN, deliberately not claimed: WHICH call wedges the monitor in EL3 remains unidentified; R161 has not been on the device yet; the admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the GPU has never rendered a frame and our kernel has never authenticated zap. system_b currently holds the ci258 payload (control-run leftover) and must be re-flashed before any R161 run.',
  '[ROUND 160 2026-11-16, HONEST BOUNDARY] THE STOP-LOSS IS RETRACTED, AND THE FIX IS NOT PROOF. R134-R136 declared route B dead because v13=0 was read as the hardware refusing PAS for peripheral 13; ROUND 150-157 shows that reading was never justified: the OEM device tree carries qcom,kgsl-hyp with qcom,pas-id=<13> and memory-region=<0x2a9> -> gpu_region@0x8c415000 (8192 B), and the Windows image the user actually booted on this same unlocked phone carries the same PAS configuration (its UEFI firmware volume contains a zap-shader node with firmware-name=qcom/sdm845/oneplus6/a630_zap.mbn). What is retracted is the CAUSAL claim (the secure world does not provide PAS) and the ADVICE (move to software rendering); the readings themselves stand. NOT retracted and NOT relaxed: the admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, and the GPU has never rendered a frame. The R160 claim is narrow: the scm5 retry loop added in R152 used x0..x6 as both input and output operands, so a retry re-issued the SMC with fnid=a0 and args=return values; the fix re-loads every input per iteration, which is what both the pinned qcom_scm-smc.c and Windows TZT_ASM do. That fix is HOST-VERIFIED ONLY (31 host suites, probe 26/26, 71 of 71 verifiers, zero count drift); whether it lets XNU reach the boot-log writer is a DEVICE question the R160 run must answer. If the window still shows the old boot_id with zero gputate= rows, the retry-loop hypothesis is WRONG and must be re-derived rather than patched a third time.',
  '[ROUND 101 2026-11-13, HONEST BOUNDARY] ONE INPUT OBTAINED, NOT THE ROW SATISFIED. ias is now measured, which removes the input round 77 proved underivable and round 85 proved unreadable from userspace - but kgsl-smmu-stage1 needs FOUR inputs and three remain: an ASID allocator (none exists), a populated 4 KiB-granule LPAE page table (none exists), and a programmed context bank. words_ok=1 and plan_ok=1 mean the CONTRACT computed the round-83 words from the real ias; not one of them has been written to the SMMU. A single device run, a single boot, a single window. The ID2 value is stable for this part and this firmware, but one read is one read: it is not a sweep across boots. The measurement also constrains what comes next rather than unblocking it: ias=48 with IAS=1 giving ipa=36 means the translation regime is 48-bit VA over a 36-bit IPA/PA, and the granule set is 4K/16K/64K with 8-bit VMIDs only - all facts a future context programmer must honour, none of which build one. The device ran with the reboot guarantee verified first and re-armed immediately afterwards; no flash of boot_a, no partition written except system_b (the payload slot, the failed one), m39510 NOT exercised. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified as an AREA even though this SUB-RESULT is device-sourced, and this does NOT unblock stage 5.',
  '[ROUND 95 2026-11-13, HONEST BOUNDARY] ARMED BUT NEVER EXECUTED. No flash was performed for this round, the stage has never written a register, no reboot, m39510 NOT exercised. The evidence class is a compile plus static verifiers, which is what this port has always required before arming a device write path. WHEN IT RUNS, THREE OUTCOMES ARE POSSIBLE AND THE ROW DISTINGUISHES THEM: (a) up=Ok with cx_on_after=1 - the domain came up, which would be the FIRST TIME this port powered the GPU, and it would unblock stage 4 ID2 read on the next boot; (b) up=Ok with cx_on_after=0 - the five ordered ops executed and THE RAIL DID NOT RISE, which is a real hardware finding rather than a defect in the plan; (c) up=<not Ok> - an op was refused and up_fail_index names which one. Even outcome (a) does NOT satisfy kgsl-smmu-stage1: that still needs an ASID allocator and a populated LPAE table, neither of which exists. The round-22/28 prohibition is UNCHANGED and is deliberately not enforced by this stage: writing gpu_cx_gdsc own control register is how a collapsed domain is raised, and that register lives in always-on GPUCC; the gate that must run before any GPU/GMU/SMMU window READ is still AdrenoGmuCallerV1Precheck. The admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified, and this does NOT unblock stage 5.',
  '[ROUND 94 2026-11-13, HONEST BOUNDARY] KERNEL PROBE, HOST-VERIFIED AND FAIL-CLOSED, NOT RUN ON HARDWARE. No flash was performed for this round, no device register was read by this stage, no reboot, m39510 NOT exercised. The evidence is a compile plus two static verifiers, which is exactly the strength the port has always required before arming a device path: check-enchilada-adreno-probe.py 18/18 (including that the only dereference is a read and that there are no unexpected undefined symbols) and verify-enchilada-probe-stage4.py 45 checks. THE HONEST GAP IS SPECIFIC: stage 4 has never executed, so the row it prints is unknown until a device run. Even then, a refusal row proves the GATE works and proves NOTHING about ias - the two must never be conflated. Obtaining ias additionally requires CX to come up first, which is a genpd/clock backend this port still does not have, so stage 4 cannot produce a value on the current device state at all. The admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED: making an input OBTAINABLE is not obtaining it, and satisfying kgsl-smmu-stage1 also needs an ASID allocator and a populated LPAE table that nobody has written. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified, and this does NOT unblock stage 5.',
  '[ROUND 85 2026-11-13, HONEST BOUNDARY] A READ-ONLY DEVICE ROUND that produced a NEGATIVE RESULT. No MMIO write, no ioctl, no KGSL submission, no snapshot buffer, no firmware load, no PAS, no SMMU programming, no flash, no reboot, no persistent file. debugfs was mounted briefly and UNMOUNTED with the removal verified (mount count back to 0, mountpoint empty again); the /dev/mem node created to TEST the exclusion was removed and its absence asserted. The device finished the round exactly as it started: still in recovery, not rebooted, zero debugfs mounts. No ID2 read happened, because it is not possible on this kernel - that absence IS the finding rather than a shortfall. No GPUCC GDSC status read either: the round-28 design needs /dev/mem and is blocked by the same ceiling, and it was deliberately NOT attempted after Finding 2 proved it impossible, because a failed read recorded as if it were a measurement is worse than no read. The admission table is UNCHANGED: modeled=9, satisfied=0, BLOCKED. Learning that an input is UNREADABLE does not satisfy it; it narrows the method. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the four hard blockers of docs/porting/gpu.md section 1 remain open, the gpu area STAYS host-verified, and this does NOT unblock stage 5.',
  '[ROUND 84 2026-11-13, HONEST BOUNDARY] CI-COMPILE/LINK ONLY, the same boundary as CI #214-#238. No device run, no flash, no MMIO, no ioctl, no mount, no reboot; m39510 NOT exercised. The run compiled and linked; it did not execute one instruction of the new module on hardware, and every value that module derives remains computed from pinned sources rather than read from the SMMU. The 29-object archive and the +4,096 B image are OBSERVED facts about a macOS cross-build; they are not device evidence. The admission table did NOT move and was not touched: modeled stays 9, satisfied stays 0, verdict stays BLOCKED, and kgsl-smmu-stage1 keeps modeled=1 with the three inputs it still lacks (ias from an ID2.UBS probe read, an ASID allocator, a populated LPAE table). Two things this run deliberately does NOT license: it does not make the four round-75 blockers any less real, and it does not make the first device action any closer - CX still must come up first, the SMMU still cannot be read before that, and zap-auth remains the largest single piece. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, and the gpu area STAYS host-verified.',
  '[ROUND 83 2026-11-13, HONEST BOUNDARY] WORD DERIVATION ONLY. This module computes the values a stage-1 context bank is a function of and the order to write them; it reads no register, allocates no page table, owns no ASID, maps nothing, and programs nothing. No device run, no flash, no MMIO, no ioctl, no mount, no reboot; m39510 NOT exercised. The admission table is UNCHANGED and deliberately so: round 75 already records kgsl-smmu-stage1 as modeled=1, and deriving one more word satisfies NONE of its four inputs, so this round moves no row and does not touch AdrenoGen1BackendV1. THREE inputs remain absent and are derived into ready()==0 rather than assumed: ias, because ID2.UBS is a PROBE-TIME REGISTER READ (P2:1904-1905 -> P1:70 -> P2:1879, round 77) and no document or DTS can supply it; asid, because this port has no context-bank allocator (P2:795 cfg->asid = cfg->cbndx, round 75 I2 unchanged); and a populated LPAE table, because TTBR is virt_to_phys(pgd) of an allocated table (P2:1023, round 75 I1 unchanged). Round 75 I3 (streams still in the firmware BYPASS handoff, round 53 Busy=10 id0=4c017e4c) and I4 (CX measured DOWN, round 35 cx=0x00005ff4) are DELIBERATELY NOT repeated in the mask of this module, because they gate whether a context may be PROGRAMMED, not which word to write - and blurring that distinction is how a word model starts to look like a driver. They remain in force for the write path. CONFIG_XNU_NATIVE_ADRENO=n, A630 client GPU windows stay all-zero, the four hard blockers of docs/porting/gpu.md section 1 remain open; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 66 2026-11-12, BOUNDARY] AdrenoDarwinKmdAbiV1 is a HEADER/DIRECTORY CONTRACT, NOT a GPU driver and NOT a compiled Turnip dylib: it maps no register, allocates no BO, maps no IOVA, powers no domain, loads no firmware, publishes no MTLDevice and is reachable from no IOKit user client. Building the real Turnip darwin-KMD dylib needs xcrun --sdk iphoneos, -fobjc-arc, Apple frameworks, codesign and hdiutil, all macOS-Xcode-bound and absent locally. It does NOT unblock stage 5. No device run, no flash, no MMIO, no CI result and no Turnip build this round; m39510 (standing flash authorization) NOT exercised; gpu area STAYS host-verified.',
  '[ROUND 67 2026-11-12, BOUNDARY] AdrenoMetalPublishV1 is a POLICY CONTRACT, NOT a GPU driver and NOT a Metal plugin: it maps no register, allocates no BO, programs no SMMU context, loads no firmware, creates no MTLDevice or user client, and the four A630 GPU windows are structurally ZERO until a board VA map and a working kgsl SMMU stage-1 context exist (never from a guess). Of the nine establishment stages only the client allow-list stage carries ZERO blockers and is fully portable; the other eight still carry the macOS toolchain (hdiutil/codesign/xcrun for the Turnip dylib, the ObjC++ plugin and the APFS Data seed), the OS Metal/IOSurface ABI, the A6XX_GEN1 backend, the signed ZAP/PAS chain and the SMMU context as blockers (OR 0x3f today). enchilada_publish_frontend_allowed requires all SEVEN prerequisites and returns 0 today because only the compiler prerequisite (pinned Mesa 85fda3b36405bcaea8bffc64aa4f2651dc90770d already supports GPUId(630)/CHIP.A6XX/a6xx_gen1) is satisfied. No device run, no flash, CONFIG_XNU_NATIVE_ADRENO=n unchanged; gpu area STAYS host-verified.',
  '[ROUND 65 2026-11-12, BOUNDARY] AdrenoMetalSeamV1 is NOT a GPU driver and NOT a Metal frontend: it maps no register, allocates no BO, maps no IOVA, powers no domain, loads no firmware, publishes no MTLDevice and is reachable from no IOKit user client. It does NOT unblock stage 5: the A6XX_GEN1 backend, TrustZone PAS auth, kgsl SMMU context and OS Metal/IOSurface ABI remain open and CONFIG_XNU_NATIVE_ADRENO=n is unchanged. The archive has NOT been rebuilt locally because this Windows workspace lacks the recorded XNU ios-obj tree; only macOS CI can link the 20th object. No device run, no flash, no CI result and no MMIO this round; gpu area STAYS host-verified.',
