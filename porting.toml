  '[ROUND 94 2026-11-13, HOST-VERIFIED + FAIL-CLOSED] The order that follows is now unambiguous, because the only missing INPUT on the SMMU row has a named, coded, gated producer. (1) CX must come up, and that is a kernel-side genpd/clock backend that does not exist yet - it is the same power path rounds 51/56/57/58/59/61/62 modelled and round 62 gave an executor, but never a real bus. Until it exists, stage 4 will refuse on every boot and that is correct behaviour rather than a fault. (2) With CX up, stage 4 yields ID2 and therefore ias, and round 83 TCR/TCR2 become COMPLETE for the first time; the stage-1 context words can then be programmed once an ASID allocator and a populated LPAE table exist. (3) Those three inputs (ias, asid, page table) are precisely the prerequisites kgsl-smmu-stage1 has recorded since round 75, so this round does not shorten the list - it makes the first item reachable. (4) Only after the SMMU context is real does a Mesa freedreno path become possible at all, because freedreno needs a DRM/kernel interface (kms + gem + submit) that nobody has written for XNU, and bergamota own README still lists GPU acceleration under Working on rather than working. So the next artifact is the CX power backend, not another contract and not a firmware change. Nothing in this list can be advanced by reading more of the vendor driver.',
  '[ROUND 85 2026-11-13, DEVICE-SOURCED] The strict order is unchanged but its COST is now measured, and that is what this round bought. ias cannot be read from userspace on a DEVMEM-less kernel, so the stage-1 words derived in round 83 cannot be COMPLETED from userland either: the only path left runs through code in the kernel. That makes the next real step unambiguous and it is not another survey. In order: (1) CX power and the SMMU probe must both move INTO the XNU-side driver, because a userspace probe cannot see ID2 at all; (2) the driver reads ID2.UBS at probe exactly as arm-smmu.c:1879-1905 does, derives ias, then mixes it into the round-83 TCR/TTBR words - which is the first moment those words become complete; (3) zap-auth remains the largest single piece (an XNU SMC conduit to the SIP owner, a storage path turning the round-74 MDT parser into the LOADER S7 needs, and the S2/S3/S4 node-shape decision); (4) only then the round-28 gated GPUCC read as the first honest device action - and note it needs kernel-side MMIO too, for the same DEVMEM reason. Two things this round rules OUT so no future round wastes effort on them: a TWRP or userspace SMMU register probe is impossible on this boot image, and re-mounting debugfs will never yield ias because no such node exists. Anything that claims to read ID2 from userland on this device should be treated as an error. The three unmodelled prerequisites (device-proof, config-on, macos-frontend) still need a running driver or a macOS host. No device run of PORT code, no flash, no MMIO, m39510 NOT exercised.',
  '[ROUND 84 2026-11-13, CI-VERIFIED] Every contract module this port has written is now CI-compile/link-proven, including the round-83 stage-1 word derivation, so the modelling column of the admission table is as full as this workspace can make it. That does NOT move the verdict - it stays modeled=9 / satisfied=0 / BLOCKED - and it does not reorder the work: a compile proof of a contract satisfies nothing on the phone. What is left is therefore not another module and not another CI run for its own sake. The strict order is unchanged: (1) CX must come up first, because the four SMMU inputs and the round-77 ID2 dependency both need it; (2) with CX up the SMMU can be probed (ID2.UBS to learn ias) and programmed (the now-derived stage-1 words), which yields BOTH the translation regime and the VA aperture; (3) zap-auth remains the largest single piece - an XNU SMC conduit to the SIP owner, a storage path turning the round-74 MDT parser into the LOADER S7 needs, and the S2/S3/S4 node-shape decision; (4) only then does the round-28 gated GPUCC READ become the first honest device action. The three unmodelled prerequisites (device-proof, config-on, macos-frontend) still need a running driver or a macOS host and cannot be advanced from this workspace at all. This run CLOSED the last pending archive change: every archive unit this port has added since round 78 is now compiled and linked by the kernel own clang, so a further dispatch with no new unit would certify nothing new - it would be a ritual, not a proof. The next archive change that would justify a CI run is the XNU-side caller that actually programs the derived words, and that cannot be written before CX comes up.',
  '[ROUND 83 2026-11-13, HOST-VERIFIED] The stage-1 words are now derived from pinned sources instead of accepted as arguments, and the sequence is complete, which sharpens the remaining work on THIS row without moving the strict order. What the row needs next, in order, and none of it is a document: (a) ias, from an ID2 read that requires CX up - which is why the SMMU row cannot precede the power row and why round 77 already sequenced CX first; (b) an ASID allocator, since CONTEXTIDR and both TTBRn_ASID fields need an owned ASID and this port has none; (c) a populated 4 KiB-granule LPAE table, since TTBR is virt_to_phys(pgd) of an allocated table; and only then (d) the write path itself, where round 75 I3 and I4 become live: the target streams must FAULT before a context bank can be bound (round 53 measured Busy=10 in the firmware BYPASS handoff) and CX must be UP (round 35 measured 0x00005ff4 with BIT(31) clear). The one thing this round CHANGES about the order is diagnostic rather than structural: a future programmer can no longer be written against the round-75 six-write plan, because that plan would leave the context bank without a CBAR type, without VA64, without PASIZE, and with neither TTBR carrying an ASID - it would fault or translate against stale state and would look like a hardware problem. Strict order from here is otherwise UNCHANGED: (1) CX up first; (2) with CX up, probe ID2 to learn ias and program the stage-1 context, which yields BOTH the translation regime and the VA aperture; (3) zap-auth - an XNU SMC conduit to the SIP owner plus a storage path turning the round-74 MDT parser into the LOADER S7 needs, plus the S2/S3/S4 node-shape decision; (4) only then the round-28 gated GPUCC READ as the first honest device action. Nothing in (1)-(4) can be advanced by reading more of the vendor driver, because the vendor driver is not the artifact being built. The three unmodelled prerequisites (device-proof, config-on, macos-frontend) still need a running driver or a macOS host. No device run of PORT code, no flash, no MMIO, m39510 NOT exercised.',
