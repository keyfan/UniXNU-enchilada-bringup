inputs = ["Synaptics RMI4 over GENI I2C (i2c12 @0x20, IRQ tlmm 125, vdd/vio supplies, ts_1p8 regulator on tlmm 88), 3048x2032 sensor mapped to 1080x2280; no physical buttons (board.toml:227 'This board has no buttons')."]
configuration = [ "Stage 4 welcome-screen test payload (stage4welcome, 2026-11-08): 49 items / 995/1000 B arg string = device-verified dataswipe chain (enchilada-touch=4, sheng-touch-hid=1, enchilada-touch-swipe=480, sheng-gpu-addon=1, enchilada-deadline=900, sheng-data-reset=1) with cosmetic sheng-no-mac-label=1 dropped and enchilada-backlight=4 added; enchilada-wdog=3 auto-return. Reuses the CI #211 kernel (23d2428b) so no new CI build was needed.","build-enchilada-touch.py builds EnchiladaTouchProbe + NativeHidInput into libEnchiladaTouch.a; CONFIG_XNU_EXTRA_LD_ARCHIVES force-loads it; playSwipe() synthesizes a 24-frame full-height stroke every 120 s."]
procedure = [ "Stage 4 device chain: two independent pre-build checks (verify_stage4_prebuild.py arg re-derivation + CI #211 artifact hash; argbudget_stage4welcome.py / preflash_check_stage4welcome.py gates+wdog+misc+kernel sha) -> flash test-cycle.py stage4welcome -> read-only log-window collection (collect_stage4welcome.py, no reboot, no reflash) -> smoke_stage4_parsers.py baseline regex check -> two independent device verifiers (verify_device_stage4welcome.py L-row/edge/HID/stroke decode + verify_device_stage4welcome_independent.py remote source format strings, raw header, FT5 counters, flashed-image gates, boot freshness) -> _collect_stage4welcome_data.py facts JSON.","NativeHidInput.cpp:161-212 touchSend() publishes a 62-byte HID report every frame; EnchiladaTouchProbe.cpp:572-588 playSwipe() and :657-670 the 40 ms / 120000 ms cadence; EDGE wrapper marks contacts from the bottom edge."]
findings = [ "Stage 4 DEVICE-VERIFIED (stage4welcome, 2026-11-08): the strict-order welcome-screen re-test booted the CI #211 kernel with BOTH enchilada-backlight=4 and the full dataswipe touch chain in ONE 995/1000 B arg string. 510 L rows all st=7 (backlight service Published, max=0x3ff) AND [touch edge] installed=1 contacts=4 from_edge=4, TOUCH HID touch-reports=337 result=0, [touch] strokes=4 extent x 1522..1522 y 0..2031 are live in the SAME fresh boot (boot_id 548302479, uptime 898 s, slots 1737, write_errors 0). Two independent device verifiers PASS. This satisfies the old next_action (re-run the welcome-screen test once the DCS backlight is in place).", "RETROSPECTIVE log analysis (2026-11-08, 244 decoded latest.txt/msgbuf.txt files): the earlier claim that Setup Assistant was blocked by SpringBoard crashing in CoreImage GLContext creation (mach_vm_allocate_kernel failure) has NO literal log evidence - zero hits for CoreImage, GLContext, mach_vm_allocate_kernel, EXC_BAD_ACCESS or a SpringBoard crash row. The wide panic=170 hits are benign DumpPanic process-name / ustate container path noise; the real CRASH rows across all boots are PerfPowerServices sig6 (SIGABRT). The claim was an external inference (screen photo / other channel), not reproduced by the decoded boot logs, so it is neither confirmed nor disproven here.","[HISTORICAL, unverified external inference - see RETROSPECTIVE finding above]: The dataswipe run proved all 84 HID reports were delivered and produced a 32-frame ripple animation, but Setup Assistant did not advance; the blocker was reported as SpringBoard crashing in CoreImage GLContext creation (mach_vm_allocate_kernel failure), not the touch driver. No literal log evidence exists for that crash (see evidence/stage4-welcome.md).", "ShengNovatekTouch is the sheng SPI component; enchilada instead uses RMI4 over GENI I2C, so the sheng touch transport is not reusable (fajita's build-fajita-touch.py S3706B/RMI4 is the closer reference)."]
completion = [ "Stage 4 DEVICE-VERIFIED: backlight control plane (st=7, max=1023) and RMI4/HID touch chain (edge wrapper installed, 337 HID reports, 4 full-height strokes) both live in one boot. Does NOT include first-run UI advance or optical brightness readback.","Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = [ "Honest limits of stage4welcome: no Setup process line and no optical readback, so whether the first-run Setup Assistant welcome screen advanced is UNCONFIRMED; CoreBrightness userspace acceptance UNCONFIRMED (req=0); the SpringBoard CoreImage GLContext crash has no literal log evidence (244 logs scanned, real CRASH rows are PerfPowerServices sig6). The synthetic swipe remains a diagnostic aid, not production input.","No ButtonProbe (there are no physical buttons to report); the synthetic swipe is a diagnostic aid, not a production input path; SpringBoard-side gesture handling was never fixed."]
next_action = [ "Stage 4 DONE (DEVICE-VERIFIED stage4welcome + evidence/stage4-welcome.md). Remaining honest limits: first-run Setup Assistant advance UNCONFIRMED (no Setup process line, no optical readback); CoreBrightness userspace acceptance UNCONFIRMED (req=0). NEXT: continue the official unixnu.com 8-stage order with the still-open areas - memory ArmSmmu4K, gpu Adreno A630 (NOT Adreno740), network WCN3990 Wi-Fi/Bluetooth, audio WCD9340/MAX98927, cellular QcomBaseband, power bq27441/PMI8998 battery + cpufreq - each with its own two verifications + CI + device evidence + porting.toml record.","[HISTORICAL, superseded by stage4welcome device verification 2026-11-08]: Once the DCS backlight is in place, re-run a present/welcome-screen test to confirm whether the SpringBoard/CoreImage crash still blocks the first-run UI."]
evidence = [
  { kind = "source", reference = "package/EnchiladaTouchProbe.cpp", result = "RMI4 touch probe with playSwipe() and stroke tracking." },
  { kind = "source", reference = "NOTES-touch.md", result = "Touch/probe design notes." },
  { kind = "device", reference = "evidence/console206.md", result = "Boot log line B st=0 irq=0 rep=0 ... documents the input probe; the boot completed with userland running.", command = "python scripts/test-cycle.py console206 --wait-return 900", revision = "7eeda1e01aa906ff3b2ac5fa58fdcfd244701c59" },
  { kind = "device", reference = "evidence/stage4-welcome.md", result = "CI #211 kernel (23d2428b69d5) flashed as stage4welcome with enchilada-backlight=4 + full dataswipe touch chain (995/1000 B): 510 L rows all st=7 (backlight Published, max=0x3ff) AND [touch edge] installed=1 contacts=4 from_edge=4, TOUCH HID touch-reports=337 result=0, [touch] strokes=4 extent x 1522..1522 y 0..2031 in ONE fresh boot (boot_id 548302479, uptime 898 s, slots 1737, write_errors 0). FT5 hid up1 chk897 rep337 res0 n337 edge1/4/4 svc897 open1 eso1 uc1 tdm- pub1 mapL1080x2280. The flash command returned CYCLE_EXIT=1 only because enchilada-deadline=900 made the watchdog auto-return land at ~941 s beyond the 900 s wait window; the phone did return to recovery and the log window was collected READ-ONLY (no reboot, no reflash). Two independent device verifiers PASS; controls console206 st=0 / backlight208 st=3 / backlight209mode2 st=4 / backlight210mode3 st=5 / backlight211mode4 st=7 unchanged. Does NOT prove first-run Setup Assistant advance (no Setup process line, no optical readback) nor CoreBrightness acceptance (req=0); the CoreImage GLContext crash has no literal log evidence (244 logs scanned, real CRASH rows are PerfPowerServices sig6) - see evidence/stage4-welcome.md for the honest Proves / Does NOT prove list.", command = "python -X utf8 oneplus6-ios/scripts/test-cycle.py stage4welcome --wait-return 900", revision = "4bd917b8a6d4d7c64bafac286b3e1a5be26d8f87" },
]

