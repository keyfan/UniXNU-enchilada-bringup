]
inputs = [
  "STAGE 7 DEVICE-VERIFIED (2026-11-09) via a read-only bq27xxx probe: the gauge answers at 0x55 on SE10 / i2c10 (0x00a88000, QUP wrapper 0x00ac0000, 100 kHz), reached through the same device-verified NativeGeniI2c transport as the stage-4 RMI4 touch. No proprietary firmware, no DSP and no closed OS ABI are involved.",
  "MODEL CONFLICT RESOLVED ON HARDWARE (not by assumption): both bq27xxx register-map families are implemented and BOTH are read every probe. The verdict line reports family A (mainline ti,bq27411 map: SOC 0x1c / VOLT 0x04 / TEMP 0x02 / AI 0x10 / FCC 0x0e) as physically sane at pl=6/6, while family B (vendor ti,bq27541 map: SOC 0x2c / VOLT 0x08 / TEMP 0x06 / AI 0x14 / FCC 0x12) decodes to impossible values at pl=3/6 (soc=3161, t=-2059). The selection is therefore measured, not guessed.",
  "Official power guide (section 1), verbatim: the transport, the device protocol and the OS service are implemented separately; a board with a directly connected I2C gauge implements the chip register protocol, a board with a DSP battery manager implements its message protocol. sheng ShengBattmgr.h is the SM8550 PMIC GLINK message protocol and is NOT this I2C gauge.",
  "battery: simple-battery 3300000 uAh / 3.4-4.4 V and the bq27xxx fuel gauge on i2c10 @0x55; PMI8998 charger; PM8998/PMI8998/PM8005 RPMH regulators; 8 CPU clocks.",
  "GCC clock vote for SE10 = BIT20 (m_ahb) | BIT21 (s_ahb) | BIT24 (S2), with halt bits at 0x1800c / 0x18010 / 0x18274 and the S2 RCG at 0x18278; pinmux GPIO55 (SDA) / GPIO56 (SCL) as qup10 function 1 on the NORTH tile (0x03400000 + 0x00500000 + 0x1000 * n)."
]
configuration = [
  "drivers/NativeBattery/BqGaugeProbe.h/.c: freestanding pure C read-only orchestrator (own integer formatting, no libc) that reads the 7 standard commands for BOTH register-map families and scores them for physical plausibility.",
  "package/EnchiladaGaugeBoard.h + package/EnchiladaGaugeProbe.cpp: thin C++ shim that maps GCC / wrapper / SE / pins with armcpu_map_physical, votes the three clock bits, writes the two pin CTLs, initialises and clocks NativeGeniI2c, then calls the pure-C core. Gated by the boot arg enchilada-gauge=<stage> (1 = survey only, 2 = enable and probe); absent means the probe never runs.",
  "scripts/build-enchilada-gauge.py builds libEnchiladaGauge.a and it is force-loaded from CONFIG_XNU_EXTRA_LD_ARCHIVES in configs/enchilada_defconfig, so the weak_import hook in package/BootProgress.c resolves to the strong definition.",
  "The probe never writes CONTROL / CONFIG / unseal or data-flash: only the standard command register address byte plus a 2-byte little-endian read appear on the bus. Clock voting and pinmux writes are controller bring-up, exactly as the stage-4 touch driver does.",
  "enchilada-gauge=2 in the payload boot args; the poll is 1 Hz from the existing package/BootProgress.c monitor thread; the verdict text is replayed every tick so it survives the 128 KiB msgbuf ring overwriting early boot output."
]
procedure = [
  "Verification 1 (host): python scripts/check-enchilada-gauge-probe-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe (decoder 11 groups + read-only orchestrator 7 groups) and a CI-equivalent clang++ -std=c++20 -Wdeprecated-volatile -Werror -fsyntax-only of the shim.",
  "Verification 2 (host, different method): strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow -O2 -ffreestanding on BqGaugeProbe.c plus an independent program that drives the core through a fake I2C file and re-derives the printed verdict.",
  "Verification 3 (device): python -X utf8 scripts/test-cycle.py gaugereplay --wait-return 400 flashes the payload, waits for the deadline auto-return, then work/tmp/collect_gaugereplay.py pulls the 32 MiB window read-only and decodes it.",
  "Two independent device analyses were then run over different data paths: analyze_gaugereplay_device_logs.py (decoded log files) and analyze_gaugereplay_serial.py (raw window bytes plus the host serial watcher log).",
  "Verification 4 (round 18, read-only re-analysis, no new flash): a full survey of all 133 archived boot dirs under work/log/ found six distinct boots carrying the gauge verdict. _gauge_multiboot_scan.py (regex over msgbuf.txt + latest.txt, family-A tuple de-duplication) and _gauge_multiboot_verify2.py (raw-byte scan of every file, whitespace split parser, header validation, cross-check) are two independent readers; both agree and GAUGE_MULTIBOOT_VERIFY2: PASS (12/12)."
]
findings = [
  "STAGE 7 DEVICE-VERIFIED (2026-11-09, boot_id 553807564, uptime 899 s): the gauge probe ran read-only on hardware and returned rc=0 with a full 12/12 register read set. Verdict line, verbatim: enchilada-gauge: rc=0 BG sel=bq27411 / bq27441 (mainline ti,bq27411 @0x55) ok=12/12 a[soc=100 v=4326 i=0 t=145 f=3153 d=3240 pl=6/6] b[soc=3161 v=3191 i=-3402 t=-2059 f=0 d=3240 pl=3/6] (replay t=899 attempt=1)",
  "Both independent analyses agree (read_only_probe_device_verified = true on each): family A decodes to SOC 100 pct / 4326 mV / 0 mA / 14.5 degC / 3153 mAh full / 3240 mAh design with 6/6 fields plausible, which is a sane charged battery; family B decodes to SOC 3161 pct and -205.9 degC, which is physically impossible. That contrast, not a datasheet guess, fixes the chip family.",
  "Three earlier flashes were INCONCLUSIVE and are recorded as such rather than as failures: the 128 KiB msgbuf ring is overwritten from ~59 s onward at 1300-3000 B/s of early boot output, so the t<8 s probe lines were collected-but-discarded. Shortening the watchdog deadline from 900 to 240 to 60 s did not help, because the ring fill time is a property of total boot output, not of the deadline. The fix was to replay the verdict every 1 Hz so the newest copy always sits inside the ring; the ring then held 480 gauge lines across ticks 420-899.",
  "STAGE 7 DECISION (retained): the full DSP / audio / GLINK-battery / RPMh-cpufreq path stays BLOCKED. enchilada SDM845 uses pil-tz-generic LPASS firmware and a SLIMBUS WCD9340 codec with Q6AFE, while sheng SM8550 uses AdspProbe AudioReach/GPR with SoundWire plus PMIC GLINK; the generations and buses differ, the .mbn firmware blobs are absent from the workspace, and the iOS CoreAudio / IOPMPowerSource ABI is closed-source with no macOS or Xcode on this host.",
  "RETROSPECTIVE log analysis (retained): the only nonzero audio-ish hits in 246 decoded device logs are userspace or container noise, not drivers.",
  "The no-auto-dim seed flag is required because this board has no buttons and no idle timer: without it SpringBoard dims and sleeps about 30 s after boot.",
  "ROUND 18 RETROSPECTIVE (read-only re-analysis, no new CI/flash): the power-area 'single boot' limit was a stale record. Six distinct boots (553807564, 552252012, 553634628, 549982314, 553412253, 551765171) across four payload variants (gaugereplay / persist x2 / smmu / smmu2 / smmu3) each carry a full 12/12 gauge verdict with family A plausible 6/6. Voltage 4325-4328 mV, current 0-29 mA, temperature 145-182 (0.1 K) and full capacity 3149-3153 mAh vary across boots, proving the probe re-reads live hardware on every boot rather than replaying a cached constant. All six headers are SHLOG001 / write_errors=0. GAUGE_MULTIBOOT_SCAN: 133 dirs / 6 verdict boots; GAUGE_MULTIBOOT_VERIFY2: PASS (12/12) with two independent readers. SOC=100 on all six, so this is still one charge level, not six."
]
completion = [
  "Official completion criteria (PARTIALLY met): declared power controls and battery readings must match observations, and each claimed sleep/resume transition must restore its dependent peripherals. The battery reading criterion is now met on device: a stated chip family, seven standard-command readings in stated units, and a physically sane result.",
  "Stage 7 scope actually completed: byte-exact bq27xxx decoding for both register-map families (host-verified twice), a read-only on-device probe with two independent device analyses (device-verified), durable evidence records for both, and a read-only six-boot reproduction survey confirming the probe re-reads hardware each boot."
]
limits = [
  "The gauge is READ-ONLY. No CONTROL / CONFIG / unseal write, no charger state, no IOPMPowerSource publication and no OS power-source service exist yet, so nothing consumes the reading inside iOS.",
  "Audio is entirely absent: no DSP boot, no SLIMBUS WCD9340 backend, no Q6AFE, no CoreAudio playback or capture and no RPMh voting. ShengBattery is listed as intended but not implemented.",
  "The device evidence now spans six distinct boots (boot_id 553807564, 552252012, 553634628, 549982314, 553412253, 551765171) across four payload variants, each with a full 12/12 read set and physically varying voltage/current/temperature/full-capacity, which confirms the probe re-reads live hardware on every boot. It is still one unit at one charge level (SOC=100 on all six), so it proves the register protocol and the transport, not long-term accuracy across charge cycles. The earlier 'single boot' limit was a stale record corrected by read-only log re-analysis (no new CI or flash)."
]
next_action = [
  "Stage 7 battery follow-up: publish the decoded values as IOPMPowerSource-style properties with explicit units and a valid/missing state, then read the PMI8998 charger status so charge state is available alongside capacity. A discharge/recharge cycle on device would be needed before any long-term accuracy claim.",
  "Stage 7 audio remains blocked on the ADSP firmware set and a new SLIMBUS WCD9340 + Q6AFE backend (NOT a port of the sheng SM8550 AudioReach/GPR stack).",
  "Strict 8-stage order then continues with the remaining areas: a real stage-1 SMMU context (the ArmSmmu4K kit is now LINKED and its read-only preflight is device-verified; the target streams must first be made to fault) and diagnostics (ShengPreflight not linked)."
]
