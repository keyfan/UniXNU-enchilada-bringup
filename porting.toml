  '[ROUND 75 2026-11-12, HOST-VERIFIED] AdrenoSmmuStage1V1 adds the layer round 53 deliberately did not build: round 53 AdrenoKGSLSmmuGate is a fail-closed READ-safety gate whose own header says it "merely DECIDES whether a future read would be safe; it never performs one", and NOTHING in the tree computed a TTBR0/TCR/SCTLR word. This round computes them, from THREE sha256 pins (arm-smmu.h 16630 B, arm-smmu.c 67693 B, io-pgtable-arm.c 38934 B). THE WORDS: context-bank byte offsets SCTLR 0x00, ACTLR 0x04, TCR2 0x10, TTBR0 0x20, TTBR1 0x28, TCR 0x30, CONTEXTIDR 0x34, S1_MAIR0 0x38, S1_MAIR1 0x3c, FSR 0x58; SCTLR bits S1_ASIDPNE BIT(12), HUPCF BIT(8), CFCFG BIT(7), CFIE BIT(6), CFRE BIT(5), E BIT(4), AFE BIT(2), TRE BIT(1), M BIT(0). THE DEFAULT a stage-1 context bank gets (arm-smmu.c:641-651) is CFIE|CFRE|AFE|TRE|M plus S1_ASIDPNE, plus E ONLY for a big-endian CPU, so 0x00001067 LE and 0x00001077 BE - RECOMPUTED from the pinned bit positions in the verifier rather than copied, so a transposed bit cannot survive. S2CR geometry (arm-smmu.h:105-120): address 0xc00 + (n << 2); PRIVCFG GENMASK(25,24), TYPE GENMASK(17,16) with TRANS 0 / BYPASS 1 / FAULT 2, EXIDVALID BIT(10), CBNDX GENMASK(7,0). THE PLAN is six writes ordered MAIR0, MAIR1, TTBR0, TCR, CONTEXTIDR, SCTLR, and the load-bearing rule is the LAST one: SCTLR carries M, so it is the write that TURNS TRANSLATION ON and must come after the table and format exist; TTBR0 is the only 64-bit write. FOUR INPUTS ARE STILL ABSENT and are named individually rather than assumed: I1 no page table (TTBR0 must point at a real LPAE table; this port allocates and walks none), I2 no ASID allocator (CONTEXTIDR needs an owned ASID), I3 the target streams do not fault - round 53 MEASURED Busy=10 and id0=4c017e4c in the firmware BYPASS handoff, so nothing reaches translation, and the module models this as a TYPE choice where a non-faulting stream resolves to BYPASS and never TRANS - and I4 CX is DOWN, round 35 MEASURED cx=0x00005ff4 with BIT(31) clear. adreno_smmu_stage1_missing() returns 0xf and ready() is DERIVED from it, so it is 0. The admission row moves kgsl-smmu-stage1 modeled 0 -> 1 (total 7 -> 8), satisfied stays 0, verdict BLOCKED. A defect found in this round own first draft is recorded: the first assertion expected privcfg=1 to equal the bare mask 0x03000000, but PRIVCFG is GENMASK(25,24) so 1 occupies 0x01000000 and only 3 fills the mask; the check now tests BOTH.',
  '[ROUND 76 2026-11-12, CI-VERIFIED] CI #237 (run 43242359273) compiled and LINKED THREE archive units the kernel CI had NEVER seen: AdrenoZapAuthV1 (round 73), AdrenoMdtV1 (round 74) and AdrenoSmmuStage1V1 (round 75). Until this run every piece of evidence for those three was host-toolchain only, so this is the ABI authority for them. The archive reported 27 objects sha256 a9b461e4f1378731 (CI #236 was 24 objects 59e80bd40870c8d8); kernel.macho is 126099456 B sha256 40d6fe4a5fdde2cdeaf0062a3c016346df01bf3d620dff339e60cc76c450918e, changed vs CI #236 9bd2d93910192a9c with a +24576 B delta - three units this time, so the image DID grow, but per rounds 43/45/59 size is OBSERVED not asserted and the load-bearing proof stays the object count, the changed sha256 and the symbol inventory. All 35 new exports survived linking (11 zap-auth, 12 mdt, 12 smmu-stage1) alongside the 11 cp-ring, 19 publish, 8 darwin-kmd and 15 earlier names with zero regression. An independent llvm-nm check went 70214 -> 70261 defined symbols, exactly +47 with LOST_FROM_236=0; the +47 is the three units 35 exports PLUS the 12 round-72 cp-ring additions that had also never been through this check. A VERIFIER DEFECT THIS RUN EXPOSED AND FIXED, which is the interesting part: the boundary check was plain `qcom_scm not in image`, and it FAILED - correctly flagging something, but on a wrong premise. qcom_scm now appears at byte 1302126 only inside a CITATION string written by round 73 (:156 qcom_scm_pas_auth_and_reset(13); shape here, transport absent), i.e. a reference to why PAS is unimplemented rather than an implementation of it. CI #236 image had no such string because it did not contain the zap-auth unit, so the check had never been exercised against prose. It now distinguishes a citation from a symbol by requiring the callable forms _qcom_scm_ and qcom_scm_call( to be absent. Recorded because a boundary check that fires on documentation text is exactly the kind that gets fixed by deleting the do