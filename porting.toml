  "evidence/stage5-gpu-pas-device.md section 69 records R245: the two-key shape table, the reproducibility row set for key 98, the post-start row set for key 97 with a field-by-field decoding table (ctl / fwinit / gfsr / cbfsr / ao), the explicit note that CB_FSR 0x402 has bit 0 clear but bits 1 and 10 set and that their origin is unresolved, the four-part verdict (survival reproduces, the machine outlives the start word, the SMMU is no longer the suspect, the gap is now on the firmware side), the six things the round does not prove, and the four tooling facts (the anchor helper accepts both placeholder spellings and must replace PREV_BOOT and PREV_SHA in two passes, the stage-6 slice for a two-key block must be split with rindex because the refusal branches contain several '} else {', a static-gate REQUIRED row must carry key=%u or the row-key regex cannot bind the reading to one boot, and background waiters must take the run id as an argument). Section 46 of HANDOFF.md records the same plus the R246 design.",,
  'evidence/stage5-gpu-pas-device.md section 70 records R246: the three-key shape table (which key reads after the start word and which keeps the store last), the build and gate evidence (CI #357 run 44847740525 with 28 of 28 steps, the two artefact hashes, the static gate passing and failing on the R245 images with 17 problems, stage 6 at 1250 of 1250), the verbatim row sets for keys 99, 100 and 101, the verdict table that puts R243 94 / R244 95 / R245 97 / R246 99-101 side by side, the nineteen-row single-variable table, the six things the round does not prove, the three boundaries (a landed row means the round was not stopped before the write window, not that the firmware accepted the request; CB_FSR 0x402 still undecoded; the routing is per-boot and S2CR0..4 come back as 000200ff), the R247 design, and the five tooling facts (never rewrite an old key block in place - derive the new block from it and append, the token rename table must be asserted, stage-6 sub-slices need index with a start offset or rindex, the ROUND marker sentinel may not be counted as one string, and the ID1 re-read ceiling had to move to six). Section 47 of HANDOFF.md records the same plus the R247 design.',,
  'evidence/stage5-gpu-pas-device.md section 71 records R247: why the shape changed (the upstream cold plan writes the queue table, the SFR chip id and the CP message before the CM3 reset, which the probe\'s own CM3 block already did, so the untested step was \'reset then start\'), the three-key shape table, the build and gate evidence (CI #358 run 44853166235 with 28 of 28 steps, the two artefact hashes, the static gate passing and failing on the R246 images with 18 problems, stage 6 at 1288 of 1288, the probe at 222 GMU stores), the verbatim row sets for keys 102, 103 and 104 with the field table that checks sfr/cfg/bootcfg against the upstream constants, the four-part verdict, the three things that must be said separately (polls=1 cannot tell a re-run firmware from a retained DTCM word; ctl answers \'did the firmware report the engine\' and not \'is the firmware alive\'; a zero INFO may also be a masked or unrouted interrupt), the twenty-eight-row single-variable table up to R247, the six things the round does not prove, the three boundaries (including the unexplained absence of the 00800000 CM3_FAULT bit that the five previous boots all showed), the R248 design, and the six tooling facts (judgement fields must be matched as whole tokens or bootcfg= answers for cfg=, the row\'s first key is glued to the tag, a read-only replay judge is worth having, a new key block must be appended rather than substituted, unused buffers inherited from the derivation block fail -Werror, and the source-level ceilings drift every round). Section 48 of HANDOFF.md records the same plus the R248 design.',,
  'evidence/stage5-gpu-pas-device.md section 72 records R248: why the round solved polls=1 instead of rewriting PWR_COL_CP_MSG, the three-key shape table, the build and gate evidence (CI #359 run 44857868260 with 28 of 28 steps, kernel 126267392 B sha256 ba24da46..., payload 150994944 B sha256 7019acad..., the static gate passing and failing on the R247 images with 24 problems, stage 6 at 1336 of 1336, the probe at 245 GMU stores), the verbatim rows for keys 105/106/107, the four-part verdict (the firmware really re-runs; clearing the request bit changes nothing; clearing both interrupt blocks changes nothing; the silence is inside the firmware), the three things that must be stated separately (the pre-start MASK=0 reading does not retro-explain the R237 masked boot, the intr register reads 00000000 here but 00800000 in R244-R246 and that difference is registered not explained, and this round read neither CB_FSR nor sGFSR so it adds no new \'no fault\' evidence), the thirty-one-row single-variable table up to R248, the six things the round does not prove, the three boundaries, the R249 design, and the five tooling facts (string concatenation needs an explicit +, a pure-python format string leaks %% into the C source, a new key block must be appended rather than substituted, a slice terminator for the previous round must move forward with the new block or the previous round\'s assertions silently describe the wrong code, and \'the start word is the last store\' can only be asserted as \'no store follows it\'). Section 49 of HANDOFF.md records the same plus the R249 design.',,
  'evidence/stage5-gpu-pas-device.md section 73 records R249: why the round only reads and polls, the three-key shape table, the build and gate evidence (CI #360 run 44861590525 with 28 of 28 steps, kernel 126267392 B sha256 1cc617e2..., payload 150994944 B sha256 030d9742..., the static gate passing and failing on the R248 images with 21 problems, stage 6 at 1373 of 1373, the probe at 274 GMU stores), the verbatim rows for keys 108/109/110, the four-part verdict (time is not what is missing, context bank 0 records no fault across the window, the descriptor is writable both ways, and the silence is a request that is never taken rather than one that is rejected), the three things that must be stated separately (cbfsr=00000402 carries the same two bits as R245 key 97 and those bits are unexplained, the intr register reads 00800000 here but 00000000 in R247 and R248 and that difference stays registered rather than explained, and the roughly three seconds of window is converted from the R201 calibration rather than measured in this round), the thirty-one-row single-variable table up to R249, the six things the round does not prove, the three boundaries, the R250 design, and the five tooling facts (every gate anchor must assert it exists, a branch slice inside a preamble with its own else ladder needs rindex, the static gate\'s format strings must be extracted from the source rather than copied by hand, TMP and TEMP must point inside the workspace before the source-level gates run, and mechanical replacements must distinguish tokens that appear exactly once from tokens that legitimately appear twice). Section 50 of HANDOFF.md records the same plus the R250 design.',,
  'evidence/stage5-gpu-pas-device.md section 74 records R250: why the three keys share one preamble, the shared store list and the per-key difference, the build and gate evidence (CI #361 run 44866225854 with 28 of 28 steps, kernel 126267392 B sha256 d9139663..., payload 150994944 B sha256 69875e31..., the static gate passing and failing on the R249 images with 25 problems, stage 6 at 1415 of 1415, the probe at 288 GMU stores), the verbatim rows for keys 111/112/113, the four-part verdict (the doorbell gets no answer, the power and frame words do hold values, the CM3 reset leaves both firmware addresses intact, and writing the start word sets GMU2HOST_INTR_INFO bit 23 which is CM3_FAULT), the three things that must be stated separately (the read that saw bit 23 happened after the store and after the poll so only the order is known, key 113\'s row M carries no info field so only two of three runs could see the bit, and GMU2HOST_INTR_MASK is zero in all three keys so the fault is a register bit rather than an interrupt), the single-variable table up to R250, the six things the round does not prove, the three boundaries including the fact that the bit definitions come from the pinned upstream a6xx_gmu.xml and not from a local header, the R251 design, and the six tooling facts (a new probe block must be appended and never spliced at an earlier block\'s start, the IOLog format needs a doubled percent, generated format strings need their percent signs unescaped explicitly, the stage-6 slice terminator must move to the new block header, TMP and TEMP must point inside the workspace before the source-level gates run, and the window header layout must be read from the runner\'s own FMT). Section 51 of HANDOFF.md records the same plus the R251 design.',,
  'evidence/stage5-gpu-pas-device.md section 75 records R251: why the read had to be moved next to the store instead of changing the start path, the shared preamble and the per-key difference table, the build and gate evidence (CI #362 run 44870530555 with 28 of 28 steps, kernel 126267392 B sha256 0d45545d..., payload 150994944 B sha256 3c3e33c8..., the static gate passing on the R251 artefacts and failing on the R250 ones with 23 problems, stage 6 at 1429 of 1429, stage 4 61, stage 5 48, host gate 28 of 28, the probe at 669977 characters / 9933 lines with 302 GMU stores), the verbatim rows for keys 114/115/116, the five-part verdict (the bit is clear in the read adjacent to the store, the mask takes ff7fffff verbatim, the bit stays absent with only that source enabled, the bit stays absent without any start word, therefore the fault happens after the request rather than being raised by the write), the three things that must be stated separately (an adjacent read that misses the bit does not prove it never appears, key 116\'s control window is equally short, and a mask that reads back is not a mask that takes effect), the single-variable table up to R251, the six things the round does not prove, the three boundaries including the intr=00800000 line that precedes this round\'s writes, the R252 design, and the five tooling facts (identifier renaming must rewrite whole names rather than the bare number, the mode selector has to be replaced before the rename, a slice terminator may not be the previous block header because an earlier slice uses it too, an assertion about stores between rows must account for which side of the store the row sits on, and adb reconnect offline is what recovers an offline device). Section 52 of HANDOFF.md records the same plus the R252 design.',,
  'evidence/stage5-gpu-pas-device.md section 76 records R252: why the round moved only the moment of the read rather than changing any store, the three-key comparison table and the code shape, the build and gate evidence (CI #363 run 44874308728 with 28 of 28 steps, kernel 126300160 B sha256 667c7af2..., payload 150994944 B sha256 ec6d86df..., the static gate passing on the R252 artefacts and failing on the R251 ones with 23 problems, stage 6 at 1443 of 1443, stage 4 61, stage 5 48, host gate 28 of 28, the probe at 691361 characters / 10288 lines with 315 GMU stores), the verbatim rows for keys 117/118/119, the four-part verdict (the bit is caused by the start word, appears later than an adjacent read, stays set under an enabling mask, and never appears without the start word), the three things that must be stated separately (bit 23 as CM3_FAULT is read from the pinned upstream XML rather than from a local bitfield, the GMU2HOST_INTR source has never been taken as an interrupt by this port, and 0.32 s is converted from R201\'s IODelay calibration rather than measured on a wall clock), the single-variable table up to R252, the five things the round does not prove, the three boundaries including that the fault reason has not been read, the R253 design, and the three tooling facts (an anti-stale assertion must look only at the C code and not at comments, a new branch may not redeclare a preamble loop variable because of -Wshadow, and assertions about store counts must be written against the comment-stripped code). Section 53 of HANDOFF.md records the same plus the R253 design.',,
  'evidence/stage5-gpu-pas-device.md section 77 records R253: the three-key design and its single variable table, the code shape with sixteen GMU stores in the block, the build and gate evidence (CI #364 run 44879572074 with 28 of 28 steps, kernel 126300160 B sha256 f29ed080..., payload 150994944 B sha256 557866be..., the static gate passing on the R253 artefacts and failing on the R252 ones with 23 problems, stage 6 at 1461 of 1461, stage 4 61, stage 5 48, host gate 28 of 28, the probe at 712460 characters / 10641 lines with 331 GMU stores), the verbatim rows for keys 120 and 121, the three failed boots and the description of key 122 with its control key 123, the four-part verdict, the three things that must be stated separately, the correction to section 76.8 (the bit stays only because nobody clears it after the start word), the five things the round does not prove including that the death point of key 122 is not localised, the R254 design, and the four tooling facts (the arm window is the only fwKey guard and gmu217seen prints outside it, the log commits a whole round at a time so zero bytes means the block ran and died, a rekeyed payload differs from its source by the parameter byte only, and the runner reads the flashed key block back so the key of every boot is verified rather than assumed). Section 54 of HANDOFF.md records the same plus the R254 design.',,
  'evidence/stage5-gpu-pas-device.md section 78 records R254: why the round reads the fault site, the three-key design against the single-variable table, the code shape with thirteen GMU stores in the block and the 0x58 / 0x60 / 0x68 offsets, the build and gate evidence (CI #365 run 44884866354 with 28 of 28 steps, kernel 126304256 B sha256 f7107e05..., payload 150994944 B sha256 ba7c0f52..., the static gate passing on the R254 artefacts and failing on the R253 ones with 23 problems, stage 6 at 1478 of 1478, stage 4 61, stage 5 48, host gate 28 of 28 with 344 GMU stores, the probe at 735965 characters / 11039 lines), the verbatim rows of all three keys, the four-part verdict, the three things that must be stated separately (the faulting address is what reached the SMMU and not what we wrote, the FORMAT field of FSR is set before the clear and is not what the clear targets so TF is the criterion, and this is a register ledger rather than an HFI message), the five things the round does not prove, and the R255 design. Section 55 of HANDOFF.md records the same.',,
  'evidence/stage5-gpu-pas-device.md section 79 records R255: why the round builds a non-identity table, the three-key design against the single-variable table, the code shape with thirteen GMU stores and the 0x2d800000 iova argument, the build and gate evidence (CI #366 run 44890310462 with 28 of 28 steps, kernel 126304256 B sha256 19a2ec60..., payload 150994944 B sha256 b8073afa..., the static gate passing on the R255 artefacts and failing on the R254 ones with 23 problems, stage 6 at 1496 of 1496, stage 4 61, stage 5 48, host gate 28 of 28 with 357 GMU stores, the probe at 760529 characters / 11453 lines), the verbatim rows of all three keys including the two empty key-128 boots, the four-part verdict with the PLVL explanation, the three things that must be stated separately (the descriptors are not in effect with two candidate causes and the round does not tell them apart, far is the address that reached the SMMU and not what we wrote, and the key-128 death happens before commit rather than before the block), the five things the round does not prove, and the R256 design. Section 56 of HANDOFF.md records the same.',,
  'evidence/stage5-gpu-pas-device.md section 80 records R256: why the round reads the descriptors back before changing any store, the three-key design against the single-variable table, the code shape with twelve GMU stores, six loops, four IODelay waits and one dc civac, the build and gate evidence (CI #367 run 44908085664 with 28 of 28 steps, kernel 126320640 B sha256 6aaeee48..., payload 150994944 B sha256 d75e04ec..., the static gate passing on the R256 artefacts and failing on the R255 ones with 26 problems, stage 6 at 1517 of 1517, stage 4 61, stage 5 48, host gate 28 of 28 with 369 GMU stores, the probe at 785551 characters / 11907 lines), the verbatim rows of all three keys including both readbacks with m0=m1=m2=1, the four-part verdict that rules out both the layout and the cache visibility and leaves the walk reading something other than this table, the three things that must be stated separately (the clean only reaches the point of coherency and says nothing about the SMMU walk cache, far is the address that reached the SMMU rather than what we wrote, and the FORMAT field is not part of the W1C group so a non-zero readback after a clear is not a failed clear), the five things the round does not prove, and the R257 design. Section 57 of HANDOFF.md records the same, including the re.subn assignment trap that left the arm window one round behind.',,
  'evidence/stage5-gpu-pas-device.md section 80 records R257: why the round reads the descriptors back before changing any store, the three-key design against the single-variable table, the code shape with twelve GMU stores, six loops, four IODelay waits and one dc civac, the build and gate evidence (CI #367 run 44908085664 with 28 of 28 steps, kernel 126320640 B sha257 6aaeee48..., payload 150994944 B sha257 d75e04ec..., the static gate passing on the R257 artefacts and failing on the R255 ones with 26 problems, stage 6 at 1517 of 1517, stage 4 61, stage 5 48, host gate 28 of 28 with 369 GMU stores, the probe at 785551 characters / 11907 lines), the verbatim rows of all three keys including both readbacks with m0=m1=m2=1, the four-part verdict that rules out both the layout and the cache visibility and leaves the walk reading something other than this table, the three things that must be stated separately (the clean only reaches the point of coherency and says nothing about the SMMU walk cache, far is the address that reached the SMMU rather than what we wrote, and the FORMAT field is not part of the W1C group so a non-zero readback after a clear is not a failed clear), the five things the round does not prove, and the R257 design. Section 57 of HANDOFF.md records the same, including the re.subn assignment trap that left the arm window one round behind.',,
  'R258 recorded in evidence section 82 (CI #369 run 44920004888 with 28 of 28 steps, kernel 126320640 B sha256 df6deeeb..., payload 150994944 B sha256 24b88b78..., the static gate passing on the R258 artefacts and failing on the R257 ones): the three read-path and routing keys with their verbatim rows, the four judgements (readings are trustworthy, the earlier mismatch was about when the hardware sets the word, the fault shape did not change, and turning the match off kills the round), the three things that must be said apart, the five things the round does not prove, and the R259 design.',
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 259 ROUTING GATE: keys 139/140/141 landed 14 of 14 rows each (boot_id 597896721 / 633253890 / 598851584). Without the start word the bank is clean (fsr 00000400, far 0, gfsr 0) while SMR0 reads back 00000004; with the match restored and the start word the fault is the same shape as every round since R255; and SMR0 = 0x8000007f is refused, reading back 0x80000004, so the ID field is not writable." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 260 CANNOT-MISS TABLE: keys 142/143/144, with 143 booted three times (boot_id 584844122 / 641886752 / 584484607) and 144 once (584028634). Filling the table pages removes the translation fault in all four filled boots (fsr 00000400, far 0, fsynr0 0) and the status word reports bit0 = 1 in three of them (ctl 00000001, polls 2); one boot read ctl 000000fe with bit0 clear. Key 142 committed no bytes twice, so the match-off plus start-word shape kills the round whether or not the log is flushed first." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 261 DEVICE-RUN: keys 145/146/147 landed 14/14, 15/15 and 15/15 rows; the three start words each left ctl=00000001 with polls 2/1/1; the queue page first four words were 00000000/00000078/00000006/0000000c on both boots; the re-arm path changed nothing observable; all three fault ledgers were clean (fsr=00000400, far=0, gfsr=0)." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 262 DEVICE-RUN: keys 148/149/150 landed 14/14, 14/14 and 15/15 rows; the queue page read 00000000/00000078/00000006/0000000c before the start word and the same four words after the full poll; with no start word at all the page read the same twice and ctl stayed 00000000 with info=0; twenty-four words after a start form two twelve-word records; every fault ledger stayed clean (fsr=00000400, far=0, fsynr0=0)." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 263 DEVICE-RUN: keys 151/152/153 landed 16/16 rows each; key 151 read the queue page as 00000000/00000078/00000006/0000000c before arming, after arming, after the reset pulse and after the start word, unchanged four times, with ctl=00000001 and polls=2; key 152 skipped the reset pulse and the page read all zero with CM3_FW_INIT_RESULT stuck at 00000000 and ctl=00000000 after 200000 polls; key 153 kept the pulse and dropped the start word, the firmware reinitialised but ctl stayed 00000000; every fault ledger stayed clean (fsr=00000400, far=0, fsynr0=0)." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 264 DEVICE-RUN: keys 154/155/156 landed 16/17/17 rows; key 154 accepted the start (ctl=00000001, polls=2) with the page untouched and CP_MSG=ad957000; key 155 wrote a pattern into page words four to seven and the same start word was refused across 200000 polls with CM3_FAULT set (info=00800000); key 156 wrote the same pattern without a start word, CM3_FAULT stayed clear and CP_MSG still read ad957000; the pattern read back as zero in both keys, so the write path is unproven; every fault ledger stayed clean (fsr=00000400, far=0, fsynr0=0)." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 265 DEVICE-RUN: keys 157/158/159 landed 18/17/17 rows; key 157 proved the write path word-for-word (a5a5a5a5 then 5a5a5a5a then c3c3c3c3, second mapping agreeing); key 158 wrote safe words 64..67, cleaned with dc civac, read back zeros and had its start word refused (ctl=00000000, polls=200000, info=00800000); key 159 wrote the same pattern at words 4..7, cleaned with dc cvac, read the pattern back and had its start word accepted (ctl=00000001, polls=104); the fault ledger stayed clean in all three (fsr=00000400, far=0, fsynr0=0)." },
