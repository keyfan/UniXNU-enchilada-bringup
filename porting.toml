'[ROUND 53 2026-11-11, HOST-VERIFIED] Broad upstream lookup (m12247) established that mainline enables SMMU clocks (arm-smmu.c:2196) and resumes the power domain (:2264-2266, rpm_get :71-77) BEFORE any register access (:2200 cfg_probe, :2255 reset); a6xx_gmu.c:1277 creates the IOMMU only AFTER power. The GPU kgsl SMMU shares vdd-supply 0x1a4 == gpu_cx_gdsc, and device logs measured verdict=cx-DOWN, so a read while collapsed is NOT established safe. Encoded the fail-closed AdrenoKGSLSmmuGate decision layer; NO flash, NO device run this round.',
  '[ROUND 53, procedure 14/14] CI #229 (run 43004328339) verified the round-53 module build: scripts/verify-ci-229-adreno.py -> 21 checks, 0 failures (archive line PASS: libEnchiladaAdreno.a 12 objects sha256 5a6bb21bcf3d7da5, no 10/11-object regression, kernel.macho 126042112 B sha256 b446e81d2b524d326c3968603754ae6ce9c5c6b707e019e9639279bca8ff534e, Mach-O cffaedfe, 5 byte strings, stage3=exec absent, kernel.log clean). Two independent stacks: artifact verifier + .NET Invoke-RestMethod run/job/artifact metadata (completed/success, 27 steps, 3 artifacts). NOTE: kernel-bootstrap.log is the intentionally failing baseline pass (no extra archives) whose Undefined symbols for _mockfs_mountroot/_native_legacy_display_probe/_sheng_pmgr_run is the DIFFERENTIAL evidence the archive pass is required; only kernel.log must be clean. NO device run, NO flash.',
  '[ROUND 56, procedure 15/15] Re-derive instead of re-assert. Read the pinned gdsc sources, encode the descriptor -> (status register, masks) function in AdrenoGdscDecode.c, then cross-check it in Python from the same pinned bytes (scripts/verify-enchilada-gdsc-decode.py -> GDSC_DECODE_CROSS: PASS, 69 checks) so the C module and the upstream bytes are verified against EACH OTHER, not against a shared literal.',
  '[ROUND 57, procedure 16/16] Derive the SEQUENCE too, not just the constants. Round 56 made the status register a function of the descriptor; round 57 reads gdsc_enable() (:259-315) and gdsc_disable() (:317-364) out of the same pinned bytes and re-expresses their statement order as an ordered, fixed-size step plan (adreno_gdsc_plan_enable/disable/cpu_enable). The Python cross verifier rebuilds each plan from the flags alone and only then compares, so C and upstream are checked against EACH OTHER (GDSC_DECODE_CROSS: PASS, 98 checks).',
  '[ROUND 58 2026-11-11, HOST-VERIFIED] Composed the round-57 GDSC step plans with the round-51 power-up plan: the guarded bit of every genpd step now equals the CPU performs zero GDSC register writes for that domain, derived and asserted in both directions by AdrenoPowerUpGdscGuardMatchesWrites.',
  '[ROUND 59 2026-11-11, HOST-VERIFIED] A630 GMU TEARDOWN order derived from pinned Linux v6.12 a6xx_gmu_stop() (a6xx_gmu.c:1184-1217) and the GX-before-CX hardware constraint (gdsc.c:590, a6xx_gmu.c:1205). The stop body emits GX put (:1209-1210), then clk_bulk_disable_unprepare (:1212), then the CX put LAST (:1214), gated by pm_runtime_active (:1189). AdrenoPowerDownV1 encodes exactly that 3-op order: GX(guarded) - clocks(4) - CX. It is NOT the round-51 power-up plan reversed: power-up enables clocks LAST while teardown disables them in the MIDDLE, and no clk_set_rate exists in the stop path so rates are never restored.',
  '[ROUND 59 2026-11-11, CI-VERIFIED] CI #230 (run 43034488610, dispatch 14:01:28Z, success 14:26:22Z, device head b4579fd5) proved the 13th and 14th A630 archive units build and link inside a real XNU kernel, which the local host suite cannot show (different toolchain, SDK and link step). Artifact verification runs in two independent domains: scripts/verify-ci-230-adreno.py parses the downloaded artifacts (archive line, object count, sha256 of the pinned inputs, kernel Mach-O size/magic/sha256, 9 required symbols, absence of AdrenoPowerDownV1, stage3=plan present and stage3=exec absent), and a .NET Invoke-RestMethod pass re-reads the run, job and artifact metadata from the GitHub API.',
  '[ROUND 60 2026-11-11, CI-VERIFIED] CI #231 (run 43043000108, dispatch 14:54:20Z, success 15:17:58Z, device head 0e11f1b3) proved the 15th A630 archive unit builds and links inside a real XNU kernel, which the local host suite cannot show (different toolchain, SDK and link step). Artifact verification runs in two independent domains: scripts/verify-ci-231-adreno.py parses the downloaded artifacts (archive line, object count, kernel Mach-O size/magic/sha256, 13 required symbols including all nine AdrenoPowerDownV1 exports, stage3=plan present and stage3=exec absent), and a .NET Invoke-RestMethod pass re-reads the run, job, step list and artifact metadata from the GitHub API.',
  '[ROUND 65 2026-11-12, CI-VERIFIED] CI #232 (run 43142322338, dispatch 02:34:09Z, success 02:53:40Z, device head e2adac8e) proved the 20th A630 archive unit AdrenoMetalSeamV1.c and the four consolidated ROUND 61-64 units build and link inside a real XNU kernel (libEnchiladaAdreno.a 20 objects sha256 678e1c6219cc110d, kernel.macho 126066688 B sha256 a69f8e7dbba316, all 14 metal-seam exports plus 13 earlier unit names present). Two independent verifications: scripts/verify-ci-232-adreno.py parses the downloaded artifacts (45 checks) and a .NET Invoke-RestMethod pass re-reads run, job, step list and artifact metadata (14 checks).',
'[HISTORICAL, kept for traceability] Follow /zh/porting/gpu for the selected OS ABI; sheng 6 archives (adreno740-kits, accelerator, gmu, gmu-votes, gpu-smmu, dts/inputs) are the upstream method reference.',
