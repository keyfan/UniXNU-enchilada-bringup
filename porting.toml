  "evidence §三十五：R187 键 34 只读转储 APPS RSC（三行 gmursc2/3/4、boot_id 553864669），确认 CPU 侧通道可用、命令数据库在 0x85fe0000、四个 TCS 空闲，并推翻 R182 的「无 cmd-db」结论",
  "evidence §三十六..§四十三：R188 读三张 arc-vote 表（gfx.lvl 十档 top 0x01a0@9，另两张误报 0）、R189 枚举八个条目名（cx.lvl/mx.lvl 一直在库里）、R190 逐条目读出地址长度偏移（cx.lvl@0x30000、mx.lvl@0x30010 各 32 B）、R191 修好越界读的真 bug（gfx_n=10 cx_n=8 mx_n=5、pindex=9、sindex=4）、R192 用真索引写 vote（vote=0x01a00409 读回 gx=9 mx=4，仍 ack=0）、R193 装载 RSC 定序器微码（loaded=1 仍 ack=0）、R194 只读勘察 PDC 两个候选窗（厂商基址成立、mainline 偏移全 0）、R195 在基址读 TCS1/TCS3（t1en=t3en=0x0f、地址落在 0x30080/0x30010 => PDC 早被配好）",
  "evidence §四十四..§四十九：R196 RSC 双向矩阵（停方向 3 次应答、起方向 ACK bit0 置起后卡死）、R197 三相位快照（SEQ_BUSY 停方向就置 1 再不回 0、四个 TCS 状态三时刻逐位相同）、R198 CPU 侧 APPS RSC 代投轨道（st=00000001、polls=1，GX 仍 00222001）、R199 直接写 GX GDSC（四笔全生效、cfg bit16 恒 0、gx_on=0）、R200 CM3 活着时重跑（与 R199 逐位相同）、R201 CX 对照 + 十倍窗口（待判读）。CI 运维记录：#309/#310/#311 三次 job cancelled、runner=''、steps=0，与代码无关。",
  "evidence §五十..§五十一：R202（清 QTBL_ADDR+QTBL_INFO 后那笔致死写存活，gmuhfi5/6 逐字，并明确留下 INFO 的 confound）、R203（只清地址、INFO 保持 1 → 静默死，窗口仍是 R202 那次、gmuhfi7/8 计数 0）——两轮合起来把 R202 的解释 A 作废、B 成立，并给出 B 的证据链（三轮单变量并排表）。",
  "evidence §五十二：R204-R213 十轮并排表（窗口 sha256 与 boot_id 逐行可核对）、键 58/59/62 的实测时间戳（3.18 s / 6.43 s / 无行）、BootLog.c 关于 IOSleep 的逐字更正、键 59 与键 60 的未解矛盾，以及 R213 的构建证据（CI #324 / run 44451699719 的 kernel 与 payload sha256）。",
  "evidence §五十三：R214-R219 的观测链修正（整轮提交、sync 与 panic_flush 的实测边界、8 MiB 回读盲区与设备实测）、R217 键 64/65 对照，以及 R219 三分支判决表（窗口 sha256、boot_id、逐字读数与事先固定的判读规则命中情况）。",
  "evidence §五十三..§五十五：观测链修正（整轮提交、sync 与 panic_flush 的实测边界、8 MiB 回读盲区）、R217 键 64/65 对照、R219 三分支判决、R221 余量否证、R222 键值恒定下的单变量归因，以及 R223 写 0/写 1 的语义定位。",
  "evidence §五十六/§五十七/§五十八：GR1 帧地址的推导与 R164 的更正记录、R232c 四行读数、R232d 的九笔顺序与六项逐位比对、R233 的 cw 从 ID0 现算与 TCR 0090->03510 的字段表、以及两份 kernel sha256 对照（证明旧静态门曾对着上一轮镜像通过）。",
  "evidence §五十九：R234 键 73 的五行读数与「写进去了没落地」的判决、先提后撤的「只读映射」解释、R235 键 75 的三个探针设计与七行读数、「GR0 可写/只有那一位不接」的三条证据、gfsr=0 不能用来开脱 SMMU 的自我更正、以及 sCR0 字段名的逐位订正（CLIENTPD/GFRE/USFCFG，无 SMMUEN）。",
  "evidence §六十：R236 键 76 的四行读数与「两个掩码都是零」的判决、键 77 零字节且窗口逐字节相同的事实、为什么这一轮分不开屏蔽与启动字的结构性原因、本轮明确没有证明的四件事、以及下一轮必须先修观测链（键 78 只屏蔽不启动）的实验设计。",
  "evidence/stage5-gpu-pas-device.md section 61 records R237: the key 78 reading (ao_mask can only read 0x3f because the AO block implements six bits, so both_masked must be judged as (aoMask & 0x3f) == 0x3f), the two byte-identical key 79 boots, and the correction of the runner's KNOWN-table false positive.",
  "evidence/stage5-gpu-pas-device.md section 62 records R238: the key 80 control rows, the byte-identical key 81 window, and the five things it does not prove. Section 39 of HANDOFF.md also records the tooling defect this round exposed (a shut-down local proxy broke artifact fetch until r214_par.py probed the port instead of assuming it).",
  "evidence/stage5-gpu-pas-device.md section 63 records R239: the key 82 shape control, the key 83 four-row reading, the seven-row single-variable table spanning R219 to R239, and the six things the round does not prove. Section 40 of HANDOFF.md records the same, plus the tooling defects (a runner that raised UnboundLocalError after the window was already on disk, and the static gate that counted a boot-arg string twice in the payload).",
  "evidence/stage5-gpu-pas-device.md section 64 records R240: the zero-page and positive-control keys, the nine-row single-variable table from R219 to R240, the conditional 'INFO = 1 AND INIT = 1', and the five things the round does not prove (including that the zero page was never verified zero on the device because every row of that boot was lost). Section 41 of HANDOFF.md records the same plus the tooling defects (a comment-anchored stage-6 split that silently returned the whole block, and the attribution guard added so a failed allocation cannot be read as 'the firmware walked the table').",
  "evidence/stage5-gpu-pas-device.md section 65 records R241: the three-way key split, the three readback rows, the twelve-row single-variable table from R219 to R241, the registered contradiction with R173/R174 about reads at 0xC00, and the six things the round does not prove (no GMU-mastered read of the table yet, the FAULT readback unexplained, USFCFG still not clearable). Section 42 of HANDOFF.md records the same plus the four tooling defects it exposed (row counting by the wrong gmu-prefix, the need for a read-only judge script, the re.subn anchor that must not reuse one match twice, and the static gate that first asserted a string appearing twice in the payload).",
  "evidence/stage5-gpu-pas-device.md section 66 records R242: the three-way key split, the three readbacks, the decode of 000200ff, the registered contradiction with R173/R174, the fifteen-row single-variable table from R219 to R242, the design flaw that key 90 could not establish the route it meant to test, and the six things the round does not prove (TRANS untested, key 90's S2CR0 value at start unmeasured, the abort history unexplained, no evidence that the GMU is even mastered by this SMMU, USFCFG still not clearable). Section 43 of HANDOFF.md records the same plus the five tooling defects it exposed (the anchor script that knew only one placeholder shape, the doubled work/tmp path, the incomplete artifact download that must be judged by byte count rather than exit code, the static gate that asserted a store form for a read-only key, and buffered CI polling that looks like a stalled run).",
  "evidence/stage5-gpu-pas-device.md section 67 records R243: the three-way key split, the 000200ff decode, the three-row table of same-offset writes (000200ff back as itself, 00010000 clamped to 00020000, 00000000 back as itself), the eighteen-row single-variable table from R219 to R243, why key 94 cannot attribute its zero bytes to either explanation, and the six things the round does not prove (no evidence the GMU carries SID 4, BYPASS rejection unexplained, USFCFG still not clearable, R240's conclusion unchanged). Section 44 of HANDOFF.md records the same plus the five tooling defects it exposed (the read helper that unpacked a header against the wrong length, the CI waiter with a hard-coded run id that answered about the previous round, Select-Object buffering that makes a live job look stalled, the anchor script that only scans the previous round's windows, and the runner generator that buys safety by asserting no stale token survives).",
