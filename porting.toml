  'Strict 8-stage order then continues with the remaining areas: stage 6 network (Ath12kWifi/WifiProbe/WifiNet/MhiBoot on WCN3990 ath10k-class), memory (ArmSmmu4K), audio (AdspProbe/AudioProbe), cellular (QcomBaseband) and power (CpuFreqProbe/ShengPlatformPower/ShengBattery).',
"P3：先验证「内核死在日志 writer 首次写入之前」这个前提本身 —— 两版 probe 的差异代码最早也在 stage>=4 的 CX-up 分支（对照窗里 ≈50 s）才执行，与「28.7 s 之前死亡」直接矛盾；先用一个极早期标记分清「内核死了」和「payload 根本没跑」，再决定是否二分 call_full",
"R164 之后：GX 实测仍是塌陷（gx=00088400，bit15 POWER_DOWN_COMPLETE=1、bit16 POWER_UP_COMPLETE=0）、SMMU 当时判为全局关闭（sctlr=00200626；R235 更正：bit0 是 CLIENTPD 且为 0、bit1 是 GFRE、USFCFG=bit10=1 ⇒ 未匹配流 fault）⇒ 下一步落地 AdrenoClkCtlV1 的 GX 上电路径（时钟 + regulator），GX 起来之后才读 SECVID，再谈 CB0/TTBR（SMMUEN 置位后才有意义）。R163 那条 next_action（先验证「内核死在 writer 之前」这个前提）已完成，结论：内核确实跑到了 probe",
  "Slice 1 = cold-boot the GMU: AdrenoGmuBootV1PlanCold (rsc/pdc -> rpmh_start -> GMU clocks -> gmu_start -> hfi_start -> OOB -> sptprac -> gfx_rail_on -> power config -> copy a630_gmu.bin into GMEM -> fw_start) and then re-read the same seven words; success means fwinit = the a6xx_gmu FW_START value, a non-zero HFI SFR address, and GENERAL_7 == 1. gfx_rail_on writes vdd (phandle 0x2a9); if TZ owns that regulator the first write aborts AFTER the log window is open (visible, not silent).",
  "Slice 1b = the first write: set CM3_BOOT_CONFIG to 0x2 (the a6xx_gmu_start() value) and read it back to confirm bootcfg_ok=1, without touching PDC and without copying firmware. Only after that reproduces should the GMU reset/clocks and the a630_gmu.bin copy into GMEM be attempted; gmem_base is deliberately unpinned in this repo, so a trustworthy source must be found first. Note the bootloader already enables PDC (pdcen=1), so the RSC/PDC init must save-and-restore rather than blindly reprogram.",
  "切片 2：先解决 GMEM 物理基址的可信来源（仓库 gmem_base 故意留空，只有 gmem_bytes 0x00100000；a630_gmu.bin 32,768 B 已在 work/tmp/a630-device-fw/），再谈固件搬运与 CM3_SYSRESET 复位脉冲；每步都要先用只读手段验证前提。",
  "切片 3：先只读确认 CM3 是否停在主循环（HFI_CTRL_STATUS / GMU2HOST_INTR_INFO / RSCC_CONTROL_ACK / GMU SMMU 状态），再决定是补 GMU IOMMU + HFI 队列，还是先试 gfx_rail_on 的 OOB 六步。",
  "做 OOB boot-slumber 握手：`BOOT_SLUMBER_OPTION=0` → `HOST2GMU_INTR_SET=1<<22` → 有界轮询 `GMU2HOST_INTR_INFO` bit30 → `GMU2HOST_INTR_CLR=1<<30`，先不写 vote",
  "做 OOB boot-slumber 握手并读 `GMU2HOST_INTR_INFO`，确认 ack 失败的真实原因",
  "只读探测 GMU 侧地址空间（GMU SMMU 是否启用/bypass、页表口径），确定 HFI 队列表 IOVA 来源；在此之前不再敲 OOB 门铃",
  "ROUND 177: 把键 18 再劈三份 —— 18=只写 HFI_CTRL_INIT 并读回该字（不读状态）、19=再读一次 HFI_CTRL_STATUS、20=再加 1000 次有界轮询；按哪一级第一次静默死定位「写 / 首次读 / 轮询」中的具体致死动作，然后才谈 HFI 是否真的通了（看 HFI_CTRL_STATUS bit0、队列 write_index、GMU2HOST_INTR_INFO 的 CM3_FAULT 位）。",
  "ROUND 178: 先做顺序实验 —— 键 22 只复刻上游第 5 步的握手形状（BOOT_SLUMBER_OPTION=0、置 HOST2GMU_INTR_SET bit22、等 GMU2HOST_INTR_INFO bit30、清 bit30，两个 vote 仍不写），然后再写 HFI_CTRL_INIT=1 并只读一次 HFI_CTRL_STATUS；存活则说明死因是顺序/握手缺失，仍死则说明 vote 是硬前提，转去做 RPMh cmd-db 读取器。",
  "ROUND 179: 键 24 = 在脉冲之前补 a6xx_rpmh_start() 四步，其余沿用键 22 形状，看 boot-slumber 门铃是否终于被应答（ack=1）；键 25 = 在键 24 之上再补 a6xx_sptprac_enable()（SPTPRAC_POWER_CONTROL=1，等 (val & 0x38) == 0x28）。vote 仍不写，直到拿到 RPMh cmd-db。",
  "ROUND 180: 候选 A（首选）= 先只读 RPMh command DB（enchilada.dts 的 qcom,cmd-db@861e0000）把 gfx.lvl 的 aux 数据读出来，据此算出 GX/MX 两个 arc vote 的合法取值，再用键 26 写 vote 并看 gmurail2= 的 ack 是否终于变 1；候选 B = 先单独验证 RSC 窗口（gmu mmio + 0x23000）本身可读，区分「ACK 没置」与「整个 RSC 窗口读回 0」。",
  "ROUND 181: 只读 RPMh command DB（`enchilada.dts` 的 `qcom,cmd-db@861e0000`）取 `gfx.lvl`/`cx.lvl` 的 aux 数据，按上游 `a6xx_gmu_get_arc_level()` 规则算 `pindex`/`sindex`，得到 `vote = pindex | (sindex << 8)`，再把 `GX_VOTE_IDX`/`MX_VOTE_IDX` 写进 rail-on 路径，看 `gmurail2=` 的 `ack` 是否终于变 1 —— 以检验「arc vote 是 RSC 应答前提」这个假设。",
  "R185 键 32/33：脉冲后补 gfx_rail_on()（vote 索引 0 + GPU_SET 门铃 set 18/ack 26/clear 26）与 sptprac_enable()，先只报 gdscr bit16，再加 HFI_CTRL_INIT",

  "R187：先做只读的 APPS RSC TCS 状态转储（照 package/EnchiladaTouchRpmh.h 的 ftb_rsc_layout_for() 两套偏移：v3 tcs_stride 672 / control 0x24 / status 0x28 / cmd_enable 0x2c；FTB_RSC_TCS 0xd00），确认 CPU 侧 RSC 通道是否也像 GMU 侧一样无响应，再决定是否照 ftb_rpmh_active_request() 写 ACTIVE_MODE|TRIGGER；另一条备选是跳过 RSC 握手、vote 索引保持 0 直接推进（能跑但不可靠）",
  "R188：用已验证的基址 0x85fe0000 做只读 arc-vote 数据采集——quiet_cmd_db_levels() 读 gfx.lvl / cx.lvl / mx.lvl 三张 level 表，打印每张的条目数与最大 level 及其下标（对照上游 a6xx_gmu_rpmh_arc_votes_init：primary 取 pri[j]>=level 的首个 j，secondary 先试 gmxc.lvl、IS_ERR 且非 -EPROBE_DEFER 时退 mx.lvl）；拿到 pindex/sindex 之后再让键写 GX_VOTE_IDX/MX_VOTE_IDX，观察 GMU 侧 RSCC_CONTROL_ACK 是否变 1。注意 GMU 侧 RSCC 与 CPU 侧 APPS RSC 是两条不同的路，前者仍然 ack=0",
  "R196：在 RSCC 页做方向矩阵，只写 RSCC_CONTROL_REQ 一个寄存器（R193 已证明它可写可读回）——先 REQ=1（a6xx_rpmh_stop 方向）、有界轮询 RSCC_STATUS0_DRV0 的 bit16、再 REQ=0；然后 REQ=2（a6xx_rpmh_start 方向）、有界轮询 RSCC_CONTROL_ACK 的 bit1；每一步都读回 REQ/ACK/STATUS0/SEQ_BUSY 并一行给全。判读开跑前钉死：两向都不 ack => RSC 对非安全 CPU 完全不服务，冷启动这条路在没有 TZ 配合下走不通，应转去评估「让引导器/TZ 代劳」或「绕开 RSC 直接上电」；stop 向 ack 而 start 向不 ack => RSC 活着、只是「上电」语义被拒（很可能需要 CX 轨道先起来）；写完再读 REQ 不再是写入值 => 有别的执行体在改它",
  "R202：先读 R201 的 gmugx8=/gmugx9=（键 48：CX 的 GDSCR/CFG 与 cx_bit16 作为阳性对照，GX 的完成位轮询放大到 200000）再决定路线——gx_on=1 => 前两轮只是界太短，立即转去测 GMU/HFI；cx_bit16=1 且 gx_on=0 => GX 确由本 CPU 供不出的东西门控，唯一解是改引导器（Mu-Silicium 里没有任何 A6xx GMU 代码，RSCC/GMU_RSCC/rpmh_start/A6XX_GMU 只命中 15 个 MemoryMapLib.c 的地址常量）；cx_bit16=0 => 该完成位不能当判据，换 gdscr bit31 或 cxst/gxst 重做。引导器交接瞬间的读数在所有历史窗口逐字相同（cx=00005ff4 gx=00088400 cx_on=0 gx_on=0 gx_off=1），所以「热接管现有引导器」不成立。",
  "R204 三选一（R203 之后，§19.6）：①查 HFI 启动时固件访问了什么——HFI_SFR_ADDR 一直写的是上游公式算出的 chipid 0x06030100，从未与真机读数对照过；②回到 GX 电源门控——把 R201 的CX 阳性对照扩展成「CX 完整上电序列 vs GX 同一序列」逐字对比，找出 GX 缺的那一笔（候选：gds_hw_ctrl 0x1540、clk_dis_wait_val 0x8、GPUCC CX GMU 时钟 0x1098）；③接受「本 CPU 供不出 GX 上电」，转做不依赖 GX 域的 host 侧推进（微码 / CP 环 / seam 骨架）。当前唯一还站得住的缺口仍是 GX 电源域：同一次启动里 CX 的 cfg bit16=1（R201）而 GX 二十万次轮询恒 0（gmugx9=… gx_on=0 polls=200000）。",
  "R214 的三条硬约束（§52.7）：①不得用「占住 CPU」换观测窗口——可用的只有带 IODelay(1u) 的读循环，且 60 万次一轮已证不可靠；②必须先解释键 59 与键 60 的同一位置/同一等待/不同结局这条矛盾，否则任何「store 无罪或有罪」的结论都站不住；③必须让「有行落盘 + 不等待 + store 确实执行」这个组合出现一次——这是 R177 以来从未取得过的观测条件。",
  "下一步唯一有明确指向的动作：查 HFI 启动时固件访问了什么。已知要求启动必死、不要求（QTBL_INFO=0）则活、表指向哪无关 ⇒ 致死点在固件被要求启动之后的行为。HFI_SFR_ADDR 一直按上游公式取 chipid 0x06030100，从未与真机任何读数对照过；应先把 SFR 地址与真机侧读数对齐，再谈重试。旁注：键 65 连无条件回显都不出，原因仍未解释，与本结论无关，不要混谈。",
  "已知：要求启动 HFI 必死、不要求则活、表指向无关。因此下一步不是再重试这一笔写，而是回答「它之后固件做了什么」。主机侧没有可用通道（日志窗口被整轮提交掩盖；bark 未被取到；enchilada-wdog-stop-panic 需要人工按键且会打破自动回 TWRP，已弃用）。可选方向：①用第二颗 CPU 或内核外手段观察停住点（本机无条件）；②转做不依赖 HFI 的部分（SMMU stage-1、CP 环、GPU VA、Metal seam），把 GPU 冷启动留到有外部观测条件时。",
  "下一步（按代价排序）：①~~置 sCR0.SMMUEN~~（**R235 已作废**：该位名不存在；bit0 `CLIENTPD` 本来就是 0；R234/R235 两轮证明清 `USFCFG`(bit10) 不落地；真正缺的是 SMR 里的有效流映射，而 SMR 区可写 —— 键 75 探针 1 `landed=1`）；②把 ttbr1 接上 adreno_iommu_ttbr1_for_gpu()（目前写死 0，是已知未测输入，纯 host 侧就能做）；③之后才回到 GPU 上电与 HFI 那条线（HFI_CTRL_INIT=1 的致死点仍未定位，见 §24/§25）。",
  "下一步（按代价排序）：①不要再写 sCR0 bit10（两轮两次同一结果）；②「打开 SMMU 旁路」这条路关闭，但「SMMU 挡路」这条假设既无支持也无反驳 —— 要排掉它得在 HFI 真的启动、内核还活着时读 sGFSR，而那正是内核会死的那一刻，所以这条线停在「需要一次能活过启动字的观测」上；③SMR 区（0x800..0x810，在 0xC00 墙下）已被实测确认可写且安全（键 75 探针 1 landed=1、写 0x2a 时 SMR_VALID 保持清零、流匹配行为逐位不变）—— 若下一轮要建流映射，这是唯一一条已被确认可写的 GR0 通路；④之后才是 GPU 上电与 HFI 那条线（见 §24/§25、HANDOFF §35）。",
  "下一步（按代价排序）：①第一件事是修观测链而不是换假设 —— 键 78 只写四笔掩码 + 打印 + **不写启动字**然后正常返回，让后续 writer 轮转把证词带走；落盘 ⇒ 屏蔽无害、键 79（同样四笔 + 启动字）才有意义，零字节 ⇒ 那四笔掩码写本身致命、这条通路也要放弃；两轮用不同 boot_id 区分，同键值同镜像。②不要再用「空转买时间」换可观测量：R221 的 3.17 s IODelay 读循环、R208 的纯紧自旋、R236 键 77 的 0.63 s 都已证明救不了观测链。③AO_HOST_INTERRUPT_MASK=0 与 GMU2HOST_INTR_MASK=0 是 R236 键 76 的**实测状态**，引用时必须注明来源，不能当成上游默认值。④GR0 两条结论不变：sCR0 bit10 的清除两轮两次被忽略，别再写；SMR 区 0x800..0x810 已实测可写且安全。",
  "R238: make the start-word store the last action of the round -- print everything first, then store HFI_CTRL_INIT=1 and return without reading anything back -- because the only code shape that has ever landed rows is 'write and return' (key 78), and every shape that puts anything after the store has produced nothing (keys 77, 79). Judge by the window's own key= field and boot_id, never by a hand-maintained KNOWN table.",
  "R239: separate 'this write is fatal' from 'the firmware really starts HFI and then dies'. Same build, two keys, both keeping the store-last shape that is now proven to land rows: key 82 is key 81 with the last store writing 0u instead of 1u (shape control); key 83 is key 81 with HFI_QTBL_INFO cleared to zero first, so the firmware never sees a table. If 83 still leaves nothing, the fatality is the write to that offset with that value; if 83 lands its rows, the death needs the firmware to actually establish HFI and the next look is the table and PWR_COL_CP_MSG addressing.",
  "R240: find out whether the fatality follows the table CONTENTS or only the descriptor. Same build, two keys, both keeping the store-last shape: key 84 points HFI_QTBL_ADDR at a page of zeros (4 KiB from armcpu_dma_alloc_writable), leaves HFI_QTBL_INFO = 1 and writes HFI_CTRL_INIT = 1 last; key 85 repeats R238 key 81 exactly (real table, INFO = 1, start word last) and MUST still die, as a positive control against the world having changed. If 84 lands rows the firmware really walks the table; if 84 leaves nothing, any non-zero descriptor plus a start request is enough and the table content is irrelevant.",
  "R241: ask whether those two bits are the latch that makes the GMU become an AHB master. If they are, its first read of the queue table crosses the GPU SMMU, where no valid SMR has ever been programmed (R174: smr0 = smr1 = 0) and sCR0.USFCFG = 1 means unidentified streams fault rather than bypass - a read that cannot complete would look exactly like 'the AP stops inside an MMIO store and commits nothing for a writer round'. First probe touches no start word: key 86 reads sCR0/ID0/ID1 and SMR0..4, announces the S2CR0 (0xC00) write on its own row, then writes S2CR0 and reads it back; key 87 writes SMR0 = VALID | SID and reads it back. Only if both land does key 88 get to combine routing with the start word.",
  "R242: three keys in one build, all keeping the 'post everything you can, then act, then return' shape. Key 89 reads 0xC00 / 0xC04 / 0xC08 and writes nothing at all, to re-measure the old 'reads here abort' record with an independent, write-free probe. Key 90 programs SMR0 = VALID | SID 4 without restoring it, then S2CR0 = TRANS(0) << 16 | CBNDX 0, prints both readbacks, and only then writes HFI_CTRL_INIT = 1 as its last action: rows landing means the 'unidentified stream faults on the queue-table read' hypothesis is dead and the fatality lives in the HFI start sequence itself; no rows means S2CR is not programmable here. Key 91 reads 0xC00, writes the same value back and reads again, which separates 'the store is dropped' from 'the field is clamped to FAULT'.",
  "R243: three keys that separate 'S2CR cannot be programmed here' from 'the queue-table read is not what stops the machine'. Key 92 is read-only: read S2CR0 through S2CR4 at 0xC00 / 0xC04 / 0xC08 / 0xC0c / 0xC10 plus sGFSR at 0x48 and write nothing, to pin the default FAULT state as a baseline. Key 93 reads 0xC00, writes 0x00000000 (TYPE = TRANS, CBNDX = 0) and does not start at all: a readback of 00000000 means the TYPE field accepts TRANS and key 94 is worth running, while 000200ff or 00020000 means this SMMU will not route a non-secure stream from this CPU and the question becomes whether the GMU goes through this SMMU at all. Key 94 runs only if key 93 shows TRANS sticking: SMR0 = VALID | SID 4 and S2CR0 = TRANS | CBNDX 0 without restoring, then the start word as the last action.",
  "R244: make context bank 0's table actually cover the pages the GMU reads, then route and start, so those two explanations separate. Key 95 repeats the nine context-bank stores from key 72 but builds an identity mapping over the 128 KiB window that contains the HFI queue block (the probe already knows rb_pa and cpmsg at run time, so nothing is hard-coded), sets SMR0 = VALID | SID 4 and S2CR0 = TRANS | CBNDX 0, and writes the start word last: rows landing would mean the fault is gone and the firmware finally started in a CPU-provided address space, zero bytes would kill the fault-on-queue-read story and move the search to the HFI start sequence itself (resets, clocks, power domains). Key 96 is the control: build the table and write the nine words, leave SMR0 and S2CR0 at their defaults, write the start word last; if that still leaves zero bytes then the table work is not what the fatality rides on. Before implementing, read AdrenoSmmuLpaeV1's geometry and adreno_table_bytes_needed() to confirm one build can span 128 KiB and reach both non-contiguous pages.",
  "R245: find out what the start word actually does now that it can be survived. Key 97 repeats key 95's whole setup and start word and then, standing in the same round, reads back HFI_CTRL_STATUS, sGFSR (0x048) and context bank 0's CB_FSR (cb_base + 0x58) and prints all three; since that lands inside one writer round it is best-effort only - rows landing answers whether the fault was recorded at all, zero bytes means the machine still cannot outlive a round and the observation has to move to another channel (panic flush), which would break the standing 'must return to TWRP unattended' constraint and needs the user's agreement first. Key 98 repeats key 95 verbatim to confirm reproducibility, because the round has only one sample so far and reproducibility is worth more than a new bit here. If both land, the next question is whether the firmware really accepted the queue table (its contents, the cpmsg address, PWR_COL_CP_MSG) and whether sCR0/USFCFG or stage-2 still need touching.",,
  "R246: ask the firmware side why the start word does not produce a start report. Three independent keys, ordered by how much each can separate: key 99 writes the same setup and start word and then reads PWR_COL_CP_MSG (0x5100), PWR_COL_CP_RESP (0x5101) and the first words of the HFI queue itself, to see whether the firmware ever touched them; key 100 isolates the ordering between HFI_QTBL_INFO and HFI_CTRL_INIT by inserting a single HFI_CTRL_STATUS read between them; key 101 builds two routes, one for the GMU user stream (SID 4) and one for the GMU kernel stream (SID 5), to see whether the firmware only accepts one of them. If all three show no firmware reaction, the next question is the more basic one of whether the GMU is running at all (resonance, clocks, power domain), and answering that needs an observation channel other than the log window; switching channels would break the standing 'must return to TWRP unattended' constraint and needs the user's agreement first.",,
  'R247: ask why the CM3 does not take the start request. Key 102 is a read-only control key that prints HFI_SFR_ADDR (0x5182), CM3_CFG (0x502d) and CM3_SYSRESET (0x5000) before any store, so the chip id and the reset state are on record. Key 103 re-writes PWR_COL_CP_MSG once before the start word and prints the control status again, to separate \'the firmware is waiting for the CPU to publish the message area\' from \'the firmware is not running at all\'. Key 104, only if both point at a firmware that never runs, reads GMU2HOST_INTR (0x5193) and AO_HOST_INTERRUPT_STATUS (0x9305) to show that no interrupt is pending; if that is also silent, the next measurement needs an observation channel other than the log window (for example a second CPU reading EDPCSR), and switching channels breaks the standing \'must return to TWRP unattended\' constraint, so it needs the user\'s agreement first.',,
  'R248: the only remaining gap is why a live CM3 does not set HFI_CTRL_STATUS bit 0. Key 105 clears the request bit (HFI_CTRL_INIT = 0) after the CM3 re-boot and before writing it back to 1, so a stale request cannot be the explanation. Key 106 writes PWR_COL_CP_MSG from the CPU\'s own log buffer right after the re-boot and before the start word, to separate \'the firmware is waiting for the message area\' from \'the firmware is not running at all\'. Key 107 clears GMU2HOST_INTR (CLR = ~0) before the start word and reads INFO afterwards, to show whether the interrupt path exists at all. Every key keeps the start word as its last action. If all three come back negative, the next measurement needs an observation channel other than the log window (for example another CPU reading EDPCSR, or letting the writer commit once inside the a6xx_gmu_hfi_start polling loop); switching channels breaks the standing \'must return to TWRP unattended\' constraint, so it needs the user\'s agreement first.',,
  'R249: ask whether the firmware needs time and whether it touches any word at all. Key 108 repeats the R248 key-107 shape and, after the start word, polls HFI_CTRL_STATUS bit 0 with IODelay(1u) for a bounded window of about three seconds (the duration R201 measured for a read loop that still let the writer commit), then reads ctl/fwinit/cpresp/qtbli once. Key 109 repeats it but prints the first and last value of CM3_FW_INIT_RESULT and HFI_CTRL_STATUS across the same window and finishes by reading CB_FSR (cb_base + 0x58) and sGFSR (0x048), to show whether the firmware moves any word during those seconds. Key 110 repeats key 108 but writes HFI_QTBL_INFO 0 and then 1 just before the start word, to test whether the firmware samples the descriptor only at the moment it starts. All three keep the start word as the last store and none of them adds a sleep. If all three come back with ctl bit 0 still clear, the log window can no longer be the observation channel and the next step needs the user\'s agreement (for example another CPU reading EDPCSR, or a panic-time flush), because switching channels breaks the standing \'must return to TWRP unattended\' rule.',,
  'R250: stop changing CPU-side configuration and look for arrival evidence instead. Key 111 repeats key 108 but writes HOST2GMU_INTR_SET (0x5194) once before the start word and then reads GMU2HOST_INTR_INFO and AO_HOST_INTERRUPT_STATUS after the poll, to see whether the GMU answers a doorbell at all. Key 112 repeats key 108 but reads PWR_COL_INTER_FRAME_CTRL (0x50c0) and the power related words before the start word, to find out why gmurpmh never reports ack=1 (gmurpmh=pre=00000000 ack=00000000 apolls=400000 ok=0 in every window so far). Key 113 repeats key 108 but rings the request through the other doorbell path, so that \'this offset with this bit\' can be separated from \'the start request never leaves the host\'. None of the three touches the SMMU configuration, so the settled queue-table result does not become a variable again.',,
  'R251: pin down when the CM3_FAULT bit appears and whether it is an event or a state. Key 114 keeps the shared preamble, clears GMU2HOST_INTR_CLR once more and reads the info back immediately before the start word, then writes the start word and reads the info exactly once with no poll, so the bit can be placed between the store and the first read. Key 115 keeps the preamble, writes GMU2HOST_INTR_MASK to ~CM3_FAULT so only bit 23 is enabled, writes the start word, and reads the info and mask at once: if the bit is still set under an enabling mask it is a persistent state and not a clearable event. Key 116 keeps the preamble and does not write the start word at all, running the same reads and the same mask store as a control, so that the bit can be separated from the start word entirely. None of the three touches the SMMU configuration.',,
  'R252: bisect when the CM3_FAULT bit appears and settle whether it is an event or a state. Key 117 takes the key-115 shape (mask written as ff7fffff, only bit 23 enabled) and adds the 200000-round poll after the start word, so a bit that still appears under an enabling mask is a persistent state rather than a clearable event. Key 118 takes the key-114 shape and inserts one short bounded wait (20000 rounds, about 0.3 s) between the start word and the read, pushing the appearance time from 3.17 s towards zero. Key 119 writes no start word at all and still runs the full 200000-round poll, so that polling alone can be shown not to raise the bit; that is the stronger control that R251 could not provide because its control window was equally short. None of the three touches the SMMU configuration or sCR0.',,
  'R253: follow the fault instead of only timing it. Key 120 takes the key-117 shape and adds one more GMU2HOST_INTR_CLR clear immediately after the poll has observed bit 23, then reads again, so that clearable-versus-latched is measured instead of assumed. Key 121 takes the key-117 shape and, once the bit is seen, reads CM3_SYSRESET, CM3_BOOT_CONFIG and CM3_CFG again to see whether the CM3 has changed its own reset or configuration state while faulting. Key 122 writes the start word while HFI_QTBL_ADDR is zero with HFI_QTBL_INFO set, which separates a fault caused by reading the queue table from a fault caused by the start request alone. None of the three touches the SMMU configuration, sCR0, or any path that would leave the machine needing a keypress.',,
  'R254: localise the death that key 122 hit. Key 124 prints the zero-address row and then calls boot_log_panic_flush() before writing HFI_QTBL_ADDR as zero, HFI_QTBL_INFO as one and the start word, so the row that survives separates dying in the first store from dying later. Key 125 keeps the same flush but writes only the start word, and should survive like keys 120 and 121, which proves the flush itself did not change behaviour. Neither key touches the SMMU configuration, sCR0, or a path that needs a keypress.',,
  'R255: test whether the lost bit 31 is the functional cause. Key 127 builds the identity block at base 0x2D800000, which covers 0x2D800000 to 0x2D9FFFFF and therefore the addresses 0x2D960008 and 0x2D90D008 that the two faulting reads asked for, keeps the queue table where it is, writes the start word, polls 200000 rounds and reads CB_FSR, CB_FAR, CB_FSYNR0, HFI_CTRL_STATUS and the interrupt word: a clean status word together with any change in the status or interrupt word would show that the truncated address is the whole of the problem. Key 128 writes HFI_QTBL_ADDR in the truncated form (the queue table with bit 31 cleared), reads it back to see whether the firmware keeps that value, and then writes the start word, which separates a firmware that truncates the address itself from one that needs the truncated value from us. Key 129 repeats the key-127 mapping but writes no start word, so the new mapping is shown not to fault on its own. None of the keys touches sCR0, the panic path, or a path that needs a keypress.',,
  'R256: find out where our descriptors actually are, without changing any store first. Key 130 builds the low mapping, programs context bank 0 and then reads the three descriptor words (level-0 index 0, level-1 index 0 and the level-2 block at index 0x16c) back out of memory and prints them, writing no start word: if they read back bit for bit as the plan asked for, the writes are right and the open question is visibility rather than layout. Key 131 repeats key 130 and then cleans the three table pages with dc civac and dsb sy before the start word, polls 200000 rounds and reads the fault site: a clean status word would mean the SMMU was reading stale descriptor memory, and a fault of the same shape would mean this walk does not use the TTBR0 we program. Key 132 repeats the cleaning but writes no start word, so the cleaning itself is shown not to fault. None of the keys touches sCR0, the panic path, or a value with bit 31 clear in HFI_QTBL_ADDR.',,
  'R257: find out what the faulting walk is actually using, in three keys that still touch no sCR0 bit and no panic path. Key 133 programs context bank 0, clears the status word, writes the start word, polls, and only then reads the five context-bank words (TTBR0, TTBR1, SCTLR, TCR, CBAR) plus FSR and FAR: the same values we wrote would mean nothing rewrote the bank, a changed value would mean firmware or hardware rewrote it at start. Key 134 repeats key 133 and also reads GFSR and the FSR/FAR of context banks 0 to 4: a fault logged only in bank 0 would confirm the stream routing, while a fault in another bank would mean every round so far read the wrong window. Key 135 programs the bank, issues an SMMU sync and a TLB invalidate before the start word, polls, and reads the fault site with no page cleaning at all: a clean status word would mean the walk cache held a stale invalid entry, and an unchanged fault would rule the TLB out.',,
  'R257: find out what the faulting walk is actually using, in three keys that still touch no sCR0 bit and no panic path. Key 133 programs context bank 0, clears the status word, writes the start word, polls, and only then reads the five context-bank words (TTBR0, TTBR1, SCTLR, TCR, CBAR) plus FSR and FAR: the same values we wrote would mean nothing rewrote the bank, a changed value would mean firmware or hardware rewrote it at start. Key 134 repeats key 133 and also reads GFSR and the FSR/FAR of context banks 0 to 4: a fault logged only in bank 0 would confirm the stream routing, while a fault in another bank would mean every round so far read the wrong window. Key 135 programs the bank, issues an SMMU sync and a TLB invalidate before the start word, polls, and reads the fault site with no page cleaning at all: a clean status word would mean the walk cache held a stale invalid entry, and an unchanged fault would rule the TLB out.',,
  'R259: split the two explanations the routing key left joined. Key 139 clears the stream match valid bit while keeping SID 4 and polls without writing any start word, so a live round would put the death on the unmatched fault the start word triggers and a dead round would put it on the store itself. Key 140 writes the match word down to 0x00000004 and then back up to 0x80000004 before the start word, so a live round would say what matters is the state at the moment of the start word and not the fact that the register was ever changed. Key 141 keeps the match valid but moves it to a SID that certainly does not exist (0x80000000 | 0x7f), then writes the start word and reads the global status word plus the context bank status and address: a global USF with a clean bank word would say that the queue-table read does consult the stream match, while a bank word that still carries the fault would say it bypasses that match entirely.',
  'ROUND 260, KEY 142: SMR0 = 0x00000004 (VALID clear) then boot_log_panic_flush() then the mask store and the start word, with the long poll. Three outcomes, all informative: no bytes committed (the 138 reproduction - the read that becomes an unmatched stream takes the round down, which is the routing evidence); alive with gfsr USF set and the bank clean (the read goes through SMR0); alive with fsr = 00000402 and gfsr = 0 (the fault ignores the match register). Key 143 does both halves in one boot: VALID off, flush, start, poll, then VALID back on, flush, start again, poll. Key 144 leaves SMR0 alone and puts SID 0x7f into SMR1 instead, so a second observation of the read-only ID field comes without breaking the match this round depends on.',
  'ROUND 261, KEY 145: repeat the three-page fill and the start word three times in one boot, logging each polled status word and its poll count in one row (ctl0/ctl1/ctl2, bit0_count, polls0), so that a single sample of 000000fe can be told apart from a first start. Key 146 reads the queue-table page back after the start word (the first 64 bytes of the page HFI_QTBL_ADDR names), which is the first direct evidence of what the CM3 wrote once the walk succeeded. Key 147 fills the pages, writes the start word and enables GMU2HOST_INTR_MASK bit0 (MSGQ) before the long poll, to see whether the host interrupt word finally reports a message.',
  '[ROUND 262 2026-11-22, READ THE SAME PAGE BEFORE AND AFTER THE START] Key 148 maps the queue page, reads it, writes the start word, polls and reads the same page again in one boot so the difference is attributable; key 149 never writes a start word and reads the page twice with an IODelay between; key 150 prints the first 32 words of the page after a start to see whether it looks like a queue header.'
  '[ROUND 263 2026-11-22, WHO WROTE THE PAGE] Keys 151, 152 and 153 separate the preamble from the page content: key 151 reads the page in the same session before arming QTBL_ADDR and QTBL_INFO, key 152 reads it after arming but before the CM3 reset pulse, and key 153 reads it after the reset pulse and before any start word, so the three keys bracket which step makes those four words appear.'
  '[ROUND 264 2026-11-22, AFTER ACCEPTANCE] Key 154 reads CP_RESP and CP_MSG and the first queue word twice after a successful start to see whether the firmware advances the queue, key 155 writes a recognisable pattern into the first four words of the queue page before the pulse and the start word to learn who owns the page, and key 156 repeats key 155 without the start word as its control.'
  '[ROUND 265 2026-11-22, WRITE PATH AND SAFE WORDS] Key 157 writes one word into page words sixty-four to sixty-seven and reads it straight back through the same mapping to prove the write path; key 158 repeats that safe-page write and adds the start word, so a refusal there cannot be blamed on the queue header; and key 159 replays key 155 but cleans with dc cvac instead of dc civac before the start word to separate a write that never landed from a write the firmware erased.'
  '[ROUND 266 2026-11-22, THE 2x2 MATRIX] Finish the grid inside one boot: key 160 writes words four to seven, cleans with dc civac, commits, then rewrites, cleans with dc cvac and commits again; key 161 does the same pair at safe words sixty-four to sixty-seven so the missing cvac arm exists; and key 162 cleans words four to seven with dc cvac and commits no start word at all, to separate visibility from acceptance.'
  '[ROUND 267 2026-11-22, COUNTING ACCEPTANCE] Repeat the accepted shape three times inside one boot (key 163 at words four to seven, key 164 at safe words sixty-four to sixty-seven) so acceptance becomes a count rather than an anecdote, and add key 165 that writes no pattern at all, cleans once with dc civac and commits the start word, to separate page visibility from acceptance.'
]
evidence = [
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 281 DEVICE-VERIFIED] The zero window is intermittent, not a function of 'store, 2000 ctl polls, read'; a pure wait after the store ends the round between 15 and 20 ms. Key 205 (the same shape as R280 key 202 minus the 10 ms wait) landed 4/4 rows with a healthy window (st=000000d4 gd=00222001 cf=00088400 qa=ad975000 fw=babeface) and ctl 00000000, so R280 key 202's all-zero window did not reproduce. Key 206 sampled twenty times inside the two thousand polls: every sample identical and healthy, and the post-loop read healthy too, so the window never collapses while the loop runs. Key 207 wrote INIT and then only waited: 10 ms and 15 ms rows landed healthy, the 20 ms row and the tail row did not land at all, so a pure wait suffices to end the round and the threshold is now bracketed at (15 ms, 20 ms) measured from the store itself. ctl bit 0 and GDSCR config bit 16 stayed zero in all three keys. See section 105." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 280 DEVICE-VERIFIED] Ten milliseconds is safe and fifty microseconds is too fast to see the zero window. Key 202 (descriptor cleared, INIT written, 2000 ctl polls, then a 10 ms wait and one read) survived 5/5 rows: p2 showed the all-zero window, p3 read waited=100 with st=000000d4 gd=00222001 cf=00088400 qa=ad972000 fw=babeface sr=00000000 while ctl stayed 00000000, so the wait completed, the window recovered within 10 ms and bit 0 still never latched. Key 203 (CM3 reset, a row printed before the INIT store, then INIT with the descriptor set) gave a zero-byte boot with the window and boot_id unchanged from key 202 - the pre-reset census row did not land either, so keys 201/203 die before the INIT store. Key 204 (descriptor cleared, INIT written, twenty samples about 50 us apart) landed 3/3 head rows plus all twenty samples, every sample identical and the first already non-zero, which refutes 'the window reads zero immediately after the INIT store'; the zero reading tracks 'store, 2000 ctl polls, read' instead. See section 104." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 279 DEVICE-VERIFIED] The zero window is intermittent and the 20 ms wait ends the round. Key 199 (descriptor cleared, INIT written, ten samples about 3 ms apart) survived 13/13 rows with all ten samples identical and no zero window at all, so R278's all-zero reading is not a deterministic consequence of those two stores. Key 200 (same sequence plus a further 20 ms wait) landed only 3 of 5 rows: p2 again showed the all-zero window while p3 and the tail row never printed, so waiting longer can itself end the round and 'never latched' remains unproven. Key 201 (real CM3 reset, INIT written WITHOUT clearing the descriptor) gave a zero-byte boot with a successful flash and key-block read-back, the third such boot with the descriptor set. One correction to R278: probe rows land in slices rather than one commit, so a zero-byte boot only means the round died before its first flush. See section 103." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 278 DEVICE-VERIFIED] Descriptor vs address bisected in one build. Key 196 (descriptor cleared, address kept, INIT written) survived 4/4 with init=00000001 and latched=0 ctl=00000000 polls=2000; key 197 (address cleared, descriptor kept, same INIT) gave two zero-byte boots while both flashes succeeded; key 198 (real CM3 reset, descriptor cleared, INIT written, doorbell only on latch) survived 6/6 with latched=0 ctl=00000000 polls=20000 and skipped=1. So HFI_QTBL_INFO != 0 is the lethal half, and restarting the firmware does not make the HFI start latch. A new observation: after the INIT store the whole GMU/GPU_CC window reads zero for a while (including the untouched queue address) and recovers on its own in key 198 with no store in between; in key 196 it is still zero at the tail row. See section 102." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 277 DEVICE-VERIFIED] Firmware identity and the HFI message ring. Key 193 (zero writes) reads ver=00000000, HFI ctl/ver/mmap/init all zero, qinfo=00000001 with qaddr=ad970000, fw=babeface, st=000000d4: the version word upstream uses to pick its init scheme carries no revision, so 0xbabeface is not revision evidence. Key 194 rings MSGQ (bit 0) and reads ack=0 info=00800000 with the queue address unchanged, so the message ring is not serviced and a message doorbell raises CM3_FAULT too. Key 195 writes HFI_CTRL_INIT=1 and then rings the same doorbell: two zero-byte boots, window sha still key 194's 33e8ed83... and boot_id still 585406562 although both flashes succeeded, so that round dies before its commit; with R239 key 83 (table description cleared first) having survived 4/4, the lethal condition is the combination 'table described + write INIT'. See section 101." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 276 DEVICE-VERIFIED] Out-of-band doorbell asked with a second message: key 190 rings GMU_OOB_GPU_SET (set 16 / ack 24) and reads ack=0 info=00800000 with the rail words unchanged, so no out-of-band message is serviced at all. Key 191 finds all four AO interrupt sources clear (wdt/ahb/fen/vdr = 0) and the AHB fence open, so the CM3_FAULT bit has no hardware fault behind it. Key 192 sets BOOT_SLUMBER_OPTION=1, rings the same doorbell, gets ack=0 again, and reads RPMH_POWER_STATE = 0000000f - mainline's 'the GMU really did slumber' value - throughout. gx_on stays 0. The gate for GX power-up narrows to whether this firmware implements out-of-band service at all. See section 100." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 275 DEVICE-VERIFIED] Out-of-band rail doorbell: key 187 reads both arc votes as 0 (the firmware never took a rail vote) and two censuses are identical. Key 188 writes the five upstream stores and rings HOST2GMU_INTR_SET bit 22: nothing observable changes, bit 30 never rises in 10 ms, but info goes 00000000 -> 00800000 (bit 23 = CM3_FAULT per the upstream xml). Key 189 restarts the CM3 first (0xbabeface returns after 4 polls) and then rings the identical doorbell with the identical result, so this firmware simply does not service the out-of-band request. gx_on stays 0. The gate for GX power-up narrows to the out-of-band interrupt path. See section 99." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 274 DEVICE-VERIFIED] GX power domain: key 184 reads cfg=00088400 bit 16 = 0, so the domain is off at rest. Key 185 (clocks on + four GDSC writes) drives gdscr 00222001 -> 08222000 (bit 27 sets) and cfg 00088400 -> 01080400, but bit 16 stays 0 through 20000 polls. Key 186 (same writes, clocks off) is bit-for-bit identical to key 185, so the gfxcc clocks are not the gate. GDSC accepts the power-up request but POWER_UP_COMPLETE never completes (gap G1). See section 98." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "[ROUND 273 DEVICE-VERIFIED] The 0x5180 bit 0 a start word writes is a latched state, not a clearable event: after acceptance key 181 clears GMU2HOST_INTR_CLR and 0x5180 still reads 00000001 bit 0 set (opposite of R253 key 120 on 0x5192 bit 23). Key 182 reads the whole control word 00000001 and every neighbour (0 0 0 1 ad980000 1); no neighbour carries 0xfe, so the 0xfe is the control word's own value, not leakage. Key 183 reproduces key 177's start-then-clear order and reads a clean 00000000, so the 0xfe was a one-off residual state, not a product of that order. See section 97." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 272 DEVICE-VERIFIED: the 0xfe in R271 key 177 came from its start word, not from the CM3 reset - a restart with no start word leaves the control word at 00000000 and 0x5180 at 0 (key 179), while the same shape plus one start word gives control 00000001 and 0x5180 00000001 (key 180). A start word the firmware accepts writes 0x5180 bit 0. Key 178 confirms clear-then-start still accepts after a restart (00000001 / pol=1), so key 177 failed on ordering, not because the restart broke acceptance. See section 96." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 271 DEVICE-VERIFIED: a CM3 restart does not restore the acceptance - clearing the control word, restarting and sending no start word leaves it 00000000 through a full 200000-poll watch (key 175), and reading it right after a restart reads 00000000 (key 176); only the later start word sets 00000001. The once-per-boot limit lives in the control word. Key 177 (two start words with no clear between them) left the word at 000000fe and did not answer whether the limit counts runs or boots - an unresolved anomaly. See section 95." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 270 DEVICE-VERIFIED: restarting the CM3 inside one boot makes the firmware re-run (init result returns to babeface after 5 polls, four times), after which HFI_CTRL_STATUS reads 00000001 again with no translation fault (keys 172, 174); re-arming the queue table onto a fresh page refuses nothing (key 173). Whether a restart restores the acceptance or leaves the old bit standing is not separable from these keys. See section 94." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 269 DEVICE-VERIFIED: only the first of four start words inside one boot is accepted; after a hand clear of HFI_CTRL_STATUS the remaining three wait 200000 polls and stay zero (key 169). The control word is writable by hand (1 reads 1, 0 reads 0) and a hand write does not consume the one acceptance (key 170). Hand clearing the word leaves fwinit, cpmsg, cpresp, info and gfsr untouched (key 171). No translation fault in any key. See section 93." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 268 DEVICE-VERIFIED: six start words inside one boot all read back a set control word; the only moving status word is 0x5180 bit 0 (0x5182 is the chip id); and after a hand clear of HFI_CTRL_STATUS the same start word is never accepted again in that boot (200000 polls, still 0). The bit is a once-per-boot latch, so earlier polls=0 readings report the previous latch. No translation fault in any of the three. See section 92." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 267 DEVICE-VERIFIED: three start words inside one boot were all accepted (163 on the header words, 164 on the safe words), the control word latches at bit 0 and is not cleared by another start word, and a mask store alone never sets it (165, 200000 polls, bit 0 clear, ctl=000000fe). No translation fault in any of the three. See section 91." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 163 DEVICE-RUN: control build #264 (the ci258 tree rebuilt with todays workflow) booted and wrote a full log, window cd2e4c1b80, boot_id 584678385; the pipeline is therefore exonerated and the silent boots are our own source delta." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 162 DEVICE-RUN: fourth silent boot; the early SCM shape matches ci258 instruction for instruction and the kernel still writes nothing, so the shape hypothesis is falsified; pipeline control build #264 pending" },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 162 HOST-VERIFIED isolation of the retry machinery, and the R161 device run that forced it. R161 was silent (window sha256 96f0d655.. byte-identical to the R160 control window, boot_id 629517746), which falsifies the R160 attribution that the re-issue loop alone stopped early boot; the attribution entries below are superseded. ArmCpu::start differs from ci258 in only three early places, and the dangerous one is a read of a zero-initialised BSS global before the loader is known to have zero-filled __DATA. R162 restores struct ScmTriple and a single-smc scm5 with x6 only as a clobber, and moves cap plus counters plus ScmResult into scm5Retry, called only by armcpu_scm_call_full. stage6 314 checks, k3 76, host 31, probe 26/26, sweep 71/71. No device reading yet." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 160-161 DEVICE-VERIFIED three-run attribution. The R160 flash of the #260 payload succeeded (system_b read-back head sha256 8998eba8... equals the payload head) yet the boot was silent: window sha256 2f513143..., boot_id 935335677, zero gputate= rows, byte-identical to R147 and R159. The CONTROL run then flashed the ci258 payload with the same boot image and the same procedure and it logged immediately: window sha256 96f0d655..., boot_id 629517746, first timestamped line t=30.72 s, EnchiladaAdreno rows t=31.79-32.06 s. Since 4a786a39 (source of ci259 and #260) differs from 3f1de2be (source of ci258) only in the scm5 retry loop and in probe-side statements that run after 31.8 s, the re-issue path itself is what stops the early boot; R161 gates it behind armcpu_scm_retry_cap default 0. Disassembly of the #260 image confirmed the reload fix was compiled in. Still unidentified: which specific SMC call wedges EL3." },
  { kind = "device", reference = "evidence/stage5-gpu-pas-device.md", result = "ROUND 139-160: SECTION 12 retracts the SECTION 8 final verdict and records the R159 false start. Established: SHM_BRIDGE_ENABLE returns av2=1 sb=0 (service present and enabled); SHM_BRIDGE_CREATE with all-0xFFFFFFFF returns status 0x57 and with all-zero 0x5b while both return the SAME handle 0x8587EB18, which SHM_BRIDGE_DELETE then removes with a0=0; PAS and bridge rejections are therefore of different kinds (dispatch-level refusal vs secure-side business logic). The OEM device tree carries qcom,pas-id=<13> pointing at gpu_region@0x8c415000 (0x2000) and has NO zap-shader child node, so upstream would take the -ENODEV degrade path on this DT. The Windows image booted on this phone contains UEFI-stage zap configuration; qcscm850.sys contains zero PAS/PIL/GPU strings and is a Secure App SCM. R159: the system_b head 8 MiB matched the ci259 payload, yet the log window was byte-identical to R147 (boot_id 935335677, zero gputate= rows, no rt=/a3=/a6=), and BootLog writes continuously, so XNU never reached the writer. R160: scm5 now re-loads all seven registers per retry iteration; host 31 suites, probe 26/26, stage3 40, stage4 52, stage5 40, stage6 289, zap-auth 306, gmu-caller 28, 71 of 71 verifiers pass with zero count drift; pushed as db8264e5; CI run 43829869564 (#260). The device reading for R160 is PENDING at the time of writing and must be filled in, not assumed." },
  { kind = "device", reference = "evidence/stage5-gpu-ias-measured-device.md", result = "ROUND 101 DEVICE-VERIFIED: ias IS MEASURED. ID2 read on the phone for the first time: id2=00007511 -> ias=48. ROW: stage4=id2 id2=00007511 ver=2 ias_ok=1 ias=48 ipa=36 pa=36 oas2=36 ptfs4k=1 vmid16=0 words_ok=1 plan_ok=1 tcr=a0100080 tcr2=00038011, from a run where stage5 also reported cx_before=00005ff4 -> cx_after=80001fe0 cx_on_after=1. DECODE re-derived independently: IAS[3:0]=1 -> ipa 36; OAS[7:4]=1 -> pa 36; UBS[11:8]=5 -> va_size 48 via the DEFAULT arm of arm_smmu_id_size_to_bits() (P2:1727-1744), the collapsing branch round 83 called a trap and this device lands in; PTFS 4K/16K/64K set at BIT(12/13/14); VMID16 clear. IAS and UBS DISAGREE by design (ipa from IAS, va from UBS) and this part reports 36 vs 48. CROSS-CHECK: TCR2=0x00038011 equals round 83 derivation for oas 36 + AArch64; TCR=0xa0100080 is the TTBR1 geometry (EPD0 set, EPD1 clear, TG1 at bits[31:30]=2 = 4 KiB, T1SZ=16 in the HIGH half so 64-16=48) and re-deriving round 83 own function for (ias=48, coherent=0, ttbr1=1) yields 0xa0100080 EXACTLY. Measured word and composed word agree. PATH: five runs, each removing one wrong precondition - (98) refused-cx-down because the CX word was sampled before stage 5 raised it; (99) refused-clocks-off because clocks_enabled was hard-coded 0; (100) refused-unmapped because the map sat inside the permitted branch while the gate checks mapped-ness; (100) refused-no-stream because stream_faults was folded into the READ gate. The last was settled by counting upstream: arm_smmu_device_cfg_probe() has ZERO occurrences of fault/BYPASS/BUSY/wait before it reads ID2. The stream condition now lives in adreno_iommu_admit_program(), which delegates to assess(). SAFETY: reboot-to-TWRP verified before the run and re-armed after (the misc BCB is one-shot); fastboot reboot recovery returns to TWRP even with a zero BCB, so it is the default path; BCB kept for XNU-initiated resets; boot_a backup md5 ca8ddd7a5af345636cad8c5bf645fee2 is the third line. BOUNDARY: proves ID2 reads 0x00007511 and decodes to ias=48; does NOT prove a stage-1 context works. Three of four kgsl-smmu-stage1 inputs remain (ASID allocator, populated LPAE table, programmed context). Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No flash of boot_a, no m39510, CONFIG_XNU_NATIVE_ADRENO=n, gpu AREA stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-ias-measured.py", revision = "6e3ed75c24183cfd8da6d4806e45d0630c34df0a" },
  { kind = "host", reference = "evidence/stage5-gpu-probe-stage5.md", result = "ROUND 95 HOST-VERIFIED + ARMED, NOT RUN ON HARDWARE: probe stage 5 is the IOKit caller that connects the power-up chain, and the only stage of this probe that WRITES. The gap it closes is stated by the modules themselves - AdrenoPowerUpBackendV1 performs MMIO through the caller callbacks and nothing else (maps nothing, owns no window, no IOKit caller of its own) and round-64 AdrenoCallerV1 has the same boundary - so the executor was real and unreachable. ORDER: re-check the same gpucc_window_is_safe() gate stages 1-4 use and bind the window only after it passes; bind AdrenoGpuccWindowV1 and supply a REAL delay via IODelay because the window refuses an MMIO triple with a NULL delay (the GDSC plan genuinely waits between its collapse-clear write and the status poll, and a calibrated spin loop would be worse than none); obtain the bounded MMIO triple so every write goes through its bounds; run the caller with board facts (armed=1, gxpd_present=1, rcg_enabled=0, core_rate_hz=200000000 from a6xx_gmu.c, strict_gx=0); report THREE SEPARATE verdicts - up_status, precheck_status, and cx_before/cx_after/cx_on_after. THE LOAD-BEARING DISTINCTION: up=Ok means the writes happened, NOT that CX is on; round 35 measured cx=0x00005ff4 BIT(31) clear and nothing proves the collapse clear raises it, so up=Ok with cx_on_after=0 is a possible and meaningful outcome. Collapsing the two into one success flag is how a port invents a fact. SAFETY: no direct store (the verifier parses the comment-stripped source and asserts the only casts remain the two volatile window types); no invented delay loop; mmio.write32( never appears; default-off with mask stage < 1u || stage > 5u; board.toml moves enchilada-adreno=4 to =5 at the same byte count, joined line stays 970/1000. EVIDENCE: check-enchilada-adreno-probe.py 18/18, verify-enchilada-probe-stage5.py 38 checks, stage3 40/40, stage4 updated to the monotonic mask, verify-gpuprobe-device-2.py refined to assert the precise write property instead of a literal substring, full tree 63/64. NOT PROVEN: never flashed, never executed, has written no register. Outcome (a) would be the first time this port powered the GPU; outcome (b) would be a real finding that the rail did not rise. Even (a) does not satisfy kgsl-smmu-stage1, which still needs an ASID allocator and a populated LPAE table. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No flash, no reboot, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-enchilada-probe-stage5.py", revision = "a2aab9a2d2398aa179be3f3748a9b028d8bdf80f" },
  { kind = "host", reference = "evidence/stage5-gpu-probe-stage4.md", result = "ROUND 94 HOST-VERIFIED + FAIL-CLOSED, NOT RUN ON HARDWARE: probe stage 4 is the port FIRST kernel call path that can read SMMU ID2, the only source of ias. It exists because three doors closed: round 77 proved ias comes from a PROBE-TIME READ of ID2.UBS (P2:1879, :1904-1905) so no document supplies it; round 85 measured CONFIG_DEVMEM is not set (a mknod-ed /dev/mem fails ENXIO) and that the iommu debugfs tree is only io-pgtable + tests with find -maxdepth 2 returning one file, so userspace cannot reach it either. ORDER: read the GPUCC CX status at 0x05091540 (already measured by stages 1/2 in the same poll); ask the round-86 contract gate with struct adreno_iommu_gate_inputs whose cx_status_word IS the measured word, never a constant, which the verifier asserts negatively; if refused, log a row that NAMES the verdict and stop with no mapping and no read; if permitted, map ADRENO_BOARD_KGSL_SMMU_BASE (0x05040000) for the first time, read GR0_ID2 at byte 0x28 EXACTLY ONCE, dsb sy, then adreno_iommu_id2_decode + adreno_iommu_va_size + adreno_iommu_stage1_words so the real ias lands in round 83 TCR/TCR2. No ID2 bit position is re-derived here. EXPECTED ON THE CURRENT DEVICE: round 35 measured CX DOWN (cx=0x00005ff4, BIT(31) clear) and nothing has powered it since, so the expected row is stage4=refused verdict=N cx=00005ff4 cx_on=0 - the gate working, NOT the read failing, and a refusal says nothing about ias. WIRING: board.toml adds enchilada-adreno=4 (18 bytes plus separator) against a MEASURED 49 bytes of headroom, joined line now 970/1000; default-off; the mask accepts only 1/2/3/4 and the stage-3 verifier now pins that. EVIDENCE: check-enchilada-adreno-probe.py 18/18 (the only dereference is a read; no unexpected undefined symbols), verify-enchilada-probe-stage4.py 45 checks (gate struct, measured CX word, map only inside the permitted branch, single rd32 plus dsb, contract-only decode, no re-derived fields, no store through any pointer, no libc, pure LF, boot-arg budget), stage-3 verifier 40/40, full tree 62/63 (the 63rd needs a 40-hex revision by design). NOT PROVEN: never flashed, never run, reads no register today; a CX-DOWN refusal proves the gate and nothing about ID2; obtaining ias additionally needs CX up, which needs a genpd/clock backend this port lacks. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No flash, no reboot, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-enchilada-probe-stage4.py", revision = "d249e6c165e3f2fc9dfd32af9765ee1db696d57c" },
  { kind = "device", reference = "evidence/stage5-gpu-devmem-ceiling.md", result = "ROUND 85 DEVICE-SOURCED (read-only, NEGATIVE RESULT: ias is not readable from userspace). Two findings. (1) THE DEBUGFS SURFACE IS UNCHANGED: debugfs mounted briefly then removed and verified (BEFORE_MOUNTS=0, MOUNT_RC=0, UMNT_RC=0, AFTER_MOUNTS=0, AFTER_ENTRIES=0); io-pgtable/pages is 92 (re-confirms round 82); the whole iommu tree is io-pgtable and tests; find -maxdepth 2 returns ONE file (pgtable/pages), so there is NO va_size / address_size / ias / id2 node and NO kgsl-specific node (both tests/ entries are apps_iommu_*); the kgsl SMMU is still bound to arm-smmu and its modalias is still of:Narm,smmu-kgslT<NULL>Cqcom,smmu-v2. 92 pages prove tables exist, NOT how wide the VA space is. (2) THE DECISIVE ONE: CONFIG_DEVMEM IS NOT SET (config reads # CONFIG_DEVMEM is not set and # CONFIG_STRICT_DEVMEM is not set). The read-only route to ID2 at 0x05040028 is /dev/mem and this kernel does not provide it: a mknod-ed node is accepted (test -e says YES) but every read fails with ENXIO - dd says No such device or address - which is the kernel saying major 1 minor 1 was never compiled in. This is a HARD kernel-level exclusion, not a permission problem: root, an SELinux context or another mknod mode cannot fix it, only a DIFFERENT KERNEL. CONSEQUENCE: we have not read ias yet becomes ias is NOT READABLE from this boot image, which removes a false hope rather than creating one; ias can now only come from code running IN the kernel, which is exactly what kgsl-smmu-stage1 means and why it reads satisfied=0. A TWRP-side probe is NOT a shortcut (it needs a DEVMEM=y kernel or a module). NOTHING INFERRED FROM THE VANISHED BOOT LOG: dmesg holds about two minutes of wall clock (uptime 151128 s), so the arm-smmu probe line Stage-1: N-bit VA -> N-bit IPA (arm-smmu.c:1940) is gone, and zero smmu lines in dmesg is NOT evidence of absence. The round-28 GPUCC GDSC read of 0x05091540/0x05091010 is blocked by the SAME ceiling and was NOT attempted once provably impossible. Device restored exactly: still in recovery, not rebooted, zero debugfs mounts, the created node removed. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No MMIO write, no ioctl, no submission, no flash, no persistent file, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-enchilada-devmem-ceiling.py", revision = "e0f0640efe1a8a8da403b1b4f736f6167a88c977" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-239.md", result = "ROUND 84 CI-COMPILE-ONLY (the 29th archive object, round 83 compile-proven): CI #239 run 43335691372, workflow_dispatch, created 2026-11-13T00:16:06Z updated 00:32:07Z, completed/success, workflow head edb0593a, device ref main @ ab99958f (round-83 phase 4), job build 27 steps 0 failed. FIRST CI since #238 (round 78), closing a specific gap: rounds 79-82 were read-only evidence and prose, round 83 added real code (AdrenoSmmuCtxWordV1.c) that had a 10-group host suite and a 264-check cross-verifier but had never met the kernel clang - and host verification of code is not a compile proof. ARCHIVE: PASS: libEnchiladaAdreno.a (29 objects, sha256 d140c2aa89bc89aa); CI #238 was 28 objects sha16 f90f1a3267b71762, so the count ROSE BY ONE and the sha16 CHANGED - structural proof the new unit compiled and joined the link. kernel.macho 126,103,552 B vs 126,099,456 B = +4,096 B, the OPPOSITE of rounds 43/45/59/78 where a new object linked without growing the image; the two directions together are why SIZE IS NEVER THE PROOF. prelink.log: Experimental candidate 126103552 bytes, executable bytes unchanged, runtime unqualified. kernel.log 36,731,153 B CLEAN (no Undefined symbols, no Error 1); kernel-bootstrap.log 37,040,468 B is the INTENTIONALLY failing baseline (both present, plus _native_verified_root_probe) kept as differential evidence. ALL 18 adreno_smmu_ctx_* exports in the image, and round-77 va-map / round-75 smmu-stage1 (source left BYTE-IDENTICAL) / round-70 cp-ring / round-73 zap-auth / round-74 mdt / round-69 gen1-backend / round-67 publish / round-66 darwin-kmd / round-65-and-earlier all survive. BOUNDARY ASSERTED: no _writel(, _readl(, _IOServiceOpen, _IOConnectCallMethod, _qcom_scm_call or adreno_zap_shader_load symbol; stage3=plan steps=%u present, stage3=exec ABSENT. This CI uploads ONE log PER ARCHIVE, so there is NO AdrenoSmmuCtxWordV1.log and the verifier asserts that absence rather than inventing one. Compile/link proves the module is kernel-clang clean and linkable and proves NOTHING about the phone: no context programmed, no page table, no ASID, no ID2 read, no CX power-up. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-ci-239-adreno.py", revision = "7006a1e3f02f39c23d1be9827d3791c7067e7827" },
  { kind = "host", reference = "evidence/stage5-gpu-smmu-ctx-word.md", result = "ROUND 83 HOST-VERIFIED (the stage-1 context WORDS, and why round 75 six-write plan was incomplete): round 75 answers only the ORDER and takes every VALUE as an argument, so its own test passes tcr = 0x1234 - and its six writes are an incomplete SUBSEQUENCE of upstream nine (arm-smmu.c:566-653): CBAR, CBA2R, TCR2 and TTBR1 missing entirely, TTBR0 carrying no ASID although P2:540-548 puts one in bits 63..48, and CONTEXTIDR written although upstream writes it ONLY in the AArch32 branch (the pinned file holds exactly one ARM_SMMU_CB_CONTEXTIDR write site, at P2:625). NET 6 -> 9 writes: FOUR added, ONE dropped, so the net +3 is smaller than the register delta +4 and BOTH numbers are exposed in code (round75_writes() 6, plan_writes() 9) and asserted. Derived words, all form pinned sources: TCR from (ias, coherent_walk, ttbr1) per P1:393-412 + P3:944-999 = 0x00803518 coherent / 0x00802018 non-coherent / 0xB5180080 TTBR1 at ias 40; TCR2 from oas per P1:414-418 = 0x00038011 with AS / 0x00038001 without at oas 36 (SEP 0x7 always); CBAR = 0x0001F300 with the 8-bit VMID only when 16-bit VMIDs are absent; CBA2R VA64 + VMID16 at 31..16; MAIR = 0xF404FF44 split by P2:560-561 into MAIR0 0xF404FF44 / MAIR1 0; TTBRn = (asid << 48) | table for BOTH, so the ASID lands in the HIGH word at bit 16. TWO TRAPS: TG1_4K is 2 not 3 (P4:10-11) so importing 3 programs TG1_64K, and arm_smmu_id_size_to_bits() DEFAULT arm collapses 5 and everything else to 48 (P2:1727-1744). SCTLR stays LAST - round 75 one correct rule, preserved. Round 75 left BYTE-IDENTICAL. THREE inputs stay absent (ias from ID2.UBS, no ASID allocator, no populated table) and are derived into ready()==0; round 75 I3/I4 deliberately NOT repeated because they gate PROGRAMMING, not the word. Admission table UNCHANGED (modeled=1 already, nothing satisfied). Host suite 10 groups / 0 failures with an 82-check self-verifier whose count is pinned; SMMU_CTX_WORD_CROSS PASS (264 checks) re-deriving every word from 4 pinned sources; 28 host suites green; all 58 runnable verifiers green; strict freestanding arm64 Mach-O exit 0. Six stale 27-unit assertions moved to 28 and two PASS enumerations made cumulative (the round-78 drift class). No device run, no flash, no MMIO, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-smmu-ctx-word.py", revision = "3fbbd4ee98fee3c39709c8d820f8c4c2521b8b7f" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-233.md", result = "ROUND 66 CI-COMPILE-ONLY (2026-11-12): CI #233 run 43158161524 completed success (workflow_dispatch, 27-step build job, 0 failed steps) at device head 6e50eea85593. libEnchiladaAdreno.a 21 objects sha256 a1d20d90bb7a75d2; kernel.macho 126070784 B sha256 18bcb8e25b431b228bc64645f14b38477560063153b0d560c28bcb46a91a09df (changed sha256 vs CI #232 = genuine relink); clean kernel.log with no Undefined symbols or Error 1; intentionally-dirty kernel-bootstrap.log retained as differential evidence; all 8 darwin-kmd exports and 15 earlier unit names linked; stage3=plan present and stage3=exec absent. Honest boundary: CI compile/link only, NO device run, NO flash, CONFIG_XNU_NATIVE_ADRENO remains n, NOT a GPU driver, does NOT unblock stage 5, gpu stays host-verified.", command = "python -X utf8 scripts/verify-ci-233-adreno.py", revision = "0fd68e3466aa9129b66d984cdf7ffd189188e1c6" },
  { kind = "host", reference = "evidence/stage5-gpu-metal-publish.md", result = "ROUND 67 HOST-VERIFIED (2026-11-12): A630 Metal publish/discovery/client-window policy contract AdrenoMetalPublishV1 mirrors the generation-independent publish layer of NativeAdrenoPublish.cpp/NativeAdrenoMetalPlugin.mm (seed markers, IOAcceleratorES discovery chain, publish gate, backboardd routing, allow-list semantics with * / exact / trailing-star, open-type routing 0x4147/0x4148, connection cap 8) as freestanding pure C, and enforces the A630 window-zero honesty gate: all four GPU windows structurally ZERO, specified mask 0, any nonzero window rejected; the four sheng windows are exposed only as provenance via enchilada_publish_sheng_reference. DOC-CONSTANT CORRECTION carried: 256 MiB is the per-object cap MaxBoBytesShift=28, the real sheng client windows are 0x0AAA9000 = 178905088 B each and slot0 is 1 GiB at 0x20000000. Three independent verifications PASS: strict freestanding 4488 B arm64 Mach-O + 7-group host test (extern C defect caught and fixed), METAL_PUBLISH_CROSS: PASS (164 checks, 0 failures) re-derived from 7 sha256-pinned sources, and the 22-suite host runner + record checker (15 structured areas). NOT a GPU driver, no MMIO/BO/IOVA/firmware/MTLDevice/user client, no device run, no flash, CONFIG_XNU_NATIVE_ADRENO=n, does NOT unblock stage 5; gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-metal-publish.py", revision = "7a06723488a65777273505d48fd24582e54e0e45" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-234.md", result = "ROUND 68 HOST-VERIFIED (CI COMPILE/LINK ONLY, 2026-11-12): CI #234 run 43181798726 completed/success, 27 build steps 0 failed, 3 non-empty artifacts. libEnchiladaAdreno.a = 22 objects sha16 8a487d183190a276; kernel.macho 126070784 B magic cf fa ed fe sha256 d71d6a8b23ed83b321c40af5c68b53d9bdfec13a10f953ae141b705c8fb28acb (changed vs CI #233, 0-byte delta). All 19 round-67 publish exports + 8 round-66 darwin exports + 15 earlier unit names present; llvm-nm 70168 -> 70187 defined symbols (+19, LOST_FROM_233=0); clean kernel.log, intentionally dirty bootstrap. Two independent verifications PASS: scripts/verify-ci-234-adreno.py (60 checks, 0 failures, artifact-derived) and work/tmp/_verify_ci234_dotnet.ps1 (15 checks, 0 failures, .NET REST run/job/artifact metadata). NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-234-adreno.py", revision = "b4ac229a24d2d7cfdb527a6f86684af1882eb25f" },
  { kind = "host", reference = "evidence/stage5-gpu-gen1-backend.md", result = "ROUND 69 HOST-VERIFIED (ADJUDICATION ONLY, 2026-11-12): AdrenoGen1BackendV1 adjudicates the twelve A6XX_GEN1 backend prerequisites with two independent columns - modeled=5 (power-path, gpucc-windows, gmu-cold-boot, hfi-v1-transport, firmware-blobs) vs satisfied=0 - and a tri-state verdict BLOCKED. Encodes the A630 catalog pins (chip 0x06030001/0x06030002, revn 630, gmem 0x00100000, gmu_cgc_mode 0x00020202, prim_fifo_threshold 0x00180000, NO gmu_chipid), the 5-step a6xx_gmu_resume order with core 200000000 / hub 150000000 (A630) vs 200000000 (A740), SPTPRAC 0x778000 enable / 0x778001 disable with poll (val & 0x38) == 0x28 at 1..100 us, the four A630 GMU regions (debug/log/hfi SZ_16K at IOVA 0 + dummy SZ_4K at 0x60000000, total 0xd000, none executable, NO icache/dcache), the CP ring word offsets 0x0800/0x0802/0x0804/0x0806/0x0807, GPU_PAS_ID 13 with the explicit refusal to attribute it to sheng, and a6xx_has_gbif() == false for A630. Three independent verifications PASS: (1) host suite #23 = PASS: enchilada A6XX_GEN1 backend admission contract (9 test groups, 0 failures) inside the 23-suite runner; (2) scripts/verify-enchilada-gen1-backend.py = GEN1_BACKEND_CROSS: PASS (230 checks, 0 failures) over 8 sha256-pinned sources, including that all FIVE local copies of GPU_PAS_ID still agree, and both DTB clock counts (4 GMU / 6 GPU) parsed from the node text; (3) work/tmp/_r69_strict.py strict freestanding compile - arm64 Mach-O 5168 B magic cf fa ed fe, native COFF 4782 B, C++17 host link/run PASS, R69_STRICT: PASS. Record checker: enchilada: 15 structured areas checked. NOT a GPU driver, no device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-gen1-backend.py", revision = "33315e89a031c8426a97d00ce5c7a809ba90d380" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-235.md", result = "ROUND 69 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #235 run 43201433058 compiled and linked the 23rd archive unit AdrenoGen1BackendV1 inside a real XNU kernel build on device head 33315e89a031c8426a97d00ce5c7a809ba90d380 (committed before the dispatch). libEnchiladaAdreno.a reports 23 objects with a sha16 changed vs CI #234 8a487d183190a276; kernel.macho is a Mach-O 64 image whose sha256 changed vs CI #234 d71d6a8b23ed83b321c40af5c68b53d9bdfec13a10f953ae141b705c8fb28acb; all 16 enchilada_gen1_backend_* exports are present and the 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; the real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline; no qcom_scm and no ZAP loader symbol leaked into the image, and stage3=plan survives with no stage3=exec. Object count 22 -> 23 is the structural proof of a genuine rebuild (kernel size remains OBSERVED, not asserted, per rounds 43/45/59). NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=5 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-235-adreno.py", revision = "c673957ff859b98def773b394cf827458986eb93" },
  { kind = "host", reference = "evidence/stage5-gpu-cp-ring.md", result = "ROUND 70 HOST-VERIFIED (ORDER + PAYLOAD + REFUSAL ONLY, 2026-11-12): AdrenoCpRingV1 encodes the six-step A630 CP ring bring-up with its ONE conditional step (the shadow-RPTR write happens only when a shadow BO exists), the exact eight-dword CP_ME_INIT payload with the A7xx shape refused, the barrier-before-CP_RB_WPTR doorbell rule, the WHERE_AM_I vs hardware shadow strategy, and the CP_PROTECT encoding - and it records the FIVE constants no pinned source defines (CP_ME_INIT opcode, type-7 header encoding, MSM_GPU_RB_CNTL_DEFAULT, AXXX_CP_RB_CNTL_NO_UPDATE, ring size), so is_executable() is 0. The round-69 admission row moves cp-ring modeled 0 -> 1 (modeled 5 -> 6) while satisfied stays 0 and the verdict stays BLOCKED. Three independent verifications PASS: (1) host suite #24 = PASS: enchilada A630 CP ring init/doorbell contract (7 test groups, 0 failures) inside the 24-suite runner; (2) scripts/verify-enchilada-cp-ring.py = CP_RING_CROSS: PASS (139 checks, 0 failures) over 3 sha256-pinned sources plus an exhaustive define-scan proving the five macros are used and never defined; (3) work/tmp/_r70_strict.py strict freestanding compile - arm64 Mach-O 4048 B magic cf fa ed fe, native COFF 3703 B, C++17 host link/run PASS, R70_STRICT: PASS. The round-69 cross verifier re-runs green at 230 checks with the new row, and the record checker reports 15 structured areas. NOT a GPU driver, no device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-cp-ring.py", revision = "134c7a493e57b2a897c2794a35d01fc89ae7a227" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-236.md", result = "ROUND 70 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #236 run 43208981056 compiled and linked the 24th archive unit AdrenoCpRingV1 inside a real XNU kernel build on device head 134c7a493e57b2a897c2794a35d01fc89ae7a227 (committed before the dispatch). libEnchiladaAdreno.a reports 24 objects sha256 59e80bd40870c8d8 (CI #235 was 23 objects 588dee59442fc9d9); kernel.macho is 126074880 B Mach-O 64 sha256 9bd2d93910192a9c5d24c9aa9f297ebec85ce934674d50e5c38eaff9719b609e, changed vs CI #235 d266893097d713ce with a ZERO-byte size delta (observed, not asserted). All 11 adreno_cp_ring_* exports are present and the 16 gen1-backend + 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; independent llvm-nm 70203 -> 70214 defined symbols, exactly +11, LOST_FROM_235=0. The real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline; no qcom_scm and no ZAP loader symbol leaked into the image, and stage3=plan survives with no stage3=exec. NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=6 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-236-adreno.py", revision = "9b47bf42c6ff5d5f4c3bccdd9638a4d448b1b445" },
  { kind = "host", reference = "evidence/stage5-gpu-cp-ring.md", result = "ROUND 71 HOST-VERIFIED (re-record of the CP-ring contract after the constant derivation): three of the five round-70 unknowns are now DEFINED - U1 CP_ME_INIT 0x48 (adreno_pm4.xml:248), U2 the type-7 header (adreno_gpu.h:659-665 + PMAR_PARITY :637-643), U5 ring size SZ_32K 0x8000 (msm_gpu.h:311 + sizes.h:26) - while U3/U4 remain open because the AXXX_CP_RB_CNTL_* accessors come from the generated a6xx.xml.h which is absent. adreno_cp_ring_me_init_message() now emits the real nine-dword message 0x70C80008 + the 8-dword payload; can_encode_packet()=1 while is_executable()=0. Host suite #24 reports 10 test groups (3 new: parity/header, message, geometry); CP_RING_CROSS PASS (215 checks, 0 failures) over 7 sha256-pinned sources, with Domain A9 rewritten to check the round-70 claim as HISTORY and to prove U4 residual absence by exhaustive scan; strict freestanding compile arm64 Mach-O 5240 B, R71_STRICT PASS. Two defects were found and fixed inside this work: a capacity guard +2 where header+payload is +1, and three wrong parity expectations that the hand-computed table exposed.", command = "python -X utf8 scripts/verify-enchilada-cp-ring.py", revision = "256caedb61cf881ca683a4b29eccfa15ea62abd0" },
  { kind = "device", reference = "evidence/stage5-gpu-device-tree.md", result = "ROUND 71 DEVICE-SOURCED, READ-ONLY (static board facts only): the A630 board constants were read from the phone OWN live device tree on device 27f4f45d (TWRP recovery, uid=0(root), boot bb93c06b-ea20-4073-8836-fa26c5275240) using getprop/ls/find/od over /proc/device-tree only - no mount, no write, no dd, no reboot, no flash, no GPU register access. Every value matches the host models: chipid 0x06030001, highest-bank-bit 15, ubwc-mode 2, pas-id 0x0d=13 (GPU_PAS_ID 13 now DEVICE-confirmed rather than merely derived), firmware-name a630_zap, GPU 0x05000000+0x40000 / 0x05061000+0x800 / 0x0509e000+0x1000, GMU 0x0506a000+0x30000 and PDC 0x0b200000+0x300000, kgsl SMMU 0x05040000+0x10000, gpucc 0x05090000+0x9000, apps SMMU 0x15000000+0x80000 (plus a second 0x150c2000+0x20 window), SIX GPU clock names vs FOUR GMU clock names as DISTINCT lists, kgsl_3d0_irq SPI 300. scripts/verify-enchilada-device-tree.py re-reads all 17 facts from the live phone and cross-checks them against NativeAdrenoA630HwInit.h / AdrenoBoardInputs.h / AdrenoDomainState.h / NativeAdrenoABI.h: DEVICE_TREE_VERIFY PASS (53 checks, 0 failures). This is a device-sourced STATIC fact set, NOT a device run of the driver: no GPU code executed, no register read, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-device-tree.py", revision = "12dd711d1ee2993295f9bdf70ad599b2e6299f43" },
  { kind = "host", reference = "evidence/stage5-gpu-cp-ring-closed.md", result = "ROUND 72 HOST-VERIFIED (all five CP-ring constants CLOSED): the kernel register generator was pinned and RUN, not guessed. adreno_common.xml:116-123 holds the CP_RB_CNTL FIELDS (BUFSZ 0..5, BLKSZ 8..13, BUF_SWAP 16..17, POLL_EN 20, NO_UPDATE 27, RPTR_WR_EN 31) that a6xx.xml:2282 does not - the file round 71 had not searched. gen_header.py produced a6xx.xml.h (454595 B sha adcd25ca...) and adreno_common.xml.h (17781 B sha 373a5c88...); the generated accessors BUFSZ__MASK 0x3f/shift 0, BLKSZ__MASK 0x3f00/shift 8 and NO_UPDATE 0x08000000 reproduce the module hand-derived CP_RB_CNTL default 0x0000020C and A630 value 0x0800020C exactly, and the generated REG_A6XX_CP_RB_CNTL 0x00000802 confirms the word offset used since round 70. adreno_cp_ring_undefined_open() is 0 and adreno_cp_ring_is_executable() is 1 (derived from the open set, so it flips only when all constants exist). Host suite #24 cp-ring is 11 groups (testRbCntl: field placement, pack/unpack round-trip, the two branches differing EXACTLY in bit 27, refusals); CP_RING_CROSS PASS (251 checks, 0 failures) over 9 sha256-pinned sources; strict freestanding compile arm64 Mach-O 5472 B, R72_STRICT PASS. Every register word is COMPUTABLE; none has been WRITTEN - no ring, no IOVA, no MMIO, no doorbell, no fence, no submit. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-cp-ring.py", revision = "c209f37256cec1c7cf5387cd0470f98046906a24" },
  { kind = "host", reference = "evidence/stage5-gpu-zap-auth.md", result = "ROUND 73 HOST-VERIFIED (PAS/ZAP auth SHAPE + chain inventory, nothing executed): the Qualcomm PAS descriptor is SVC_PIL 0x02 / PAS_AUTH_AND_RESET 0x05 / ARGS(1) / SIP owner (qcom_scm.c:703-731, internal qcom_scm.h:97-102), and those numeric ids are NOT in the public qcom_scm.h - the verifier asserts both the public absence and the internal presence. The result-semantics trap `return ret ?: res.result[0]` is implemented: transport 0 AND PCTX 0 are both required, so a rejected image can never read as authorised. The EIGHT-step chain from adreno_gpu.c:43-156 is encoded with per-step present/reachable; EXACTLY ONE is present (S5 firmware-name, confirmed live) and S1 CONFIG_ARCH_QCOM is marked reachable=0 because XNU has no such Kconfig, so that step IS the SCM transport. adreno_zap_auth_ready() is derived from the count and is 0. Admission row moves zap-auth modelled 0 -> 1 (total 6 -> 7), satisfied stays 0, verdict BLOCKED. Host suite #25 (7 groups); ZAP_AUTH_CROSS PASS (114 checks, 0 failures) over 4 sha256-pinned sources with the eight anchors in strictly increasing source order; strict freestanding compile arm64 Mach-O 6336 B, R73_STRICT PASS; DEVICE_TREE_VERIFY PASS (58 checks) with new live ZAP-node checks confirming qcom,kgsl-3d0 has no zap-shader child while qcom,kgsl-hyp carries memory-region/firmware-name/pas-id. No SCM call, no firmware load, no memremap, no MMIO. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-zap-auth.py", revision = "8bce7292e66eb0ea475c4aa9626c3d9647a9a4e7" },
  { kind = "host", reference = "evidence/stage5-gpu-mdt-parser.md", result = "ROUND 74 HOST-VERIFIED (MDT/ELF32 parser, validated on the REAL device blob): AdrenoMdtV1 reimplements the four Qualcomm rules behind zap-auth S6/S7 from two sha256 pins (mdt_loader.c 12182 B, mdt_loader.h 2179 B): mdt_phdr_valid three independent conditions, get_size as min..ALIGN(max) over VALID phdrs only, the bNN suffix REPLACEMENT, and the metadata/split test ehdr+hash == file size. Parsing the real 6684-byte a630_zap.mdt gives ELF32 LE, e_machine 0xa4 EM_HEXAGON at byte 18, e_phnum 3, exactly ONE valid segment (ph[2] paddr 0x5000 filesz/memsz 1968, RELOCATABLE), region size 4096 and p_filesz sum 8652 - two DIFFERENT numbers, which is the conflation trap the API exposes adreno_mdt_filesz_sum() to catch. The three p_filesz values 148/6536/1968 are exactly the device .b00/.b01/.b02 sizes from the round-38 inventory, and ehdr 148 + hash 6536 = 6684 = the whole file, so this MDT is SPLIT. Verifications: host suite #26 with group 6 running against the real blob (REAL_BLOB bytes=6684, 6 groups, 0 failures); MDT_CROSS PASS (113 checks, 0 failures) with an INDEPENDENT Python reparse confronted with the device manifest; strict freestanding compile arm64 Mach-O 4880 B, R74_STRICT PASS. PARSER ONLY - no storage read, no allocation, no memremap, no SCM, no MMIO; loader_available()=0 and ready() derived so S6/S7 stay present=0 and the admission table does not move. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-mdt.py", revision = "c2746b3bbc63d9154fcaa0e1aa5f136816c74d56" },
  { kind = "host", reference = "evidence/stage5-gpu-smmu-stage1.md", result = "ROUND 75 HOST-VERIFIED (ARM SMMU v2 stage-1 context WORD MODEL): AdrenoSmmuStage1V1 computes the register words round 53 never computed, from 3 sha256 pins (arm-smmu.h 16630 B, arm-smmu.c 67693 B, io-pgtable-arm.c 38934 B). Ten CB byte offsets (SCTLR 0x00 through FSR 0x58), nine SCTLR bits, and the stage-1 default RECOMPUTED from those bits as 0x00001067 little-endian / 0x00001077 big-endian (CFIE|CFRE|AFE|TRE|M|S1_ASIDPNE, with E only for a BE CPU). S2CR: address 0xc00+(n<<2), PRIVCFG 25..24, TYPE 17..16 (TRANS 0/BYPASS 1/FAULT 2), EXIDVALID bit 10, CBNDX 7..0. The six-write plan orders MAIR0, MAIR1, TTBR0, TCR, CONTEXTIDR, SCTLR with SCTLR LAST because SCTLR.M enables translation; TTBR0 is the only 64-bit write. All FOUR inputs are recorded absent with citations: no page table, no ASID allocator, streams still in the firmware BYPASS handoff (round 53: Busy=10, id0=4c017e4c) so a non-faulting stream resolves to BYPASS and never TRANS, and CX measured DOWN (round 35: cx=0x00005ff4 BIT(31) clear). missing()==0xf and ready() derived so it is 0. Admission row moves kgsl-smmu-stage1 modeled 0 -> 1 (total 7 -> 8), satisfied stays 0, BLOCKED. Host suite #27 (6 groups); SMMU_STAGE1_CROSS PASS (117 checks, 0 failures); strict freestanding compile arm64 Mach-O 3496 B, R75_STRICT PASS. A first-draft defect was caught by the self-check: privcfg=1 was expected to equal the bare mask 0x03000000, but PRIVCFG is GENMASK(25,24) so 1 is 0x01000000 and only 3 fills the mask; both are now tested. No MMIO, no mapping, no page table. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-smmu-stage1.py", revision = "56d65299d339d27b011d110347df4780ac8f56fe" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-237.md", result = "ROUND 76 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #237 run 43242359273 compiled and linked the three units the kernel CI had never seen - AdrenoZapAuthV1 (73), AdrenoMdtV1 (74), AdrenoSmmuStage1V1 (75) - on device head 30b39fa1f864. libEnchiladaAdreno.a reports 27 objects sha256 a9b461e4f1378731 (CI #236 was 24 objects 59e80bd40870c8d8); kernel.macho is 126099456 B Mach-O 64 sha256 40d6fe4a5fdde2cdeaf0062a3c016346df01bf3d620dff339e60cc76c450918e, changed vs CI #236 9bd2d93910192a9c with a +24576 B delta (observed, not asserted). All 35 new exports present (11 zap-auth + 12 mdt + 12 smmu-stage1) and the 11 cp-ring + 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; independent llvm-nm 70214 -> 70261 defined symbols, exactly +47, LOST_FROM_236=0. The real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline. A verifier defect was found and fixed here: the qcom_scm boundary check fired on a CITATION string (round 73 anchor text) rather than a symbol, because CI #236 never contained the zap-auth unit; it now requires the callable forms _qcom_scm_ and qcom_scm_call( to be absent. NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=8 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-237-adreno.py", revision = "8c5c370fff31aa6a85ec1353ad5fe0f1aa0ed25d" },
  { kind = "host", reference = "evidence/stage5-gpu-va-map.md", result = "ROUND 77 HOST-VERIFIED (GPU VA aperture DERIVATION model): AdrenoVaMapV1 encodes the chain that produces the GPU VA aperture and proves it terminates in a RUNTIME register read, from 3 sha256 pins (adreno_gpu.c 29592 B, arm-smmu.c 67693 B, a6xx_gmu.c 48981 B). CHAIN: max(16 MiB, aperture_start)..aperture_end (adreno_gpu.c:224-225) <- (1<<ias)-1 (arm-smmu.c:828) <- ias = smmu->va_size (:735) <- id_size_to_bits(ID2.UBS) (:1904-1905) <- an ID2 READ AT PROBE (:1879). That last line is why the GPU VA range is not a board constant: it depends on the silicon ID2.UBS field, so no document or DTS can supply it and deriving it needs a powered SMMU. Both geometry shapes are implemented (plain TTBR0 and the TTBR1 variant at :824-828). The GMU own space (a6xx_gmu.c:1283, 0x0..0x80000000) is kept strictly distinct from the GPU space (adreno_gpu.c:227, named gpu) via adreno_va_gmu_end_is_gpu_end(), and the verifier recomputes the TTBR0 aperture for ias in {32,36,40,48} and asserts none equals 0x80000000. THREE blockers derived into ready()==0: ID2.UBS unread, no powered SMMU (round 35 cx=0x00005ff4), no page-table walker (round 75). DEPENDENCY EXPOSED: B1 is downstream of the SMMU CX requirement, so board-va-map sits behind kgsl-smmu-stage1 - CX must come first of FIVE inputs, not four. Admission row board-va-map modeled 0 -> 1 (total 8 -> 9), satisfied 0, BLOCKED. Host suite #28 (7 groups); VA_MAP_CROSS PASS (98 checks, 0 failures); strict freestanding compile arm64 Mach-O 2680 B, R77_STRICT PASS. A first-draft defect was caught: the test was labelled 6 groups while it contains 7; corrected upward and the verifier now prints the actual names on mismatch. No MMIO, no page table, no mapping. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-va-map.py", revision = "af9d70e5aab4109243c8cfae59e18b8580962a26" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-238.md", result = "ROUND 78 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #238 run 43252926421 compiled and linked AdrenoVaMapV1, the 28th archive unit and the first archive change since CI #237, on device head 7569b2cd4a11. libEnchiladaAdreno.a reports 28 objects sha256 f90f1a3267b71762 (CI #237 was 27 objects a9b461e4f1378731); kernel.macho is 126099456 B Mach-O 64 sha256 bdfdc5a05881b663b0450d283bbb015c6f8a590eb6e8aa2fe4ffd287d0d90cc5, changed vs CI #237 40d6fe4a5fdde2cd with a ZERO-byte size delta (the 28th object linked without growing the image, per rounds 43/45/59). All 10 va-map exports present and the 12 smmu-stage1 + 12 mdt + 11 zap-auth + 11 cp-ring + 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; independent llvm-nm 70261 -> 70271 defined symbols, exactly +10, LOST_FROM_237=0, the 10 new names being precisely the AdrenoVaMapV1 exports. The real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline. A verifier defect was caught BEFORE the dispatch: verify-enchilada-gen1-backend.py still asserted zap-auth modeled=0, six items modelled, a 23-unit archive and an old PASS suffix, so four checks were failing while every other verifier passed - the same hand-coded-count drift class as round 77 phase 5; fixed to 27 units and nine modelled with the summary line corrected. NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=9 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-238-adreno.py", revision = "a09368c930fe9c6aade458265a3ab786dbd9504c" },
  { kind = "device", reference = "evidence/stage5-gpu-kgsl-sysfs.md", result = "ROUND 79 DEVICE-SOURCED, READ-ONLY (the live vendor kgsl driver own view): read over adb cat from /sys/class/kgsl/kgsl-3d0 on device 27f4f45d in TWRP, no mount, no write, no ioctl, no MMIO, no flash. gpu_model = Adreno630v2 - a string present in NEITHER the pinned Linux v6.12 catalog (one revn-630 entry, chip ids 0x06030001/0x06030002, ADRENO_6XX_GEN1) NOR the vendored Mesa table (one GPUId(630)); it is a downstream kgsl naming convention and the port does NOT map it onto a catalog entry or claim what v2 implies. New board facts: 7 GPU frequency levels 710/675/596/520/414/342/257 MHz with max_gpuclk 710 MHz, and the ordering trap that gpu_available_frequencies DESCENDS while devfreq/available_frequencies ASCENDS the same seven values. Idle-but-live, measured: gpuclk 257 MHz under the msm-adreno-tz governor, gpu_busy_percentage 0, gpubusy 0/0, gpu_clock_stats seven zeros, reset_count 0, preemption 0, ifpc 1 with ifpc_count 0x0, sptp_pc 1, popp 0, idle_timer 80, usesgmem 1, hwcg 1 - so the GPU is BOUND AND HEALTHY and has NEVER BEEN DRIVEN. Also dev 233:0, OF_NAME qcom,kgsl-3d0, OF_FULLNAME /soc/qcom,kgsl-3d0@5000000, OF_COMPATIBLE qcom,kgsl-3d0 + qcom,kgsl-3d, and power/runtime_status unsupported with both runtime times 0. scripts/verify-enchilada-kgsl-sysfs.py re-reads all 28 attributes live and confronts them with both pinned sources: KGSL_SYSFS_VERIFY PASS (61 checks, 0 failures). NOT a device run of port code: no GPU register, no MMIO, no PAS, no SMMU, CONFIG_XNU_NATIVE_ADRENO=n, windows all-zero, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-kgsl-sysfs.py", revision = "dd9949801fce54b01bdf180e20cfa9ac70ad7c0e" },
  { kind = "device", reference = "evidence/stage5-gpu-kgsl-globals.md", result = "ROUND 80 DEVICE-SOURCED (kgsl globals under a briefly-mounted debugfs, then removed and verified removed): /sys/kernel/debug/kgsl/globals lists 17 global objects with REAL sizes - setstate 4096, gpu-qdss 262144, memstore 32768, scratch 4096, FOUR complete ring sets (pagetable_desc 4096 + profile_desc 4096 + ringbuffer 32768 each) and profile 196608 - and EVERY ONE has IOVA 0x0000000000000000-0x0000000000000000, every range degenerate (start == end). active_cnt = 0 with an EMPTY ctx/ directory, five log_level_* all 3, and debug/strict_memory = 0 so the zeros are not an accounting artefact. Mount state before: 0 debugfs mounts and 0 entries; after umount: 0 and 0, UMNT_RC=0 - device restored exactly. This MEASURABLY confirms rounds 53 and 77: the target streams sit in firmware BYPASS (Busy=10, id0=4c017e4c) so nothing reaches translation, and with no programmed kgsl SMMU there is no aperture - the all-zero table is what that looks like from the driver side. Combined with round 79 reset_count 0 / clock_stats all zero / busy 0 %, the GPU is bound, fully allocated and NEVER DRIVEN. Consequence for board-va-map: the reference implementation is itself at zero, so there is no working VA layout to copy - sharper than absent. The CAUSE of the zeros is deliberately NOT claimed: deferred-until-submit and never-programmed both fit, and deciding needs a submission this round did not make (a state change needing its own authorization). scripts/verify-enchilada-kgsl-globals.py re-reads the table live (mounting then ALWAYS unmounting in a finally block and asserting the mount count restored): KGSL_GLOBALS_VERIFY PASS (53 checks, 0 failures). No GPU register, no MMIO, no ioctl, no submission, no flash, CONFIG_XNU_NATIVE_ADRENO=n, windows all-zero, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-kgsl-globals.py", revision 