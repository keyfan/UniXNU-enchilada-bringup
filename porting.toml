  '[ROUND 103 2026-11-13, HOST-VERIFIED + ARMED, NOT YET RUN ON HARDWARE] Probe stage 6 adds the two GR0 words the SMMU chain had never read, behind the SAME stage-4 fail-closed gate and the SAME mapped kgsl window, so it is a READ-ONLY prefix of a sequence already proven safe on this phone. WHY: upstream arm_smmu_device_cfg_probe() reads ID0 (P2:1758) then ID1 (P2:1853) then ID2 (P2:1879); round 94 joined at the LAST word and measured ias=48, but the round-102 ASID allocator still reported ready()==0 with BOTH bits of its missing-input mask set (kAdrenoAsidInputId1: ID1.NUMCB/NUMS2CB never read; kAdrenoAsidInputCaller: no domain owner), and the round-86 contract still composed stage-1 words with coherent_walk(0u,0u) because ID0.CTTW (kAdrenoIommuMissingId0Word) was never read either. Stage 6 reads ID0 at 0x20 and ID1 at 0x24 exactly ONCE each, in addition to the single stage-4 ID2 read at 0x28 - three dereferences of one mapped window, two dsb sy barriers, no second gate, no second mapping. WHAT IT COMPUTES: coherent_walk is now adreno_iommu_coherent_walk(id0, 0u), where the firmware flag 0 is a FACT rather than a guess (sdm845.dtsi defines adreno_smmu at 0x5040000 with NO dma-coherent property), and stage-1 words are RE-COMPOSED with that measured value instead of the stage-4 zero. ID1 is decoded ONLY by extension of AdrenoSmmuAsidV1: kAdrenoAsidId1Nums2cbMask=0x00ff0000 / Shift=16 (P1:62 GENMASK(23,16)), plus adreno_asid_s2cb_count_from_id1() and adreno_asid_init_from_id1(), which decode BOTH NUMCB and NUMS2CB from one word and DELEGATE to adreno_asid_init() so the P2:1867-1870 impossible-number-of-S2-context-banks refusal stays in one place. It then takes ONE first-fit bank and emits the four derived tuple fields (TTBRn_ASID, CONTEXTIDR, S2CR_CBNDX, CBAR) in a labelled stage6=id1 row cached in its own replay buffer. HOST VERIFICATION: check-enchilada-adreno-probe.py 18/18 (adreno_asid_* are covered by the not-u.startswith(adreno_) allow rule, every cast stays volatile, no store through a pointer); verify-enchilada-smmu-asid.py 99/99; verify-enchilada-probe-stage3/4/5 40/40, 49/49, 40/40 (mask widened 1..5 to 1..6 in three verifiers, board.toml enchilada-adreno=6 at the SAME 18 bytes so the command line stays 970/1000, and the stage-4 verifier now counts exactly three GR0 reads); new verify-enchilada-probe-stage6.py. build-enchilada-adreno.py sources tuple also gained the missing AdrenoSmmuAsidV1 provenance stem that round 102 left out. HONEST BOUNDARY: NO device run, NO flash, NO reboot, no register has been read by stage 6 yet - the code is ARMED, the row is UNKNOWN until a boot with enchilada-adreno=6. Reading ID1 does NOT clear the ASID missing-input mask: ready() is still derived from that mask and STAYS 0, because a real domain OWNER (I2) and a populated LPAE page table (I1) are still absent; a register word is not a domain and does not allocate a bank for a caller. The admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified, and this does NOT unblock stage 5 or make Adreno render. NEXT: device run to read the stage6=id1 row; then the LPAE page table (TTBR1 geometry, 4 KiB, ias=48) and a real bank owner are what stand between this and a programmed context.',
  '[ROUND 101 2026-11-13, DEVICE-VERIFIED] ias IS MEASURED. The port read the SMMU ID2 register on the phone for the first time, and the value it had only ever held as an argument is now a measurement: ID2 = 0x00007511 -> ias = 48. THE ROW, verbatim from the log window: stage4=id2 id2=00007511 ver=2 ias_ok=1 ias=48 ipa=36 pa=36 oas2=36 ptfs4k=1 vmid16=0 words_ok=1 plan_ok=1 tcr=a0100080 tcr2=00038011. DECODED INDEPENDENTLY and matching the probe line field for field: IAS[3:0]=1 -> ipa 36; OAS[7:4]=1 -> pa 36; UBS[11:8]=5 -> va_size 48 through the DEFAULT arm of arm_smmu_id_size_to_bits() (P2:1727-1744) - the exact collapsing branch round 83 recorded as a trap, which this device lands in; PTFS_4K/16K/64K all set at BIT(12/13/14); VMID16 BIT(15) clear. NOTE THE DISAGREEMENT, which is the load-bearing detail: IAS=1 gives ipa=36 while UBS=5 gives va_size=48, because on a v2 SMMU the VA size comes from UBS and the IPA size from IAS. They are different fields and this part reports different values for them. CROSS-CHECK THAT MAKES IT A MEASUREMENT RATHER THAN TWO COINCIDENCES: TCR2 = 0x00038011 is SEP(0x7<<15) | PASIZE(1 = 36-bit) | AS(BIT4), exactly what round 83 derived for oas 36 with an AArch64 context; and TCR = 0xa0100080 is the TTBR1 geometry - EPD0 set, EPD1 clear, TG1 at bits[31:30] reading 2 = 4 KiB, and T1SZ = 0x10 = 16 in the HIGH half so 64-16 = 48 = ias. Reading T0SZ from the low half in this geometry returns 0 and would look like ias 64, so the halves must be identified before either is believed. Re-deriving round 83 own function for (ias=48, coherent_walk=0, ttbr1=1) yields 0xa0100080 EXACTLY. The measured word and the composed word agree. HOW THE DEVICE GOT HERE - five consecutive runs, each removing ONE wrong precondition that review had accepted: (98) verdict=3 refused-cx-down, because the gate used the CX word sampled BEFORE stage 5 raised the rail; (99) verdict=4 refused-clocks-off, because the probe hard-coded clocks_enabled=0 although the executor had enabled them; (100a) verdict=5 refused-unmapped, because the window was mapped INSIDE the permitted branch while the gate checks mapped-ness, a deadlock; (100b) verdict=7 refused-no-stream, because stream_faults was folded into the READ gate although upstream reads ID2 at probe with nothing bound; (101) stage4=id2. THE LAST ONE WAS SETTLED BY READING UPSTREAM, NOT BY REASONING: a mechanical count over arm_smmu_device_cfg_probe() between its start and the ID2 read finds ZERO occurrences of fault, BYPASS, BUSY or wait, and the smr/s2cr mentions in that span are array allocation plus smmu->s2crs[i] = s2cr_init_val, i.e. initialisation. The stream condition is real but belongs to PROGRAMMING a context, so it now lives in a separate adreno_iommu_admit_program() gate that DELEGATES to assess(); the verifier asserts the read gate does not mention stream_faults and the program gate must. SAFETY: the reboot-to-TWRP guarantee was established BEFORE the run and re-armed after, because the misc BCB is one-shot. Measured this round: fastboot reboot recovery returns to TWRP even with a BCB of all zeroes, which is why it is now the default reboot path; the BCB is kept for XNU-initiated resets and the byte-identical boot_a backup (md5 ca8ddd7a5af345636cad8c5bf645fee2) is the third line. BOUNDARY: this proves ONE thing - ID2 reads as 0x00007511 with CX up and decodes to ias=48. It does NOT prove a stage-1 context works: that still needs an ASID allocator and a populated LPAE table, and words_ok/plan_ok are about COMPUTING words, not writing them. The admission table stays modeled=9 / satisfied=0 / BLOCKED; the kgsl-smmu-stage1 row needs four inputs and this round obtained one.',
  '[ROUND 95 2026-11-13, HOST-VERIFIED + ARMED, NOT YET RUN ON HARDWARE] Probe stage 5 closes the gap that rounds 51-64 left: the power-up chain WAS derived and HAD an executor, but every layer spoke through callbacks and NOTHING in the tree ever connected them to a mapped window. AdrenoPowerUpBackendV1 says so in its own header - it performs MMIO through the caller callbacks and does nothing else: it maps nothing, owns no window, enables no regulator, runs no TrustZone PAS, and has no IOKit caller of its own - and round-64 AdrenoCallerV1 has the same boundary. So the executor was real and UNREACHABLE. Stage 5 is that caller, and it is the ONLY stage of this probe that writes. WHAT IT DOES: (1) re-checks the SAME gpucc_window_is_safe() gate stages 1-4 use, and binds the window only AFTER it passes - a probe that trusted an earlier stage opinion of the mapping would be one refactor away from writing through a wrong base; (2) binds AdrenoGpuccWindowV1 over the mapping already held and SUPPLIES A REAL DELAY via IODelay, because the window refuses an MMIO triple with a NULL delay for a stated reason: the GDSC plan genuinely waits between its collapse-clear write and the status poll, and a spin loop calibrated by guesswork would be worse than no loop; (3) obtains the bounded MMIO triple from the window so every write goes through its bounds rather than a raw pointer; (4) runs the caller with board facts, not magic - armed=1, gxpd_present=1, rcg_enabled=0 because this port has never started gmu_clk_src, core_rate_hz=200000000 from a6xx_gmu.c, strict_gx=0 because GX-OFF is the measured steady state; (5) reports THREE INDEPENDENT VERDICTS SEPARATELY: up_status (did the five ops execute), precheck_status (does the CX word now say up), and cx_before/cx_after/cx_on_after so the DELTA is visible. THE DISTINCTION THAT MATTERS MOST: Up() succeeding means THE WRITES HAPPENED; whether CX is now ON is a different question answered by re-reading the status word. Round 35 measured cx=0x00005ff4 with BIT(31) clear and NOTHING proves the collapse clear raises it on this boot path, so up=Ok with cx_on_after=0 is a perfectly possible outcome - collapsing those two into one success flag is exactly how a port invents a fact, and the row keeps them apart. SAFETY PRESERVED: no direct store anywhere (the verifier parses the comment-stripped source and separately asserts the only pointer casts remain the two volatile window types); no invented delay loop; mmio.write32( never appears because the triple is passed by pointer into the caller; default-off via enchilada-adreno=5 with the mask stage < 1u || stage > 5u so a future stage cannot slip in unnoticed. WIRING: board.toml moves enchilada-adreno=4 to =5 (same byte count), joined command line stays 970/1000. VERIFICATION: check-enchilada-adreno-probe.py 18/18 (strict C++17 arm64, callback-only writes, no unexpected undefined symbols); verify-enchilada-probe-stage5.py 38 checks; stage3 40/40 and stage4 updated to the monotonic mask; verify-gpuprobe-device-2.py refined because its literal WRITE-not-in-src test could not survive the stage that legitimately writes - it now asserts the precise property instead. Full tree 63/64, the 64th needing a 40-hex revision by design.',
  '[ROUND 94 2026-11-13, HOST-VERIFIED + FAIL-CLOSED, NOT YET RUN ON HARDWARE] Probe stage 4 is the port FIRST kernel call path that can read the SMMU ID2 register, and it exists because three earlier rounds each closed a door. Round 77 proved the chain ias = smmu->va_size <- arm_smmu_id_size_to_bits(ID2.UBS) <- a PROBE-TIME READ (P2:1879, :1904-1905), so no document or DTS can supply the value. Round 85 then measured that userspace cannot reach it either: the kernel is built with CONFIG_DEVMEM NOT SET, so a mknod-ed /dev/mem fails ENXIO, AND the iommu debugfs tree is only io-pgtable + tests with find -maxdepth 2 returning one file, so there is no address-size node to read. That combination forces the read INTO the kernel. WHAT STAGE 4 DOES, IN ORDER: (1) it reads the GPUCC CX status word at 0x05091540 (already done by stages 1/2 in the same poll, BIT(31)); (2) it asks the round-86 contract gate with a struct adreno_iommu_gate_inputs whose cx_status_word IS THAT MEASURED WORD, never a constant, and adreno_iommu_assess() returns one of eight named verdicts; (3) if not permitted it logs a row that NAMES the verdict and stops, with no mapping and no read - deliberately, because a refusal and a read that returned 0x00000000 mean completely different things and conflating them is how a port invents a fact; (4) if permitted it maps ADRENO_BOARD_KGSL_SMMU_BASE (0x05040000) FOR THE FIRST TIME, reads GR0_ID2 at byte 0x28 exactly ONCE, issues dsb sy, and hands the word to the contract: adreno_iommu_id2_decode() for the field positions and version gate, adreno_iommu_va_size() for ias (refused if implausible), and adreno_iommu_stage1_words() to mix that REAL ias into round 83 TCR/TCR2 - the first time that chain closes with a measured input. Nothing in the probe re-derives an ID2 bit position; the verifier asserts that with negative checks, because round 81 proved what happens when a module and its verifier drift. EXPECTED OUTCOME ON THE CURRENT DEVICE, STATED UP FRONT: round 35 measured CX DOWN (cx=0x00005ff4, BIT(31) clear) and nothing since has powered the GPU domain, so the expected single-boot row is stage4=refused verdict=N(cx-down or clocks-off) cx=00005ff4 cx_on=0 clocks=0. That is the DESIGN SUCCEEDING, not the read failing: it proves the gate is fail-closed. A stage4=id2 row requires CX up, which requires the genpd/clock backend that does not exist yet. WIRING: board.toml gains enchilada-adreno=4 (18 bytes plus separator) against the MEASURED 49 bytes of headroom, the joined command line now 970/1000; the stage is default-off (absent argument = no-op) and the mask accepts only 1/2/3/4, which the stage-3 verifier now pins so a new stage cannot silently widen what the boot arg accepts. WHAT IT DOES NOT PROVE: it has not been flashed or run, it reads no register today, and even when it runs a CX-DOWN board will refuse - which says nothing about ID2, only about CX. The word itself is still unknown.',
  '[ROUND 85 2026-11-13, DEVICE-SOURCED] This round was authorised to act on the phone and spent that authorisation measuring what a device-side action can now ACHIEVE - and the answer bounds the project. TWO FINDINGS. (1) THE DEBUGFS SURFACE IS UNCHANGED and still lacks ias: debugfs mounted briefly, read, then unmounted with the removal VERIFIED (BEFORE_MOUNTS=0, MOUNT_RC=0, UMNT_RC=0, AFTER_MOUNTS=0, AFTER_ENTRIES=0); /sys/kernel/debug/iommu/io-pgtable/pages is 92, re-confirming round 82 exactly; the WHOLE iommu tree is just io-pgtable and tests, and find -maxdepth 2 returns ONE file (pgtable/pages) - there is NO va_size, address_size, addr_size, ias or id2 node anywhere, and NO kgsl-specific node (both tests/ entries are apps_iommu_*). The 92 pages prove tables exist; they do NOT say how wide the VA space is. The kgsl SMMU is still bound to arm-smmu alongside apps-smmu and its modalias is still of:Narm,smmu-kgslT<NULL>Cqcom,smmu-v2. (2) THE DECISIVE ONE: CONFIG_DEVMEM IS NOT SET. The read-only route to ID2 at 0x05040028 would be /dev/mem, and this kernel does not provide it: the config reads # CONFIG_DEVMEM is not set and # CONFIG_STRICT_DEVMEM is not set. The distinction is the whole finding - STRICT_DEVMEM unset would mean devmem is present but unrestricted, whereas DEVMEM itself unset means the char device does not exist at all, and a node made with mknod is accepted by the filesystem (test -e /dev/mem says YES) but every access fails: dd if=/dev/mem yields No such device or address, i.e. ENXIO. That is the kernel saying the driver behind major 1 minor 1 was never compiled in, and it cannot be fixed with root, an SELinux context or a different mknod mode - only with a DIFFERENT KERNEL. This closes the last read-only route to ias on a stock boot. CONSEQUENCE, AND IT IS THE POINT: this converts we have not read ias yet into ias is NOT READABLE from this boot image, which is stronger and more useful - it removes a false hope instead of creating one. ias can now only be obtained by code running IN the kernel, i.e. by XNU driving the SMMU itself, which is exactly what prerequisite kgsl-smmu-stage1 means and why it reads satisfied=0. A TWRP-side SMMU probe is NOT a shortcut: it would need a kernel with DEVMEM=y or a kernel module, and both are new kernels rather than new commands. NOTHING WAS INFERRED FROM THE VANISHED BOOT LOG: dmesg holds only about two minutes of wall clock (uptime 151128 s, ring buffer starting at the same battery-vote lines), so the arm-smmu probe messages from boot - which WOULD have printed Stage-1: N-bit VA -> N-bit IPA at arm-smmu.c:1940, the very number ias is - are gone. Counting zero smmu lines in dmesg is therefore NOT evidence of absence; only the config and the failed read are, and that distinction is stated rather than glossed. The round-28 gated GPUCC GDSC read of 0x05091540 / 0x05091010 is blocked by the SAME ceiling, so it was not attempted once Finding 2 made it provably impossible.',
  '[ROUND 84 2026-11-13, CI-VERIFIED] CI #239 DONE green: the round-83 module compiles under the kernel own clang and links into a real XNU image. This was the FIRST CI run since #238 (round 78), and the gap it closed was specific: rounds 79-82 were read-only evidence and prose, while round 83 added real code (AdrenoSmmuCtxWordV1.c) that had passed a 10-group host suite and a 264-check cross-verifier but had NEVER been through the kernel clang. Host verification of code is not a compile proof - a file can be correct freestanding C11 here and still fail under XNU headers, the -mgeneral-regs-only regime, or the archive link. RUN (derived from the REST API, not guessed): run 43335691372 (#239), workflow_dispatch, created 2026-11-13T00:16:06Z, updated 00:32:07Z, completed/success, workflow head edb0593a, device ref main @ ab99958f (round-83 phase 4), job build 27 steps 0 failed. ARTIFACTS: the archive line reads PASS: libEnchiladaAdreno.a (29 objects, sha256 d140c2aa89bc89aa); CI #238 was 28 objects sha16 f90f1a3267b71762. The object count ROSE BY ONE and the sha16 CHANGED, which together are structural proof that the round-83 unit compiled AND joined the link - a cached artifact cannot produce that pair. kernel.macho is 126,103,552 B vs CI #238 126,099,456 B, so +4,096 B: the 29th object needed an extra page. That is the OPPOSITE of rounds 43/45/59/78, where a new object linked WITHOUT growing the image, and the two directions together are why SIZE IS NEVER THE PROOF here - the object count, the changed archive sha16, the kernel sha256 and the symbol inventory carry the weight. prelink.log records Experimental candidate: 126103552 bytes; executable bytes unchanged; runtime unqualified, so the payload stage accepted the larger image. kernel.log (36,731,153 B) is CLEAN: no Undefined symbols, no Error 1. kernel-bootstrap.log (37,040,468 B) is the INTENTIONALLY failing baseline and still carries both, plus _native_verified_root_probe - retained as differential evidence, because a green log means something only next to the red one. ALL EIGHTEEN adreno_smmu_ctx_* exports are present in the linked image (id_size_to_bits, mair, mair0, mair1, tcr, tcr2, cbar, cba2r, ttbrn, ttbrn_checked, plan, plan_writes, round75_writes, missing, input_name, input_anchor, ready, verify), and every earlier unit survived: round-77 va-map, round-75 smmu-stage1 (whose SOURCE this round left byte-identical), round-70 cp-ring, round-73 zap-auth, round-74 mdt, round-69 gen1-backend, round-67 publish, round-66 darwin-kmd and the round-65-and-earlier symbols. BOUNDARY ASSERTED, NOT ASSUMED: the linked image contains NO _writel(, _readl(, _IOServiceOpen, _IOConnectCallMethod, _qcom_scm_call or adreno_zap_shader_load symbol, while stage3=plan steps=%u is still present and stage3=exec is still ABSENT. A citation string may NAME a register; a symbol may not - that distinction is the difference between a contract module and a driver. HONEST LIMIT OF THIS RUN: it uploads ONE log PER ARCHIVE (archive-23-build-enchilada-adreno.log), NOT one per object, so there is NO AdrenoSmmuCtxWordV1.log; the verifier asserts that absence explicitly instead of inventing a file that does not exist. This run proves the module is kernel-clang clean and linkable and proves NOTHING about the phone: no context programmed, no page table allocated, no ASID assigned, no ID2 read, no CX power-up. The admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED, because a compile proof of a word-derivation contract satisfies no prerequisite.',
  '[ROUND 83 2026-11-13, HOST-VERIFIED] The round-75 six-write stage-1 plan is an INCOMPLETE SUBSEQUENCE of the upstream nine, and the omission is measurable rather than stylistic. Round 75 answers in what ORDER the context-bank registers are written and never computes a VALUE: adreno_smmu_stage1_plan() takes tcr, mair0 and mair1 from the caller, which is why its own test passes tcr = 0x1234, a number that appears in no pinned source. The larger defect is the register SET. Upstream arm_smmu_write_context_bank() (arm-smmu.c:566-653) writes NINE registers in order - CBA2R, CBAR, TCR2, TCR, TTBR0, TTBR1, S1_MAIR0, S1_MAIR1, SCTLR - and round 75 emits SIX, missing FOUR that are not optional: CBAR (GR1 0x0+n<<2, P2:594-612) which DECLARES the stage-1 type, without which the page-table format is never stated; CBA2R (GR1 0x800+n<<2, P2:581-592) whose VA64 selects the 64-bit table format; TCR2 (CB 0x10, P2:619-620) carrying PASIZE and SEP, written BEFORE TCR because TCR decides how ASID[15:8] is read (P2:614-618); and TTBR1 (CB 0x28, P2:630-632), because stage-1 writes BOTH TTBRs and BOTH carry the ASID. Round 75 also writes TTBR0 with NO ASID although P2:540-548 places FIELD_PREP(ARM_SMMU_TTBRn_ASID, cfg->asid) in bits 63..48 - so the plan cannot be repaired by better arguments, it is missing registers. Conversely round 75 writes CONTEXTIDR UNCONDITIONALLY, while upstream writes it in exactly ONE place, arm-smmu.c:625, inside the cfg->fmt == ARM_SMMU_CTX_FMT_AARCH32_S branch; the AArch64 branch (P2:628-633) writes no CONTEXTIDR at all and the ASID reaches the bank through TTBRn_ASID. Verified mechanically: the pinned file contains exactly one ARM_SMMU_CB_CONTEXTIDR write site. NET: 6 -> 9 writes, FOUR registers added and ONE dropped, so the net delta (+3) is deliberately SMALLER than the register delta (+4) and BOTH numbers are now exposed as code (round75_writes() = 6, plan_writes() = 9) and asserted, so the gap stays measurable instead of becoming folklore. WHY SEVEN ROU