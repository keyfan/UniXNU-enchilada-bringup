  '[ROUND 71 2026-11-12, DEVICE-SOURCED + HOST-VERIFIED] Two things, both of which correct or confirm earlier rounds. (1) ROUND 71 DEFEATED THREE FIFTHS OF ROUND 70 OWN CLAIM about the CP ring. Round 70 recorded five constants as undefined and named the next step: pin the headers that might define them. That step was taken and three closed: U1 CP_ME_INIT opcode = 0x48 (registers/adreno/adreno_pm4.xml:248), U2 the type-7 header encoding (adreno/adreno_gpu.h:659-665 OUT_PKT7 over PM4_PARITY :637-643 with the 0x9669 LUT, CP_TYPE7_PKT 0x70000000 from adreno_pm4.xml:234), U5 the ring size = SZ_32K = 0x8000 (msm_gpu.h:311 + include/linux/sizes.h:26). U3 MSM_GPU_RB_CNTL_DEFAULT became a FORMULA (msm_gpu.h:314-316 over AXXX_CP_RB_CNTL_BUFSZ/BLKSZ) whose two field accessors remain generated-header-only, and U4 AXXX_CP_RB_CNTL_NO_UPDATE is STILL open for the same reason: those AXXX_ accessors live in the GENERATED a6xx.xml.h, which is absent from the tree, and the pinned a6xx.xml:2282 declares CP_RB_CNTL as a bare reg32 with NO bitfields. Four new sha256 pins make it checkable (sizes.h 1723 B, msm_gpu.h 20026 B, adreno_gpu.h 18946 B, adreno_pm4.xml 85907 B). CONSEQUENCE: the module now ENCODES A REAL PACKET - adreno_cp_ring_me_init_message() emits nine dwords 0x70C80008 0x0000002F 0x00000003 0x20000000 0 0 0 0 0, the first byte sequence this port could produce that a CP might in principle consume - while adreno_cp_ring_is_executable() STAYS 0, because the RING cannot be programmed without the RB_CNTL word. The asymmetry is explicit: can_encode_packet()=1, is_executable()=0. Two load-bearing arithmetic facts are now asserted: the opcode is MASKED to 7 bits (not truncated into the parity bit at 23), and parity(0) is 1 because 0x9669 bit 0 is set - a popcount would say 0 and produce a wrong header on every packet. (2) FIRST DEVICE-SOURCED BOARD-FACT READ: the A630 board constants were read from the PHONE OWN live device tree (/proc/device-tree, read-only, no mount, no write, no 