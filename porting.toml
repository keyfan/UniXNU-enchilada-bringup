  'CORRECTION (2026-11-08): the old inputs/next_action claim that WCN3990 uses an "MHI boot path" / "ath10k/WCN3990 MHI" was WRONG. MHI belongs only to sheng WCN7850 PCIe. WCN3990 SNOC boots via QRTR/WLFW QMI service lookup + qcom_scm_assign_mem SCM MSA permissions + an SDM845-specific msleep(20) XPU hack (Linux v6.12 qmi.c). Kept as [HISTORICAL, corrected] below for traceability.',
