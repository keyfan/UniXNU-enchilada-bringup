    'FINAL STATE (2026-11-08): stage 3 layer 3d-beta is DONE (CI #211 SUCCESS -> payload construction -> two pre-flash checks -> flash -> two independent device verifications -> evidence/backlight211mode4.md + porting.toml device evidence -> push 794cead5 -> remote byte audit PASS). NEXT: continue the official unixnu.com 8-stage order with the still-open areas: memory (ArmSmmu4K), input (ShengHidInput / ShengNovatekTouch), gpu (Adreno A630, NOT Adreno740), network (WCN3990 Wi-Fi/Bluetooth), audio (WCD9340 / MAX98927), cellular (QcomBaseband), power (bq27441 / PMI8998 battery + cpufreq). Each item needs its own two verifications + CI + device evidence.','Stage 3 layer 3d-beta: COMPLETE (CI #211 SUCCESS + backlight211mode4 device-verified st=7 + evidence pushed as 794cead5). HISTORICAL NEXT-step note (superseded 2026-11-08): git add + push + remote byte audit; dispatch CI under real macOS/Xcode 26.6 headers to confirm the 8-object archive + late-objcopy compile (CI #207 lesson: local stubs are not ABI-equivalent); then flash enchilada-backlight=4 and device-verify runtime metaclass lookup + CoreBrightness acceptance (stats[1] request count) + measured brightness change with two independent verifiers + evidence + porting.toml device evidence + push. Then continue the official 8-stage order: stage 1/2 ArmSmmu4K, 4 input, 5 GPU Adreno A630, 6 Wi-Fi/Bluetooth/baseband, 7 audio/battery/cpufreq.', 'Stage 3 layer 3d-alpha: DONE (HOST-VERIFIED). HISTORICAL NEXT-step note (superseded by CI #211 + backlight211mode4): implement EnchiladaBacklight : IOService in package/EnchiladaBacklight.cpp (build tree maps package/ to kits/enchilada/ per scripts/unixnu/tree.py:71-75) - class name MUST NOT be AppleARMBacklight (duplicate metaclass panic int-229); slot-7 impersonate() (copy vtable, getMetaClass answers OSMetaClass::getMetaClassWithName(OSSymbol::withCString(...))) using the DEVICE-VERIFIED metaclass target from evidence/applearmbacklight-metaclass.md; publish IODisplayParameters.brightness with min=0/max=1023/value via msm_dsi_control_publish() (NOT sheng 2047) plus backlight-control=true and NativeSandboxGrantProcess=backboardd; setProperties() FadePeriod 16.16 -> msm_dsi_control_request() and a 16 ms fade work loop -> msm_dsi_control_step() -> the DEVICE-VERIFIED msm_dsi_brightness_send() path (backlight210mode3, st=5); LATE-OBJECT objcopy + a probe calling preModLoad/native_backlight_static_init/postModLoad (BacklightProbe.cpp, build-native-legacy-display.py:315-321) as the 8th archive object. Then CI compile under real XNU headers, flash, and device-verify runtime metaclass lookup + CoreBrightness acceptance with two independent verifiers + evidence + push (xian heyan zai shangji). Then continue the official 8-stage order: stage 1/2 ArmSmmu4K, 4 input, 5 GPU Adreno A630, 6 Wi-Fi/Bluetooth/baseband, 7 audio/battery/cpufreq.', 'Stage 3 layer 3d PREREQUISITE: DONE (HOST-VERIFIED, 2026-11-07) - AppleARMBacklight metaclass confirmed present (stock kernelcache + CI #210 built kernel), no ADT backlight nub and no built-in instance clash; reproducible via scripts/check-enchilada-applearmbacklight-metaclass.py. NEXT (layer 3d, not yet done): implement EnchiladaBacklight : IOService - class name MUST NOT be AppleARMBacklight (duplicate metaclass panic int-229); slot-7 impersonate() (copy vtable, getMetaClass answers OSMetaClass::getMetaClassWithName), publish IODisplayParameters.brightness with min=0, max=1023, value + backlight-control=true + NativeSandboxGrantProcess="backboardd", setProperties() with FadePeriod 16.16 and a 16 ms fade work loop, LATE-OBJECT objcopy (--remove-section=__DATA,__mod_init_func --globalize-symbol=__GLOBAL__sub_I_<name>.cpp) and a probe that calls preModLoad/native_backlight_static_init/postModLoad; drive the already DEVICE-VERIFIED msm_dsi_brightness_send() path (backlight210mode3, st=5) instead of sheng GENI-I2C KTZ8866; handle 2047-vs-1023 scale. Then CI compile under real macOS/Xcode XNU headers, flash, and device-verify runtime metaclass lookup + CoreBrightness acceptance with two independent verifiers + evidence + push (xian heyan zai shangji). After layer 3d, continue the official 8-stage order: stage 1/2 ArmSmmu4K, 4 input, 5 GPU Adreno A630, 6 Wi-Fi/Bluetooth/baseband, 7 audio/battery/cpufreq.', "Stage 3 layer-3 prerequisite mode-2: DONE and DEVICE-VERIFIED (evidence/backlight209mode2.md, CI #209, test-cycle.py backlight209mode2 --wait-return 900). 510 L rows st=4, verdict=Bypass, translation OFF confirmed on the real device before any DMA (先核验再上机). The CMD-DMA physical-vs-IOVA blocker is RESOLVED: a CPU physical address is safe, so layer 3 can proceed with dc civac + dsb sy cache maintenance and msm_dsi_cmd_send().", "Stage 3 layer 2.5 device verification: DONE (evidence/backlight208.md, CI #208, test-cycle.py backlight208 --wait-return 900). All 510 L rows st=3 with coherent live DSI0 register values; the read-only probe proved XNU can map and read the firmware-owned DSI0 before any write (先核验再上机).", "Stage 3 layer 3: implement the sheng AppleARMBacklight OS-facing IOService shape (class name, IODisplayParameters.brightness / backlight-control / backboardd properties, 16 ms fade work loop, late-object linkage) and the transmit-side runtime probe that allocates a DMA-coherent buffer with IOBufferMemoryDescriptor (physical addresses now device-confirmed safe, backlight209mode2), does dc civac + dsb sy cache maintenance, and calls msm_dsi_cmd_send() on brightness writes. Then dispatch CI (kernel+payload), flash, and verify a real brightness change on device.", "Stage 3 layer 3a: DONE (HOST-VERIFIED, commit pending) — MsmDsiBrightness.c/.h pure-C brightness-transmit orchestrator with the 32-bit DMA_BASE gate, dc civac/dsb sy clean hook, and L st=5 publish; 6th archive object; 7 new host test groups. layer 3b (since DONE, HOST-VERIFIED): a gated enchilada-backlight=3 C++ shim that allocates a physically-contiguous IOBufferMemoryDescriptor (retry/relocate until (phys>>32)==0 so the 32-bit gate passes), maps DSI0 at 0xae94004, supplies the dc civac + dsb sy clean callback, and calls msm_dsi_brightness_send(); keep mode 1/2 byte-identical. Then CI-compile under real macOS/Xcode XNU headers, flash, and verify a real brightness change (先核验再上机). Layer 3d (EnchiladaBacklight : IOService, NEVER named AppleARMBacklight, slot-7 impersonation + late-object) follows after the transmit path is device-proven.", "Stage 3 layer 3b: DONE (HOST-VERIFIED, NOT CI-compiled / NOT flashed) — enchilada-backlight=3 first-write shim with one-shot msm_dsi_brightness_send, device-proven IOKit DMA allocation, dc civac/dsb sy clean, CPU-spin delay, and the 32-bit DMA_BASE gate; mode 1/2 byte-identical (static diff vs f566e737). NEXT (layer 3c, not yet done): dispatch CI to compile the 6-object archive + shim under real macOS/Xcode XNU headers (CI #207 taught local stubs are insufficient), verify kernel.macho contains the mode-3 symbols, register a test-cycle.py variant, build the enchilada-backlight=3 payload (997/1000 B with --drop sheng-gpu-addon=1), flash and read the L st=5 / st=-2 / st=-4 row with two independent device verifiers, then write evidence/backlight*mode3.md + porting.toml device evidence + push. If the device reports st=-2 (AddrTooHigh) the kernel allocation is above 4 GiB and the NativeUfs.cpp:1092-1161 stage-1 SMMU IOVA fallback is required before any brightness packet. Layer 3d (EnchiladaBacklight : IOService, NEVER named AppleARMBacklight, slot-7 impersonation + late-object) follows only after the transmit path is device-proven.", "Stage 3 layer 3b: DONE and DEVICE-VERIFIED (evidence/backlight210mode3.md, CI #210, test-cycle.py backlight210mode3 --wait-return 900). 510 L rows st=5, one DCS brightness packet (level 512) committed to the DSI0 CMD-DMA engine with rc=0; the 32-bit DMA_BASE gate passed with a physical address 0xae01a000 below 4 GiB, so no stage-1 SMMU IOVA fallback is required. NEXT (layer 3d, not yet done): implement the sheng-shaped OS-facing IOService — class EnchiladaBacklight : IOService (NEVER named AppleARMBacklight: duplicate metaclass panics, int-229), slot-7 impersonation via OSMetaClass::getMetaClassWithName(OSSymbol::withCString(\"AppleARMBacklight\")), publish IODisplayParameters.brightness {min,max=1023,value} + backlight-control=true + NativeSandboxGrantProcess=\"backboardd\", setProperties() with FadePeriod 16.16 and a 16 ms fade work loop, late-object linkage (--remove-section=__DATA,__mod_init_func --globalize-symbol=__GLOBAL__sub_I_<name>.cpp). Open UNCERTAIN risks to settle on device: whether AppleARMBacklight's metaclass is loaded on enchilada/iPadOS-17.7.11 (IOObjectConformsTo / CoreBrightness / backboardd are closed source) and the 2047-vs-1023 scale mismatch (sheng KTZ8866 kMaxLevel=2047 vs enchilada DCS 1023 — publish max=1023 or scale, never feed 2047 to dsi_dcs_set_brightness_large). Each item still needs its own CI compile + device verification + evidence (每步两次验证、先核验再上机). Then continue the official 8-stage order: stages 1/2/4/5/6/7 remaining components (ArmSmmu4K, touch, GPU Adreno A630, Wi-Fi WCN3990 / Bluetooth / baseband, audio/battery/cpufreq)."]
