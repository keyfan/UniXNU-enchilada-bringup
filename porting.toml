  '[ROUND 72 2026-11-12, HOST-VERIFIED] ALL FIVE CP-ring unknowns from round 70 are now DEFINED, and adreno_cp_ring_is_executable() returns 1 for the first time. Round 71 named the next step exactly: the accessors are a BUILD ARTIFACT, so REGENERATE them with the kernel own generator rather than fetch a header. That was done, and it corrected TWO round-71 assumptions. CORRECTION 1: CP_RB_CNTL fields are NOT in a6xx.xml at all - round 71 correctly observed that a6xx.xml:2282 declares CP_RB_CNTL as a bare reg32 with NO bitfields, but then concluded the fields were unreachable; they live in adreno_common.xml:116-123, which a6xx.xml IMPORTS at :7 and round 71 simply had not searched (BUFSZ 0..5, BLKSZ 8..13, BUF_SWAP 16..17, POLL_EN 20, NO_UPDATE 27, RPTR_WR_EN 31). CORRECTION 2: rather than hand-compute, the kernel registers/gen_header.py was pinned (27564 B sha 465b340f...) and ACTUALLY RUN twice - gen_header.py --rnn a6xx --xml adreno/a6xx.xml c-defines -> a6xx.xml.h (454595 B sha adcd25ca...) and the same over adreno_common.xml -> adreno_common.xml.h (17781 B sha 373a5c88...). The generated accessors are exact: REG_AXXX_CP_RB_CNTL 0x1c1, AXXX_CP_RB_CNTL_BUFSZ__MASK 0x3f __SHIFT 0, BLKSZ__MASK 0x3f00 __SHIFT 8, NO_UPDATE 0x08000000, RPTR_WR_EN 0x80000000, and REG_A6XX_CP_RB_CNTL 0x00000802. Feeding BUFSZ(12) | BLKSZ(2) through those masks gives 0x0000020C and ORing the generated NO_UPDATE gives 0x0800020C - byte-for-byte what the module computes by hand, so the generation both CLOSES U3/U4 and INDEPENDENTLY CHECKS the derivation instead of restating it. Two facts round 71 could only assert are now anchored: the generated REG_A6XX_CP_RB_CNTL 0x802 confirms the WORD offset used since round 70, and the generated NO_UPDATE confirms bit 27. State now: open set 0, CP_RB_CNTL default 0x0000020C, A630 (no extended APRIV) 0x0800020C, CP_ME_INIT message 9 dwords from 0x70C80008, ring size 0x8000. is_executable() is DERIVED from the open set, not hard-coded, so it flips only wh