[[area]]
id = "memory"
status = "implemented"
components = ["ArmSmmu4K", "RamBlock"]
paths = ["drivers/NativeUfs/SmmuTakeover.h", "drivers/NativeDwc3/Dwc3SmmuPlan.h", "drivers/NativeDwc3/tests/Dwc3Smmu.cpp", "drivers/NativeRamBlock/**", "enchilada-facts/parsed.txt"]
inputs = ["apps_smmu 0x15000000 size 0x80000; firmware SMMU bypass slots: UFS stream 0x60 at slot 6 / bank 4, DWC3 stream 0x740 with observed SMR 0x80000740; 6 GiB DRAM, 4.75 GiB owned memory, kt_fixed_zones=120."]
configuration = ["[payload] dram_size=0x180000000; CONFIG_NATIVE_RAM_BLOCK=y; CONFIG_NATIVE_CS_HASH_CACHE=y; SMMU takeover adopts firmware bypass entries rather than creating stage-1 contexts."]
procedure = ["SmmuTakeover.h:141 (fixed) compares the observed p.smr, not a recomputed ufsSmmuSmr(stream, mask); Dwc3SmmuPlan.h is a permissive planner that saves the UEFI-written SMR including mask bits; configureUfsSmmu validates SMR/S2CR/CB before touching hardware."]
findings = ["console178/179/183 stalled at kStageSmmu with 'firmware UFS stream mapping changed': the shared check recomputed the SMR, which differs for DWC3 because UEFI writes mask bits (b4q.dts:20074 qcom,handoff-smrs).", "console183 exposed the real cause with 'now=00800020/52000042 cb=6f6f6c6c' (ASCII text): inspect()'s OSSharedPtr<IOMemoryMap> was local, so the gadget thread read an unmapped VA. Maps were promoted to file scope (gGccMap/gCoreMap/gPhyMap/gSmmuMap), matching ArmCpu.cpp:159 and NativeUfs.cpp:1089.", "A regression assert in Dwc3Smmu.cpp pins the mask-bit case; a Python simulation reproduced the old failure and the new pass."]
completion = ["Every handoff region is accounted for, each enabled DMA engine (UFS, DWC3) accesses its allocated range with a documented cache policy, and the firmware bypass entries are proven unchanged on device."]
limits = ["ArmSmmu4K is listed as the intended component but the kit is NOT yet linked; the current implementation reuses the firmware bypass slots. No stage-1 context, no DVM/ATS, no per-stream isolation is implemented.", "The device-verified console206 line 'G smmu slot=6 bank=4 plan=80000740/00000004 now=80000740/00000004 cb=000000e0' proves the bypass is intact, not that a new SMMU driver works."]
next_action = ["Stage 1 follow-up: link the ArmSmmu4K kit (components.toml:399-415, rev 83969cd87450, deps empty) into [kernel] archives, add a dedicated stage-1 context for the display scanout bank, and re-run the SMMU regression on device."]
evidence = [
