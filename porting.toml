  '[ROUND 70 2026-11-12, HOST-VERIFIED] AdrenoCpRingV1 closes the cp-ring gap the round-69 admission table named, as the 24th unit of libEnchiladaAdreno.a and the 24th host suite - and, with equal care, records what CANNOT be closed from pinned sources. DERIVED (3 sha256 pins: a6xx_gpu.c, a6xx.xml, a6xx_gpu.h): the SIX-step ring bring-up order CP_SQE_INSTR_BASE := sqe_iova -> CP_RB_BASE := rb[0] iova -> CP_RB_CNTL (bare default under extended APRIV, else | AXXX_CP_RB_CNTL_NO_UPDATE) -> CP_RB_RPTR_ADDR := shadowptr() ONLY when a shadow BO exists -> CP_SQE_CNTL := 1 -> CP_ME_INIT (a6xx_gpu.c:1118-1153); the exact EIGHT-dword CP_ME_INIT payload 0x0000002f, 0x00000003 (multiple hardware contexts), 0x20000000 (error detection) then five zeros (:616-635), with the A7xx shape (CP_THREAD_CONTROL first, count 7, :641-688) encoded as a REFUSAL; the doorbell rule wptr latched under the lock, then mb(), THEN one CP_RB_WPTR store (:82-89) - the barrier-before-store order is the content of the function; the WHERE_AM_I vs hardware shadow strategy (:61-66, :1123-1131); and the CP_PROTECT encoding (a6xx_gpu.h:59-69). REFUSED AS UNDEFINED, and this is the load-bearing half: FIVE constants that every pinned source USES and NONE defines - CP_ME_INIT numeric opcode (the pinned XML register databases contain ZERO occurrences of CP_ME_INIT, because it is an opcode and not a register), the type-7 packet header encoding (OUT_PKT7 is called at :616, defined in an unpinned header), MSM_GPU_RB_CNTL_DEFAULT value, AXXX_CP_RB_CNTL_NO_UPDATE bit, and the ring size MSM_GPU_RINGBUFFER_SZ (absent from every pinned file). adreno_cp_ring_is_executable() therefore returns 0: without a header there is no packet, and without an opcode there is nothing to put in it. CONSEQUENCE FOR THE TABLE: exactly ONE row moves, cp-ring modeled 0 -> 1, so modeled goes 5 -> 6, while satisfied STAYS 0 and the verdict STAYS BLOCKED - the order is known, a packet cannot be encoded, and calling that satisfied would be the dishonest way to move the table. A defect found in this round own first draft and fixed is recorded in the doc: the capacity guard demanded six slots even when no shadow BO existed and only five steps were emitted; the self-check caught it and both directions are now asserted.',
  '[ROUND 71 2026-11-12, DEVICE-SOURCED + HOST-VERIFIED] Two things, both of which correct or confirm earlier rounds. (1) ROUND 71 DEFEATED THREE FIFTHS OF ROUND 70 OWN CLAIM about the CP ring. Round 70 recorded five constants as undefined and named the next step: pin the headers that might define them. That step was taken and three closed: U1 CP_ME_INIT opcode = 0x48 (registers/adreno/adreno_pm4.xml:248), U2 the type-7 header encoding (adreno/adreno_gpu.h:659-665 OUT_PKT7 over PM4_PARITY :637-643 with the 0x9669 LUT, CP_TYPE7_PKT 0x70000000 from adreno_pm4.xml:234), U5 the ring size = SZ_32K = 0x8000 (msm_gpu.h:311 + include/linux/sizes.h:26). U3 MSM_GPU_RB_CNTL_DEFAULT became a FORMULA (msm_gpu.h:314-316 over AXXX_CP_RB_CNTL_BUFSZ/BLKSZ) whose two field accessors remain generated-header-only, and U4 AXXX_CP_RB_CNTL_NO_UPDATE is STILL open for the same reason: those AXXX_ accessors live in the GENERATED a6xx.xml.h, which is absent from the tree, and the pinned a6xx.xml:2282 declares CP_RB_CNTL as a bare reg32 with NO bitfields. Four new sha256 pins make it checkable (sizes.h 1723 B, msm_gpu.h 20026 B, adreno_gpu.h 18946 B, adreno_pm4.xml 85907 B). CONSEQUENCE: the module now ENCODES A REAL PACKET - adreno_cp_ring_me_init_message() emits nine dwords 0x70C80008 0x0000002F 0x00000003 0x20000000 0 0 0 0 0, the first byte sequence this port could produce that a CP might in principle consume - while adreno_cp_ring_is_executable() STAYS 0, because the RING cannot be programmed without the RB_CNTL word. The asymmetry is explicit: can_encode_packet()=1, is_executable()=0. Two load-bearing arithmetic facts are now asserted: the opcode is MASKED to 7 bits (not truncated into the parity bit at 23), and parity(0) is 1 because 0x9669 bit 0 is set - a popcount would say 0 and produce a wrong header on every packet. (2) FIRST DEVICE-SOURCED BOARD-FACT READ: the A630 board constants were read from the PHONE OWN live device tree (/proc/device-tree, read-only, no mount, no write, no register access) and every one matches the host models: qcom,chipid = 0x06030001, qcom,highest-bank-bit = 15, qcom,ubwc-mode = 2, qcom,kgsl-hyp qcom,pas-id = 0x0d = 13 (so GPU_PAS_ID 13 is now DEVICE-confirmed, not merely derived), firmware-name a630_zap, the GPU 0x05000000+0x40000 / cx_dbgc 0x05061000+0x800 / cx_misc 0x0509e000+0x1000 windows, the GMU 0x0506a000+0x30000 + PDC 0x0b200000+0x300000 windows, kgsl SMMU 0x05040000+0x10000, gpucc 0x05090000+0x9000, apps SMMU 0x15000000+0x80000, the SIX GPU clock names and the FOUR GMU clock names as DISTINCT lists on real hardware (the round-51 distinction, now measured), and kgsl_3d0_irq = SPI 300.',
  '[ROUND 72 2026-11-12, HOST-VERIFIED] ALL FIVE CP-ring unknowns from round 70 are now DEFINED, and adreno_cp_ring_is_executable() returns 1 for the first time. Round 71 named the next step exactly: the accessors are a BUILD ARTIFACT, so REGENERATE them with the kernel own generator rather than fetch a header. That was done, and it corrected TWO round-71 assumptions. CORRECTION 1: CP_RB_CNTL fields are NOT in a6xx.xml at all - round 71 correctly observed that a6xx.xml:2282 declares CP_RB_CNTL as a bare reg32 with NO bitfields, but then concluded the fields were unreachable; they live in adreno_common.xml:116-123, which a6xx.xml IMPORTS at :7 and round 71 simply had not searched (BUFSZ 0..5, BLKSZ 8..13, BUF_SWAP 16..17, POLL_EN 20, NO_UPDATE 27, RPTR_WR_EN 31). CORRECTION 2: rather than hand-compute, the kernel registers/gen_header.py was pinned (27564 B sha 465b340f...) and ACTUALLY RUN twice - gen_header.py --rnn a6xx --xml adreno/a6xx.xml c-defines -> a6xx.xml.h (454595 B sha adcd25ca...) and the same over adreno_common.xml -> adreno_common.xml.h (17781 B sha 373a5c88...). The generated accessors are exact: REG_AXXX_CP_RB_CNTL 0x1c1, AXXX_CP_RB_CNTL_BUFSZ__MASK 0x3f __SHIFT 0, BLKSZ__MASK 0x3f00 __SHIFT 8, NO_UPDATE 0x08000000, RPTR_WR_EN 0x80000000, and REG_A6XX_CP_RB_CNTL 0x00000802. Feeding BUFSZ(12) | BLKSZ(2) through those masks gives 0x0000020C and ORing the generated NO_UPDATE gives 0x0800020C - byte-for-byte what the module computes by hand, so the generation both CLOSES U3/U4 and INDEPENDENTLY CHECKS the derivation instead of restating it. Two facts round 71 could only assert are now anchored: the generated REG_A6XX_CP_RB_CNTL 0x802 confirms the WORD offset used since round 70, and the generated NO_UPDATE confirms bit 27. State now: open set 0, CP_RB_CNTL default 0x0000020C, A630 (no extended APRIV) 0x0800020C, CP_ME_INIT message 9 dwords from 0x70C80008, ring size 0x8000. is_executable() is DERIVED from the open set, not hard-coded, so it flips only when the constants genuinely all exist.',
  '[ROUND 73 2026-11-12, HOST-VERIFIED] The zap-auth row is now MODELLED (0 -> 1; total modelled 6 -> 7), still satisfied=0, verdict BLOCKED. What was added is the SHAPE of the Qualcomm PAS call and the EIGHT-STEP chain around it, from four sha256 pins (public qcom_scm.h 5203 B, qcom_scm.c 53938 B, the INTERNAL qcom_scm.h 4977 B, adreno_gpu.c 29592 B). THE CALL (qcom_scm.c:703-731): svc QCOM_SCM_SVC_PIL 0x02, cmd QCOM_SCM_PIL_PAS_AUTH_AND_RESET 0x05, arginfo QCOM_SCM_ARGS(1), args[0] = the peripheral id, owner ARM_SMCCC_OWNER_SIP. A FINDING WORTH KEEPING: those numeric ids are NOT in the PUBLIC qcom_scm.h - only the function signatures are (:75/:79/:80/:81) - so a port that pinned only the public header would have the call and none of the wire values; the verifier asserts that absence AND the presence in the internal header so the distinction cannot rot. THE TRAP (qcom_scm.c:729): `return ret ?: res.result[0];` - a zero SCM TRANSPORT return is NOT success. If the secure world rejects the image, res.result[0] is non-zero and the call FAILED. Getting this backwards would report a rejected ZAP image as authorised, and since ZAP gates GPU access that is the worst possible lie here; adreno_zap_result_semantics() therefore requires BOTH to be zero. THE CHAIN (adreno_gpu.c:30-174, in strict source order): S1 CONFIG_ARCH_QCOM (:43), S2 the zap-shader child node (:48), S3 memory-region (:54), S4 of_address_to_resource (:61), S5 firmware-name (:82), S6 qcom_mdt_get_size (:111), S7 qcom_mdt_load (:141/:148), S8 pas_auth_and_reset (:156) with the -EOPNOTSUPP quiet fallback (:162). EXACTLY ONE OF THE EIGHT IS PRESENT TODAY, and it is S5 firmware-name - the live device tree read confirmed this directly: qcom,kgsl-3d0 has NO zap-shader child while qcom,kgsl-hyp carries memory-region, qcom,firmware-name and qcom,pas-id, which is why S5 exists while S2/S3/S4 do not. S1 is modelled with reachable=0 rather than present=0, because it is NOT merely not-yet-built: XNU is not Linux, there