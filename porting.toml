# OnePlus 6 (enchilada, SDM845) structured porting record.
# Follows https://unixnu.com/zh/porting/drivers (8-stage dependency order) and
# https://unixnu.com/zh/porting/records (format 2 record, schema_version = 1).
# Validated with: python3 work/UniXNU/scripts/porting-record.py check --device work/UniXNU-enchilada
schema_version = 1

[device]
name = "enchilada"
soc = "SDM845"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 6 (SDM845): iPadOS 17.7.11 userland booted with a CDC-ACM USB serial console; display/input/storage/CPU stages are in place, GPU, Wi-Fi, audio, battery and DSI-DCS backlight remain to be adapted."

