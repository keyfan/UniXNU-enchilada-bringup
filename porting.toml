  '[ROUND 103 2026-11-13, HOST-VERIFIED + ARMED, NOT YET RUN ON HARDWARE] Probe stage 6 adds the two GR0 words the SMMU chain had never read, behind the SAME stage-4 fail-closed gate and the SAME mapped kgsl window, so it is a READ-ONLY prefix of a sequence already proven safe on this phone. WHY: upstream arm_smmu_device_cfg_probe() reads ID0 (P2:1758) then ID1 (P2:1853) then ID2 (P2:1879); round 94 joined at the LAST word and measured ias=48, but the round-102 ASID allocator still reported ready()==0 with BOTH bits of its missing-input mask set (kAdrenoAsidInputId1: ID1.NUMCB/NUMS2CB never read; kAdrenoAsidInputCaller: no domain owner), and the round-86 contract still composed stage-1 words with coherent_walk(0u,0u) because ID0.CTTW (kAdrenoIommuMissingId0Word) was never read either. Stage 6 reads ID0 at 0x20 and ID1 at 0x24 exactly ONCE each, in addition to the single stage-4 ID2 read at 0x28 - three dereferences of one mapped window, two dsb sy barriers, no second gate, no second mapping. WHAT IT COMPUTES: coherent_walk is now adreno_iommu_coherent_walk(id0, 0u), where the firmware flag 0 is a FACT rather than a guess (sdm845.dtsi defines adreno_smmu at 0x5040000 with NO dma-coherent property), and stage-1 words are RE-COMPOSED with that measured value instead of the stage-4 zero. ID1 is decoded ONLY by extension of AdrenoSmmuAsidV1: kAdrenoAsidId1Nums2cbMask=0x00ff0000 / Shift=16 (P1:62 GENMASK(23,16)), plus adreno_asid_s2cb_count_from_id1() and adreno_asid_init_from_id1(), which decode BOTH NUMCB and NUMS2CB from one word and DELEGATE to adreno_asid_init() so the P2:1867-1870 impossible-number-of-S2-context-banks refusal stays in one place. It then takes ONE first-fit bank and emits the four derived tuple fields (TTBRn_ASID, CONTEXTIDR, S2CR_CBNDX, CBAR) in a labelled stage6=id1 row cached in its own replay buffer. HOST VERIFICATION: check-enchilada-adreno-probe.py 18/18 (adreno_asid_* are covered by the not-u.startswith(adreno_) allow rule, every cast stays vo