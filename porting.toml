  'Stage 5 HOST-VERIFIED scope actually completed: A630 identity + cross-generation gap + firmware/backend blockers encoded in tested pure C (10 host tests, strict compile), PLUS the A6XX GEN1 hw_init register map derived by the upstream pin-before-derive method (3 more host tests, 2 independent verifications, 8 SHA-pinned sources), PLUS the Round 21 GPU board-input study (dedicated kgsl SMMU, single-cell SIDs 0/2,1/4/5, 5 more host tests, 2 independent repo verifiers ENCHILADA_GPU_BOARD_EXTRACT: PASS 18 checks + ENCHILADA_GPU_BOARD_CROSS: PASS 21 checks). No device, CI, firmware, register-read or SMMU-context claim.',
