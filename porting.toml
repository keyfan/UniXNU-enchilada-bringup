  "evidence/stage7-power-feasibility.md",
  "evidence/stage7-gauge-device.md",
  "evidence/stage7-gauge-multiboot.md",
  "scripts/build-enchilada-cpufreq.py",
  "scripts/build-sheng-platform-power.py",
  "kits/enchilada-pmgr/ShengPlatformPower.cpp",
