  '[ROUND 80 2026-11-12, HONEST BOUNDARY] The only state change this round made was a debugfs mount, and it was removed and the removal VERIFIED (0 mounts and 0 entries before and after; UMNT_RC=0). No GPU register read or write, no MMIO, no ioctl, no submission, no firmware load, no PAS, no SMMU programming, no flash, no reboot, no read-write mount, no file created on the device; m39510 NOT exercised. The all-zero IOVA table is recorded as an OBSERVATION and deliberately NOT explained: two causes fit it equally and this round refuses to pick one without a submission attempt, which it did not make. CONFIG_XNU_NATIVE_ADRENO=n, A630 client GPU windows stay all-zero, the four hard blockers of docs/porting/gpu.md section 1 remain open; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 79 2026-11-12, HONEST BOUNDARY] READING A SYSFS ATTRIBUTE IS NOT ISSUING MMIO, and it is certainly not this port own code executing on the GPU. The interface exists because the VENDOR kernel brought the GPU up; nothing from this port ran. gpu_busy_percentage 0, gpu_clock_stats all zero and reset_count 0 confirm the GPU has never rendered anything on this boot. No GPU register was read or written, no ioctl, no MMIO, no firmware load, no PAS, no SMMU programming, no flash, no reboot, no mount; m39510 NOT exercised. The Adreno630v2 string is recorded as an OBSERVATION and deliberately NOT mapped onto a catalog entry - whether v2 implies different behaviour would need its own evidence, and asserting it from a model string would be exactly the guess this port has spent seventy-nine rounds refusing. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
