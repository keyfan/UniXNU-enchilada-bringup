[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["drivers/NativeMobileDisplay/**", "scripts/build-native-legacy-display.py", "package/BootLog.c", "enchilada-facts/parsed.txt", "drivers/NativeDsiBacklight/**", "scripts/check-enchilada-dsi-backlight-host.py", "drivers/NativeMsmDsi/**", "scripts/build-enchilada-msm-dsi.py", "scripts/check-enchilada-msm-dsi-host.py", "configs/enchilada_defconfig", "scripts/check-enchilada-archives-linked.py", "drivers/NativeMsmDsi/MsmDsiSession.c", "drivers/NativeMsmDsi/MsmDsiSession.h", "drivers/NativeMsmDsi/tests/msm-dsi-session-test.cpp", "package/EnchiladaBacklightProbe.cpp", "package/BootProgress.c", "package/BootProgressStubs.c", "package/BootProgressStubs.symbols"]
inputs = ["Samsung sofef00 AMOLED DSI panel, 1080x2280 @ 60 Hz, 4 lanes RGB888; vendor DTS node qcom,mdss_dsi_samsung_sofef00_m_cmd declares qcom,mdss-dsi-bl-pmic-control-type = bl_ctrl_dcs, brightness 0..1023 (0x3ff); Linux v6.12 panel-samsung-sofef00.c uses mipi_dsi_dcs_set_display_brightness_large().", "Linux v6.12 drivers/gpu/drm/drm_mipi_dsi.c and include/video/mipi_display.h: DCS long write 0x39 with tx [0x51, b>>8, b&0xff]; WRITE_CONTROL_DISPLAY 0x53/0x20 and WRITE_POWER_SAVE 0x55/0x00 are 0x15 short writes."]
configuration = ["CONFIG_NATIVE_LEGACY_DISPLAY=y via scripts/build-native-legacy-display.py; CPU-rendered UI (no GPU), sheng-vsync=60 as on fajita (not sheng's 120); BootLog.c:78 has a weak extern for native_backlight_stats[10] and prints the L st=... line.", "Stage 3 layer 2: board.toml [kernel] archives adds build-enchilada-msm-dsi.py (libEnchiladaMsmDsi.a, two pure-C objects). A link-wiring audit found board.toml archives only order the build (work/UniXNU/scripts/unixnu/kernel.py archive_plan); the kernel link force-loads board archives solely through CONFIG_XNU_EXTRA_LD_ARCHIVES (build-xnu-4k-baseline.sh:755 appends ${XNU_EXTRA_LD_ARCHIVES}; kernel.py xnu_env maps CONFIG_XNU_* -> XNU_* and substitutes {tree}). The defconfig line listed only 3 archives, so libEnchiladaMsmDsi.a was CI-compiled but NOT linked. Fixed by adding -Wl,-force_load,{tree}/build/enchilada-msm-dsi/libEnchiladaMsmDsi.a; scripts/check-enchilada-archives-linked.py now guards that every enchilada runtime builder is force-loaded.", "Stage 3 layer 2.5 (READ-ONLY runtime probe, default off): enchilada-backlight=1 makes BootProgress.c monitor() call enchilada_backlight_poll() 1 Hz; the shim (package/EnchiladaBacklightProbe.cpp, compiled into the same force-loaded libEnchiladaMsmDsi.a) maps 0xae94004 via strong armcpu_map_physical (ArmCpu.cpp:207) and reads seven live config registers through pure-C MsmDsiSession.c, publishing them into a STRONG native_backlight_stats[10] that overrides the weak char[4096] stub (BootProgressStubs.c:65) so the L st= row becomes non-zero on device. enchilada_backlight_poll() has weak_import declaration in BootProgress.c, a weak stub in BootProgressStubs.c/.symbols, and a strong definition in the archive. NO controller register is written and NO DMA is triggered in this stage (先核验再上机: prove XNU can map/read the firmware-owned controller before any packet)."]
procedure = ["build-native-legacy-display.py compiles NativeMobileDisplay.cpp and the GOP presenter into libNativeLegacyDisplay; the frame is composed on the CPU and swapped through the UEFI framebuffer.", "Stage 3 layer 1 (host-only, not yet linked into the kernel): scripts/check-enchilada-dsi-backlight-host.py compiles drivers/NativeDsiBacklight/DsiDcs.c as C11 and runs drivers/NativeDsiBacklight/tests/dsi-dcs-test.cpp as C++17 with -Wall -Wextra -Werror, asserting the exact DCS wire bytes. Command: python scripts/check-enchilada-dsi-backlight-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/dsi-host-out (requires TMP/TEMP=work/tmp/ctmp).", "Stage 3 layer 2: scripts/build-enchilada-msm-dsi.py compiles MsmDsiCmd.c + DsiDcs.c (the startup.o flags + -mgeneral-regs-only) into libEnchiladaMsmDsi.a for [kernel] archives. Host verification: python scripts/check-enchilada-msm-dsi-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/msm-dsi-host-out (requires TMP/TEMP=work/tmp/ctmp AND tools/llvm-mingw/bin on PATH for the runtime DLLs). MsmDsiCmd.c turns the layer-1 packet into the MSM CMD DMA buffer and emits prepare (CTRL|=CMD_MODE_EN|ENABLE) -> commit (DMA_BASE, DMA_LEN, TRIG_DMA=1, wmb) -> STATUS0 busy poll -> restore CTRL.", "Link-wiring guard: python scripts/check-enchilada-archives-linked.py verifies every build-enchilada-*.py board archive has a matching -Wl,-force_load entry in configs/enchilada_defconfig (CONFIG_XNU_EXTRA_LD_ARCHIVES), all {tree}-relative and duplicate-free. Run it after any new board archive is added.", "Stage 3 layer 2.5: scripts/build-enchilada-msm-dsi.py now compiles 4 objects (mixed C/C++: EnchiladaBacklightProbe.cpp with IOPlatformExpert.cpo.json flags; MsmDsiSession.c/MsmDsiCmd.c/DsiDcs.c with startup.o.json + -mgeneral-regs-only) into the same force-loaded libEnchiladaMsmDsi.a. Host verification: python scripts/check-enchilada-msm-dsi-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/msm-dsi-host-out runs both the layer-2 transport (7 groups) and the layer-2.5 read-only session (3 groups, FakeDsi asserts writes==0). C++ shim syntax: clang++ -std=c++17 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror. On device enchilada-backlight=1 must be set in the boot args; the 1 Hz poll then publishes L st=3 req=<polls> lvl=0 a=<CTRL> b=<STATUS0> xerr=<CMD_DMA_CTRL> irq=<TRIG_CTRL> ea=<CMD_CFG0> eb=<CMD_CFG1> err=<CLK_CTRL>."]
findings = ["Linux v6.12 sdm845-oneplus-common.dtsi contains no backlight/wled/ktd3136/lm3697 nodes for this board, and the three device DTBs' strings contain zero backlight hits; the 73 bl_ctrl_* hits in Mu-Silicium/Resources/DTBs/enchilada.dts belong to 16 other panel variants in the multi-panel table.", "The sofef00 entry at enchilada.dts:2613-2664 is bl_ctrl_dcs with bl-min 0x01 / bl-max 0x3ff, which matches mainline's 1023-step DCS brightness. sheng's two KTZ8866 I2C controllers (0x11 on QUP SE1/SE2) DO NOT apply here.", "BootLog.c already defines the L st=%d req=%d lvl=%d a=%d b=%d xerr=%d irq=%x ea=%x eb=%x err=%d row and BootProgressStubs.c:65 has a weak definition, but AppleARMBacklight.cpp / BacklightProbe.cpp / DisplayTimingProbe.cpp do not exist in this repository; the L row therefore reads all zeros (console206: L st=0 req=0 lvl=0).", "Stage 3 layer 1 DCS packet builder (drivers/NativeDsiBacklight/DsiDcs.c) verified twice locally: host test PASS 'enchilada DSI DCS backlight transport (7 test groups)', strict -Wconversion -Wsign-conversion -Wshadow -pedantic compile exit 0, and an independent byte dump gives 39 03 00 00 51 03 ff for brightness 1023 ch0 (DCS long write, word count 3), b9 03 00 00 51 02 00 for 512 ch2, and 15 53 20 00 for WRITE_CONTROL_DISPLAY 0x20. The non-large mipi_dsi_dcs_set_display_brightness() uses the REVERSED byte order and must NOT be used for sofef00.", "Stage 3 layer 2 (drivers/NativeMsmDsi/MsmDsiCmd.c) verified twice locally from two independent sources: (1) vendor DTS enchilada.dts:3404 qcom,mdss_dsi_ctrl0@ae94000 / :2635 dma-trigger=trigger_sw / :2619 dsi_cmd_mode, (2) Linux v6.12 dsi_cfg.c sdm845_dsi_cfg io_start 0xae94000 + io_offset 4 and dsi.xml/dsi_host.c registers+DMA sequence. The 6G_HW_VERSION at offset 0 shifts every other register +4 (runtime MMIO base 0xae94004). dsi_cmd_dma_add(): data[0..2]=header[1],header[2],DI; data[3]=0x80|0x40(long); payload; 0xff pad to len=(size+3)&~3 -> long write 8 bytes 03 00 39 c0 51 03 ff ff, short write 4 bytes 53 20 15 80 (NO padding). msm_dsi_host_cmd_xfer_commit(): DMA_BASE, DMA_LEN, TRIG_DMA=1. Busy poll must be a CPU spin, NOT XNU IODelay/WFE (RootCommands.h:22). Host test: PASS 'enchilada MDSS DSI0 command-channel transport (7 test groups)'; strict -Wconversion -Wsign-conversion -Wshadow -pedantic compile exit 0; independent dump byte-identical to mainline; recipe py_compile exit 0; both C units also compile clean as arm64-apple-darwin -mgeneral-regs-only objects.", "Stage 3 layer 2.5 (read-only runtime probe): two independent verifications passed locally. (1) check-enchilada-msm-dsi-host.py runs both test binaries -> PASS command-channel transport (7 groups) + PASS read-only runtime session (3 groups; FakeDsi proves 7 registers each read exactly once at the dsi.xml offsets and writes==0). (2) clang++ -std=c++17 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror on EnchiladaBacklightProbe.cpp exit 0 (PE_parse_boot_argn has C linkage via pexpert.h __BEGIN_DECLS:42). Design cross-checked against device-proven staged probes (EnchiladaTouchProbe.cpp stage 1 read only, EnchiladaCpuFreq.cpp mode 1 read only) and the strong/weak symbol pattern: armcpu_map_physical strong extern C in ArmCpu.cpp:207; native_backlight_stats strong volatile int32_t[10] overrides BootProgressStubs.c:65 weak char[4096], matching BootLog.c:174 type. BootProgressStubs.c kept CRLF (167 lines) and .symbols kept LF; BootProgress.c:161 weak_import + :1272 1 Hz call. NO hardware claim: not flashed, L st=3 row not yet observed.", "CMD-DMA address open question for layer 3: Linux v6.12 dsi_host.c dsi_tx_buf_alloc_6g() uses msm_gem_kernel_new + msm_gem_get_and_pin_iova (MDSS SMMU IOVA), not a plain physical address as v2 dma_alloc_coherent did; enchilada DTS dsi_ctrl0 node has no iommus property (neighbouring rot nodes do). Sending a brightness packet also needs dc civac + dsb sy cache maintenance (Dwc3Gadget.cpp:306-313).", "CI verification (run #207, 2026-11-07, commit 7adf35f7): the real macos-26 kernel build compiled all 19 other archives successfully and failed ONLY in build-enchilada-msm-dsi.log with two C++20 -Werror,-Wdeprecated-volatile errors that a local -std=c++17 stub-header syntax check could not catch: (1) MsmDsiSession.h:63 volatile-qualified array parameter 'volatile int32_t stats[10]' and (2) EnchiladaBacklightProbe.cpp:99 '++gPolls' on a volatile object. Fixed by spelling the parameter as a pointer to volatile ('volatile int32_t *stats', keeping concurrent-read semantics) and replacing ++ with an explicit read+assign ('gPolls = gPolls + 1'). Re-verified locally with the CI-equivalent 'clang++ -std=c++20 -Wdeprecated-volatile -Werror' (exit 0), strict C11 compile of MsmDsiSession.c (exit 0), and the full host runner (both test binaries PASS). This is the '先核验再上机' discipline: no flash until the real kernel compiles."]
