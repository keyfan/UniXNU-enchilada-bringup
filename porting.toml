  'CORRECTION (2026-11-09): this area previously claimed "IPA with qcom,gsid-loader=self". That property DOES NOT EXIST -- the real name is qcom,gsi-loader (Linux v6.12 ipa_main.c:735, qcom,ipa.yaml:135), NEITHER DTB sets it, and mainline sdm845.dtsi leaves &ipa status=disabled with no such property, so the loader is IPA_LOADER_SELF (legacy). Also corrected: the default descriptors are SPLIT images modem.mdt (q6v5_mss.c:2007 `qproc->hexagon_mdt_image = "modem.mdt";`) and ipa_fws.mdt (ipa_main.c:71 `IPA_FW_PATH_DEFAULT "ipa_fws.mdt"`), NOT single .mbn files; mainline sdm845-oneplus-common.dtsi:552-556/:604-610 name the vendor .mbn entry pieces qcom/sdm845/OnePlus/enchilada/{ipa_fws,mba,modem}.mbn. "No eSIM" was not verified (zero esim/eSIM hits in the vendor DTB) and is dropped. "QRTR" was loose: the DTB node is qcom,ipc_router_glink_xprt.',
