  '[ROUND 74 2026-11-12, HONEST BOUNDARY] A PARSER is not a LOADER. AdrenoMdtV1 reads a buffer the caller already holds: it does not read .bNN from storage, does not allocate or memremap the region, does not call SCM, and authorises nothing. adreno_mdt_loader_available() is 0 and adreno_mdt_ready() is DERIVED from it, so it stays 0 until real wiring exists; consequently zap-auth steps S6/S7 remain present=0 - their RULES are now modelled, their EXECUTION is not, and the admission table does not move (modeled=7, satisfied=0, BLOCKED). Every read is bounds-checked against the buffer size and every multi-byte field is composed byte-wise from a little-endian source, so the parser needs no unaligned 32-bit load and no libc. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 73 2026-11-12, HONEST BOUNDARY] The SHAPE of a call is not the call. AdrenoZapAuthV1 makes no SCM call, loads no firmware, performs no memremap, issues no MMIO, and authorises nothing: there is no SCM transport in XNU, no MDT parser, and seven of the eight preconditions do not exist. zap-auth is modelled=1 / satisfied=0 for exactly that reason, and the row is recorded the same way cp-ring was before round 70 closed it. The -EOPNOTSUPP path is documented as a QUIET fallback (a target that needs no ZAP shader is not an error) while -EACCES is a real failure - conflating them would either hide a genuine rejection or fail a device that never needed ZAP. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 72 2026-11-12, HONEST BOUNDARY] Every register word a CP ring needs is now COMPUTABLE; NOT ONE HAS BEEN WRITTEN. is_executable()==1 means the port knows what to put in each register, NOT that a ring works: no ring allocated, no IOVA mapped, no CP_RB_CNTL written, no doorbell rung, no MMIO of any kind, no fence, no interrupt, no submit. The power sequence, the PAS handshake and the SMMU context are all still absent, and the four hard blockers of docs/porting/gpu.md section 1 remain open. A defect this round found in ITSELF is recorded: the module round-71 self-check still asserted is_executable()==0, and when round 72 made it 1 that stale assertion fired - the self-check caught its own superseded expectation, which is why it is asserted rather than trusted. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 71 2026-11-12, HONEST BOUNDARY] Round 71 is TWO evidence classes and neither promotes the area. The CP-ring work is HOST-VERIFIED: a packet can be encoded, but no ring is programmed, no BO is allocated, no IOVA mapped, no doorbell written, no MMIO issued, and is_executable() stays 0 while U3/U4 hold. The device-tree work is DEVICE-SOURCED and READ-ONLY: it reads STATIC board facts from /proc/device-tree - which say where a block is and how it is wired, and say NOTHING about whether it is powered, what its status words read, or whether it responds. No GPU register was read or written, no firmware loaded, no PAS authentication, no SMMU programming, no flash, no reboot, no mount. Device-sourced STATIC facts are NOT a device RUN of the driver - that is the distinction this port has kept since round 38 - so the gpu area STAYS host-verified. A board VA map is still absent and the A630 client GPU windows stay ALL-ZERO (round-67 gate); nothing in /proc/device-tree supplies one. m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the four hard blockers of docs/porting/gpu.md section 1 remain open, and this does NOT unblock stage 5.',
  '[ROUND 70 2026-11-12, HOST-VERIFIED] AdrenoCpRingV1 is ORDER + PAYLOAD + REFUSAL, NOT a ring: no BO allocated, no IOVA mapped, no doorbell written, no fence, no interrupt, no submit, no MMIO. The five undefined constants are reported as a first-class value rather than papered over, and is_executable() is 0 because U1 and U2 are both open. The admission table is 6 modeled / 0 satisfied / BLOCKED - one row moved, the verdict did not. The four hard blockers of docs/porting/gpu.md section 1 remain open, the A630 client GPU windows stay all-zero, CONFIG_XNU_NATIVE_ADRENO remains n, no device run, no flash, m39510 NOT exercised; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 69 2026-11-12, HOST-VERIFIED] AdrenoGen1BackendV1 is ADJUDICATION ONLY: it asserts what the pinned sources say and what this tree holds, and a green CI build of it would not move a single row of its table. It is NOT a GPU driver - no MMIO, no BO/IOVA/queue/fence/shader cache/MTLDevice/user client, no firmware load, no PAS authentication, no SMMU programming, no Turnip dylib. modeled=5 and satisfied=0 are BOTH deliberate: a caller can log them, and no caller can mistake the five host models for five working steps. The four hard blockers of docs/porting/gpu.md section 1 remain open, the A630 client GPU windows stay all-zero, CONFIG_XNU_NATIVE_ADRENO remains n, no device run, no flash, m39510 NOT exercised; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
"R163 二分（真机）：#264 ci258 树能启动、#265 +R162 ArmCpu.cpp 能启动、#267 +pre-R158 probe 能启动 ⇒ ROUND-158 的 probe 增量有罪；#269 P1b（删 SECVID 读）与 #270 P2（删 344 B replay statics）仍然零字节 ⇒ 两者都无罪，剩余嫌疑只剩 s7 的 rt=/a3=/a6= 字段与 armcpu_scm_call_full 调用",
"R163 P3 零 CI 二分（真机，六次上机）：stage=1 能启动、stage=4 能启动（stage4=refused verdict=3 cx-down，permitted 分支没进）、stage=5 静默、stage=6 静默；同一 stage=5 下 pre-R158 的旧 probe 能启动（窗口 aade7f67…、boot_id 582814787）⇒ 死因是 ROUND-158 快照块里那两次 rd32(gSmmuVa, 0x800u + 0x20u/0x28u)：0x800 是 GR1（kAdrenoSmmuGr1Cba2r）、qcom SMMU-500 的 CB0 在 0x8000，即读到了未实现的 GR1 寄存器偏移（external abort，窗口前死亡＝零字节）。另：msgbuf 只有 16 KiB 且是环形缓冲（msg_bytes 28k > 16384），「首批文本 28.37 s」不能证明内核 28 s 才开始打印 —— 早前那条「时间线矛盾」已撤回",
  "ROUND 165 slice 0 (device, boot_id 583848016): the GMU window is READABLE once CX is up -- no abort -- but fwinit=0, HFI status/SFR/RSC-ack all 0, general7=0 (boot_state=1 = COLD) and sptprac 0xd4 & CLK_MASK 0x38 = 0x14 != 0x28, so the GMU controller has never been started. Reading the window is safe; writing it is untested (this slice was strictly read-only). The old R158 CB0/GR1 question stays closed: only the GR0 page is read.",
  "ROUND 166 slice 1a (device, boot_ids 584944001 at enchilada-pas-exec=4 and 584629860 at =5): the CM3/boot words and the 3 MiB PDC window are both readable with CX up and no abort. CM3_CFG reads 0x4052 (== the pinned CM3_CFG_VALUE) on both boots, but CM3_BOOT_CONFIG reads 0 while a6xx_gmu_start() writes 0x2 -- the software precondition for the GMU never having started is now device-confirmed. PDC_ENABLE_PDC already reads 1 with a non-zero PDC_SEQ_MEM_0 (0x00a000a8), so the bootloader has programmed PDC: a cold boot must read it back before rewriting. BOOT_SLUMBER_OPTION / GX_VOTE_IDX / MX_VOTE_IDX differ between the two boots and are NOT interpreted. Read-only slice: writes to either window remain untested.",
  "ROUND 167（切片 1b）: 第一笔寄存器写在真机成功 —— `CM3_BOOT_CONFIG` 由 0 写成 0x2，读回 ok=1（窗口 b3820911…，boot_id 584581111，gmuboot=pre=0 reset=1 held=1 post=2 fwinit=0 wrote=1 ok=1）。写必须走新入口 armcpu_map_physical_rw（kIODirectionInOut），旧 armcpu_map_physical 是 kIODirectionIn，四个设备已验证调用点保持只读。写仅限复位位为 1 时执行；不写 CM3_SYSRESET/ITCM_START、不载固件、不碰 PDC。",
  "ROUND 168：GMU 固件能装载并执行（CM3 写出 FW_INIT_RESULT=0xbabeface），但 HFI 未初始化（hfistat=0），因为 HFI 队列表与日志缓冲需要 GMU IOMMU 的 IOVA，本仓库没有该 backend；GX 轨仍未上电。",
  "切片 3：GMU 冷启动的 host 侧三步（OOB 握手、power_config、HFI）尚未实现；`gx_arc_votes` 不可从 DT 推导，vote 值仍缺",
  "切片 3：OOB 握手在真机上得到 `ack=0` 且 `post_intr=0x00800000`（CM3_FAULT）；缺 HFI 队列表与 CP_MSG 的 IOVA，GMU IOMMU 后端仍缺",
  "切片 3：上游九笔预启动配置已落盘读回（ifc=09c40405/rpmh=f11/fence=802800a0/sfr=06030100），但没有阻止 CM3 fault；写配置与 fault 无关已被真机排除",
  "ROUND 176: GMU 的 SMMU 窗口只有前 0x800 字节可读，0xC00 起（S2CR 区）任何读法都 external abort（R172/R173 两次静默死 + 同内核对照证明）；读到 sCR0=0x00200626 当时判为 SMMUEN=0（R235 更正：bit0 实为 CLIENTPD 且为 0，客户端已开；USFCFG=bit10=1 才表示未匹配流 fault），GMU 走物理地址，故 HFI 队列表可以用物理内存；分配/映射填表/QTBL 三笔都已由真机判定安全（键 15/16/17 活），死亡点精确落在写 HFI_CTRL_INIT=1 或读 HFI_CTRL_STATUS 上（键 18 静默死）。",
  "ROUND 177: GMU 的 HFI 门铃不能单独写 —— 只写一次 HFI_CTRL_INIT=1（不读任何寄存器）就会让内核死在日志 writer 之前（窗口与 R176 键 17 逐字节相同）；上游 a6xx_gmu_fw_start() 在 hfi_start 之前还有 a6xx_gmu_gfx_rail_on()（BOOT_SLUMBER_OPTION=0 + GX_VOTE_IDX + MX_VOTE_IDX + BOOT_SLUMBER OOB 握手）与 a6xx_sptprac_enable()，我们整段跳过；而 vote 来自 RPMh cmd-db（cmd_db_read_aux_data(\"gfx.lvl\")）算出的 pindex|(sindex<<8)，enchilada 的 DT 里没有任何 opp-hz/arc-level 可算，因此 vote 不许猜。",
  "ROUND 178: 把 gfx_rail_on 的握手形状（BOOT_SLUMBER_OPTION=0 + 置 HOST2GMU_INTR_SET bit22 + 有界等 GMU2HOST_INTR_INFO bit30 + 清 bit30，两个 vote 不写）补在 HFI_CTRL_INIT=1 之前后，同一个 store 不再致死（键 22/23 均 NEW LOG，boot_id 547712722 / 547212046）；但固件仍不应答：ack=0、post=00800000（CM3_FAULT）、HFI_CTRL_STATUS 连读 1000 次为 0；上游 a6xx_gmu_fw_start() 的第一件事 a6xx_rpmh_start()（RSCC_CONTROL_REQ=2 → 等 ACK bit1 → 等 RSCC_SEQ_BUSY_DRV0==0 → REQ=0）本仓库从未实现。",
  "ROUND 179: 按上游顺序补 a6xx_rpmh_start() 四步（RSCC_CONTROL_REQ=2 → 等 ACK bit1 → 等 RSCC_SEQ_BUSY_DRV0==0 → REQ=0，键 24）与 a6xx_sptprac_enable()（SPTPRAC_POWER_CONTROL=0x778000，键 25）后，两次启动都是 NEW LOG、写操作安全；但 RSC 的 ACK 位从未置起（apolls 耗尽 400000，ack=00000000），SPTPRAC 状态字 写前写后都是 000000d4（& 0x38 = 0x14 ≠ 0x28），boot-slumber 门铃照旧 ack=0、CM3 照旧 post=00800000（FAULT）。寄存器偏移已与上游 a6xx_gmu.xml 及两份 vendor 头核对一致。",
  "ROUND 180: 键 26 只读 RSC 页后确认 `gmu mmio + 0x23000` 这片窗口**有背衬**（`tcs0=00000001`），所以 R179 的「RSC 不应答」是真读数、不是打空气；但写 `RSCC_CONTROL_REQ=2` 后 `RSCC_CONTROL_ACK` 仍为 0（400000 次轮询耗尽），`busy/mem0/st0/ovr` 全 0，`CM3_FW_INIT_RESULT` 仍 `babeface`（CM3 活着）。顺带更正 R179 的错误判断：`rd32()` 的 offset 是字节偏移，键 24 的 `GMU_RSCC_DELTA + RSCC_SEQ_BUSY_DRV0 * 4u = 0x23404` 本来就在窗口内。",
  "R184 判决：在「配齐 + 脉冲」的干净状态下单独写 HFI_CTRL_INIT 会静默打死内核；HFI 启动还缺 gfx_rail_on() 与 sptprac_enable()",

  "R186 判决：轨道五笔（BOOT_SLUMBER_OPTION=0 + 两个 vote=0 + SPTPRAC_ON_VALUE）在脉冲后写下去全部被接受、不致死，但 GPU_CC_GX_GDSCR 的 bit16 与 SPTPRAC_PWR_CLK_STATUS 的时钟位一个都没变；boot-slumber 门铃（HOST2GMU_INTR_SET bit22）只把 GMU2HOST_INTR_INFO 从 0 变成 00800000（CM3_FAULT），ACK(bit30) 400000 次内从不置起。R185 那次「键 32 静默死」已查明是继承键 31 的 HFI_CTRL_INIT 致死写（守卫 >= 泄漏），属设计错误，不作为设备证据",
  "R187 判决（DEVICE-VERIFIED）：CPU 侧 APPS RSC（0x179e0000，qcom,tcs-drv）从这支内核里可读，drv=00010100 与触摸驱动自己的 RAIL 行逐位相同（major 1 => legacy 布局）；顺着它读到带 magic 的命令数据库头 h0=00000001 h1=0c0330db，基址 0x85fe0000 => R182 的「这台机器引导器没灌 cmd-db」只对当时试过的 0x861e0000 与 AOSS 指针页两个地址成立，不是机器事实；四个 TCS 的 ctl/en 全 0、st 全 1 全部空闲；0xc3f00000 页读到的 10c11c22 与 R182 键 29 相同，确认那页是 AOSS 消息 RAM 而非指针",
  "R188-R195 判决（DEVICE-VERIFIED，八轮单变量）：GPU 冷启动的所有外围原因已被真机逐一排除，只剩一条——GMU 侧 RSCC_CONTROL_REQ=2 之后 RSCC_CONTROL_ACK 的 bit1 在 400000 次有界轮询内从未置起、RSCC_SEQ_BUSY_DRV0 恒 0、GPU_CC_GX_GDSCR 前后同为 00222001（bit16=0）、SPTPRAC_PWR_CLK_STATUS 恒 0xd4（&0x38=0x14 != 0x28），而 CPU 侧 APPS RSC（0x179e0000）可读且四个 TCS 空闲 => 问题不是「这台机器不会投票」，是 GMU 侧 RSC 不服务非安全 CPU。被排除的假设：vote 值不对（R192 用 cmd-db 算出的真索引 gx=9 mx=4 写 vote=0x01a00409 并读回，仍无人应答）、RSC 缺微码（R193 把五字 0xa7a506a0/a1e6a6e7/a2e081e1/e9a982e2/0020e8a8 写进去并逐字读回 loaded=1，同启动后跑的键 26 也读到 mem0=a7a506a0，握手照旧 ack=0）、PDC 未配置（R194 证明寄存器在厂商基址 0x0b200000、mainline sdm845.dtsi 推出的 +0x80000 与 +0x280000 全 0；R195 在基址读到 t1en=t3en=0x0f、t1ad=0x00030080、t3ad=0x00030010、t3da=3，说明引导器早配好了，且 t1ms=0x00010000/t3ms=0x00010100 与上游 0x10108 不同族，是另一套命令）。中途修掉一个真 bug：quiet_cmd_db_levels() 的名字比较读到 want[7] 越界，导致 6 字母资源全部误判不存在（R191 修好后 gfx_n=10 cx_n=8 mx_n=5、pindex=9、sindex=4）",
  "R196-R201 判决（DEVICE-VERIFIED，六轮单变量）：①GMU 侧 RSC 不是被安全世界拒绝——REQ=1（a6xx_rpmh_stop 方向）之后 STATUS0_DRV0 的 bit16 在 3 次轮询内就置起；②但起方向 REQ=2 永不完成，ACK 的 bit0 会置起而 bit1 不置，且 SEQ_BUSY_DRV0 在任何 REQ 之后再不回 0（三相位快照里四个 TCS 状态字三时刻逐位相同，说明请求根本没落到命令表）；③CPU 侧 APPS RSC（0x179e0000）完全通，用命令数据库算出的真投票值投 gfx/cx 两条轨道（ctl=01010000、st=00000001、polls=1）；④但投票不等于上电：四笔 GPUCC GX GDSC 写每次都生效（clamp 1->0、SW_COLLAPSE 清、PWR_ON bit31 置），POWER_UP_COMPLETE(bit16) 在 20000 次内从不置起，且 CM3 冷（键 46）与 CM3 活（键 47）结果逐位相同（gdscr=08222000 cfg=01080400 gx_on=0）。=> 上游 gdsc_gx_do_nothing_enable() 是空实现、注释明说 GX 由 GMU 控制，所以这些读数与上游设计不矛盾：CPU 侧这套序列本来就不会等到 GX 上电完成。",
  "R202-R203 判决（DEVICE-VERIFIED，两次单变量）：写 HFI_CTRL_INIT=1 时，只要 QTBL_INFO=1（真的要求启动 HFI），不论 QTBL_ADDR 是真表 ad940000（键 17/31，R176/R184）还是 0（键 50，R203），内核都静默死——窗口逐字节不变、内核死在日志 writer 打开之前。唯一安全的情形是把 QTBL_INFO 也清零（键 49，R202）：存活，读出 gmuhfi6=stat=00000000 polls=400000 intr=00000000 fwinit=babeface。=> 致死因子不是我们那张队列表的地址/内容/几何，而是「固件真的被要求启动 HFI」这件事本身；R178 里「先做 boot-slumber 门铃再写就不死」同样是因为 CM3 已被打成 FAULT、不再正常执行启动，而不是门铃提供了前提。HFI 这条路在拿到新信息前不应再重试同一笔写：它的失败方式是零字节静默，不提供任何可观测性。",
  "R204-R213 判决（DEVICE-VERIFIED，十轮单变量）：R203 那条「只要真的要求启动 HFI 就必死」不成立。①HFI 队列表两笔写无罪——键 59 两行都落盘、相隔 6.43 s（gmusp59= @30.159753 / gmusp59b @36.591704）。②这个内核的 IOSleep 不是阻塞睡眠，而是空转（package/BootLog.c 逐字：IOSleep is not a sleep: IOLib.cpp:1509 forwards it to delay_for_interval, which spins the CPU on the time base），所以它与手写紧自旋同属一类失败：长期占住 CPU 会饿死日志 writer（R205/R206/R207/R208）。③键 58（20 万次带 IODelay(1u) 的读循环、无 store）两行都落盘，键 59 连续占住 6.43 s 仍活，但键 62 把首段拉到 60 万次后三行全丢 => 长等待不可靠；不得把上限表述为 3 秒（无读数支持）。④因此「启动字是凶手」至今没有被任何一轮证明：没有任何一轮在「有行落盘且该 store 确实执行」的条件下观测过。⑤未解矛盾（必须优先处理）：键 59 与键 60 在各自块之前执行的代码逐条相同（r210_guards.py 求值一致，均 15 个 RUNS 块），都先打一行再空转 20 万次；键 59 两行都落盘，键 60 的第一行（任何 store 之前）却没落盘。",
  "R219 判决（DEVICE-VERIFIED，三分支单变量，决定性）：HFI_CTRL_INIT=1 单独一笔就足以在能写窗口之前打死内核，而两笔队列表写无罪。同一镜像、同一执行点、只差键值：键 66（三行零 store）3/3 落盘、窗口 eff8caa2、boot 582344900；键 67（三行+两笔表字）3/3 落盘、窗口 f39fac2c、boot 582538748，且 addr 由 ad940000 变为 00000000；键 68（三行+启动字）0/3、窗口与 67 逐字节相同。观测链的事实：BootLog.c 的 writer 按 slot→msgbuf→header→sync 整轮提交，header 最后写且只有它让前两块可见；native_ufs_log_sync 只刷已写入日志区的数据（R214 因此无效）；boot_log_panic_flush 在 R215 也没有提交任何东西（窗口无 [panic] round，两行相隔 15 微秒）。另：键字节在 payload 0x794a25b（约 127 MB），而每轮只回读前 8 MiB —— 该盲区已补，runner 现在定位真正命名期望键值的那份参数并与 system_b 同块比对。",
  "R219-R223 判决（DEVICE-VERIFIED，五轮单变量，决定性）：写 HFI_CTRL_INIT=1 会在内核能写日志之前打死整机；写 0 或不写则一切正常；队列表指向哪里无关。三重对照（同一键 66、同一位置、同一访问宽度）：不写得 3/3（窗口 eff8caa2、boot 582344900）；写 1 得 0/3（窗口未变）；写 0 得 3/3（窗口 d60bb6e3、boot 583170095，fwinit=babeface）。同时排除三条备选解释：①余量不足——R221 在启动字前插入 3.17 s（>6 轮）有界读循环，三行仍全丢；②键值太大跑不到——R222 用已证明可写的键 66，同键值前一轮 3/3；③访问偏移致命——R223 同偏移写 0 得 3/3。观测链的三条事实：BootLog.c 的 writer 按slot→msgbuf→header→sync 整轮提交且 header 最后写；native_ufs_log_sync 只刷已写入日志区的数据（R214 因此无效）；boot_log_panic_flush 在 R215 也没提交（窗口无 [panic] round，两行相隔 15 微秒）。键字节在 payload 0x794a25b（约 127 MB），每轮只回读前 8 MiB 的盲区已补。",
  "R232-R233 判决（DEVICE-VERIFIED）：SMMU stage-1 的寄存器编程路径打通了，但 SMMU 仍未启用。①GR1 帧 = base + (1 << pgshift)（上游 ARM_SMMU_GR1 == 1 与 return smmu->base + (n << smmu->pgshift)），本机 pgshift=12 即 0x05041000；R232 把偏移 0 当 CBAR 读到的 00200626 其实是 GR0 的 sCR0。②键 72 首次真正写 context bank 0：九笔（CBA2R/CBAR/TCR2/TCR/TTBR0/TTBR1/S1_MAIR0/S1_MAIR1/SCTLR，SCTLR 最后）全部落地，读回 ttbr0=ad940000/00000000、sctlr=00001067、cbar=0001f300，六项与模型逐位一致。③R232d 的 cw=0 是「输入没测」：探针给的是字面零，而 ID0=48016605 的 CTTW(BIT14)=1；R233 改为读 IDR0 现算，TCR 由 00802010 变 00803510（只有 SH OS->IS 与 RGN NC->WBWA 动），内核 4/4 行存活。④sCR0.SMMUEN 仍为 0（**R235 更正：该位名不存在，bit0 是 CLIENTPD 且为 0**；R234/R235 已证明清 USFCFG(bit10) 不落地，SMR0..4 全零 ⇒ 无一条流匹配）、stage-2 区（0xC00 起）一笔未写、表里只有一个哨兵叶子 IOVA 0x40000000->0x90000000，所以以上写入不会被任何走表使用；GPU 仍无渲染、准入表 modeled=9/satisfied=0。",
  "R234-R235 判决（DEVICE-VERIFIED）：想「先清 sCR0 的未匹配流旁路、再写启动字」这条路被两轮实测关闭。①R234 键 73 只做一笔 store（sCR0 &= ~(1<<10)，清 USFCFG）：wrote=1 但 before==after==0x00200626，位没动、内核 5/5 行存活（boot_id 580460135、窗口 6028dce4…）。②R235 键 75 在同一次启动里对三个 GR0 地址做同形式 store 以分辨「GR0 整块不接写」与「只有那一位拒绝」：SMR0(0x800)<-0x0000002a 回读一致 landed=1；sCR0<-scr0|(1<<4)=0x00200636 回读一致 landed=1；sCR0<-0x00200226 仍回读 0x00200626 landed=0（boot_id 573874107、窗口 71cdd532…、7/7 行存活）。⇒ GR0 是可写的，被拒的是清 USFCFG 那一位。③同轮更正一个从 R164 起就错的字段名：sCR0 的 bit0 是 CLIENTPD（实测 0，客户端本来就是开的），bit1 是 GFRE，钉住的 arm-smmu.h 里没有 SMMUEN 这个名字，关键词是 USFCFG(bit10)=1 ⇒ 未匹配流 fault；而 SMR0..4 全零 ⇒ 一条流都匹配不上。文档 21 处措辞已改并保留原文删除线。④gfsr 两轮都是 00000000，但键 73/75 都没写 HFI_CTRL_INIT，没有 HFI 流量 ⇒ 零 fault 是必然的，不能据此给 SMMU 开脱（本轮明确拒绝这条推论）。HFI_CTRL_INIT=1 的致死点仍未解释。",
  "R236 判决（DEVICE-VERIFIED）：GMU 的两处中断掩码都被读出，值都是 0。①键 76 只读（AO_HOST_INTERRUPT_STATUS/MASK、GMU2HOST_INTR_INFO/MASK、CM3_FW_INIT_RESULT、HFI_CTRL_STATUS），四行 4/4 落盘、跨 45 微秒（boot_id 573661243、窗口 ca5e9f8a…、msg_bytes=30678），读数 ao_status=00000000 ao_mask=00000000 hfi_info=00000000 hfi_mask=00000000 fwinit=babeface hfistat=00000000。⇒ 每个中断源都没被屏蔽，而 XNU 从未接管 IRQ 304/305，「写 HFI_CTRL_INIT=1 会让一个没人处理的中断打进来」的**前提被实测坐实**；此前十九轮里这两个寄存器从未被本移植写过（探针全文 AO_HOST_INTERRUPT/GMU2HOST_INTR_MASK 命中均为 0）。②键 77（先写四笔 ~0 屏蔽、再空转约 0.63 s、再写启动字）**一行都没落盘**，窗口与键 76 逐字节相同（sha256 仍 ca5e9f8a…、boot_id 仍 573661243）⇒ 那次启动没在盘上留下任何一个新字。原因是结构性的：块在微秒级跑完掩码写，随后空转 40000 次 IODelay 读循环（约 0.63 s），而 writer 一轮约 500 ms，连行 A 都不可能提交；零字节对「死在屏蔽」「死在等待」「死在启动字」三种可能同样兼容。⇒ 本轮**没有**把屏蔽与启动字分开，也**没有**证明 GMU 真的抬过中断。",
  "R237: the GMU interrupt masks were ruled out as the cause of the silent death that follows HFI_CTRL_INIT=1. Key 78 wrote both clears and both masks and returned: new boot_id 586031978, 3 of 3 rows. Key 79 wrote the same four stores plus the start word, twice, and left no new boot_id and no rows -- the window on the platter is byte-identical to the key 78 window and still says key=78 inside. So masking every interrupt source does not save the start word, and the death is not an unhandled IRQ 304/305.",
  "R238: the start word kills even when the store is the LAST action of the round. Key 80 (preamble, four interrupt-mask stores, all prints, return) left boot_id 586963994 and 3 of 3 rows; key 81 is the same code with one added 'gmuW[HFI_CTRL_INIT] = 1u; dsb sy' after every print and nothing after it, and left a window byte-identical to key 80's, whose rows still say key=80. So from the last print to the next writer commit (at most one round, ~500 ms) the machine stopped, and the only thing in that interval is that one store. This does NOT say the store faulted synchronously: an MMIO fault and a CM3-side crash are indistinguishable in this reading, and HFI was never observed starting (fwinit=babeface was read before the store).",
  "R239: with the store kept as the very last action of the round, writing 0u at that offset lands rows (key 82, boot_id 586092751, window 0c000d89..., 3 of 3 rows) and clearing HFI_QTBL_INFO to zero before writing 1u also lands rows (key 83, boot_id 585892346, window 3b7d37b4..., 4 of 4 rows), whereas R238 key 81 - same shape, same table pointer, same 1u - left a byte-identical older window. So neither the shape nor a write at that offset is fatal on its own; what correlates with death is the pair 'table descriptor reads non-zero' AND 'the firmware is told to start HFI'. This is the first time this port has obtained a fresh window after a start-word write.",
  "R240: with the store kept as the last action of the round, pointing HFI_QTBL_ADDR at an immediately zeroed 4 KiB page while leaving HFI_QTBL_INFO = 1 and then writing HFI_CTRL_INIT = 1 leaves no rows at all (key 84, 0 of 4, window still 3b7d37b4...), and the positive control that repeats R238 key 81 verbatim leaves no rows either (key 85, 0 of 3, same window). Together with R239 key 83 (INFO = 0 before INIT = 1 survived, 4 of 4) and R219 key 67 (INFO = 1 without any INIT survived, 3 of 3) this pins the fatality to the pair 'descriptor bit set AND start bit set': where the descriptor points and what that memory contains make no measurable difference.",
  "R241: without writing any start word, the SMMU stream-routing registers turn out to be reachable in both directions but only half programmable. A no-write control key leaves its three rows and a fresh window (key 86, 3 of 3, boot 587123969), so the observation shape is clean. SMR0 takes VALID | SID 4 and holds it (key 88, 5 of 5, wanted 80000004, back 80000004, valid = 1, sid = 4, restored = 1). S2CR0 at 0xC00 accepts the store without dying (key 87, 5 of 5) but does not keep it: wanted 00010000 (type BYPASS), back 00020000 (type FAULT), landed = 0. So the wall at 0xC00 blocks reads only, not writes - which contradicts the note left by R173/R174 that every read in that region aborts, and that contradiction is still open.",
  "R242: the wall at 0xC00 turns out to block reads only, and the S2CR field turns out to hold writes while refusing one of the type values. Key 89 writes nothing at all and still reads c00 = 000200ff, c04 = 000200ff, c08 = 000200ff with 4 of 4 rows and a fresh window (boot 586058586), so the old R173/R174 note that every read in that region aborts cannot stand as written - the likeliest difference is that those reads ran with the GPU CX collapsed, which is not yet measured. Key 91 writes the value it just read back into 0xC00 and gets the same value out (5 of 5, orig 000200ff, back 000200ff, landed = 1), so the field is writable; that recasts R241 key 87's 00020000 as the hardware clamping TYPE to FAULT for a BYPASS store rather than dropping the store. Key 90 routes SID 4 through SMR0 = VALID | SID 4 plus S2CR0 = BYPASS and then makes the start word its last action: zero bytes, the window still byte-identical to key 91's. It does not settle whether routing could save the start word, because key 87 in the same build already showed BYPASS being clamped, so key 90 most likely started without a working route at all.",
  "R243: the S2CR group is readable and one of its type values is writable after all. Key 92 makes no store at all and reads S2CR0 through S2CR4 as 000200ff five times over with sGFSR = 00000000 and 4 of 4 rows (boot 585424163), so the group can be read while the GPU CX is on and the default routes every stream to TYPE = FAULT with CBNDX = 0xff. Key 93 writes TRANS (0x00000000) into 0xC00, does not start, and reads the same value back (4 of 4, boot 585816702, old 000200ff, back 00000000, landed = 1), so TYPE accepts TRANS and R242's wording that TYPE is clamped to FAULT has to be narrowed to BYPASS alone. Key 94 fills SMR0 with VALID | SID 4, writes S2CR0 = TRANS | CBNDX 0 without restoring either, and then makes the start word its last action: zero bytes, the window still byte-identical to key 93's, so the route does not save the start word - but this round cannot tell whether the start word kills by itself or whether routing the GMU into context bank 0 (whose table holds only one sentinel leaf) faults on the queue-table read.",
  "R244: the start word can be survived. Two keys differ in exactly one thing - whether they write HFI_CTRL_INIT. Both first build an identity 2 MiB block under context bank 0 covering the HFI queue page (the queue address is read from HFI_QTBL_ADDR at run time and aligned down with ~0x1fffff, so nothing is hard-coded), write the same nine context-bank words, fill SMR0 with VALID | SID 4 and set S2CR0 to TRANS | CBNDX 0, each read back. Key 96 stops there: 8 of 8 rows land (boot 585220336, build=0 need=3 tables=3 writes=3 root=ad947000 base=ad800000, wrote=9, smr back=80000004 sid=4 landed=1, s2cr back=00000000 landed=1), so the whole setup is harmless on its own. Key 95 is the same code with the start word as its last action: 7 of 7 rows land (boot 585373771, about_to_start=1 start=1 route=1), so the start word no longer stops the machine inside one writer round. Compared with R243's key 94 - identical routing, but a table that holds only one sentinel leaf and covers nothing the GMU reads - dying, the only difference is the table's coverage, which supports the queue-read-fault explanation on both sides for the first time and refutes 'the start word always kills by itself'. The geometry is 2 MiB and not 128 KiB because adreno_lpae_leaf_level() accepts only legal LPAE block sizes and adreno_table_bytes_needed() would otherwise return 2 with nothing built.",,
  "R245: the start word is survivable *and* the registers behind it can be read in the same round. Key 98 repeats R244's key 95 verbatim as a reproducibility control: 7 of 7 rows land on a second boot of the same build (boot 587175491, window b5ea6ee7..., root=ad949000 qtbl=ad945000, about_to_start=1 post=0 route=1 smr=80000004 s2cr=00000000), so that survival was not a one-off. Key 97 is the same shape but, immediately after the start word and with no loop, sleep or poll, reads HFI_CTRL_STATUS (0x5180), CM3_FW_INIT_RESULT (0x501c), sGFSR (0x048), context bank 0's CB_FSR (cb_base + 0x58) and AO_HOST_INTERRUPT_STATUS (0x9305) once each and prints them: 8 of 8 rows land (boot 586639327), gmu97h=after_start=1 post=1 ctl=00000000 fwinit=babeface gfsr=00000000 cbfsr=00000402 ao=00000000. Read bit by bit: CB_FSR bit 0 (FSR_FAULT) is clear, so context bank 0 did not record a translation fault, and sGFSR is completely clean; but CB_FSR is not zero - bits 1 and 10 are set and their origin was not separated this round, so they count neither as a positive translation result nor as a fault. HFI_CTRL_STATUS bit 0 is clear and CM3_FW_INIT_RESULT still reads babeface, so the start word was written and the firmware never reported the HFI engine as started. The open question has therefore moved off the SMMU and onto the firmware side.",,
  'R246: the firmware side is now measurable and it reports nothing. All three keys keep the R244 shape verbatim (read HFI_QTBL_ADDR, 2 MiB align, adreno_table_bytes_needed, adreno_table_build for an identity block, nine context-bank words, SMR0 = VALID|SID 4, S2CR0 = TRANS|CB0) and each lands 8 of 8 rows. Key 99 writes the start word and then, with no loop sleep or poll, reads HFI_CTRL_STATUS (0x5180), PWR_COL_CP_MSG (0x5100), PWR_COL_CP_RESP (0x5101), HFI_QTBL_ADDR (0x5185) and HFI_QTBL_INFO (0x5184) once: boot 584949295, window 5d5e8f48..., gmu99h=after_start=1 ctl=00000000 cpmsg=ad946000 cpresp=00000000 qtbla=ad943000 qtbli=00000001. Key 100 re-arms HFI_QTBL_ADDR and HFI_QTBL_INFO before the start word and reads the control status once before it: boot 584935029, window fe071b25..., gmu100h=before_start=1 ctl=00000000 qtbla=ad935000 qtbli=00000001, so re-arming the descriptor is harmless and the control status bit 0 was already clear before the request. Key 101 also routes the GMU kernel stream (SMR1 = VALID|SID 5, S2CR1 = TRANS|CB0) and then writes the start word last: boot 583926476, window f6a83297..., gmu99h=smr1_set wanted=80000005 back=80000005 valid=1 sid=5 landed=1 s2cr1_wanted=00000000 s2cr1_back=00000000 landed1=1. Together these say the descriptor is never taken (qtbla/qtbli are bit for bit what the CPU wrote, cpresp is always zero) and the request is never reported (ctl bit 0 is clear both before and after), while the machine no longer stops. The old \'writing the start word kills the machine\' phenomenon is therefore located in a queue table page that the SMMU did not cover, and it is bypassed; the gap has moved to the firmware.',,
  'R247: the CM3 can be re-booted and the start word no longer stops the machine, and the firmware still refuses the request. All three keys keep the R244 setup verbatim (2 MiB identity block over the queue-table page, nine context-bank words, SMR0 = VALID|SID 4, S2CR0 = TRANS|CB0). Key 102 writes no GMU word at all and lands 8 of 8 rows: boot 585194661, window eb5f0b32..., gmu102h=pre_start=1 sfr=06030100 cfg=00004052 sysreset=00000000 bootcfg=00000002 fwinit=babeface ctl=00000000 ifc=09c40405 rpmh=00000f11 info=00000000 mask=00000000 cpresp=00000000 cpm=ad937000 survived=1, which says the chip id is the value the upstream formula gives, the CM3 configuration words are exactly the upstream constants, the core is released and the firmware ran. Key 103 re-boots the CM3 with the queue table already in place (QTBL_ADDR, QTBL_INFO, SYSRESET=1, CP_RESP=0, SYSRESET=0, bounded poll of CM3_FW_INIT_RESULT) and stops short of the start word: boot 586194441, window d6c2ff4e..., gmu103h=cm3_reboot=1 no_start=1 fwinit=babeface polls=1 sysreset=00000000 cfg=00004052 ctl=00000000 survived=1, 8 of 8. Key 104 repeats that and writes HFI_CTRL_INIT=1 as its last action, then reads the status once: boot 584880976, window 210e5a41..., 9 of 9, gmu104i=after_start=1 ctl=00000000 info=00000000 cpresp=00000000 qtbli=00000001 survived=1. So a fresh CM3 boot with the table in place survives the start word, and the firmware still reports nothing: ctl bit 0 clear, no GMU2HOST interrupt, no CP response, and the descriptor bits are the ones the CPU wrote. The old \'writing the start word kills the machine\' finding is closed: R243 94 died and R244 95 lived with the only change being whether CB0 covered the queue-table page.',,
  'R248: the polls=1 ambiguity is closed and it closed in the direction of \'the firmware really did re-run\'. Key 105 clears CM3_FW_INIT_RESULT to zero, reads it back as 00000000, then re-boots the CM3 with the R244 setup and does not write the start word: boot 583913461, window 569d7337..., 9 of 9, gmu105h=init_cleared=1 before=babeface after_clear=00000000 about_to_reset=1 and gmu105i=reboot=1 fwinit=babeface polls=4 sysreset=00000000 cfg=00004052 ctl=00000000 win=1 survived=1. Because the init word was zero before the pulse, the babeface that comes back has to be written by instructions, and this boot needed four polls where R247 needed one. Key 106 repeats that and clears HFI_CTRL_INIT before writing it back to 1 as the last action (11 of 11, boot 584210510, window 4aca5189...): gmu106j=request_cleared=1 ctl=00000000 fwinit=babeface about_to_start=1, gmu106k=after_start=1 ctl=00000000 info=00000000 cpresp=00000000 qtbli=00000001 survived=1. Key 107 repeats it and clears GMU2HOST_INTR_CLR and AO_HOST_INTERRUPT_CLR to ~0 before the start word (11 of 11, boot 584625589, window 343c6a00...): gmu107j=interrupts_cleared=1 info=00000000 mask=00000000 ao=00000000 about_to_start=1, gmu107k=after_start=1 ctl=00000000 info=00000000 cpresp=00000000 qtbli=00000001 survived=1. So neither a stale request bit nor stale interrupt state explains the silence: the CM3 executes, writes its own init word, and never sets HFI_CTRL_STATUS bit 0, never writes PWR_COL_CP_RESP and never sets GMU2HOST_INTR_INFO. The design was changed from section 48.9 on purpose: clearing the init word answers the polls=1 question with one boot, while rewriting PWR_COL_CP_MSG would have added no discriminating evidence.',,
  'R249: the last three explanations for the silent firmware are gone. Keys 108, 109 and 110 all keep the R248 preamble (clear CM3_FW_INIT_RESULT, re-boot the CM3, poll the init word, clear both interrupt blocks) and differ only after the start word. Key 108 writes the start word and then polls HFI_CTRL_STATUS bit 0 with IODelay(1u) for 200000 passes: boot 643188047, window aacb8f98..., 11 of 11, gmu108k=after_poll=1 ctl=00000000 bit0=0 polls=200000 fwinit=babeface cpresp=00000000 qtbli=00000001 survived=1, so the whole window was used and bit 0 never came. Key 109 reads ctl just before and just after the same window and then reads sGFSR and CB_FSR: boot 621183782, window e4b91961..., 12 of 12, gmu109k=poll_start=1 fwinit=babeface ctl=00000000 about_to_start=1 and gmu109l=poll_end=1 fwinit=babeface ctl=00000000 polls=200000 cbfsr=00000402 gfsr=00000000 survived=1, so context bank 0 recorded no FSR_FAULT (bit 0 clear) anywhere in the window. Key 110 writes HFI_QTBL_INFO to 0, reads it back, writes it to 1, reads it back, and only then writes the start word: boot 642761268, window 56998d7b..., 12 of 12, gmu110k=qtbl_repoked=1 info0=00000000 info1=00000001 about_to_start=1 and gmu110l=after_poll=1 ctl=00000000 bit0=0 polls=200000 fwinit=babeface cpresp=00000000 qtbli=00000001 survived=1. So time, the table descriptor and a translation fault are all excluded: the CM3 is alive (fwinit stays babeface), the descriptor reads back both ways, no interrupt is raised (info/mask/ao all zero), and the request is simply never taken.',,
  'R250: the firmware does react, but only by faulting. All three keys share one preamble this round (nine context-bank words, SMR0 = VALID|SID 4, S2CR0 = TRANS|CBNDX 0, clear CM3_FW_INIT_RESULT, five CB-note CM3 re-boot stores, one bounded poll for babeface, two interrupt clears), so each key differs in exactly one place. Key 111 reads GMU2HOST_INTR_INFO, rings HOST2GMU_INTR_SET, reads the info and mask again, then writes the start word and polls 200000 times: boot 624391291, window 06d3a912..., 13 of 13, gmu111k=before_doorbell info=00000000 ao=00000000 about_to_ring=1, gmu111l=rang_doorbell set=00000001 info=00000000 mask=00000000 ao=00000000, gmu111m=after_start=1 ctl=00000000 bit0=0 polls=200000 fwinit=babeface info=00800000 cpresp=00000000 qtbli=00000001 survived=1. Key 112 prints the power and frame words on both sides of the start word: boot 640349468, window 64dfa842..., 12 of 12, gmu112k=power_state ifc=09c40405 hyst=000a2710 cm3cfg=00004052 bootcfg=00000002 sysreset=00000000 about_to_start=1 and the same values again after the start, so the inter-frame control word is not zero and the failing gmurpmh ack is an unanswered handshake rather than an empty register. Key 113 writes HFI_SFR_ADDR and PWR_COL_CP_MSG back with the values they already held: boot 631958867, window 86fe38ce..., 13 of 13, gmu113k=before_repoke sfr=06030100 cpmsg=ad949000 qtbl=ad946000 sfr_zero=0 cpmsg_zero=0, gmu113l=repoke sfr_want=06030100 sfr_back=06030100 cpmsg_want=ad949000 cpmsg_back=ad949000 landed=1, so the CM3 reset leaves both addresses intact. The new fact is GMU2HOST_INTR_INFO bit 23 (CM3_FAULT per a6xx_gmu.xml): it reads 00000000 right after the doorbell and 00800000 after the start word in both key 111 and key 112, while ctl bit 0 is never set and fwinit stays babeface.',,
  'R251: the CM3_FAULT bit is not raised by the store, it appears after it. The three keys keep the R250 preamble and each add exactly one thing. Key 114 clears GMU2HOST_INTR_CLR once more, reads info/mask/ctl/qtbli, writes the start word and reads once with no loop in between: boot 582648101, window 6cfa33de..., 12 of 12, gmu114j=interrupts_cleared=1 info=00000000 mask=00000000 ao=00000000, gmu114k=cleared_again=1 info=00000000 mask=00000000 ctl=00000000 qtbli=00000001, and gmu114l=first_read=1 ctl=00000000 bit0=0 info=00000000 mask=00000000 qtbli=00000001 survived=1, so the two clears really do zero the info and the read next to the store still sees zero. Key 115 writes GMU2HOST_INTR_MASK as ff7fffff so only bit 23 is enabled: boot 582894143, window b979256c..., 12 of 12, gmu115k=mask_set want=ff7fffff back=ff7fffff info=00000000, gmu115l=first_read=1 ctl=00000000 bit0=0 info=00000000 mask=ff7fffff qtbli=00000001 survived=1, so the mask takes the value verbatim and the bit is still absent in the read adjacent to the start word. Key 116 does the same clear and the same mask store and never writes the start word: boot 583569074, window 957fe73f..., 12 of 12, gmu116k=control_no_start info=00000000 mask=ff7fffff, gmu116l=after_control=1 ctl=00000000 bit0=0 info=00000000 mask=ff7fffff qtbli=00000001 no_start=1 survived=1. Verdict: the 00800000 that R250 read belongs to some moment after the store, inside its 3.17 s polling window, so the firmware accepts the request first and faults while processing it rather than rejecting it instantly.',,
  'R252: the CM3_FAULT bit belongs to the start word and is a delayed, persistent state. Keys 117, 118 and 119 share the R250 preamble (clear the init word, five CM3 re-boot stores, poll it, two interrupt clears) and differ only in what they add and when they read. Key 117 writes GMU2HOST_INTR_MASK as ff7fffff so only bit 23 is enabled, reads it back, writes the start word and polls 200000 rounds: boot 612503960, window e9ffa24d..., 12 of 12, gmu117k=mask_set want=ff7fffff back=ff7fffff info=00000000, and gmu117l=after_poll=1 ctl=00000000 bit0=0 polls=200000 info=00800000 mask=ff7fffff qtbli=00000001 survived=1, so under an enabling mask and after a clear the bit is still there. Key 118 clears GMU2HOST_INTR_CLR once more, writes the start word and waits only 20000 rounds (about 0.32 s): boot 586394539, window e4c33b3f..., 12 of 12, gmu118k=cleared_again=1 info=00000000 mask=00000000 ctl=00000000, and gmu118l=after_short_wait=1 waited=20000 ctl=00000000 bit0=0 info=00800000 mask=00000000 qtbli=00000001 survived=1, so the bit is already set a third of a second in. Key 119 clears once and never writes the start word, then polls the same 200000 rounds: boot 640788860, window 7bdb8916..., 12 of 12, gmu119k=cleared_no_start=1 info=00000000 mask=00000000 ctl=00000000, and gmu119l=after_poll_no_start=1 ctl=00000000 bit0=0 polls=200000 info=00000000 mask=00000000 qtbli=00000001 no_start=1 survived=1, so without the start word the full poll leaves it clear. Verdict: the fault is caused by the start word, appears somewhere between the read adjacent to the store (R251, clear) and 0.32 s, and stays set; ctl bit 0 is 0 in all three keys and fwinit stays babeface.',,
  'R253: the CM3_FAULT bit is a clearable event, not a latched state, and the CM3 does not reset itself while faulting. Keys 120, 121 and 122 share the R250 preamble and differ only in what they add. Key 120 writes GMU2HOST_INTR_MASK as ff7fffff, the start word, polls 200000 rounds until HFI_CTRL_STATUS bit 0 would be set, reads the fault row, and then writes GMU2HOST_INTR_CLR as ffffffff for the first time after the start word: boot 639527882, window e16f658e..., 12 of 12, gmu120k=observed=1 ctl=00000000 bit0=0 polls=200000 info=00800000 mask=ff7fffff about_to_clear=1, and gmu120l=cleared_after=1 wrote=ffffffff info=00000000 mask=ff7fffff qtbli=00000001 survived=1. The mask is unchanged across the two rows, so the clear removed the fault bit and not the enablement, and the machine survived it. Key 121 adds one mask store and its start word and then reads the CM3\'s own words: boot 640193532 and 639658773, windows ee3728899e2a... and 5a116285aabb..., 12 of 12, gmu121k=observed=1 ctl=00000000 info=00800000, and gmu121l=cm3_after=1 sysreset=00000000 bootcfg=00000002 cm3cfg=00004052 fwinit=babeface info=00800000 ctl=00000000 survived=1, which is bit for bit the state R247 read before any start word. Verdict so far: the bit is an event nobody had ever cleared rather than a persistent state, and the CM3 is not rebooting itself. Key 122 writes HFI_QTBL_ADDR as zero with HFI_QTBL_INFO back to one and then the start word: three boots all came back byte-identical to the previous window (gmu122k=0 gmu122l=0), while a control boot of the same kernel with the argument outside the arm window committed its window twice (gmu217seen=parsed=1 key=123 armed=0, boot 581958999, window 97239231380c...), so the armed block ran and the machine died before the round commit. The payload differs from the key-121 one in a single byte at offset 0x7963270.',,
  'R254: read the context-bank fault address instead of only its status. Keys 124, 125 and 126 share the R250 preamble and differ only in what they do around the start word. Key 124 reads CB_FSR, writes the FSR_FAULT pattern 0xc00001fe to clear it, reads it back, writes GMU2HOST_INTR_MASK as ff7fffff, writes the start word, polls 200000 rounds and then reads CB_FSR, CB_FAR and CB_FSYNR0: boot 604034594, window 4147719ce03d..., 12 of 12, gmu124k=fsr_cleared=1 fsr_before=00000400 fsr_clear_back=00000400 far_before=00000000 about_to_start=1 and gmu124l=cleared_then_started=1 ctl=00000000 bit0=0 polls=200000 info=00800000 fsr=00000402 far=2d960008 fsynr0=00000021 survived=1. Key 125 clears nothing, reads the status word twice and then writes the start word: boot 650093298, window 86b7007b1edf..., 12 of 12, gmu125k=un_cleared=1 fsr_before=00000400 fsr_again=00000400 far_before=00000000 about_to_start=1 and gmu125l=un_cleared_then_started=1 ctl=00000000 bit0=0 polls=200000 info=00800000 fsr=00000402 far=2d90d008 fsynr0=00000021 survived=1. Key 126 clears the status word and polls but writes no start word at all: boot 637424232, window 7f39d67886c1..., 12 of 12, gmu126k=fsr_cleared=1 fsr_before=00000400 fsr_clear_back=00000400 no_start=1 about_to_poll=1 and gmu126l=no_start_polled=1 ctl=00000000 bit0=0 polls=200000 info=00000000 fsr=00000400 far=00000000 fsynr0=00000000 survived=1. The two faulting keys each report a faulting address equal to that boot\'s queue-table address plus eight with bit 31 removed: 0xAD960008 & 0x7FFFFFFF = 0x2D960008 and 0xAD90D008 & 0x7FFFFFFF = 0x2D90D008, so the read the CM3 issues inside the start request loses bit 31 of the queue-table address. FSYNR0 0x21 decodes as PLVL 1 (the walk failed at level one), WNR 0 (a read) and S1CBNDX 0 (context bank 0). The control key with no start word keeps FSR at 00000400 and FAR at zero, so the table build and the routing produce no fault on their own and the fault belongs to the start request. HFI_CTRL_STATUS bit 0 is still zero in all three keys, so the firmware still does not report having started.',,
  'R255: map the truncated address the CM3 actually asks for, and test whose truncation it is. Keys 127, 128 and 129 share the R250 preamble, but the table build is no longer identity: adreno_table_build is called with iova 0x2d800000 and paddr equal to the queue table\'s 2 MiB page, so the 2 MiB block the two R254 faulting reads asked for is now covered. Key 127 clears the status word, arms one source, writes the start word and polls 200000 rounds: boot 639964159, window 5138f374ffab..., 12 of 12, gmu127b=build=0 need=3 tables=3 writes=3 root=ad964000 base=ad800000 iova=2d800000 ias=48 oas=36 ok=1 and gmu127l=low_map_started=1 ctl=00000000 bit0=0 polls=200000 info=00800000 fsr=00000402 far=2d960008 fsynr0=00000021 survived=1, which is bit for bit what R254 read with the identity table, so the new descriptors did not affect this walk. Key 128 writes HFI_QTBL_ADDR as the queue table with bit 31 cleared and reads it back before the start word: two separate boots both committed nothing at all (the window still held the previous round\'s bytes, gmu128k=0 gmu128l=0), the same shape as R253 key 122 with a zero address (three of three), so every value with bit 31 clear that has ever been written there has killed the round before it could commit a row, while the untruncated values of keys 127 and 129 survive. Key 129 builds the same low mapping and writes no start word: boot 600256967, window 1b15ffafae7b..., 12 of 12, gmu129l=low_map_no_start=1 ctl=00000000 bit0=0 polls=200000 info=00000000 fsr=00000400 far=00000000 fsynr0=00000000 survived=1, so the build and the routing fault nothing on their own. FSYNR0 0x21 decodes as PLVL 1, and the PLVL value now ties the two rounds together: the identity table of R254 puts its entries at level-1 index 2 because 0xAD800000 >> 30 is 2, while the truncated address 0x2D960008 has level-1 index 0, so that walk stops on an empty level-1 entry; the R255 table writes exactly that level-1 index 0 entry and the walk still stops there, which means those descriptors are not the ones being used. HFI_CTRL_STATUS bit 0 is still zero.',,
  'R256: read the descriptors back out of memory before blaming the store, then clean them to the point of coherency. Keys 130, 131 and 132 share the R250 preamble with twelve GMU stores in the block; key 130 builds the low mapping, programs context bank 0 and reads level-0 index 0, level-1 index 0 and the level-2 block out of memory without writing any start word: boot 645270395, window 541f66c26cab..., 14 of 14, gmu130m=readback=1 root_off=0 l2_idx=364 l0=00000000ad917003 l1=00000000ad918003 l2=00000000ad800401 m0=1 m1=1 m2=1 pages=3, so all three words are bit for bit what adreno_lpae_table_pte and adreno_lpae_leaf_pte encode. Key 131 repeats the build (a different physical allocation again: ad965000 / ad966000, still m0=m1=m2=1), cleans the three pages with dc civac and dsb sy, then clears the status word, arms one source, writes the start word and polls 200000 rounds: boot 645823279, window ce1e51af0327..., 14 of 14, cleaned=1 pages=3 dsb=1, gmu131l=cleaned_then_started_end=1 ctl=00000000 bit0=0 polls=200000 info=00800000 fsr=00000402 far=2d960008 fsynr0=00000021 qtbl_now=ad960000 survived=1, which is bit for bit the R255 row with no clean at all. Key 132 cleans the same pages and writes no start word: boot 645545880, window c862b9be4047..., 14 of 14, fsr=00000400 far=00000000 fsynr0=00000000, so the clean itself produces nothing. The verdict is that the descriptors are right in memory, the visibility of the pages this core wrote is right, the faulting address 2d960008 still lies inside the 2 MiB range the round mapped, and therefore the walk that faults is not using this table: FSYNR0 0x21 says level-1 descriptor invalid while our level-1 entry 0 is a valid table descriptor, and that contradiction is the finding. HFI_CTRL_STATUS bit 0 is still zero.',,
  'R257: read the descriptors back out of memory before blaming the store, then clean them to the point of coherency. Keys 130, 131 and 132 share the R250 preamble with twelve GMU stores in the block; key 130 builds the low mapping, programs context bank 0 and reads level-0 index 0, level-1 index 0 and the level-2 block out of memory without writing any start word: boot 645270395, window 541f66c26cab..., 14 of 14, gmu130m=readback=1 root_off=0 l2_idx=364 l0=00000000ad917003 l1=00000000ad918003 l2=00000000ad800401 m0=1 m1=1 m2=1 pages=3, so all three words are bit for bit what adreno_lpae_table_pte and adreno_lpae_leaf_pte encode. Key 131 repeats the build (a different physical allocation again: ad965000 / ad966000, still m0=m1=m2=1), cleans the three pages with dc civac and dsb sy, then clears the status word, arms one source, writes the start word and polls 200000 rounds: boot 645823279, window ce1e51af0327..., 14 of 14, cleaned=1 pages=3 dsb=1, gmu131l=cleaned_then_started_end=1 ctl=00000000 bit0=0 polls=200000 info=00800000 fsr=00000402 far=2d960008 fsynr0=00000021 qtbl_now=ad960000 survived=1, which is bit for bit the R255 row with no clean at all. Key 132 cleans the same pages and writes no start word: boot 645545880, window c862b9be4047..., 14 of 14, fsr=00000400 far=00000000 fsynr0=00000000, so the clean itself produces nothing. The verdict is that the descriptors are right in memory, the visibility of the pages this core wrote is right, the faulting address 2d960008 still lies inside the 2 MiB range the round mapped, and therefore the walk that faults is not using this table: FSYNR0 0x21 says level-1 descriptor invalid while our level-1 entry 0 is a valid table descriptor, and that contradiction is the finding. HFI_CTRL_STATUS bit 0 is still zero.',,
  'R258: one read-path key pair, one routing key, and one clear result that is itself a fact. Keys 136, 137 and 138 share the R250 preamble with fourteen GMU stores in the block. Key 136 reads the context bank status word three times with a one tick pause between reads and once more after the faulting address: boot 644267162, window c238351717a0..., 14 of 14, fsrA=00000402 fsrB=00000402 fsrC=00000402 far=2d960008 fsynr0=00000021 fsrD=00000402, so all four reads are set and the clean read of the previous round was a timing window. Key 137 reads the address twice around a same value write and read of the bank control word: boot 650481063 then 655177693, windows fa721275ad9a... and ac48f18decce..., 14 of 14 each, farA=farB=2d911008 fsr_first=fsr_mid=fsr_last=00000402 sctlr_self=sctlr_back=00001067, so the window returns what was just written and no reading of it was stale. Key 138 clears the stream match valid bit while keeping SID 4 and writes the start word: two boots, both zero bytes, window staying at 655177693 / ac48f18decce..., 12 of 14, so turning that match off kills the round before it can commit a single byte.',
  'ROUND 259 2026-11-22, ROUTING SIDE OPENS: keys 139/140/141 all landed 14 of 14 rows. Key 139 wrote SMR0 = 0x00000004 (VALID cleared, SID 4 kept) and never wrote the start word: the round survived with fsr = 00000400 (TF = 0), far = 0 and gfsr = 0, so laying the table, routing the stream and clearing the status word faults nothing by itself, and the VALID bit is writable. That also bounds R258 key 138, which died with no bytes twice: the same write is harmless alone, so what killed it was the start word written while the match was off. Key 140 put the match back (off_back = 00000004, on_back = 80000004) and then started: the fault is unchanged (fsr = 00000402, far = 2d951008, fsynr0 = 00000021), so a round trip of the match state changes nothing. Key 141 tried to point the match at SID 0x7f and the hardware refused it: 0x8000007f reads back 0x80000004, so the ID field is not writable and the routing comparison cannot be made by editing SMR0. ctl bit0 stayed 0 in all three keys. R260 therefore starts with key 142: clear VALID, flush the log, then write the start word - the 138 reproduction, where zero bytes is itself the routing evidence.',
  'ROUND 260 2026-11-22, THE TABLE STOPS FAULTING: keys 142/143/144 landed 14 of 14 rows on every boot that wrote, and the translation fault that every round since R254 carried is gone. Keys 143 and 144 fill every entry of the SMMU table pages (three pages, or the two child pages) with valid descriptors and the 2 MiB leaf; after the start word the bank reads fsr = 00000400 (TF = 0), far = 00000000 and fsynr0 = 00000000 in all four boots, against 00000402 / 2d9xxxxx / plvl 1 in every identity-table round. So the read that faulted was landing on an entry we never wrote, and filling only the children is enough: the root page as the builder writes it was already good. CM3_CTRL_STATUS then read 00000001 with bit0 set in three of the four filled boots (polls = 2) - the first time this port has seen the firmware report the HFI engine started - and 000000fe with bit0 clear once, which is recorded but not explained. Key 142 took the stream match down, flushed the log and wrote the start word: no bytes twice, exactly like R259 key 138, so the flush was never what 138 lacked. info and gfsr stayed 0, so no message and no interrupt yet.',
  '[ROUND 261 2026-11-22, QUEUE PAGE READBACK] Three accepted start words in one boot all leave CM3_CTRL_STATUS bit0 at one (polls 2/1/1), and the first four words of the HFI queue table page read 00000000 00000078 00000006 0000000c byte for byte on two different boots with two different physical pages and two different window virtual addresses; there is no pre-start baseline yet, so the authorship of those four words is unproven, and re-arming QTBL_ADDR and QTBL_INFO changed nothing observable.'
  '[ROUND 262 2026-11-22, THE PAGE WAS ALREADY FILLED] Key 149 arms the queue table and writes no GMU store at all, and the first four words of the queue-table page still read 00000000 00000078 00000006 0000000c, identical one microsecond apart; key 148 reads the same four words before its start word and again after a full poll and they do not move, so the round 261 reading cannot be attributed to the start request; key 150 prints twenty-four words that fall into two twelve-word records with pointers ad950000 and ad951000, which is the shape of a queue header pair and not of a single request answer.''
  '[ROUND 263 2026-11-22, WHAT THE RESET PULSE BUYS] Key 151 brackets the queue page with reads before the arming stores, after them, after the reset pulse and after the start word, and all four reads are the same four words 00000000 00000078 00000006 0000000c, so arming and the pulse do not write the page; key 152 skips the reset pulse on the same path and the page reads all zero, CM3_FW_INIT_RESULT never leaves 00000000 and the start word is never taken across 200000 polls (ctl=00000000); key 153 keeps the pulse and drops only the start word, the firmware reinitialises (babeface) and ctl still reads 00000000, so accepting a start needs the pulse and the start word together, while the four words belong to neither.'
  '[ROUND 264 2026-11-22, WHO OWNS THE QUEUE PAGE] Key 154 commits the start word with the page untouched, the firmware accepts it (ctl=00000001, polls=2), the first queue words stay 00000000 00000078 00000006 0000000c, and PWR_COL_CP_MSG reads ad957000 with PWR_COL_CP_RESP still 00000000; key 155 writes a visible pattern into page words four to seven first, and the same start word is then refused across 200000 polls (ctl=00000000) with CM3_FAULT set (info=00800000), so the content of those words changes what the firmware does; key 156 repeats the pattern with no start word, CM3_FAULT stays clear (info=00000000) and CP_MSG still reads ad957000, so CP_MSG belongs to the reset pulse and not to the start word; the pattern never reads back in either key (w4..w7 all zero right after the write), so the write path itself is still unproven.'
  '[ROUND 265 2026-11-22, THE WRITE PATH AND THE CACHE OP] Key 157 writes page word sixty-four through the writable mapping and reads it straight back as a5a5a5a5, rewrites it as 5a5a5a5a and reads that back too, writes word sixty-five as c3c3c3c3, and a second mapping sees the final values, so the write path is real (ctl stays clear without a start word); key 158 writes the same pattern into safe words sixty-four to sixty-seven, cleans with dc civac and commits the start word, the readback is zero in both places and the start word is refused across 200000 polls (ctl=00000000, info=00800000); key 159 puts that pattern back into words four to seven, cleans with dc cvac instead, and the start word is accepted (ctl=00000001, polls=104) with the pattern still there afterwards, so the refusal in R264 key 155 tracked the cache operation rather than the page content.'
  '[ROUND 266 2026-11-22, THE MATRIX RETRACTS THE CONTENT RULE] Keys 160 and 161 put the same four-word pattern at page words four to seven and at safe words sixty-four to sixty-seven, clean with dc civac and commit the start word, then rewrite, clean with dc cvac and commit again: all four start words were accepted in one boot each (ctl0=00000001 pol0=1, ctl1=00000001 pol1=0) with the patterns read back before and after each commit; key 162 cleans words four to seven with dc cvac and commits no start word, and the control word stays 00000000. Same offset, same cache op, opposite outcome from R264 key 155 and R265 key 159, so page content does not decide acceptance and neither cache pass does; the refusal cause of those two keys is still unknown.'
]
next_action = [
  'Test the 'dying read' explanation of the zero window directly. (1) Key 208: repeat key 207's ladder at 1 ms resolution from 15 to 20 ms, one row per millisecond, to put the death point inside a single millisecond. (2) Key 209: after a wait known to be fatal (for example 19 ms), read the whole window once immediately and print it - if the reading is zero while the round is still logged, the zero window is a dying read rather than a live state. (3) Key 210: split 209 in two - a wait-then-read-only control with no store, and a wait-then-read-nine-words-and-print-one-row variant - to separate 'the round is already dead' from 'the store poisoned the window'. (4) Keep every key free of interrupt-mask writes, SMMU table writes and idle spinning; IODelay-paced read loops only; check-reboot-to-twrp.py --arm before and after every boot.',
  'Turn this round's shape hypothesis into a direct test. (1) Key 205: write INIT and then run ONLY the two thousand ctl polls followed by one read, reproducing the p2 shape and isolating the poll loop as the variable. (2) Key 206: the same two thousand polls but sampling every hundred polls, so twenty samples fall INSIDE the loop and show whether the zero window exists only at the moment the loop ends. (3) Key 207: a wait ladder of 100/150/200 polls (10/15/20 ms) with one read per step, bracketing the round-ending threshold between 10 and 20 ms. (4) Keep every key free of interrupt-mask writes, SMMU table writes and idle spinning; IODelay-paced read loops only; check-reboot-to-twrp.py --arm before and after every boot.',
  'Split the two questions that did not get an answer. (1) Key 202: key 200's wait HALVED to 10 ms with a single read afterwards, which separates 'waiting longer kills the round' from 'the read after the wait kills it'. (2) Key 203: key 201's order but with a row printed BEFORE the INIT store (reset, print one row, then write INIT without clearing the descriptor, then print one row); requiring that first row to land is what splits the reset stage from the INIT stage, and it is exactly the row key 201 never printed. (3) Key 204: key 199's sampler tightened to twenty points fifty polls apart, pushing the zero window's lower bound down to about 50 us. (4) Keep every key free of interrupt-mask writes, SMMU table writes and idle spinning; IODelay-paced read loops only; check-reboot-to-twrp.py --arm before and after every boot.',
  'Measure the zero window and test the ordering. (1) Key 199: clear the descriptor, write INIT, then read st/gd/cf once every 200 polls for 10 samples, each sample accompanied by fw_init_result and sysreset, so the zero window's length and whether the firmware was restarted by that store are both answered. (2) Key 200: the same sequence but read HFI_CTRL_STATUS and info once MORE after the latch poll, to decide whether 'never latched' is a transient or a standing state. (3) Key 201: reset the CM3 first and then write INIT WITHOUT clearing the descriptor - the reversed order of key 197 - to decide whether the lethal condition depends on store order or only on the descriptor value. (4) Only after the HFI start latches should the message ring be rung again; until then a silent doorbell proves nothing, which is why key 198 reports skipped=1. Constraints unchanged: no interrupt-mask writes, no SMMU table writes, no idle spinning to buy observation time (IODelay-paced read loops only), and check-reboot-to-twrp.py --arm before and after every boot.',
  '[ROUND 277 DONE, NEXT IS R278] The version word reads zero (so it cannot be used as a revision), the HFI message doorbell is unanswered like the out-of-band ones, and writing HFI_CTRL_INIT with the queue table described kills the round before its commit (2/2 zero bytes). R278 should first supply the control this round did not run, inside one build: (a) key 196 clears HFI_QTBL_INFO and THEN writes HFI_CTRL_INIT=1 - if it survives, 'the table is described' is half of the lethal condition; (b) key 197 writes INIT=1 after clearing only the queue-table ADDRESS, separating the descriptor from the pointer; (c) key 198 touches nothing and reads the queue page (the qaddr table) before and after, a zero-write baseline for 'did a consumer advance the ring'. Keep the zero-side-effect discipline: no interrupt mask, no CM3 reset, no busy-spin bought time. Then the usual chain: rebuild the block, sync all gates, push a branch, dispatch CI, download and flatten both artefacts, static gate on the real artefacts plus self-prove against this round, runners and anchor, then boot the keys one at a time with the reboot gate armed before and after each.',
  '[ROUND 276 DONE, NEXT IS R277] No out-of-band message is acknowledged (GPU_SET set16/ack24 and BOOT_SLUMBER set22/ack30 are both silent for 10 ms), every doorbell raises info bit 23 (CM3_FAULT) while the AO fault sources are all zero, and RPMH_POWER_STATE already reads 0x0f so the firmware believes it is slumbered. R277 should ask what the firmware is actually RUNNING instead of ringing another doorbell: (a) read the CM3 firmware version word (a6xx_gmu_start() reads GMU_CM3_DTCM_START + 0xff8 to choose the mask/reset value) so 'it returned 0xbabeface' can be tied to a firmware revision; (b) check whether the HFI queue ring is advanced by a CONSUMER (R261/R262 only proved the two records lie in the page, not that the CM3 ever read them), which separates 'the main loop runs' from 'only the init latch is written back'; (c) if the ring does advance, try a firmware-specific message instead of the mainline out-of-band bits. Keep it zero-side-effect: no HFI_CTRL_INIT write, no interrupt mask, no CM3 reset, no busy-spin bought time. Then the usual chain: rebuild the block, sync all gates, push a branch, dispatch CI, download and flatten both artefacts, static gate on the real artefacts plus self-prove against this round, runners and anchor, then boot the keys one at a time with the reboot gate armed before and after each.',
  '[ROUND 275 DONE, NEXT IS R276] The rail votes were already zero and writing them changes nothing, the BOOT_SLUMBER doorbell is never acknowledged (bit 30 stays clear) even by a freshly restarted CM3, and the doorbell is followed by info bit 23 (CM3_FAULT). R276 should measure how much of the out-of-band path this firmware implements at all: (a) ring other HOST2GMU_INTR_SET bits, starting with MSGQ pos 0 and then one bit at a time, to separate 'only BOOT_SLUMBER is unsupported' from 'the whole doorbell is unserviced'; (b) read the CM3_FAULT reason register (if one is readable) before and after the doorbell so the fault becomes a cause instead of a single bit; (c) write a legal non-zero GMU_BOOT_SLUMBER_OPTION value and ring the doorbell again, to see whether the firmware answers only under a 'it wants to sleep itself' semantic. All three stay zero-side-effect: no HFI_CTRL_INIT write, no interrupt mask, no busy-spin bought time. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot the keys one at a time with the gate armed before and after each.',
  '[ROUND 274 DONE, NEXT IS R275] The GX domain is off at rest (bit 16 = 0), the four GDSC writes raise bit 27 but POWER_UP_COMPLETE never sets, and the gfxcc clocks are not the gate (keys 185 and 186 identical). R275 splits gap G1 into the two remaining likely gates: (a) vdd_gfx itself - read gfxcc's BCM/power registers to see whether gfx rail power is requested and whether it arrives; (b) the AON reset-clamp timing - mainline releases the AON clamp around the GDSC power-up and this tree may be missing it. Three keys: read gfxcc BCM state; release the AON clamp in mainline order and then run the four GDSC writes; and replicate the full CX power-up sequence onto GX as a control. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot the keys one at a time with the gate armed before and after each.',
  '[ROUND 273 DONE, NEXT IS R274] The control-word tail is closed. The main attack returns to the GX power domain, which has never been powered up: see notes/GX-power-domain-status.md for G1 (what sets POWER_UP_COMPLETE bit 16), G2 (the gfxcc vdd_gfx and GX clock pre-conditions) and G3 (the meaning of cfg=01080400 bits 10/18/19). Three keys: key 184 = read gfxcc's vdd_gfx and the GX clock registers as they stand; key 185 = enable the gfxcc pre-conditions and then run the four GX GDSC writes again to see whether POWER_UP_COMPLETE bit 16 sets; key 186 = replicate the full CX-domain power-up sequence, write by write, onto the GX domain as a control. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 184, 185 and 186 one at a time with the gate armed before and after each.',
  '[ROUND 272 DONE, NEXT IS R273] The start word writes 0x5180 bit 0 to 1, but whether that is a clearable event or a latched state is not yet known, and the 0xfe bit pattern is still unexplained. Three keys: key 181 = after 0x5180 reads 1, clear the interrupt by hand once more and see whether 0x5180 falls back to 0 (the same test R253 key 120 used on GMU2HOST_INTR_INFO bit 23). Key 182 = read the whole 32 bits of 0x5180 and print it bit by bit, together with the neighbouring 0x517f/0x5184, to see whether the extra bits of 0xfe are just neighbour leakage. Key 183 = reproduce the 'clear AFTER the start word' failure of key 177 once more, to confirm it is repeatable and not a one-off. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 181, 182 and 183 one at a time with the gate armed before and after each.',
  '[ROUND 271 DONE, NEXT IS R272] Key 177 left the control word at 0xfe and never accepted a start; three keys should separate where that 0xfe comes from and re-confirm the ordering. Key 178: restart, then clear by hand and only then send the start word, to confirm pol=1 is reproducible when the clear precedes the start (the shape keys 175/176 used). Key 179: restart, do NOT clear, only read the control word over several polls, to see whether it sits at 0xfe or at 0 after a restart - separating a value the reset leaves from a value a bad start word creates. Key 180: restart, do NOT clear, write the start word and immediately re-read 0x5180..0x5183, to see which word the 0xfe tracks. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 178, 179 and 180 one at a time with the gate armed before and after each.',
  '[ROUND 270 DONE, NEXT IS R271] Key 175: clear the word by hand, restart the CM3 and then send NO start word at all - if the control word comes back to 1 on its own, the whole idea of a restored acceptance collapses. Key 176: clear, restart, then read the word ONCE before the start word and once after it, to separate the value a restart leaves from the value a start word sets. Key 177: clear, restart, then send two start words with no clear between them, to see whether the once-per-boot limit counts firmware runs rather than boots. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 175, 176 and 177 one at a time with the gate armed before and after each.',
  '[ROUND 269 DONE, NEXT IS R270] Key 172: the shape of key 169 but restart the CM3 before each start word (write QTBL_ADDR and INFO, pulse CM3_SYSRESET, clear PWR_COL_CP_RESP, poll), to see whether the one acceptance comes back with a fresh firmware run inside the same boot. Key 173: the same four starts but re-arm HFI_QTBL_ADDR onto a NEW page before the second start, to see whether acceptance depends on the queue table the firmware was pointed at. Key 174: start once, clear by hand, restart the CM3, then start again, stacking the clear and the restart to see whether that combination sets the bit again. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 172, 173 and 174 one at a time with the gate armed before and after each.',
  '[ROUND 268 DONE, NEXT IS R269] Key 169: inside one boot run start, hand clear, start, and then a start with no hand clear, to see whether a hand-cleared word stays clear for the rest of the boot. Key 170: write the control word to 1 by hand without any start word, to see whether software can set the bit that only the firmware set so far. Key 171: after the hand clear read CM3_FW_INIT_RESULT, PWR_COL_CP_MSG, PWR_COL_CP_RESP, GMU2HOST_INTR_INFO and sGFSR, to see whether the firmware changed anything else at that moment. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 169, 170 and 171 one at a time with the gate armed before and after each.',
  '[ROUND 267 DONE, NEXT IS R268] Key 166: six cycles of header write, dc civac, mask and start word inside one boot, to see whether only the first cycle ever waits. Key 167: read two candidate status words per cycle (HFI_CTRL_STATUS 0x5180 and 0x5181), to see whether a second word exists. Key 168: write HFI_CTRL_STATUS before the start word, to see whether the latched bit 0 can be reset by hand. Then the usual chain: rebuild the block, sync all four gates, push a branch, dispatch CI, download and flatten both artefacts, run the static gate on the real artefacts and self-prove it against the previous round, generate three runners and the anchor, and boot 166, 167 and 168 one at a time with the gate armed before and after each.',
  '[ROUND 163 2026-11-16, BISECT RUNNING] CI #265 (run 43854373803) builds 3f1de2be with only the R162 ArmCpu.cpp. Read its window the same way as every other run (gate, flash system_b, fastboot boot work/out/boot-r16.img, wait for recovery, arm-bcb, dd bs=4096 skip=13207739 count=8192, pull 32 MiB, compare boot_id against 584678385/629517746/935335677). Silent means the culprit is inside ArmCpu.cpp and the next bisect swaps only the early scm path; a new boot_id means the culprit is the probe file and bisect B splits gGpuStateReplay and the gputate row away from the armcpu_scm_call_full and s7 fields. device_ref must be a branch name: a short sha makes actions/checkout fetch refs/heads/<sha> and the job dies in Check out the device repository (#263). Delete the throwaway branches r163-ctl-ci258 and r163-b-armcpu-new when the bisect is finished.',
  "[ROUND 162 2026-11-16, PIPELINE CONTROL BUILD PENDING] CI #264 (run 43851484483) builds the device tree 3f1de2be, the tree whose payload ci258 booted on 2026-11-16, through a throwaway branch r163-ctl-ci258 because the device_ref input must be a branch or tag name: a shortened sha is fetched as refs/heads/<sha> and the checkout fails, which is how #263 died before compiling. When the artifacts land in work/tmp/r162-ctl-payload, flash that payload to system_b, boot once, wait 35 to 45 s, re-arm the BCB, pull the 32 MiB window and read the header first. A new boot_id means the pipeline is healthy and the difference is in our source, so bisect by file starting with package/EnchiladaAdrenoProbe.cpp. The same boot_id 629517746 means the difference is in the pipeline, the toolchain or the boot chain, and every attribution since ROUND 159 has to be re-read. Delete the throwaway branch after the run. Do not stack PAS experiments on a boot that writes no log line, and do not reflash twice in one round.",
  '[ROUND 162 2026-11-16, DEVICE RUN PENDING] One question, one boot, and the gate is unchanged: does the R162 kernel write a NEW boot_id and a gputate= row? Steps: gate scripts/check-reboot-to-twrp.py PASS 3/3; flash system_b with the R162 payload; fastboot boot work/out/boot-r16.img (fastboot writes progress to stderr, so the pwsh exit code 1 is not a failure); wait 35 to 45 s; scripts/reboot-to-twrp.py --arm-bcb-only; dd if=/dev/block/sda17 bs=4096 skip=13207739 count=8192 (busybox dd rejects 1M); pull the 32 MiB window. Read in this order: boot_id (935335677 = still silent, 629517746 = the R160 control window, anything else = the kernel reached the writer), then the gputate= row and its gxon field (ADRENO_DOMAIN_GX_ON_BIT is 16, not 31), then svt=, then ttbr0=. Do not stack PAS experiments on a boot that wrote no log line, and do not reflash twice in one round.',
  '[ROUND 161 2026-11-16, DEVICE RUN DISPATCHED] One question, one boot: with the re-issue path disabled by default, does XNU survive to the log writer and print gputate=? The run is dispatched: CI #261 (run 43836989899, device sha 99e3df33, extra_firmware_b64 plus layout a630_zap.mdt:6684,a630_zap.b02:1968). Sequence: wait for success, check the artifact statically (zero hits for the six forbidden literals, the two firmware halves ordered with gap <= 32, gputate= and rt= present), flash system_b with the #261 payload, fastboot boot, wait 35-40 s, re-arm the BCB, pull the 32 MiB window with dd bs=1048576 (busybox rejects 1M). Read in this order: boot_id (still 935335677 means the ring was never the cause and the hypothesis must be re-derived rather than patched a third time), gputate=gxon (bit 16 of the GX status word, not bit 31), svt= (SECVID_TRUST_CNTL; 0 means trusted memory disabled) and ttbr0 (non-zero means a page table already exists). Do NOT stack a PAS experiment on a boot that has not written a log row, and do not re-flash twice in the same round.',
  '[ROUND 160 2026-11-16, DEVICE RUN PENDING] One question, one run, and it is already coded: does the R160 kernel survive early boot far enough to write a NEW boot_id and a gputate= row? The run is: flash system_b with the #260 payload, fastboot boot, wait about 32 s, re-arm the BCB, pull the 32 MiB SHLOG window with dd bs=1048576 (busybox does not accept 1M), then read three things in this order - boot_id (R147 and R159 are both 935335677, so a NEW value is the pass), gputate=gxon (GX domain bit 16, not bit 31), and svt= (SECVID_TRUST_CNTL). Interpretation: gxon=1 means UEFI/bootloader already brought GX up and PAS may be unnecessary for this path; gxon=0 means the full chain is still required; svt=0 means trusted memory is disabled; ttbr0!=0 means a page table already exists. Do NOT pre-announce a PAS experiment on top of a boot that has not yet written a log row, and do NOT re-flash or re-run a failing boot in the same round - one boot, one window, then decide.',
  '[ROUND 101 2026-11-13, DEVICE-VERIFIED] The SMMU row now has its first input and the remaining work on it is concrete instead of exploratory. ias=48 means the TCR/TTBR words are computable for real (they already are: tcr=a0100080, tcr2=00038011, both matching round 83 derivation exactly), so what stands between this row and a programmed context is exactly two artifacts nobody has written: an ASID allocator and a populated LPAE page table. ORDER FROM HERE, unchanged in shape and now narrower: (1) the ASID allocator - an 8-bit field on this part (VMID16 clear), so a small bitmap over the 256 SIDs is sufficient, and it must be owned by whoever programs the bank; (2) the LPAE page table - 4 KiB granule is the supported and simplest of the three the part reports, and TTBR1 is the geometry this device derives, so the table must be built for the TTBR1 shape rather than assumed TTBR0; (3) then, and only then, the nine-write sequence from round 83 with the words this round measured into, followed by a TLB invalidate; (4) the stream must be made to fault for the context to receive traffic, which is the condition now living in adreno_iommu_admit_program() and still unmet (round 53 Busy=10). Nothing in (1)-(4) can be advanced by reading more of the vendor driver, and none of it needs the boot guarantee beyond what is already scripted.',
  '[ROUND 95 2026-11-13, HOST-VERIFIED + ARMED] The next step is a DEVICE RUN, and it is now a single-command question because the probe carries its own safety and its own verdict vocabulary. Arm enchilada-adreno=5, flash the payload, and read the stage5=run row. The three outcomes are pre-committed above so no interpretation is needed afterwards: cx_on_after=1 would be the port FIRST powered GPU and would let stage 4 obtain ias on the NEXT boot (stage 4 is already coded and gated; it refuses on a CX-DOWN board by design). If cx_on_after stays 0 while up=Ok, the finding is that the collapse clear at 0x106c plus the BIT(31) poll does not raise this rail on this boot path, and the next investigation is which rail is still voting - NOT a change to the plan, because the plan is the upstream one. If up fails, up_fail_index names the op and the fix is local to that op. Only after CX genuinely rises does the order resume: stage 4 yields ID2 and therefore ias, round-83 TCR/TCR2 become complete, and the remaining two SMMU inputs (ASID allocator, populated LPAE table) are what stands between this port and a real stage-1 context. Nothing in this list can be advanced by reading more of the vendor driver.',
  '[ROUND 94 2026-11-13, HOST-VERIFIED + FAIL-CLOSED] The order that follows is now unambiguous, because the only missing INPUT on the SMMU row has a named, coded, gated producer. (1) CX must come up, and that is a kernel-side genpd/clock backend that does not exist yet - it is the same power path rounds 51/56/57/58/59/61/62 modelled and round 62 gave an executor, but never a real bus. Until it exists, stage 4 will refuse on every boot and that is correct behaviour rather than a fault. (2) With CX up, stage 4 yields ID2 and therefore ias, and round 83 TCR/TCR2 become COMPLETE for the first time; the stage-1 context words can then be programmed once an ASID allocator and a populated LPAE table exist. (3) Those three inputs (ias, asid, page table) are precisely the prerequisites kgsl-smmu-stage1 has recorded since round 75, so this round does not shorten the list - it makes the first item reachable. (4) Only after the SMMU context is real does a Mesa freedreno path become possible at all, because freedreno needs a DRM/kernel interface (kms + gem + submit) that nobody has written for XNU, and bergamota own README still lists GPU acceleration under Working on rather than working. So the next artifact is the CX power backend, not another contract and not a firmware change. Nothing in this list can be advanced by reading more of the vendor driver.',
  '[ROUND 85 2026-11-13, DEVICE-SOURCED] The strict order is unchanged but its COST is now measured, and that is what this round bought. ias cannot be read from userspace on a DEVMEM-less kernel, so the stage-1 words derived in round 83 cannot be COMPLETED from userland either: the only path left runs through code in the kernel. That makes the next real step unambiguous and it is not another survey. In order: (1) CX power and the SMMU probe must both move INTO the XNU-side driver, because a userspace probe cannot see ID2 at all; (2) the driver reads ID2.UBS at probe exactly as arm-smmu.c:1879-1905 does, derives ias, then mixes it into the round-83 TCR/TTBR words - which is the first moment those words become complete; (3) zap-auth remains the largest single piece (an XNU SMC conduit to the SIP owner, a storage path turning the round-74 MDT parser into the LOADER S7 needs, and the S2/S3/S4 node-shape decision); (4) only then the round-28 gated GPUCC read as the first honest device action - and note it needs kernel-side MMIO too, for the same DEVMEM reason. Two things this round rules OUT so no future round wastes effort on them: a TWRP or userspace SMMU register probe is impossible on this boot image, and re-mounting debugfs will never yield ias because no such node exists. Anything that claims to read ID2 from userland on this device should be treated as an error. The three unmodelled prerequisites (device-proof, config-on, macos-frontend) still need a running driver or a macOS host. No device run of PORT code, no flash, no MMIO, m39510 NOT exercised.',
  '[ROUND 84 2026-11-13, CI-VERIFIED] Every contract module this port has written is now CI-compile/link-proven, including the round-83 stage-1 word derivation, so the modelling column of the admission table is as full as this workspace can make it. That does NOT move the verdict - it stays modeled=9 / satisfied=0 / BLOCKED - and it does not reorder the work: a compile proof of a contract satisfies nothing on the phone. What is left is therefore not another module and not another CI run for its own sake. The strict order is unchanged: (1) CX must come up first, because the four SMMU inputs and the round-77 ID2 dependency both need it; (2) with CX up the SMMU can be probed (ID2.UBS to learn ias) and programmed (the now-derived stage-1 words), which yields BOTH the translation regime and the VA aperture; (3) zap-auth remains the largest single piece - an XNU SMC conduit to the SIP owner, a storage path turning the round-74 MDT parser into the LOADER S7 needs, and the S2/S3/S4 node-shape decision; (4) only then does the round-28 gated GPUCC READ become the first honest device action. The three unmodelled prerequisites (device-proof, config-on, macos-frontend) still need a running driver or a macOS host and cannot be advanced from this workspace at all. This run CLOSED the last pending archive change: every archive unit this port has added since round 78 is now compiled and linked by the kernel own clang, so a further dispatch with no new unit would certify nothing new - it would be a ritual, not a proof. The next archive change that would justify a CI run is the XNU-side caller that actually programs the derived words, and that cannot be written before CX comes up.',
  '[ROUND 83 2026-11-13, HOST-VERIFIED] The stage-1 words are now derived from pinned sources instead of accepted as arguments, and the sequence is complete, which sharpens the remaining work on THIS row without moving the strict order. What the row needs next, in order, and none of it is a document: (a) ias, from an ID2 read that requires CX up - which is why the SMMU row cannot precede the power row and why round 77 already sequenced CX first; (b) an ASID allocator, since CONTEXTIDR and both TTBRn_ASID fields need an owned ASID and this port has none; (c) a populated 4 KiB-granule LPAE table, since TTBR is virt_to_phys(pgd) of an allocated table; and only then (d) the write path itself, where round 75 I3 and I4 become live: the target streams must FAULT before a context bank can be bound (round 53 measured Busy=10 in the firmware BYPASS handoff) and CX must be UP (round 35 measured 0x00005ff4 with BIT(31) clear). The one thing this round CHANGES about the order is diagnostic rather than structural: a future programmer can no longer be written against the round-75 six-write plan, because that plan would leave the context bank without a CBAR type, without VA64, without PASIZE, and with neither TTBR carrying an ASID - it would fault or translate against stale state and would look like a hardware problem. Strict order from here is otherwise UNCHANGED: (1) CX up first; (2) with CX up, probe ID2 to learn ias and program the stage-1 context, which yields BOTH the translation regime and the VA aperture; (3) zap-auth - an XNU SMC conduit to the SIP owner plus a storage path turning the round-74 MDT parser into the LOADER S7 needs, plus the S2/S3/S4 node-shape decision; (4) only then the round-28 gated GPUCC READ as the first honest device action. Nothing in (1)-(4) can be advanced by reading more of the vendor driver, because the vendor driver is not the artifact being built. The three unmodelled prerequisites (device-proof, config-on, macos-frontend) still need a running driver or a macOS host. No device run of PORT code, no flash, no MMIO, m39510 NOT exercised.',
  '[ROUND 66 2026-11-12, CI-VERIFIED] CI #233 DONE green: libEnchiladaAdreno.a 21 objects sha256 a1d20d90bb7a75d2 (CI #232 was 20 objects 678e1c6219cc110d), kernel.macho 126070784 B sha256 18bcb8e25b43, changed sha256 vs CI #232 proving a genuine relink. The size delta is OBSERVED not the proof (ROUND 43/45/59 lesson): the symbol assertions carry the weight. The 21st archive unit AdrenoDarwinKmdAbiV1.c is now CI-compile-proven, so ROUND 66 next_action item (1) is CLOSED. Strict order from here UNCHANGED: (2) the A6XX_GEN1 kernel backend that INSTANTIATES the derived plans behind full CX/GX genpd + 6 clocks + RPMh/PDC and TrustZone PAS auth for GPU_PAS_ID 13; (3) the real kgsl SMMU stage-1 context at 0x5040000 only AFTER a powered CX; (4) the OS Metal/IOSurface ABI and macOS frontend build with the new tu-darwin-abi-dir directory; (5) device verification of any of the above.',
  '[ROUND 67 2026-11-12, HOST-VERIFIED] The A630 Metal publish/discovery/client-window policy contract is DONE as a host-verified pure-C module (22nd archive unit AdrenoMetalPublishV1.c, 22nd host suite, 164-check cross verifier). Strict order from here UNCHANGED: (1) the A6XX_GEN1 kernel backend that INSTANTIATES the derived plans behind full CX/GX genpd + 6 clocks + RPMh/PDC and TrustZone PAS auth for GPU_PAS_ID 13; (2) the real kgsl SMMU stage-1 context at 0x5040000 only AFTER a powered CX; (3) the board-derived GPU VA map - the exact input the window-zero gate is waiting for; (4) the OS Metal/IOSurface ABI and the macOS frontend build; (5) device verification of any of the above.',
  '[ROUND 68 2026-11-12, CI-VERIFIED] CI #234 DONE green: the 22nd archive unit compiles and links in a real XNU kernel build with zero regression of the 21 earlier units; the round-67 policy contract is therefore CI-COMPILE/LINK-VERIFIED as well as host-verified. Strict order from here UNCHANGED: (1) the A6XX_GEN1 kernel backend that INSTANTIATES the derived plans behind full CX/GX genpd + 6 clocks + RPMh/PDC and TrustZone PAS auth for GPU_PAS_ID 13; (2) the real kgsl SMMU stage-1 context at 0x5040000 only AFTER a powered CX; (3) the board-derived GPU VA map - the exact input the window-zero gate is waiting for; (4) the OS Metal/IOSurface ABI and the macOS frontend build; (5) device verification of any of the above. CI #234 is COMPILE/LINK ONLY - no device run, no flash, no MMIO, m39510 NOT exercised.',
