  { kind = "device", reference = "evidence/console206.md", result = "G smmu slot=6 bank=4 plan=80000740/00000004 now=80000740/00000004 cb=000000e0: the DWC3 bypass entry is intact and used for 161323 endpoint commands.", command = "python scripts/test-cycle.py console206 --wait-return 900", revision = "7eeda1e01aa906ff3b2ac5fa58fdcfd244701c59" },
  { kind = "device", reference = "evidence/stage1-smmu-device.md", result = "enchilada-smmu: rc=0 SS slots=76 banks=45 pages=64 exids=0 valid=8 t0=8 t1=0 t2=0 scr0=002a0406 gfsr=00000000 ufs=5/2/bypass usb=6/4/bypass on boot_id 553412253: the read-only survey located both streams on hardware, and the UFS slot went from none to 5/2 after the SID defect was fixed.", command = "python scripts/test-cycle.py smmu2 --wait-return 1000", revision = "0d496779f92c5b62cba448956a52e59b19a95d1d" },
