  '[ROUND 101 2026-11-13, DEVICE-VERIFIED] ias IS MEASURED. The port read the SMMU ID2 register on the phone for the first time, and the value it had only ever held as an argument is now a measurement: ID2 = 0x00007511 -> ias = 48. THE ROW, verbatim from the log window: stage4=id2 id2=00007511 ver=2 ias_ok=1 ias=48 ipa=36 pa=36 oas2=36 ptfs4k=1 vmid16=0 words_ok=1 plan_ok=1 tcr=a0100080 tcr2=00038011. DECODED INDEPENDENTLY and matching the probe line field for field: IAS[3:0]=1 -> ipa 36; OAS[7:4]=1 -> pa 36; UBS[11:8]=5 -> va_size 48 through the DEFAULT arm of arm_smmu_id_size_to_bits() (P2:1727-1744) - the exact collapsing branch round 83 recorded as a trap, which this device lands in; PTFS_4K/16K/64K all set at BIT(12/13/14); VMID16 BIT(15) clear. NOTE THE DISAGREEMENT, which is the load-bearing detail: IAS=1 gives ipa=36 while UBS=5 gives va_size=48, because on a v2 SMMU the VA size comes from UBS and the IPA size from IAS. They are different fields and this part reports different values for them. CROSS-CHECK THAT MAKES IT A MEASUREMENT RATHER THAN TWO COINCIDENCES: TCR2 = 0x00038011 is SEP(0x7<<15) | PASIZE(1 = 36-bit) | AS(BIT4), exactly what round 83 derived for oas 36 with an AArch64 context; and TCR = 0xa0100080 is the TTBR1 geometry - EPD0 set, EPD1 clear, TG1 at bits[31:30] reading 2 = 4 KiB, and T1SZ = 0x10 = 16 in the HIGH half so 64-16 = 48 = ias. Reading T0SZ from the low half in this geometry returns 0 and would look like ias 64, so the halves must be identified before either is believed. Re-deriving round 83 own function for (ias=48, coherent_walk=0, ttbr1=1) yields 0xa0100080 EXACTLY. The measured word and the composed word agree. HOW THE DEVICE GOT HERE - five consecutive runs, each removing ONE wrong precondition that review had accepted: (98) verdict=3 refused-cx-down, because the gate used the CX word sampled BEFORE stage 5 raised the rail; (99) verdict=4 refused-clocks-off, because the probe hard-coded clocks_enabled=0 although the executor ha