  { kind = "host", reference = "evidence/stage5-gpu-probe-stage5.md", result = "ROUND 95 HOST-VERIFIED + ARMED, NOT RUN ON HARDWARE: probe stage 5 is the IOKit caller that connects the power-up chain, and the only stage of this probe that WRITES. The gap it closes is stated by the modules themselves - AdrenoPowerUpBackendV1 performs MMIO through the caller callbacks and nothing else (maps nothing, owns no window, no IOKit caller of its own) and round-64 AdrenoCallerV1 has the same boundary - so the executor was real and unreachable. ORDER: re-check the same gpucc_window_is_safe() gate stages 1-4 use and bind the window only after it passes; bind AdrenoGpuccWindowV1 and supply a REAL delay via IODelay because the window refuses an MMIO triple with a NULL delay (the GDSC plan genuinely waits between its collapse-clear write and the status poll, and a calibrated spin loop would be worse than none); obtain the bounded MMIO triple so every write goes through its bounds; run the caller with board facts (armed=1, gxpd_present=1, rcg_enabled=0, core_rate_hz=200000000 from a6xx_gmu.c, strict_gx=0); report THREE SEPARATE verdicts - up_status, precheck_status, and cx_before/cx_after/cx_on_after. THE LOAD-BEARING DISTINCTION: up=Ok means the writes happened, NOT that CX is on; round 35 measured cx=0x00005ff4 BIT(31) clear and nothing proves the collapse clear raises it, so up=Ok with cx_on_after=0 is a possible and meaningful outcome. Collapsing the two into one success flag is how a port invents a fact. SAFETY: no direct store (the verifier parses the comment-stripped source and asserts the only casts remain the two volatile window types); no invented delay loop; mmio.write32( never appears; default-off with mask stage < 1u || stage > 5u; board.toml moves enchilada-adreno=4 to =5 at the same byte count, joined line stays 970/1000. EVIDENCE: check-enchilada-adreno-probe.py 18/18, verify-enchilada-probe-stage5.py 38 checks, stage3 40/40, stage4 updated to the monotonic mask, verify-gpuprobe-device-2.py refined to assert the precise write property instead of a literal substring, full tree 63/64. NOT PROVEN: never flashed, never executed, has written no register. Outcome (a) would be the first time this port powered the GPU; outcome (b) would be a real finding that the rail did not rise. Even (a) does not satisfy kgsl-smmu-stage1, which still needs an ASID allocator and a populated LPAE table. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No flash, no reboot, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-enchilada-probe-stage5.py", revision = "a2aab9a2d2398aa179be3f3748a9b028d8bdf80f" },
  { kind = "host", reference = "evidence/stage5-gpu-probe-stage4.md", result = "ROUND 94 HOST-VERIFIED + FAIL-CLOSED, NOT RUN ON HARDWARE: probe stage 4 is the port FIRST kernel call path that can read SMMU ID2, the only source of ias. It exists because three doors closed: round 77 proved ias comes from a PROBE-TIME READ of ID2.UBS (P2:1879, :1904-1905) so no document supplies it; round 85 measured CONFIG_DEVMEM is not set (a mknod-ed /dev/mem fails ENXIO) and that the iommu debugfs tree is only io-pgtable + tests with find -maxdepth 2 returning one file, so userspace cannot reach it either. ORDER: read the GPUCC CX status at 0x05091540 (already measured by stages 1/2 in the same poll); ask the round-86 contract gate with struct adreno_iommu_gate_inputs whose cx_status_word IS the measured word, never a constant, which the verifier asserts negatively; if refused, log a row that NAMES the verdict and stop with no mapping and no read; if permitted, map ADRENO_BOARD_KGSL_SMMU_BASE (0x05040000) for the first time, read GR0_ID2 at byte 0x28 EXACTLY ONCE, dsb sy, then adreno_iommu_id2_decode + adreno_iommu_va_size + adreno_iommu_stage1_words so the real ias lands in round 83 TCR/TCR2. No ID2 bit position is re-derived here. EXPECTED ON THE CURRENT DEVICE: round 35 measured CX DOWN (cx=0x00005ff4, BIT(31) clear) and nothing has powered it since, so the expected row is stage4=refused verdict=N cx=00005ff4 cx_on=0 - the gate working, NOT the read failing, and a refusal says nothing about ias. WIRING: board.toml adds enchilada-adreno=4 (18 bytes plus separator) against a MEASURED 49 bytes of headroom, joined line now 970/1000; default-off; the mask accepts only 1/2/3/4 and the stage-3 verifier now pins that. EVIDENCE: check-enchilada-adreno-probe.py 18/18 (the only dereference is a read; no unexpected undefined symbols), verify-enchilada-probe-stage4.py 45 checks (gate struct, measured CX word, map only inside the permitted branch, single rd32 plus dsb, contract-only decode, no re-derived fields, no store through any pointer, no libc, pure LF, boot-arg budget), stage-3 verifier 40/40, full tree 62/63 (the 63rd needs a 40-hex revision by design). NOT PROVEN: never flashed, never run, reads no register today; a CX-DOWN refusal proves the gate and nothing about ID2; obtaining ias additionally needs CX up, which needs a genpd/clock backend this port lacks. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No flash, no reboot, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-enchilada-probe-stage4.py", revision = "d249e6c165e3f2fc9dfd32af9765ee1db696d57c" },
  { kind = "device", reference = "evidence/stage5-gpu-devmem-ceiling.md", result = "ROUND 85 DEVICE-SOURCED (read-only, NEGATIVE RESULT: ias is not readable from userspace). Two findings. (1) THE DEBUGFS SURFACE IS UNCHANGED: debugfs mounted briefly then removed and verified (BEFORE_MOUNTS=0, MOUNT_RC=0, UMNT_RC=0, AFTER_MOUNTS=0, AFTER_ENTRIES=0); io-pgtable/pages is 92 (re-confirms round 82); the whole iommu tree is io-pgtable and tests; find -maxdepth 2 returns ONE file (pgtable/pages), so there is NO va_size / address_size / ias / id2 node and NO kgsl-specific node (both tests/ entries are apps_iommu_*); the kgsl SMMU is still bound to arm-smmu and its modalias is still of:Narm,smmu-kgslT<NULL>Cqcom,smmu-v2. 92 pages prove tables exist, NOT how wide the VA space is. (2) THE DECISIVE ONE: CONFIG_DEVMEM IS NOT SET (config reads # CONFIG_DEVMEM is not set and # CONFIG_STRICT_DEVMEM is not set). The read-only route to ID2 at 0x05040028 is /dev/mem and this kernel does not provide it: a mknod-ed node is accepted (test -e says YES) but every read fails with ENXIO - dd says No such device or address - which is the kernel saying major 1 minor 1 was never compiled in. This is a HARD kernel-level exclusion, not a permission problem: root, an SELinux context or another mknod mode cannot fix it, only a DIFFERENT KERNEL. CONSEQUENCE: we have not read ias yet becomes ias is NOT READABLE from this boot image, which removes a false hope rather than creating one; ias can now only come from code running IN the kernel, which is exactly what kgsl-smmu-stage1 means and why it reads satisfied=0. A TWRP-side probe is NOT a shortcut (it needs a DEVMEM=y kernel or a module). NOTHING INFERRED FROM THE VANISHED BOOT LOG: dmesg holds about two minutes of wall clock (uptime 151128 s), so the arm-smmu probe line Stage-1: N-bit VA -> N-bit IPA (arm-smmu.c:1940) is gone, and zero smmu lines in dmesg is NOT evidence of absence. The round-28 GPUCC GDSC read of 0x05091540/0x05091010 is blocked by the SAME ceiling and was NOT attempted once provably impossible. Device restored exactly: still in recovery, not rebooted, zero debugfs mounts, the created node removed. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No MMIO write, no ioctl, no submission, no flash, no persistent file, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-enchilada-devmem-ceiling.py", revision = "e0f0640efe1a8a8da403b1b4f736f6167a88c977" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-239.md", result = "ROUND 84 CI-COMPILE-ONLY (the 29th archive object, round 83 compile-proven): CI #239 run 43335691372, workflow_dispatch, created 2026-11-13T00:16:06Z updated 00:32:07Z, completed/success, workflow head edb0593a, device ref main @ ab99958f (round-83 phase 4), job build 27 steps 0 failed. FIRST CI since #238 (round 78), closing a specific gap: rounds 79-82 were read-only evidence and prose, round 83 added real code (AdrenoSmmuCtxWordV1.c) that had a 10-group host suite and a 264-check cross-verifier but had never met the kernel clang - and host verification of code is not a compile proof. ARCHIVE: PASS: libEnchiladaAdreno.a (29 objects, sha256 d140c2aa89bc89aa); CI #238 was 28 objects sha16 f90f1a3267b71762, so the count ROSE BY ONE and the sha16 CHANGED - structural proof the new unit compiled and joined the link. kernel.macho 126,103,552 B vs 126,099,456 B = +4,096 B, the OPPOSITE of rounds 43/45/59/78 where a new object linked without growing the image; the two directions together are why SIZE IS NEVER THE PROOF. prelink.log: Experimental candidate 126103552 bytes, executable bytes unchanged, runtime unqualified. kernel.log 36,731,153 B CLEAN (no Undefined symbols, no Error 1); kernel-bootstrap.log 37,040,468 B is the INTENTIONALLY failing baseline (both present, plus _native_verified_root_probe) kept as differential evidence. ALL 18 adreno_smmu_ctx_* exports in the image, and round-77 va-map / round-75 smmu-stage1 (source left BYTE-IDENTICAL) / round-70 cp-ring / round-73 zap-auth / round-74 mdt / round-69 gen1-backend / round-67 publish / round-66 darwin-kmd / round-65-and-earlier all survive. BOUNDARY ASSERTED: no _writel(, _readl(, _IOServiceOpen, _IOConnectCallMethod, _qcom_scm_call or adreno_zap_shader_load symbol; stage3=plan steps=%u present, stage3=exec ABSENT. This CI uploads ONE log PER ARCHIVE, so there is NO AdrenoSmmuCtxWordV1.log and the verifier asserts that absence rather than inventing one. Compile/link proves the module is kernel-clang clean and linkable and proves NOTHING about the phone: no context programmed, no page table, no ASID, no ID2 read, no CX power-up. Admission table UNCHANGED modeled=9 satisfied=0 BLOCKED. No device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified.", command = "python -X utf8 scripts/verify-ci-239-adreno.py", revision = "7006a1e3f02f39c23d1be9827d3791c7067e7827" },
  { kind = "host", reference = "evidence/stage5-gpu-smmu-ctx-word.md", result = "ROUND 83 HOST-VERIFIED (the stage-1 context WORDS, and why round 75 six-write plan was incomplete): round 75 answers only the ORDER and takes every VALUE as an argument, so its own test passes tcr = 0x1234 - and its six writes are an incomplete SUBSEQUENCE of upstream nine (arm-smmu.c:566-653): CBAR, CBA2R, TCR2 and TTBR1 missing entirely, TTBR0 carrying no ASID although P2:540-548 puts one in bits 63..48, and CONTEXTIDR written although upstream writes it ONLY in the AArch32 branch (the pinned file holds exactly one ARM_SMMU_CB_CONTEXTIDR write site, at P2:625). NET 6 -> 9 writes: FOUR added, ONE dropped, so the net +3 is smaller than the register delta +4 and BOTH numbers are exposed in code (round75_writes() 6, plan_writes() 9) and asserted. Derived words, all form pinned sources: TCR from (ias, coherent_walk, ttbr1) per P1:393-412 + P3:944-999 = 0x00803518 coherent / 0x00802018 non-coherent / 0xB5180080 TTBR1 at ias 40; TCR2 from oas per P1:414-418 = 0x00038011 with AS / 0x00038001 without at oas 36 (SEP 0x7 always); CBAR = 0x0001F300 with the 8-bit VMID only when 16-bit VMIDs are absent; CBA2R VA64 + VMID16 at 31..16; MAIR = 0xF404FF44 split by P2:560-561 into MAIR0 0xF404FF44 / MAIR1 0; TTBRn = (asid << 48) | table for BOTH, so the ASID lands in the HIGH word at bit 16. TWO TRAPS: TG1_4K is 2 not 3 (P4:10-11) so importing 3 programs TG1_64K, and arm_smmu_id_size_to_bits() DEFAULT arm collapses 5 and everything else to 48 (P2:1727-1744). SCTLR stays LAST - round 75 one correct rule, preserved. Round 75 left BYTE-IDENTICAL. THREE inputs stay absent (ias from ID2.UBS, no ASID allocator, no populated table) and are derived into ready()==0; round 75 I3/I4 deliberately NOT repeated because they gate PROGRAMMING, not the word. Admission table UNCHANGED (modeled=1 already, nothing satisfied). Host suite 10 groups / 0 failures with an 82-check self-verifier whose count is pinned; SMMU_CTX_WORD_CROSS PASS (264 checks) re-deriving every word from 4 pinned sources; 28 host suites green; all 58 runnable verifiers green; strict freestanding arm64 Mach-O exit 0. Six stale 27-unit assertions moved to 28 and two PASS enumerations made cumulative (the round-78 drift class). No device run, no flash, no MMIO, CONFIG_XNU_NATIVE_ADRENO=n, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-smmu-ctx-word.py", revision = "3fbbd4ee98fee3c39709c8d820f8c4c2521b8b7f" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-233.md", result = "ROUND 66 CI-COMPILE-ONLY (2026-11-12): CI #233 run 43158161524 completed success (workflow_dispatch, 27-step build job, 0 failed steps) at device head 6e50eea85593. libEnchiladaAdreno.a 21 objects sha256 a1d20d90bb7a75d2; kernel.macho 126070784 B sha256 18bcb8e25b431b228bc64645f14b38477560063153b0d560c28bcb46a91a09df (changed sha256 vs CI #232 = genuine relink); clean kernel.log with no Undefined symbols or Error 1; intentionally-dirty kernel-bootstrap.log retained as differential evidence; all 8 darwin-kmd exports and 15 earlier unit names linked; stage3=plan present and stage3=exec absent. Honest boundary: CI compile/link only, NO device run, NO flash, CONFIG_XNU_NATIVE_ADRENO remains n, NOT a GPU driver, does NOT unblock stage 5, gpu stays host-verified.", command = "python -X utf8 scripts/verify-ci-233-adreno.py", revision = "0fd68e3466aa9129b66d984cdf7ffd189188e1c6" },
  { kind = "host", reference = "evidence/stage5-gpu-metal-publish.md", result = "ROUND 67 HOST-VERIFIED (2026-11-12): A630 Metal publish/discovery/client-window policy contract AdrenoMetalPublishV1 mirrors the generation-independent publish layer of NativeAdrenoPublish.cpp/NativeAdrenoMetalPlugin.mm (seed markers, IOAcceleratorES discovery chain, publish gate, backboardd routing, allow-list semantics with * / exact / trailing-star, open-type routing 0x4147/0x4148, connection cap 8) as freestanding pure C, and enforces the A630 window-zero honesty gate: all four GPU windows structurally ZERO, specified mask 0, any nonzero window rejected; the four sheng windows are exposed only as provenance via enchilada_publish_sheng_reference. DOC-CONSTANT CORRECTION carried: 256 MiB is the per-object cap MaxBoBytesShift=28, the real sheng client windows are 0x0AAA9000 = 178905088 B each and slot0 is 1 GiB at 0x20000000. Three independent verifications PASS: strict freestanding 4488 B arm64 Mach-O + 7-group host test (extern C defect caught and fixed), METAL_PUBLISH_CROSS: PASS (164 checks, 0 failures) re-derived from 7 sha256-pinned sources, and the 22-suite host runner + record checker (15 structured areas). NOT a GPU driver, no MMIO/BO/IOVA/firmware/MTLDevice/user client, no device run, no flash, CONFIG_XNU_NATIVE_ADRENO=n, does NOT unblock stage 5; gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-metal-publish.py", revision = "7a06723488a65777273505d48fd24582e54e0e45" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-234.md", result = "ROUND 68 HOST-VERIFIED (CI COMPILE/LINK ONLY, 2026-11-12): CI #234 run 43181798726 completed/success, 27 build steps 0 failed, 3 non-empty artifacts. libEnchiladaAdreno.a = 22 objects sha16 8a487d183190a276; kernel.macho 126070784 B magic cf fa ed fe sha256 d71d6a8b23ed83b321c40af5c68b53d9bdfec13a10f953ae141b705c8fb28acb (changed vs CI #233, 0-byte delta). All 19 round-67 publish exports + 8 round-66 darwin exports + 15 earlier unit names present; llvm-nm 70168 -> 70187 defined symbols (+19, LOST_FROM_233=0); clean kernel.log, intentionally dirty bootstrap. Two independent verifications PASS: scripts/verify-ci-234-adreno.py (60 checks, 0 failures, artifact-derived) and work/tmp/_verify_ci234_dotnet.ps1 (15 checks, 0 failures, .NET REST run/job/artifact metadata). NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-234-adreno.py", revision = "b4ac229a24d2d7cfdb527a6f86684af1882eb25f" },
  { kind = "host", reference = "evidence/stage5-gpu-gen1-backend.md", result = "ROUND 69 HOST-VERIFIED (ADJUDICATION ONLY, 2026-11-12): AdrenoGen1BackendV1 adjudicates the twelve A6XX_GEN1 backend prerequisites with two independent columns - modeled=5 (power-path, gpucc-windows, gmu-cold-boot, hfi-v1-transport, firmware-blobs) vs satisfied=0 - and a tri-state verdict BLOCKED. Encodes the A630 catalog pins (chip 0x06030001/0x06030002, revn 630, gmem 0x00100000, gmu_cgc_mode 0x00020202, prim_fifo_threshold 0x00180000, NO gmu_chipid), the 5-step a6xx_gmu_resume order with core 200000000 / hub 150000000 (A630) vs 200000000 (A740), SPTPRAC 0x778000 enable / 0x778001 disable with poll (val & 0x38) == 0x28 at 1..100 us, the four A630 GMU regions (debug/log/hfi SZ_16K at IOVA 0 + dummy SZ_4K at 0x60000000, total 0xd000, none executable, NO icache/dcache), the CP ring word offsets 0x0800/0x0802/0x0804/0x0806/0x0807, GPU_PAS_ID 13 with the explicit refusal to attribute it to sheng, and a6xx_has_gbif() == false for A630. Three independent verifications PASS: (1) host suite #23 = PASS: enchilada A6XX_GEN1 backend admission contract (9 test groups, 0 failures) inside the 23-suite runner; (2) scripts/verify-enchilada-gen1-backend.py = GEN1_BACKEND_CROSS: PASS (230 checks, 0 failures) over 8 sha256-pinned sources, including that all FIVE local copies of GPU_PAS_ID still agree, and both DTB clock counts (4 GMU / 6 GPU) parsed from the node text; (3) work/tmp/_r69_strict.py strict freestanding compile - arm64 Mach-O 5168 B magic cf fa ed fe, native COFF 4782 B, C++17 host link/run PASS, R69_STRICT: PASS. Record checker: enchilada: 15 structured areas checked. NOT a GPU driver, no device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-gen1-backend.py", revision = "33315e89a031c8426a97d00ce5c7a809ba90d380" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-235.md", result = "ROUND 69 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #235 run 43201433058 compiled and linked the 23rd archive unit AdrenoGen1BackendV1 inside a real XNU kernel build on device head 33315e89a031c8426a97d00ce5c7a809ba90d380 (committed before the dispatch). libEnchiladaAdreno.a reports 23 objects with a sha16 changed vs CI #234 8a487d183190a276; kernel.macho is a Mach-O 64 image whose sha256 changed vs CI #234 d71d6a8b23ed83b321c40af5c68b53d9bdfec13a10f953ae141b705c8fb28acb; all 16 enchilada_gen1_backend_* exports are present and the 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; the real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline; no qcom_scm and no ZAP loader symbol leaked into the image, and stage3=plan survives with no stage3=exec. Object count 22 -> 23 is the structural proof of a genuine rebuild (kernel size remains OBSERVED, not asserted, per rounds 43/45/59). NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=5 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-235-adreno.py", revision = "c673957ff859b98def773b394cf827458986eb93" },
  { kind = "host", reference = "evidence/stage5-gpu-cp-ring.md", result = "ROUND 70 HOST-VERIFIED (ORDER + PAYLOAD + REFUSAL ONLY, 2026-11-12): AdrenoCpRingV1 encodes the six-step A630 CP ring bring-up with its ONE conditional step (the shadow-RPTR write happens only when a shadow BO exists), the exact eight-dword CP_ME_INIT payload with the A7xx shape refused, the barrier-before-CP_RB_WPTR doorbell rule, the WHERE_AM_I vs hardware shadow strategy, and the CP_PROTECT encoding - and it records the FIVE constants no pinned source defines (CP_ME_INIT opcode, type-7 header encoding, MSM_GPU_RB_CNTL_DEFAULT, AXXX_CP_RB_CNTL_NO_UPDATE, ring size), so is_executable() is 0. The round-69 admission row moves cp-ring modeled 0 -> 1 (modeled 5 -> 6) while satisfied stays 0 and the verdict stays BLOCKED. Three independent verifications PASS: (1) host suite #24 = PASS: enchilada A630 CP ring init/doorbell contract (7 test groups, 0 failures) inside the 24-suite runner; (2) scripts/verify-enchilada-cp-ring.py = CP_RING_CROSS: PASS (139 checks, 0 failures) over 3 sha256-pinned sources plus an exhaustive define-scan proving the five macros are used and never defined; (3) work/tmp/_r70_strict.py strict freestanding compile - arm64 Mach-O 4048 B magic cf fa ed fe, native COFF 3703 B, C++17 host link/run PASS, R70_STRICT: PASS. The round-69 cross verifier re-runs green at 230 checks with the new row, and the record checker reports 15 structured areas. NOT a GPU driver, no device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-cp-ring.py", revision = "134c7a493e57b2a897c2794a35d01fc89ae7a227" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-236.md", result = "ROUND 70 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #236 run 43208981056 compiled and linked the 24th archive unit AdrenoCpRingV1 inside a real XNU kernel build on device head 134c7a493e57b2a897c2794a35d01fc89ae7a227 (committed before the dispatch). libEnchiladaAdreno.a reports 24 objects sha256 59e80bd40870c8d8 (CI #235 was 23 objects 588dee59442fc9d9); kernel.macho is 126074880 B Mach-O 64 sha256 9bd2d93910192a9c5d24c9aa9f297ebec85ce934674d50e5c38eaff9719b609e, changed vs CI #235 d266893097d713ce with a ZERO-byte size delta (observed, not asserted). All 11 adreno_cp_ring_* exports are present and the 16 gen1-backend + 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; independent llvm-nm 70203 -> 70214 defined symbols, exactly +11, LOST_FROM_235=0. The real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline; no qcom_scm and no ZAP loader symbol leaked into the image, and stage3=plan survives with no stage3=exec. NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=6 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-236-adreno.py", revision = "9b47bf42c6ff5d5f4c3bccdd9638a4d448b1b445" },
  { kind = "host", reference = "evidence/stage5-gpu-cp-ring.md", result = "ROUND 71 HOST-VERIFIED (re-record of the CP-ring contract after the constant derivation): three of the five round-70 unknowns are now DEFINED - U1 CP_ME_INIT 0x48 (adreno_pm4.xml:248), U2 the type-7 header (adreno_gpu.h:659-665 + PMAR_PARITY :637-643), U5 ring size SZ_32K 0x8000 (msm_gpu.h:311 + sizes.h:26) - while U3/U4 remain open because the AXXX_CP_RB_CNTL_* accessors come from the generated a6xx.xml.h which is absent. adreno_cp_ring_me_init_message() now emits the real nine-dword message 0x70C80008 + the 8-dword payload; can_encode_packet()=1 while is_executable()=0. Host suite #24 reports 10 test groups (3 new: parity/header, message, geometry); CP_RING_CROSS PASS (215 checks, 0 failures) over 7 sha256-pinned sources, with Domain A9 rewritten to check the round-70 claim as HISTORY and to prove U4 residual absence by exhaustive scan; strict freestanding compile arm64 Mach-O 5240 B, R71_STRICT PASS. Two defects were found and fixed inside this work: a capacity guard +2 where header+payload is +1, and three wrong parity expectations that the hand-computed table exposed.", command = "python -X utf8 scripts/verify-enchilada-cp-ring.py", revision = "256caedb61cf881ca683a4b29eccfa15ea62abd0" },
  { kind = "device", reference = "evidence/stage5-gpu-device-tree.md", result = "ROUND 71 DEVICE-SOURCED, READ-ONLY (static board facts only): the A630 board constants were read from the phone OWN live device tree on device 27f4f45d (TWRP recovery, uid=0(root), boot bb93c06b-ea20-4073-8836-fa26c5275240) using getprop/ls/find/od over /proc/device-tree only - no mount, no write, no dd, no reboot, no flash, no GPU register access. Every value matches the host models: chipid 0x06030001, highest-bank-bit 15, ubwc-mode 2, pas-id 0x0d=13 (GPU_PAS_ID 13 now DEVICE-confirmed rather than merely derived), firmware-name a630_zap, GPU 0x05000000+0x40000 / 0x05061000+0x800 / 0x0509e000+0x1000, GMU 0x0506a000+0x30000 and PDC 0x0b200000+0x300000, kgsl SMMU 0x05040000+0x10000, gpucc 0x05090000+0x9000, apps SMMU 0x15000000+0x80000 (plus a second 0x150c2000+0x20 window), SIX GPU clock names vs FOUR GMU clock names as DISTINCT lists, kgsl_3d0_irq SPI 300. scripts/verify-enchilada-device-tree.py re-reads all 17 facts from the live phone and cross-checks them against NativeAdrenoA630HwInit.h / AdrenoBoardInputs.h / AdrenoDomainState.h / NativeAdrenoABI.h: DEVICE_TREE_VERIFY PASS (53 checks, 0 failures). This is a device-sourced STATIC fact set, NOT a device run of the driver: no GPU code executed, no register read, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-device-tree.py", revision = "12dd711d1ee2993295f9bdf70ad599b2e6299f43" },
  { kind = "host", reference = "evidence/stage5-gpu-cp-ring-closed.md", result = "ROUND 72 HOST-VERIFIED (all five CP-ring constants CLOSED): the kernel register generator was pinned and RUN, not guessed. adreno_common.xml:116-123 holds the CP_RB_CNTL FIELDS (BUFSZ 0..5, BLKSZ 8..13, BUF_SWAP 16..17, POLL_EN 20, NO_UPDATE 27, RPTR_WR_EN 31) that a6xx.xml:2282 does not - the file round 71 had not searched. gen_header.py produced a6xx.xml.h (454595 B sha adcd25ca...) and adreno_common.xml.h (17781 B sha 373a5c88...); the generated accessors BUFSZ__MASK 0x3f/shift 0, BLKSZ__MASK 0x3f00/shift 8 and NO_UPDATE 0x08000000 reproduce the module hand-derived CP_RB_CNTL default 0x0000020C and A630 value 0x0800020C exactly, and the generated REG_A6XX_CP_RB_CNTL 0x00000802 confirms the word offset used since round 70. adreno_cp_ring_undefined_open() is 0 and adreno_cp_ring_is_executable() is 1 (derived from the open set, so it flips only when all constants exist). Host suite #24 cp-ring is 11 groups (testRbCntl: field placement, pack/unpack round-trip, the two branches differing EXACTLY in bit 27, refusals); CP_RING_CROSS PASS (251 checks, 0 failures) over 9 sha256-pinned sources; strict freestanding compile arm64 Mach-O 5472 B, R72_STRICT PASS. Every register word is COMPUTABLE; none has been WRITTEN - no ring, no IOVA, no MMIO, no doorbell, no fence, no submit. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-cp-ring.py", revision = "c209f37256cec1c7cf5387cd0470f98046906a24" },
  { kind = "host", reference = "evidence/stage5-gpu-zap-auth.md", result = "ROUND 73 HOST-VERIFIED (PAS/ZAP auth SHAPE + chain inventory, nothing executed): the Qualcomm PAS descriptor is SVC_PIL 0x02 / PAS_AUTH_AND_RESET 0x05 / ARGS(1) / SIP owner (qcom_scm.c:703-731, internal qcom_scm.h:97-102), and those numeric ids are NOT in the public qcom_scm.h - the verifier asserts both the public absence and the internal presence. The result-semantics trap `return ret ?: res.result[0]` is implemented: transport 0 AND PCTX 0 are both required, so a rejected image can never read as authorised. The EIGHT-step chain from adreno_gpu.c:43-156 is encoded with per-step present/reachable; EXACTLY ONE is present (S5 firmware-name, confirmed live) and S1 CONFIG_ARCH_QCOM is marked reachable=0 because XNU has no such Kconfig, so that step IS the SCM transport. adreno_zap_auth_ready() is derived from the count and is 0. Admission row moves zap-auth modelled 0 -> 1 (total 6 -> 7), satisfied stays 0, verdict BLOCKED. Host suite #25 (7 groups); ZAP_AUTH_CROSS PASS (114 checks, 0 failures) over 4 sha256-pinned sources with the eight anchors in strictly increasing source order; strict freestanding compile arm64 Mach-O 6336 B, R73_STRICT PASS; DEVICE_TREE_VERIFY PASS (58 checks) with new live ZAP-node checks confirming qcom,kgsl-3d0 has no zap-shader child while qcom,kgsl-hyp carries memory-region/firmware-name/pas-id. No SCM call, no firmware load, no memremap, no MMIO. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-zap-auth.py", revision = "8bce7292e66eb0ea475c4aa9626c3d9647a9a4e7" },
  { kind = "host", reference = "evidence/stage5-gpu-mdt-parser.md", result = "ROUND 74 HOST-VERIFIED (MDT/ELF32 parser, validated on the REAL device blob): AdrenoMdtV1 reimplements the four Qualcomm rules behind zap-auth S6/S7 from two sha256 pins (mdt_loader.c 12182 B, mdt_loader.h 2179 B): mdt_phdr_valid three independent conditions, get_size as min..ALIGN(max) over VALID phdrs only, the bNN suffix REPLACEMENT, and the metadata/split test ehdr+hash == file size. Parsing the real 6684-byte a630_zap.mdt gives ELF32 LE, e_machine 0xa4 EM_HEXAGON at byte 18, e_phnum 3, exactly ONE valid segment (ph[2] paddr 0x5000 filesz/memsz 1968, RELOCATABLE), region size 4096 and p_filesz sum 8652 - two DIFFERENT numbers, which is the conflation trap the API exposes adreno_mdt_filesz_sum() to catch. The three p_filesz values 148/6536/1968 are exactly the device .b00/.b01/.b02 sizes from the round-38 inventory, and ehdr 148 + hash 6536 = 6684 = the whole file, so this MDT is SPLIT. Verifications: host suite #26 with group 6 running against the real blob (REAL_BLOB bytes=6684, 6 groups, 0 failures); MDT_CROSS PASS (113 checks, 0 failures) with an INDEPENDENT Python reparse confronted with the device manifest; strict freestanding compile arm64 Mach-O 4880 B, R74_STRICT PASS. PARSER ONLY - no storage read, no allocation, no memremap, no SCM, no MMIO; loader_available()=0 and ready() derived so S6/S7 stay present=0 and the admission table does not move. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-mdt.py", revision = "c2746b3bbc63d9154fcaa0e1aa5f136816c74d56" },
  { kind = "host", reference = "evidence/stage5-gpu-smmu-stage1.md", result = "ROUND 75 HOST-VERIFIED (ARM SMMU v2 stage-1 context WORD MODEL): AdrenoSmmuStage1V1 computes the register words round 53 never computed, from 3 sha256 pins (arm-smmu.h 16630 B, arm-smmu.c 67693 B, io-pgtable-arm.c 38934 B). Ten CB byte offsets (SCTLR 0x00 through FSR 0x58), nine SCTLR bits, and the stage-1 default RECOMPUTED from those bits as 0x00001067 little-endian / 0x00001077 big-endian (CFIE|CFRE|AFE|TRE|M|S1_ASIDPNE, with E only for a BE CPU). S2CR: address 0xc00+(n<<2), PRIVCFG 25..24, TYPE 17..16 (TRANS 0/BYPASS 1/FAULT 2), EXIDVALID bit 10, CBNDX 7..0. The six-write plan orders MAIR0, MAIR1, TTBR0, TCR, CONTEXTIDR, SCTLR with SCTLR LAST because SCTLR.M enables translation; TTBR0 is the only 64-bit write. All FOUR inputs are recorded absent with citations: no page table, no ASID allocator, streams still in the firmware BYPASS handoff (round 53: Busy=10, id0=4c017e4c) so a non-faulting stream resolves to BYPASS and never TRANS, and CX measured DOWN (round 35: cx=0x00005ff4 BIT(31) clear). missing()==0xf and ready() derived so it is 0. Admission row moves kgsl-smmu-stage1 modeled 0 -> 1 (total 7 -> 8), satisfied stays 0, BLOCKED. Host suite #27 (6 groups); SMMU_STAGE1_CROSS PASS (117 checks, 0 failures); strict freestanding compile arm64 Mach-O 3496 B, R75_STRICT PASS. A first-draft defect was caught by the self-check: privcfg=1 was expected to equal the bare mask 0x03000000, but PRIVCFG is GENMASK(25,24) so 1 is 0x01000000 and only 3 fills the mask; both are now tested. No MMIO, no mapping, no page table. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-smmu-stage1.py", revision = "56d65299d339d27b011d110347df4780ac8f56fe" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-237.md", result = "ROUND 76 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #237 run 43242359273 compiled and linked the three units the kernel CI had never seen - AdrenoZapAuthV1 (73), AdrenoMdtV1 (74), AdrenoSmmuStage1V1 (75) - on device head 30b39fa1f864. libEnchiladaAdreno.a reports 27 objects sha256 a9b461e4f1378731 (CI #236 was 24 objects 59e80bd40870c8d8); kernel.macho is 126099456 B Mach-O 64 sha256 40d6fe4a5fdde2cdeaf0062a3c016346df01bf3d620dff339e60cc76c450918e, changed vs CI #236 9bd2d93910192a9c with a +24576 B delta (observed, not asserted). All 35 new exports present (11 zap-auth + 12 mdt + 12 smmu-stage1) and the 11 cp-ring + 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; independent llvm-nm 70214 -> 70261 defined symbols, exactly +47, LOST_FROM_236=0. The real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline. A verifier defect was found and fixed here: the qcom_scm boundary check fired on a CITATION string (round 73 anchor text) rather than a symbol, because CI #236 never contained the zap-auth unit; it now requires the callable forms _qcom_scm_ and qcom_scm_call( to be absent. NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=8 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-237-adreno.py", revision = "8c5c370fff31aa6a85ec1353ad5fe0f1aa0ed25d" },
  { kind = "host", reference = "evidence/stage5-gpu-va-map.md", result = "ROUND 77 HOST-VERIFIED (GPU VA aperture DERIVATION model): AdrenoVaMapV1 encodes the chain that produces the GPU VA aperture and proves it terminates in a RUNTIME register read, from 3 sha256 pins (adreno_gpu.c 29592 B, arm-smmu.c 67693 B, a6xx_gmu.c 48981 B). CHAIN: max(16 MiB, aperture_start)..aperture_end (adreno_gpu.c:224-225) <- (1<<ias)-1 (arm-smmu.c:828) <- ias = smmu->va_size (:735) <- id_size_to_bits(ID2.UBS) (:1904-1905) <- an ID2 READ AT PROBE (:1879). That last line is why the GPU VA range is not a board constant: it depends on the silicon ID2.UBS field, so no document or DTS can supply it and deriving it needs a powered SMMU. Both geometry shapes are implemented (plain TTBR0 and the TTBR1 variant at :824-828). The GMU own space (a6xx_gmu.c:1283, 0x0..0x80000000) is kept strictly distinct from the GPU space (adreno_gpu.c:227, named gpu) via adreno_va_gmu_end_is_gpu_end(), and the verifier recomputes the TTBR0 aperture for ias in {32,36,40,48} and asserts none equals 0x80000000. THREE blockers derived into ready()==0: ID2.UBS unread, no powered SMMU (round 35 cx=0x00005ff4), no page-table walker (round 75). DEPENDENCY EXPOSED: B1 is downstream of the SMMU CX requirement, so board-va-map sits behind kgsl-smmu-stage1 - CX must come first of FIVE inputs, not four. Admission row board-va-map modeled 0 -> 1 (total 8 -> 9), satisfied 0, BLOCKED. Host suite #28 (7 groups); VA_MAP_CROSS PASS (98 checks, 0 failures); strict freestanding compile arm64 Mach-O 2680 B, R77_STRICT PASS. A first-draft defect was caught: the test was labelled 6 groups while it contains 7; corrected upward and the verifier now prints the actual names on mismatch. No MMIO, no page table, no mapping. gpu STAYS host-verified; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-va-map.py", revision = "af9d70e5aab4109243c8cfae59e18b8580962a26" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-238.md", result = "ROUND 78 HOST-VERIFIED (CI COMPILE/LINK ONLY): CI #238 run 43252926421 compiled and linked AdrenoVaMapV1, the 28th archive unit and the first archive change since CI #237, on device head 7569b2cd4a11. libEnchiladaAdreno.a reports 28 objects sha256 f90f1a3267b71762 (CI #237 was 27 objects a9b461e4f1378731); kernel.macho is 126099456 B Mach-O 64 sha256 bdfdc5a05881b663b0450d283bbb015c6f8a590eb6e8aa2fe4ffd287d0d90cc5, changed vs CI #237 40d6fe4a5fdde2cd with a ZERO-byte size delta (the 28th object linked without growing the image, per rounds 43/45/59). All 10 va-map exports present and the 12 smmu-stage1 + 12 mdt + 11 zap-auth + 11 cp-ring + 19 publish + 8 darwin-kmd + 15 earlier exports did not regress; independent llvm-nm 70261 -> 70271 defined symbols, exactly +10, LOST_FROM_237=0, the 10 new names being precisely the AdrenoVaMapV1 exports. The real kernel.log is clean while kernel-bootstrap.log stays the intentionally failing baseline. A verifier defect was caught BEFORE the dispatch: verify-enchilada-gen1-backend.py still asserted zap-auth modeled=0, six items modelled, a 23-unit archive and an old PASS suffix, so four checks were failing while every other verifier passed - the same hand-coded-count drift class as round 77 phase 5; fixed to 27 units and nine modelled with the summary line corrected. NOT a GPU driver, no device run, no flash, no MMIO, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, A630 GPU windows stay all-zero, the four hard blockers remain open, the admission table is unchanged at modeled=9 satisfied=0 BLOCKED; gpu STAYS host-verified and this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-ci-238-adreno.py", revision = "a09368c930fe9c6aade458265a3ab786dbd9504c" },
  { kind = "device", reference = "evidence/stage5-gpu-kgsl-sysfs.md", result = "ROUND 79 DEVICE-SOURCED, READ-ONLY (the live vendor kgsl driver own view): read over adb cat from /sys/class/kgsl/kgsl-3d0 on device 27f4f45d in TWRP, no mount, no write, no ioctl, no MMIO, no flash. gpu_model = Adreno630v2 - a string present in NEITHER the pinned Linux v6.12 catalog (one revn-630 entry, chip ids 0x06030001/0x06030002, ADRENO_6XX_GEN1) NOR the vendored Mesa table (one GPUId(630)); it is a downstream kgsl naming convention and the port does NOT map it onto a catalog entry or claim what v2 implies. New board facts: 7 GPU frequency levels 710/675/596/520/414/342/257 MHz with max_gpuclk 710 MHz, and the ordering trap that gpu_available_frequencies DESCENDS while devfreq/available_frequencies ASCENDS the same seven values. Idle-but-live, measured: gpuclk 257 MHz under the msm-adreno-tz governor, gpu_busy_percentage 0, gpubusy 0/0, gpu_clock_stats seven zeros, reset_count 0, preemption 0, ifpc 1 with ifpc_count 0x0, sptp_pc 1, popp 0, idle_timer 80, usesgmem 1, hwcg 1 - so the GPU is BOUND AND HEALTHY and has NEVER BEEN DRIVEN. Also dev 233:0, OF_NAME qcom,kgsl-3d0, OF_FULLNAME /soc/qcom,kgsl-3d0@5000000, OF_COMPATIBLE qcom,kgsl-3d0 + qcom,kgsl-3d, and power/runtime_status unsupported with both runtime times 0. scripts/verify-enchilada-kgsl-sysfs.py re-reads all 28 attributes live and confronts them with both pinned sources: KGSL_SYSFS_VERIFY PASS (61 checks, 0 failures). NOT a device run of port code: no GPU register, no MMIO, no PAS, no SMMU, CONFIG_XNU_NATIVE_ADRENO=n, windows all-zero, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-kgsl-sysfs.py", revision = "dd9949801fce54b01bdf180e20cfa9ac70ad7c0e" },
  { kind = "device", reference = "evidence/stage5-gpu-kgsl-globals.md", result = "ROUND 80 DEVICE-SOURCED (kgsl globals under a briefly-mounted debugfs, then removed and verified removed): /sys/kernel/debug/kgsl/globals lists 17 global objects with REAL sizes - setstate 4096, gpu-qdss 262144, memstore 32768, scratch 4096, FOUR complete ring sets (pagetable_desc 4096 + profile_desc 4096 + ringbuffer 32768 each) and profile 196608 - and EVERY ONE has IOVA 0x0000000000000000-0x0000000000000000, every range degenerate (start == end). active_cnt = 0 with an EMPTY ctx/ directory, five log_level_* all 3, and debug/strict_memory = 0 so the zeros are not an accounting artefact. Mount state before: 0 debugfs mounts and 0 entries; after umount: 0 and 0, UMNT_RC=0 - device restored exactly. This MEASURABLY confirms rounds 53 and 77: the target streams sit in firmware BYPASS (Busy=10, id0=4c017e4c) so nothing reaches translation, and with no programmed kgsl SMMU there is no aperture - the all-zero table is what that looks like from the driver side. Combined with round 79 reset_count 0 / clock_stats all zero / busy 0 %, the GPU is bound, fully allocated and NEVER DRIVEN. Consequence for board-va-map: the reference implementation is itself at zero, so there is no working VA layout to copy - sharper than absent. The CAUSE of the zeros is deliberately NOT claimed: deferred-until-submit and never-programmed both fit, and deciding needs a submission this round did not make (a state change needing its own authorization). scripts/verify-enchilada-kgsl-globals.py re-reads the table live (mounting then ALWAYS unmounting in a finally block and asserting the mount count restored): KGSL_GLOBALS_VERIFY PASS (53 checks, 0 failures). No GPU register, no MMIO, no ioctl, no submission, no flash, CONFIG_XNU_NATIVE_ADRENO=n, windows all-zero, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-kgsl-globals.py", revision = "5e549b07f3929b0746d18dd06e782060ea7a2ef5" },
  { kind = "device", reference = "evidence/stage5-gpu-smmu-bound.md", result = "ROUND 82 DEVICE-SOURCED (the kgsl SMMU is BOUND and 92 page-table pages exist; corrects round-75 wording): debugfs mounted briefly then removed and verified (before 0 mounts / 0 entries, after UMNT_RC=0 / 0 / 0). MEASURED: /sys/kernel/debug/iommu/io-pgtable/pages = 92 live page-table pages; /sys/bus/platform/drivers/arm-smmu/ holds BOTH 5040000.arm,smmu-kgsl and 15000000.apps-smmu, so the vendor kernel ships mainline arm-smmu and bound it to the dedicated kgsl SMMU at 0x5040000; the kgsl SMMU modalias is of:Narm,smmu-kgslT<NULL>Cqcom,smmu-v2, confirming the round-21 compatible string; and both GPU and SMMU report power/runtime_status unsupported with both runtime counters 0, so zeros must not be read as never powered. NOT present: any kgsl-specific iommu test or per-context node (only the two apps_iommu_*_test_device entries). THE CORRECTION: I1 no-page-table becomes 92 pages exist; I2 no-ASID-allocator stays accurate FOR THE PORT though the vendor arm-smmu allocates ASIDs with no view exposed here; I3 and I4 unchanged (round 53 Busy=10 id0=4c017e4c; round 35 cx=0x00005ff4). Honest statement: the PORT has no page table and no ASID allocator; the DEVICE has both inside a driver the port cannot use. This also re-reads round 80 all-zero IOVAs: tables exist while every object is at IOVA zero is consistent with I3 bypass. Round 75 four blocker identifiers and its DERIVED ready() are deliberately unchanged - wording correction, not a reversal. scripts/verify-enchilada-smmu-bound.py re-reads the device (always unmounting in a finally block): SMMU_BOUND_VERIFY PASS (35 checks, 0 failures). No GPU register, no MMIO, no ioctl, no submission, no flash, CONFIG_XNU_NATIVE_ADRENO=n, windows all-zero, gpu STAYS host-verified, m39510 NOT exercised; this does NOT unblock stage 5.", command = "python -X utf8 scripts/verify-enchilada-smmu-bound.py", revision = "749e20c18d5bf9d4f1e9f013e37992df16407679" },
  { kind = "host", reference = "evidence/stage5-gpu-darwin-kmd-abi.md", result = "ROUND 66 HOST-VERIFIED (2026-11-12): A630 Darwin-KMD tu-darwin-abi-dir directory contract AdrenoDarwinKmdAbiV1 mirrors the generation-independent NativeAdrenoABI.h wire ABI (8 constants, 16 methods, 20 structs, 16 layout asserts in C++ and C11 branches) as freestanding pure C, pins 4 A630 DeviceInfo fields (0x143) and refuses all board-derived fields (0x6bc). Two independent web_fetch reads prove GPUId(630) a6xx_gen1 at the EXACT Mesa commit 85fda3b36405bcaea8bffc64aa4f2651dc90770d that UniXNU builds; the pinned device table is vendored into tracked scripts/data. Three verifications PASS: strict 2232 B arm64 Mach-O + 6-group host test, DARWIN_KMD_ABI_CROSS 176 checks from 7 sha256-pinned sources, and the 21-suite host runner + record checker. NOT a GPU driver, no MMIO/BO/IOVA/firmware/MTLDevice/user client, does NOT unblock stage 5, no device run, no flash, no CI; gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-darwin-kmd-abi.py", revision = "68b0810ea3f86acba83d81369b44ed3fc9bc14ff" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-232.md", result = "ROUND 65 CI-COMPILE-ONLY (2026-11-12): CI #232 run 43142322338 completed success (workflow_dispatch, 27-step build job, 0 failed steps) at device head e2adac8e. libEnchiladaAdreno.a 20 objects sha256 678e1c6219cc110d; kernel.macho 126066688 B sha256 a69f8e7dbba316 (+20480 B vs CI #231, changed sha256 = genuine relink); clean kernel.log 36731148 B with no Undefined symbols or Error 1; intentionally-dirty kernel-bootstrap.log 37040302 B retained as differential evidence; all 14 metal-seam exports and 13 earlier unit names linked; stage3=plan present and stage3=exec absent. Two independent verifications PASS: CI232_ADRENO_VERIFY: PASS (45 checks, 0 failures) over the downloaded artifacts, and DOTNET_VERIFY_CI232: PASS (14 checks, 0 failures) over run/job/artifact metadata. Honest boundary: CI compile/link only, NO device run, NO flash, CONFIG_XNU_NATIVE_ADRENO remains n, no MTLDevice, no kernel backend, does NOT unblock stage 5, gpu stays host-verified.", command = "python -X utf8 scripts/verify-ci-232-adreno.py", revision = "9701e0f1c3fc4657f8b2f3a49cc9c725b45539e3" },
  { kind = "host", reference = "evidence/stage5-gpu-metal-seam.md", result = "ROUND 65 HOST-VERIFIED (2026-11-12): A630 Metal establishment-chain seam AdrenoMetalSeamV1.h/.c mirrors the generation-independent NativeAdrenoABI.h wire ABI (version 2, 16 methods, 128 buffers, 256 MiB per object, 20 static_asserts) as freestanding pure C; pins the 3 A630 DeviceInfo fields and refuses all 8 board-derived fields; models the 9-stage establishment chain with blocker mask 0x1f; compiler available but frontend_allowed=0. Two independent verifications PASS: strict freestanding 4176 B arm64 Mach-O + 6-group host test, and METAL_SEAM_CROSS: PASS (80 checks, 0 failures) re-derived from 4 sha256-pinned sources. NOT a GPU driver, no MMIO/BO/IOVA/firmware/MTLDevice/user client, does NOT unblock stage 5, archive NOT rebuilt locally, no device run, no flash, no CI; gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-metal-seam.py", revision = "d131433a29bd6df860428ed7650157e11b7cc9b0" },
  { kind = "host", reference = "evidence/stage5-gpu-gmu-bus-v1.md", result = "ROUND 44 HOST-VERIFIED (2026-11-10): A6XX_GEN1 GMU bus adapter AdrenoGmuBusV1.h/.c translates the AdrenoGmuBootV1 domain/word-offset op model to real MMIO windows (word-offset addressing offset<<2, derived RSCC window gmu+0x23000, per-domain byte guards, fail-closed refusals). Two independent verifications PASS: host runner 9 suites incl. gmu-bus-v1 (7 groups) and GMU_BUS_V1_CROSS: PASS (40 checks, 0 failures). Strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow EXIT=0. CI units updated: archive 7 -> 9 objects (AdrenoGmuBootV1.c + AdrenoGmuBusV1.c added, compiled-not-executed). NO device run, NO MMIO mapped, NO power action; gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-gmu-bus-v1.py", revision = "65ad956b66cee6961b56852296bdf2a6132038bf" },
  { kind = "host", reference = "evidence/stage5-gpu-feasibility.md", result = "HOST-VERIFIED A630 identification + feasibility audit (2026-11-08): three independent research passes (Linux v6.12 a6xx_catalog.c/a6xx_gmu.c, vendor DTB, official GPU guide + 246 decoded device logs). Pass 1 host runner: PASS 10 test groups + sanitizers-off PASS; Pass 2 strict C11 -Wconversion/-Wsign-conversion/-Wshadow/-pedantic compile exit 0 + independent adreno-dump (chip=06030001 gen=1 revn=630 gmem=00100000 legacy=1, assess(A630)=06 FIRMWARE|BACKEND, assess(A740+fw+backend)=00 FEASIBLE). Decision: full stage-5 Metal path BLOCKED (3 proprietary A630 firmware blobs absent, cross-generation backend required per guide section 1, closed Metal ABI, zero GPU-driver literals in 246 logs). Honest correction: CoreImage GLContext crash has no literal log evidence; real CRASH rows are PerfPowerServices sig6. No CI / no flash / no device verification.", command = "python scripts/check-enchilada-adreno-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe --out work/tmp/adreno-host-out", revision = "d83634af814ca3439d2512b8886801c57a2d3279" },
  { kind = "host", reference = "evidence/stage5-gpu-a630-registers.md", result = "ROUND 20 HOST-VERIFIED (2026-11-09): A6XX GEN1 (A630) hw_init register map derived by UniXNU's upstream pin-before-derive method from 8 SHA-pinned Linux v6.12 sources. 50 A6XX dword offsets (A630 GMU CGC 0x09309 vs A7XX 0x23b09), 105 a630_hwcg, 32 a630_protect, 4 A7XX-only names excluded. Two independent verifications PASS: (1) extended host runner 10+3 groups, (2) strict C11 + C++17 -Werror compile of a real consumer + independent 32-protect re-encoding cross-check + derive --check. Corrections: no chip-id register (DT equality), 3 A630 blobs public but signed ZAP MDT chain vendor-only, Turnip/IR3 already supports A630, UniXNU wire ABI generation-independent, AdrenoHfi.h modern-only excludes legacy HFI v1. [SUPERSEDED by Round 21] 'GPU SMMU SID/mask unverified (board DTS 404)' - the DTB is local; see evidence/stage5-gpu-a630-board.md. No CI / no flash / no device verification / no register read / no firmware load.", command = "python -X utf8 scripts/derive-a630-hwinit.py --check", revision = "6aebfac3ea29488c8967a61992c766f09664510c" },
  { kind = "host", reference = "evidence/stage5-gpu-a630-board.md", result = "ROUND 21 HOST-VERIFIED (2026-11-09): GPU board inputs extracted from the sha256-pinned vendored Mu-Silicium enchilada.dts (784857 B, sha e590ee...275, 4 byte-identical local copies, same DTB behind 3 device-verified stages). RETRACTS the Round-20 'GPU SMMU SID/mask UNVERIFIED (board DTS 404)' claim: the 404 was a subagent fetch failure, not an absent file. GPU uses a DEDICATED kgsl SMMU arm,smmu-kgsl@5040000 (qcom,smmu-v2, #iommu-cells=1 SID only NO mask, phandle 0x1ac), NOT apps_smmu @0x15000000 (flash #8's target). Context-bank SIDs 0/2,1/4/5, ALL GPU iommus use 0x1ac NONE 0x29. Two independent verifications PASS: ENCHILADA_GPU_BOARD_EXTRACT: PASS 18 checks + ENCHILADA_GPU_BOARD_CROSS: PASS 21 checks (DTB vs device-verified C constants vs sha-pinned Linux v6.12 a6xx_catalog.c vs AdrenoBoardInputs.h 26 #defines). Extended host runner 10+3+5 groups + strict C11/C++17 -Werror compile of a real consumer. Vendor-vs-mainline honesty: mainline msm_iommu_new(gmu->dev,0) is generic. STILL HOST-VERIFIED: no device register read, no SMMU context programmed, no firmware load.", command = "python -X utf8 scripts/verify-enchilada-gpu-board.py", revision = "5128b7ab9c915242b46e3c58794618c53c08df78" },
  { kind = "host", reference = "evidence/stage5-gpu-power-domain.md", result = "ROUND 22 HOST-VERIFIED (2026-11-09): the Round-21 step of reading a safe register (RBBM_STATUS 0x210) on device is UNSAFE and SUPERSEDED. GPU 0x5000000, GMU 0x506a000 and the dedicated kgsl SMMU 0x5040000 share the collapsible gpu_cx/gpu_gx domain (two nodes prove the shared rail: gpu :23667 vddcx-supply 0x1a4 = gdsc@0x509106c gpu_cx_gdsc; kgsl smmu :13967 vdd-supply 0x1a4; second rail :23668 vdd-supply 0x2a9 = gdsc@0x509100c gpu_gx_gdsc), so a cold bus read can hang; the safe apps_smmu 0x15000000 survey worked only because that node has qcom,skip-init and no supply/clocks. Two independent verifications PASS: ENCHILADA_GPU_POWER_EXTRACT 23 checks (DTB sha e590ee...275 across 4 copies) + ENCHILADA_GPU_POWER_CROSS 45 checks (DTB vs SHA-pinned a6xx_gmu.c/a6xx_gpu.c markers vs AdrenoPowerGate.h; module asserted to contain no MMIO call), plus extended host runner 23 groups. Built a fail-closed gate: adreno_power_mmio_permitted() requires all 7 preconditions and adreno_power_current_state() is all-zero (CONFIG_XNU_NATIVE_ADRENO=n). No CI / no flash / no device verification / no register read / no regulator or GDSC touched.", command = "python -X utf8 scripts/verify-enchilada-gpu-power.py", revision = "6d708a59c9e9983c03b983c33f099b9e4dbd9d33" },
  { kind = "host", reference = "evidence/stage5-gpu-domain-state.md", result = "ROUND 28 HOST-VERIFIED (2026-11-10): GPU domain-state safe-read design. Refines the Round-22 prohibition into a testable step by identifying the GPUCC GDSC status registers that stay readable while the gpu_cx/gpu_gx domains are collapsed, because gdsc.c:103-117 polls them DURING a transition. Corrects a natural DTB misreading: the cx node reg 0x509106c is the CONTROL register, while gdsc.c:66-71 prefers gds_hw_ctrl 0x1540, so the CX status register is 0x05091540 with test BIT(31); the gx node sets POLL_CFG_GDSCR so its status is 0x05091010 with POWER_UP_COMPLETE BIT(16) / POWER_DOWN_COMPLETE BIT(15). Records that the GMU node numerically swallows the GPUCC window and therefore an explicit carve-out is required, and that the cx hw-ctrl-addr 0x1a is a vendor register index not an address. Three pinned inputs sha256-verified: gpucc-sdm845.c 80c2fbef5c65df98..., gdsc.c e1210770ad3e4406..., gdsc.h ba487640dc1a0acb.... Two independent verifications PASS: ENCHILADA_GPU_DOMAIN_STATE_EXTRACT 73 checks + ENCHILADA_GPU_DOMAIN_STATE_CROSS 117 checks (DTB vs C header vs upstream gdsc source), plus 56 host checks and a zero-warning strict C11/C++17 compile. The module is asserted to contain no MMIO symbol at all. No CI / no flash / no device verification / no register read.", command = "python -X utf8 scripts/verify-enchilada-gpu-domain-state.py", revision = "74f1a7bf94a51eff9f0b7dcdecf94065d2c5ed9a" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-archive.md", result = "ROUND 29 HOST-VERIFIED (2026-11-10): the four NativeAdreno C modules plus the GPUCC probe shim become a CI-built, force_load-ed kernel archive (libEnchiladaAdreno.a, 5 objects), closing the gap that they had only ever been compiled by the host runner against stubs. Added scripts/build-enchilada-adreno.py, package/EnchiladaAdrenoProbe.cpp, host-only iokit-stub headers, and scripts/check-enchilada-adreno-probe.py (18 checks: arm64 Mach-O x5, enchilada_adreno_poll defined, no unexpected undefined symbol, every cast volatile-qualified, no store through a pointer). Wired the 7th -Wl,-force_load in configs/enchilada_defconfig:36, the 23rd builder in board.toml, and a weak_import declaration plus 1 Hz monitor call in package/BootProgress.c; package/BootProgressStubs.c stays byte-identical. The shim refuses to map anything unless five predicates hold, including the GPUCC carve-out assertion that would otherwise let the GMU DT node reg 0x506a000 0x30000 swallow the only legal register. check-enchilada-archives-linked.py: PASS 7 force-loaded archives / 7 builders covered (was 6/6). No CI run dispatched, no flash, no device verification, no register read, no firmware load, CONFIG_XNU_NATIVE_ADRENO=n unchanged.", command = "python -X utf8 scripts/check-enchilada-adreno-probe.py", revision = "bb17b67f2e4b655c810a59ecbd41ab16cd4a69cd" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-217.md", result = "ROUND 30 CI-VERIFIED BUILD/LINK (2026-11-10): kernel CI run 42726356348 (#217) concluded success on device repo HEAD adb15ad5c3043cd9a6c0b72fef0bba151518c575. Independent Domain A (-logs artifact): archive-23-build-enchilada-adreno.log is exactly PASS: libEnchiladaAdreno.a (5 objects, sha256 24b9b6eec7f70413), all 9 build-enchilada logs successful, 23 archive logs with no hard failure marker. Independent Domain B (-kernel artifact): kernel.macho is 126,013,440 bytes with magic 0xfeedfacf and contains _enchilada_adreno_poll (1), enchilada_adreno_poll (2), _enchilada_smmu_poll (1), enchilada-adreno (11), the 1 Hz replay format, the safety-gate refusal string, GPUCC, cx_on, libEnchiladaAdreno (5), and all 4 module prefixes. A linked symbol proves -force_load took effect. No device, no flash, no register read, no firmware load; status stays host-verified and CONFIG_XNU_NATIVE_ADRENO=n remains.", command = "python -X utf8 scripts/verify-ci-217-adreno.py 42726356348", revision = "0efa182bda9f9f2e90e1059c598b6eef924a0db0" },
  { kind = "host", reference = "evidence/stage5-gpu-hfi-v1.md", result = "ROUND 31 HOST-VERIFIED (2026-11-10): A630 legacy GMU HFI v1 transport encoded as freestanding pure-C with 7 source-anchored deltas from sha-pinned a6xx_hfi.c (22853 B, f62c802d...). Two independent verifications PASS: host runner 7 groups / 94 checks and verify-enchilada-hfi-v1.py 46 checks (pinned upstream + modern contrast + derived module). Pre-CI arm64 Mach-O strict compile exit 0; wired into libEnchiladaAdreno.a as the 6th object. This is a wire-protocol MODEL with NO kernel caller, no firmware, no MMIO and no device; CONFIG_XNU_NATIVE_ADRENO=n unchanged. No CI green run for this object yet, no flash, no device verification.", command = "python -X utf8 scripts/verify-enchilada-hfi-v1.py", revision = "025d19ef2f67d53dd76e4685a8f5dc9b68b81e2b" },
  { kind = "host", reference = "evidence/stage5-gpu-ci-218.md", result = "ROUND 32 CI-VERIFIED BUILD/LINK (2026-11-10): kernel CI run 42743495901 (#218) concluded success on the round-31 tree (device repo head bce4c5886b71c4c057b7126b3b67f3ad34a2f780). Independent Domain A (-logs artifact): archive-23-build-enchilada-adreno.log is exactly PASS: libEnchiladaAdreno.a (6 objects, sha256 c39ed4de2c954b34), SIX objects versus the FIVE of CI #217 (24b9b6eec7f70413), all 9 build-enchilada logs successful, 23 archive logs with no hard failure marker, kernel.log 36,731,148 chars with no Undefined symbols. Independent Domain B (-kernel artifact): kernel.macho is 126,017,536 bytes with magic 0xfeedfacf and contains all nine _AdrenoHfiV1* symbols (InitializeStopped / MakeHeader / Send / Poll / Exchange / StartupTable / StartupStepCount / StepName / IsLegacyStart) each once, plus PERF_TABLE_V1 / FW_VERSION / BW_TABLE, the archive name, the enchilada-adreno boot-arg and _enchilada_adreno_poll; the four older module prefixes remain. Second independent verification: scripts/verify-ci-218-differential.py -> CI218_DIFFERENTIAL_VERIFY: PASS (24 checks, discriminates against the CI #217 baseline which has 5 objects and ZERO _AdrenoHfiV1* symbols, image 4096 bytes smaller). No device, no flash, no register read, no firmware load; status stays host-verified and CONFIG_XNU_NATIVE_ADRENO=n remains.", command = "python -X utf8 scripts/verify-ci-218-hfi-v1.py 42743495901", revision = "87fb97e75aaf601aa87a6166956a2fc52a891ec3" },
  { kind = "host", reference = "evidence/stage5-gpu-firmware-v1.md", result = "ROUND 33 HOST-VERIFIED (2026-11-10): A630 legacy GMU firmware-load contract encoded as freestanding pure-C. Contrast: sheng AdrenoFirmwarePlanGmu() MODERN 16-byte block_header segmented image vs a6xx_gmu.c:739-750 LEGACY ONE flat ITCM write to REG_A6XX_GMU_CM3_ITCM_START (0xc00) with a 0x8000 cap. Three public blobs observed from ONE reachable mirror (jsdelivr + GitHub API base64 agree): a630_sqe.fw 34188 B sha 1c21b527d9183487, a630_gmu.bin 32768 B sha da8d9b1b1f5c1a0b (exactly 0x8000), a630_zap.mbn 14256 B sha 4aef4aff842b7db4 - OBSERVATIONS, NOT canonical/official; SQE raw dword[0]==0 is NOT a verdict (predicate runs on the MAPPED BO). Two independent verifications PASS: host runner 8 groups / 70 checks + FIRMWARE_V1_CROSS: PASS (47 checks, pinned upstream + modern contrast + derived module). Arm64 Mach-O object 2120 B (0xfeedfacf / 0x100000c / 0 / 1), archives-linked 7/7, builder AST PASS, three checker false positives corrected. FAIL-CLOSED adreno_fw_v1_ready()=0 because signed ZAP .mdt/.b00/.b01 (GPU_PAS_ID 13) absent. No device, no flash, no register read, no firmware load, no kernel caller; CONFIG_XNU_NATIVE_ADRENO=n unchanged, gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-firmware-v1.py", revision = "0a276a4713ebaadfd472a11abef7bc2c3c2fdec3" },
  { kind = "device", reference = "evidence/stage5-gpu-power-domain-device.md", result = "ROUND 35 DEVICE-VERIFIED SUB-RESULT (2026-11-10): first real-device GPU evidence. CI #219 (42762559936, success, 7 objects sha256 859f426865f9da2a) built the kernel; payload-gpuprobe219.img 150994944 B sha256 bd44ed90764503f6... carried the device-verified flash #8 args minus enchilada-smmu=1 plus enchilada-adreno=1 (49 items / 988 of 1000 B). Two independent PRE-FLASH verifiers PASS. test-cycle.py gpuprobe219 --wait-return 1100 flashed misc + system_b, booted boot-108.img and auto-returned to recovery after 941 s. NEW boot_id 0x205050d2 (decimal 542134482), uptime 899 s, write_errors 0. 300 identical 1 Hz replays: enchilada-adreno: rc=0 GPUCC=5090000 size=9000 cx=00005ff4 gx=00088400 cx_on=0 gx_on=0 gx_off=1 verdict=cx-DOWN steps_left=9 (replay t=600..899 attempt=1); NO refusal, so all five safety predicates passed and the two GPUCC GDSC status reads (0x05091540 / 0x05091010) returned instead of hanging. Two independent DEVICE verifications PASS: scripts/verify-gpuprobe-device-1.py GPUPROBE_DEVICE_VERIFY_1: PASS (25 checks, raw binary + flash log + CI sha chain) and scripts/verify-gpuprobe-device-2.py GPUPROBE_DEVICE_VERIFY_2: PASS (36 checks, decoded text + header + source READ-ONLY contract). HONEST BOUNDARY: the gpu AREA stays host-verified; this proves ONLY a narrow power-domain precondition. No GPU driver, no GMU power-up, no firmware load, no HFI exchange, no Metal, no kgsl SMMU context; CONFIG_XNU_NATIVE_ADRENO=n unchanged; round-22/28 cold-read prohibitions unchanged; one boot, one unit, one power state; device returned to TWRP with the BCB re-armed.", command = "python scripts/test-cycle.py gpuprobe219 --wait-return 1100", revision = "c05082f50b85abd485bace49dc221dd3c57f308c" },
  { kind = "host", reference = "evidence/stage5-gpu-gmu-boot-v1.md", result = "ROUND 42 HOST-VERIFIED (2026-11-10): A630 legacy GMU cold-boot sequence encoded as freestanding pure-C AdrenoGmuBootV1.h/.c (33/35-op PlanCold + 36-op PlanRpmhInit, ordered Write/WriteBulk/Read/Poll/Rmw ops over caller-supplied bus callbacks). Two independent verifications PASS: host runner 8 suites incl. gmu-boot-v1 98 checks and GMU_BOOT_V1_CROSS: PASS (213 checks: pinned a6xx_gmu.c sha c14fbb25... + a6xx_gmu.xml 462b8960... slices, 35 XML offsets, 15 PDC defines, 29 constants + 68 offsets, 16 order anchors, no modern-only construct). Strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow EXIT=0. PDC offset pins independently verified: ENCHILADA_PDC_OFFSETS_VERIFY PASS (200 checks) + ENCHILADA_PDC_SECOND_VERIFY PASS (28 checks). This is a code MODEL with NO kernel caller, NO MMIO and NO device run; CONFIG_XNU_NATIVE_ADRENO=n unchanged; gpu stays host-verified.", command = "python -X utf8 scripts/verify-enchilada-gmu-boot-v1.py", revision = "ab4143cd6c60c98e2e03b9ee46fc3cdbf51afb61" },
