    { kind = "host", reference = "evidence/stage5-gpu-gdsc-sequence.md", result = "ROUND 57 HOST-VERIFIED GDSC enable/disable sequence derivation (CX enable = collapse clear, 1 register write + a status READ (round 58 corrected the round-57 claim of 2 writes), CX disable = collapse+delay no poll, GX CPU enable = 0 writes); 108 host checks + 98 cross checks; no device run", command = "python -X utf8 scripts/verify-enchilada-gdsc-decode.py", revision = "aaebde3c95985f59a099dd7938d21e90216d2a5f" },
    { kind = "host", reference = "evidence/stage5-gpu-power-up-gdsc.md", result = "ROUND 58 HOST-VERIFIED power-up/GDSC composition contract: guarded <=> zero CPU writes for both domains; CX enable = 1 register write + a status READ (round 57 had claimed 2 writes and was corrected); CX power-off polls nothing (VOTABLE short-cut); 41 host checks + 66 cross checks; no device run", command = "python -X utf8 scripts/verify-enchilada-power-up-gdsc.py", revision = "6d7a4a845b425709a9a0185a0e93c20d2454e155" },
