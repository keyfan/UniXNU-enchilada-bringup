  { kind = "device", reference = "evidence/stage7-gauge-device.md", result = "STAGE 7 DEVICE-VERIFIED (2026-11-09, boot_id 553807564, uptime 899 s): read-only bq27xxx probe returned rc=0 with 12/12 register reads across both register-map families; family A (mainline ti,bq27411) decoded to SOC 100 pct / 4326 mV / 0 mA / 14.5 degC / 3153 mAh full / 3240 mAh design at 6/6 plausible, family B (vendor ti,bq27541) to SOC 3161 pct / -205.9 degC at 3/6 plausible. 480 replayed verdict lines across ticks 420-899. Two independent device analyses (decoded log files; raw window bytes plus serial watcher) both report read_only_probe_device_verified = true.", command = "python -X utf8 oneplus6-ios/scripts/test-cycle.py gaugereplay --wait-return 400", revision = "8f4ca9bf2b386ab8414f7ca9de176d71b4f02ded" },
  { kind = "host", reference = "evidence/stage7-gauge-device.md", result = "Host verifications before the flash: host runner 11 decoder groups + 7 read-only orchestrator groups PASS; CI-equivalent clang++ -std=c++20 -Wdeprecated-volatile -Werror -fsyntax-only of the shim PASS; strict C11 -Wconversion/-Wsign-conversion/-Wshadow/-pedantic compile of the core PASS with an independent fake-I2C verdict program agreeing. CI #213 then force-loaded libEnchiladaGauge.a (3 objects) and the delivered kernel contains the replay strings.", command = "python scripts/check-enchilada-gauge-probe-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe", revision = "8f4ca9bf2b386ab8414f7ca9de176d71b4f02ded" },
