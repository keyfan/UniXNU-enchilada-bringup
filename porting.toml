limits = [
  '[ROUND 101 2026-11-13, HONEST BOUNDARY] ONE INPUT OBTAINED, NOT THE ROW SATISFIED. ias is now measured, which removes the input round 77 proved underivable and round 85 proved unreadable from userspace - but kgsl-smmu-stage1 needs FOUR inputs and three remain: an ASID allocator (none exists), a populated 4 KiB-granule LPAE page table (none exists), and a programmed context bank. words_ok=1 and plan_ok=1 mean the CONTRACT computed the round-83 words from the real ias; not one of them has been written to the SMMU. A single device run, a single boot, a single window. The ID2 value is stable for this part and this firmware, but one read is one read: it is not a sweep across boots. The measurement also constrains what comes next rather than unblocking it: ias=48 with IAS=1 giving ipa=36 means the translation regime is 48-bit VA over a 36-bit IPA/PA, and the granule set is 4K/16K/64K with 8-bit VMIDs only - all facts a future context programmer must honour, none of which build one. The device ran with the reboot guarantee verified first and re-armed immediately afterwards; no flash of boot_a, no partition written except system_b (the payload slot, the failed one), m39510 NOT exercised. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified as an AREA even though this SUB-RESULT is device-sourced, and this does NOT unblock stage 5.',
  '[ROUND 95 2026-11-13, HONEST BOUNDARY] ARMED BUT NEVER EXECUTED. No flash was performed for this round, the stage has never written a register, no reboot, m39510 NOT exercised. The evidence class is a compile plus static verifiers, which is what this port has always required before arming a device write path. WHEN IT RUNS, THREE OUTCOMES ARE POSSIBLE AND THE ROW DISTINGUISHES THEM: (a) up=Ok with cx_on_after=1 - the domain came up, which would be the FIRST TIME this port powered the GPU, and it would unblock stage 4 ID2 read on the next boot; (b) up=Ok with cx_on_after=0 - the five ordered ops executed and THE RAIL DID NOT RISE, which is a real hardware finding rather than a defect in the plan; (c) up=<not Ok> - an op was refused and up_fail_index names which one. Even outcome (a) does NOT satisfy kgsl-smmu-stage1: that still needs an ASID allocator and a populated LPAE table, neither of which exists. The round-22/28 prohibition is UNCHANGED and is deliberately not enforced by this stage: writing gpu_cx_gdsc own control register is how a collapsed domain is raised, and that register lives in always-on GPUCC; the gate that must run before any GPU/GMU/SMMU window READ is still AdrenoGmuCallerV1Precheck. The admission table is UNCHANGED at modeled=9 / satisfied=0 / BLOCKED. CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero, the gpu area STAYS host-verified, and this does NOT unblock stage 5.',
