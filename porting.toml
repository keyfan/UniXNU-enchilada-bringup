configuration = ["native-dwc3-probe=3, enchilada-deadline=600, sheng-data-reset=1, --drop sheng-gpu-addon=1; BootLog.c emits U/G/C/S/L/B/W rows; C setup ring of 8 requests, C st nr in/out/skip, C notify armed/done, C lc baud."]
procedure = ["test-cycle.py --wait-return 900 waits for the deadline, pulls the window, decodes it to work/log/<variant>/untagged-<bootid>/latest.txt; hostwatch.ps1 polls Get-PnpDevice and SerialPort.GetPortNames() every 2 s and opens the port."]
findings = ["Thirteen DWC3 bugs were isolated with this row-based instrumentation: GCTL RAMCLKSEL mask, MMIO map lifetime, GUSB2PHYCFG bit offsets (off by two), missing core soft reset, STARTTRANSFER passing the buffer instead of the TRB ring, missing SERIAL_STATE carrier, and GET_LINE_CODING echoing a constant 9600 instead of the host's 115200.", "The last bug's root cause was a non-maxpacket-aligned 7-byte EP0-OUT TRB: Linux dwc3/ep0.c and Mu-Silicium UsbfnDwc3Dxe.c:540-607 both align to maxpacket; our single TRB left trb->size unwritten, so bytesTransferred() returned 0 and the line coding was never captured. Fixed by reading DMA directly and aligning the OUT TRB to 64 bytes.", "A stale HWO after bus reset, an uncleared STALL, and the missing GET_STATUS/GET_CONFIGURATION/SET_INTERFACE replies were all found by adding one counter/row at a time and taking two independent verifications before each flash."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["ShengPreflight is listed as the intended OS-service component but is not linked; diagnostics are provided by the board's own BootLog.c and the CDC-ACM console instead.", "The 600 s deadline limits every device run to a ~10 minute observation window."]
next_action = ["Stage 8: link ShengPreflight or an equivalent preflight archive, then add a host-side regression script that parses latest.txt and fails on any non-zero UFS/G/C error counter."]
