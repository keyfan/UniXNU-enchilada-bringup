  'Stage 6 (2026-11-08) HOST-VERIFIED audit: enchilada Wi-Fi is WCN3990 = ath10k ATH10K_BUS_SNOC (memory-mapped qcom,icnss membase 0x18800000, 12 Copy Engine IRQs, QMI/WLFW firmware + SCM/TrustZone MSA permissions), NOT sheng WCN7850 = ath12k PCIe0 endpoint 17cb:1107 + MHI BHI/BHIE. Four independent research passes: https://unixnu.com/zh/porting/network, vendor DTB Mu-Silicium/Resources/DTBs/enchilada.dts, Linux v6.12 ath10k/snoc.c + hw.h + qmi.c, sheng package/WifiPcieTables.h + MhiBoot.h + workspace/246-log inventory.',
