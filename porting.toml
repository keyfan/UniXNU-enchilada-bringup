  '[ROUND 75 2026-11-12, HONEST BOUNDARY] Computing the words is NOT programming them. AdrenoSmmuStage1V1 issues no MMIO, maps nothing, allocates no page table, owns no ASID, needs no IOKit and has no caller; ALL FOUR inputs it needs are absent, and adreno_smmu_stage1_ready() is derived from that mask so it cannot silently become 1. kgsl-smmu-stage1 is modelled=1 / satisfied=0 for exactly that reason, recorded the same way cp-ring and zap-auth were before their rules were written down. The SCTLR default is the LITTLE-ENDIAN one and the module also exposes the big-endian variant (differing EXACTLY in BIT(4)) so a caller on a different host cannot inherit the wrong value by accident. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 74 2026-11-12, HONEST BOUNDARY] A PARSER is not a LOADER. AdrenoMdtV1 reads a buffer the caller already holds: it does not read .bNN from storage, does not allocate or memremap the region, does not call SCM, and authorises nothing. adreno_mdt_loader_available() is 0 and adreno_mdt_ready() is DERIVED from it, so it stays 0 until real wiring exists; consequently zap-auth steps S6/S7 remain present=0 - their RULES are now modelled, their EXECUTION is not, and the admission table does not move (modeled=7, satisfied=0, BLOCKED). Every read is bounds-checked against the buffer size and every multi-byte field is composed byte-wise from a little-endian source, so the parser needs no unaligned 32-bit load and no libc. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 73 2026-11-12, HONEST BOUNDARY] The SHAPE of a call is not the call. AdrenoZapAuthV1 makes no SCM call, loads no firmware, performs no memremap, issues no MMIO, and authorises nothing: there is no SCM transport in XNU, no MDT parser, and seven of the eight preconditions do not exist. zap-auth is modelled=1 / satisfied=0 for exactly that reason, and the row is recorded the same way cp-ring was before round 70 closed it. The -EOPNOTSUPP path is documented as a QUIET fallback (a target that needs no ZAP shader is not an error) while -EACCES is a real failure - conflating them would either hide a genuine rejection or fail a device that never needed ZAP. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 72 2026-11-12, HONEST BOUNDARY] Every register word a CP ring needs is now COMPUTABLE; NOT ONE HAS BEEN WRITTEN. is_executable()==1 means the port knows what to put in each register, NOT that a ring works: no ring allocated, no IOVA mapped, no CP_RB_CNTL written, no doorbell rung, no MMIO of any kind, no fence, no interrupt, no submit. The power sequence, the PAS handshake and the SMMU context are all still absent, and the four hard blockers of docs/porting/gpu.md section 1 remain open. A defect this round found in ITSELF is recorded: the module round-71 self-check still asserted is_executable()==0, and when round 72 made it 1 that stale assertion fired - the self-check caught its own superseded expectation, which is why it is asserted rather than trusted. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 71 2026-11-12, HONEST BOUNDARY] Round 71 is TWO evidence classes and neither promotes the area. The CP-ring work is HOST-VERIFIED: a packet can be encoded, but no ring is programmed, no BO is allocated, no IOVA mapped, no doorbell written, no MMIO issued, and is_executable() stays 0 while U3/U4 hold. The device-tree work is DEVICE-SOURCED and READ-ONLY: it reads STATIC board facts from /proc/device-tree - which say where a block is and how it is wired, and say NOTHING about whether it is powered, what its status words read, or whether it responds. No GPU register was read or written, no firmware loaded, no PAS authentication, no SMMU programming, no flash, no reboot, no mount. Device-sourced STATIC facts are NOT a device RUN of the driver - that is the distinction this port has kept since round 38 - so the gpu area STAYS host-verified. A board VA map is still absent and the A630 client GPU windows stay ALL-ZERO (round-67 gate); nothing in /proc/device-tree supplies one. m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the four hard blockers of docs/porting/gpu.md section 1 remain open, and this does NOT unblock stage 5.',
  '[ROUND 70 2026-11-12, HOST-VERIFIED] AdrenoCpRingV1 is ORDER + PAYLOAD + REFUSAL, NOT a ring: no BO allocated, no IOVA mapped, no doorbell written, no fence, no interrupt, no submit, no MMIO. The five undefined constants are reported as a first-class value rather than papered over, and is_executable() is 0 because U1 and U2 are both open. The admission table is 6 modeled / 0 satisfied / BLOCKED - one row moved, the verdict did not. The four hard blockers of docs/porting/gpu.md section 1 remain open, the A630 client GPU windows stay all-zero, CONFIG_XNU_NATIVE_ADRENO remains n, no device run, no flash, m39510 NOT exercised; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
  '[ROUND 69 2026-11-12, HOST-VERIFIED] AdrenoGen1BackendV1 is ADJUDICATION ONLY: it asserts what the pinned sources say and what this tree holds, and a green CI build of it would not move a single row of its table. It is NOT a GPU driver - no MMIO, no BO/IOVA/queue/fence/shader cache/MTLDevice/user client, no firmware load, no PAS authentication, no SMMU programming, no Turnip dylib. modeled=5 and satisfied=0 are BOTH deliberate: a caller can log them, and no caller can mistake the five host models for five working steps. The four hard blockers of docs/porting/gpu.md section 1 remain open, the A630 client GPU windows stay all-zero, CONFIG_XNU_NATIVE_ADRENO remains n, no device run, no flash, m39510 NOT exercised; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
