  { kind = "source", reference = "https://unixnu.com/zh/porting/power", result = "Official DSP/audio/battery stage, which points at AdspProbe.cpp and AudioProbe.cpp from the SM8550 reference port." },
  { kind = "host", reference = "evidence/stage7-audio-feasibility.md", result = "8 host test groups over a pure-C model of the board audio topology (DTO constants, format arithmetic, SLIMBUS port allocation, TrustZone PIL, generation gap), plus an independent verifier that re-derives every constant from the DTB and Linux source and compiles the core freestanding at two optimisation levels.", command = "python scripts/check-enchilada-audio-host.py --cc oneplus6-ios/tools/llvm-mingw/bin/clang.exe --cxx oneplus6-ios/tools/llvm-mingw/bin/clang++.exe --out work/tmp/audio-host-out", revision = "93ed8f0b5b82518e10d7ca02d61dd85ffdfea544" },
]
