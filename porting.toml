inputs = ["Samsung sofef00 AMOLED DSI panel, 1080x2280 @ 60 Hz, 4 lanes RGB888; vendor DTS node qcom,mdss_dsi_samsung_sofef00_m_cmd declares qcom,mdss-dsi-bl-pmic-control-type = bl_ctrl_dcs, brightness 0..1023 (0x3ff); Linux v6.12 panel-samsung-sofef00.c uses mipi_dsi_dcs_set_display_brightness_large().", "Linux v6.12 drivers/gpu/drm/drm_mipi_dsi.c and include/video/mipi_display.h: DCS long write 0x39 with tx [0x51, b>>8, b&0xff]; WRITE_CONTROL_DISPLAY 0x53/0x20 and WRITE_POWER_SAVE 0x55/0x00 are 0x15 short writes.", "CMD-DMA address question (layer-3 blocker): Linux v6.12 dsi_host.c dsi_tx_buf_alloc_6g()/dsi_dma_base_get_6g() feed REG_DSI_DMA_BASE a display-SMMU IOVA via msm_gem_get_and_pin_iova, while the whole enchilada tree (NativeUfs.cpp:949-954, Dwc3Gadget.cpp:196-221) uses physical addresses assuming an apps_smmu bypass context bank; the two agree only when SCTLR.M==0 (translation off). Vendor DTS iommus display streams are 0x880/0x8 and 0xc80/0x8 (mdp :853), 0x881/0x8 and 0xc81/0x8 (sde_sec_cb :995), 0x1090/0x0 and 0x1091/0x0 (rot :3393/:3399); apps_smmu phandle 0x29 @ 0x15000000. These differ from sheng/SM8550's 0x1c00/0x1c02 and there was NO display-SMMU diagnostic row in the backlight208 / console206 boot logs, so bypass on this board was UNCONFIRMED until the mode-2 read-only survey (backlight209mode2, CI #209) DEVICE-CONFIRMED it: 510 L rows st=4, verdict=Bypass, stream 0x880, S2CR.TYPE=0 / SCTLR=0xe0 (M=0) => translation OFF, so a CPU physical address is safe for REG_DSI_DMA_BASE."]
configuration = [
    'FINAL STATE (2026-11-08): layer 3d-beta is CI #211-COMPILED (macOS 26 / Xcode 26.6, real 21H461 XNU headers, 8-object archive with late-objcopy, 0 archive errors) and DEVICE-VERIFIED (backlight211mode4, 510 L rows all st=7, impersonated=1, max=0x3ff). enchilada-backlight=4 runs EnchiladaBacklight : IOService on the 1 Hz poll; modes 1/2/3 stay byte-identical to the device-verified e200f1ab blob. Earlier configuration entries below describe the design and are retained as history.','Stage 3 layer 3d-beta (CI #211 COMPILED + DEVICE-VERIFIED; design detail): package/EnchiladaBacklight.cpp defines EnchiladaBacklight : IOService (NEVER named AppleARMBacklight; duplicate metaclass panic int-229), the 8th object of the force-loaded libEnchiladaMsmDsi.a. It impersonates the built-in AppleARMBacklight metaclass via getMetaClassWithName(OSSymbol::withCString(...)) with BOTH #if __has_feature(ptrauth_calls) manual-metaclass split (getMetaClass returns gAppleClass; no vtable copy, arm64e PAC-signed vtables) and #else OSDefineMetaClassAndStructors + vtable slot-7 replacement. It publishes IODisplayParameters.brightness {min=0, max=1023, value} (sofef00 DCS bl-max 0x3ff, NOT sheng KTZ8866 2047), backlight-control=true and NativeSandboxGrantProcess=backboardd. setProperties() is NON-BLOCKING (no runAction, no register write, no DMA; sheng backboardd warning) and hands the goal to the pure-C MsmDsiControl core; the 1 Hz mode-4 tick drives msm_dsi_control_step() -> enchilada_backlight_transmit() -> the DEVICE-VERIFIED msm_dsi_brightness_send() path (backlight210mode3 st=5, 32-bit DMA_BASE gate + dc civac/dsb sy). A late-object objcopy (--remove-section=__DATA,__mod_init_func --globalize-symbol=__GLOBAL__sub_I_EnchiladaBacklight.cpp) brackets the C++ static initializer with preModLoad/postModLoad. enchilada-backlight=4 selects it; modes 1/2/3 function bodies stay byte-identical to the device-verified remote blob.', 'Stage 3 layer 3d-alpha (HOST-VERIFIED, NOT flashed): drivers/NativeMsmDsi/MsmDsiControl.c/.h is a pure-C, host-testable OS-facing brightness CONTROL PLANE, added as the 7th object of the force-loaded libEnchiladaMsmDsi.a (build-enchilada-msm-dsi.py units). It settles the top open risk from evidence/applearmbacklight-metaclass.md: sheng kMaxLevel=2047 (11-bit KTZ8866 I2C) vs enchilada sofef00 DCS bl-max=0x3ff=1023. MsmDsiControl.h takes its single scale source from DsiDcs.h kEnchiladaBrightnessMax=1023 and kMsmDsiControlMaxLevel=1023; msm_dsi_control_clamp() clamps ANY OS request (negative, 2047, INT32_MAX) to 0..1023. The class body (layer 3d-beta) will call msm_dsi_control_request()/step()/publish() and publish IODisplayParameters.brightness max=1023, NOT 2047.', "CONFIG_NATIVE_LEGACY_DISPLAY=y via scripts/build-native-legacy-display.py; CPU-rendered UI (no GPU), sheng-vsync=60 as on fajita (not sheng's 120); BootLog.c:78 has a weak extern for native_backlight_stats[10] and prints the L st=... line.", "Stage 3 layer 2: board.toml [kernel] archives adds build-enchilada-msm-dsi.py (libEnchiladaMsmDsi.a, two pure-C objects). A link-wiring audit found board.toml archives only order the build (work/UniXNU/scripts/unixnu/kernel.py archive_plan); the kernel link force-loads board archives solely through CONFIG_XNU_EXTRA_LD_ARCHIVES (build-xnu-4k-baseline.sh:755 appends ${XNU_EXTRA_LD_ARCHIVES}; kernel.py xnu_env maps CONFIG_XNU_* -> XNU_* and substitutes {tree}). The defconfig line listed only 3 archives, so libEnchiladaMsmDsi.a was CI-compiled but NOT linked. Fixed by adding -Wl,-force_load,{tree}/build/enchilada-msm-dsi/libEnchiladaMsmDsi.a; scripts/check-enchilada-archives-linked.py now guards that every enchilada runtime builder is force-loaded.", "Stage 3 layer 2.5 (READ-ONLY runtime probe, default off): enchilada-backlight=1 makes BootProgress.c monitor() call enchilada_backlight_poll() 1 Hz; the shim (package/EnchiladaBacklightProbe.cpp, compiled into the same force-loaded libEnchiladaMsmDsi.a) maps 0xae94004 via strong armcpu_map_physical (ArmCpu.cpp:207) and reads seven live config registers through pure-C MsmDsiSession.c, publishing them into a STRONG native_backlight_stats[10] that overrides the weak char[4096] stub (BootProgressStubs.c:65) so the L st= row becomes non-zero on device. enchilada_backlight_poll() has weak_import declaration in BootProgress.c, a weak stub in BootProgressStubs.c/.symbols, and a strong definition in the archive. NO controller register is written and NO DMA is triggered in this stage (先核验再上机: prove XNU can map/read the firmware-owned controller before any packet).", "Stage 3 layer-3 prerequisite (HOST-VERIFIED, NOT flashed): drivers/NativeMsmDsi/MsmDsiSmmu.c/.h is a pure-C READ-ONLY SMMUv2 display-bank survey (single rd callback, no write path) compiled into the same force-loaded libEnchiladaMsmDsi.a (now 5 objects). It decodes IDR0/IDR1/IDR2 geometry, scans SMR/S2CR for the six built-in enchilada display (id,mask) streams, reads each matched bank's SCTLR/TTBR0/TCR/CBAR, and returns Bypass/Translate/NotFound/Geometry. Register offsets come verbatim from the device-proven local sources SmmuTakeover.h and NativeUfs.cpp:862-944. No defconfig/board.toml change needed (same archive). NOT yet wired to a runtime mode.", "Stage 3 layer-3 prerequisite mode-2 WIRING (HOST-VERIFIED, not yet CI/device): package/EnchiladaBacklightProbe.cpp now dispatches on enchilada-backlight: mode 1 (unchanged, device-verified st=3) and mode 2 (new). Mode 2 maps apps_smmu 0x15000000 window 0x80000 via the same strong armcpu_map_physical (kept at file scope), builds a READ-ONLY msm_smmu_io (only rd, no write callback), calls msm_smmu_survey_display() and publishes the verdict into the SAME native_backlight_stats[10] with stage code 4 via the new msm_smmu_survey_publish() (pointer-to-volatile param, C++20-safe). NO register write, NO DMA, NO DSI0 access in mode 2. The L row then reads st=4 req=<polls> lvl=<verdict> a=num_cb|global_pages<<16 b=bypass|translating<<8 xerr=first_s2cr irq=first_sctlr ea=first_cbar eb=first_ttbr0_lo err=first_stream.", "Stage 3 layer 3a (HOST-VERIFIED, NOT flashed): drivers/NativeMsmDsi/MsmDsiBrightness.c/.h is a pure-C brightness-transmit orchestrator chaining layer-1 dsi_dcs_set_brightness_large() into layer-2 msm_dsi_cmd_* primitives for ONE DCS packet, published to native_backlight_stats[10] with stage code 5 (st=5 req=<polls> lvl=<level> a=<dma_len> b=<dma_addr_lo> xerr=<rc> irq=<sent> ea=<addr_high> eb=<dma_err> err=0). It carries a LOAD-BEARING 32-bit REG_DSI_DMA_BASE gate: dsi_host.c:2245 commits a u32 dma_base and dsi.xml declares width 32, while backlight209mode2 device-confirmed the display bank is Bypass so the value is a CPU PHYSICAL address; NativeUfs.cpp:1197 warns kernel allocations can be above 4 GiB but enchilada-facts/parsed.txt lists SDM845 carveouts below 4 GiB, so the orchestrator takes the full 64-bit phys and REFUSES (AddrTooHigh) BEFORE touching any register when (phys>>32)!=0 (先核验再上机). A clean(va,len) callback runs dc civac + dsb sy BETWEEN buffer fill and trigger (Dwc3Gadget.cpp:306-313). It is the 6th object in the same force-loaded libEnchiladaMsmDsi.a; NO allocation/mapping/DMA lives in this pure-C unit (those belong to layer 3b).", "Stage 3 layer 3b (HOST-VERIFIED, NOT flashed): package/EnchiladaBacklightProbe.cpp gains a THIRD gated mode enchilada-backlight=3 (default off). Modes 1 (CI #208 / backlight208, device-verified L st=3) and 2 (CI #209 / backlight209mode2, device-verified L st=4 Bypass) are proven byte-for-byte unchanged by a static diff against the device-verified remote blob f566e737 (work/tmp/verify_layer3b_wiring.py: ioRd/ioWr/ioWmb/ioDelayUs/pollMode1/pollMode2 + all shared state identical; dispatcher only appends a mode==3 branch). Mode 3 is the FIRST WRITE: it allocates ONE 64-byte, 4096-aligned physically-contiguous IOBufferMemoryDescriptor with the device-proven Dwc3Gadget.cpp:204-218 pattern (kernel_task, kIODirectionInOut|kIOMemoryPhysicallyContiguous|kIOMemoryMapperNone, getBytesNoCopy + getPhysicalSegment), maps DSI0 at 0xae94004 via armcpu_map_physical, and calls msm_dsi_brightness_send() ONCE (kMode3Level=512) with a dc civac-per-64B-line + dsb sy clean callback (Dwc3Gadget.cpp:306-313 / NativeUfs.cpp:1150-1155) and a CPU-spin io.delay_us (NOT WFE/IODelay, RootCommands.h:22). The orchestrator's 32-bit REG_DSI_DMA_BASE gate is the on-device 先核验再上机 check: a buffer above 4 GiB is REFUSED (st=-2, addr_high counter) BEFORE any register write. Only ONE packet is sent; later 1 Hz polls republish the stored result (L st=5 stable). No IOService subclass / OSMetaClass / late-object objcopy: the archive stays 6 objects and 4 force_load entries. Includes <kern/task.h> + IOKit headers for the real CI XNU SDK."]
procedure = ['Stage 3 layer 3d-beta host verification (two independent scripts, both PASS): work/tmp/verify_layer3d_beta.py compiles EnchiladaBacklight.cpp BOTH ptrauth branches (textual __has_feature substitution to 0/1) + EnchiladaBacklightProbe.cpp with clang++ -std=c++20 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror -Wdeprecated-volatile against faithful ABI-shape stubs (work/tmp/backlight-stubs/_bl_all.h), then runs the full host battery, porting-record.py check, check-enchilada-archives-linked.py and py_compile of the recipe. work/tmp/verify_layer3d_beta_independent.py compares pollMode1/2/3 bodies byte-for-byte against the DEVICE-VERIFIED remote commit e200f1ab (CI #210) via the GitHub contents API, checks the 1/2/3/4 dispatcher, the 1023 (not 2047) range in code, non-blocking setProperties, and unit-tests the recipe text_bytes() Mach-O __TEXT,__text parser on a synthetic LC_SEGMENT_64 object. Both require NO_PROXY=*, TMP/TEMP=work/tmp/ctmp and tools/llvm-mingw/bin on PATH. Two decisive experiments proved the cached raw XNU source tree is NOT a compilable SDK (missing MIG types, #error processor not supported), so CI (macOS 26.6 + Xcode 26.6 + iPhoneOS SDK) is the ONLY ABI authority (CI #207 lesson).', 'Stage 3 layer 3d-alpha host verification: python scripts/check-enchilada-msm-dsi-host.py (7+3+11+7+8 groups, all PASS) plus an independent strict clang -std=c11 -Wconversion -Wsign-conversion -Wshadow -pedantic compile of MsmDsiControl.c, a clang++ -std=c++20 -Wdeprecated-volatile -Werror header check, and an arm64 -mgeneral-regs-only object. All require TMP/TEMP=work/tmp/ctmp and tools/llvm-mingw/bin on PATH. The strict compile caught one real -Wsign-conversion at stats[6] (fixed by casting impersonated to int32_t).', "build-native-legacy-display.py compiles NativeMobileDisplay.cpp and the GOP presenter into libNativeLegacyDisplay; the frame is composed on the CPU and swapped through the UEFI framebuffer.", "Stage 3 layer 1 (host-only, not yet linked into the kernel): scripts/check-enchilada-dsi-backlight-host.py compiles drivers/NativeDsiBacklight/DsiDcs.c as C11 and runs drivers/NativeDsiBacklight/tests/dsi-dcs-test.cpp as C++17 with -Wall -Wextra -Werror, asserting the exact DCS wire bytes. Command: python scripts/check-enchilada-dsi-backlight-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/dsi-host-out (requires TMP/TEMP=work/tmp/ctmp).", "Stage 3 layer 2: scripts/build-enchilada-msm-dsi.py compiles MsmDsiCmd.c + DsiDcs.c (the startup.o flags + -mgeneral-regs-only) into libEnchiladaMsmDsi.a for [kernel] archives. Host verification: python scripts/check-enchilada-msm-dsi-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/msm-dsi-host-out (requires TMP/TEMP=work/tmp/ctmp AND tools/llvm-mingw/bin on PATH for the runtime DLLs). MsmDsiCmd.c turns the layer-1 packet into the MSM CMD DMA buffer and emits prepare (CTRL|=CMD_MODE_EN|ENABLE) -> commit (DMA_BASE, DMA_LEN, TRIG_DMA=1, wmb) -> STATUS0 busy poll -> restore CTRL.", "Link-wiring guard: python scripts/check-enchilada-archives-linked.py verifies every build-enchilada-*.py board archive has a matching -Wl,-force_load entry in configs/enchilada_defconfig (CONFIG_XNU_EXTRA_LD_ARCHIVES), all {tree}-relative and duplicate-free. Run it after any new board archive is added.", "Stage 3 layer 2.5: scripts/build-enchilada-msm-dsi.py compiles 5 objects (mixed C/C++: EnchiladaBacklightProbe.cpp with IOPlatformExpert.cpo.json flags; MsmDsiSession.c/MsmDsiSmmu.c/MsmDsiCmd.c/DsiDcs.c with startup.o.json + -mgeneral-regs-only) into the same force-loaded libEnchiladaMsmDsi.a (the layer-3-prerequisite SMMU survey was added as a 5th pure-C object, no new archive/force_load entry). Host verification: python scripts/check-enchilada-msm-dsi-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/msm-dsi-host-out runs both the layer-2 transport (7 groups) and the layer-2.5 read-only session (3 groups, FakeDsi asserts writes==0). C++ shim syntax: clang++ -std=c++17 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror. On device enchilada-backlight=1 must be set in the boot args; the 1 Hz poll then publishes L st=3 req=<polls> lvl=0 a=<CTRL> b=<STATUS0> xerr=<CMD_DMA_CTRL> irq=<TRIG_CTRL> ea=<CMD_CFG0> eb=<CMD_CFG1> err=<CLK_CTRL>.", "Stage 3 layer-3 prerequisite host verification (two independent): (1) python scripts/check-enchilada-msm-dsi-host.py --cc tools/llvm-mingw/bin/clang.exe --cxx tools/llvm-mingw/bin/clang++.exe --out work/tmp/msm-dsi-host-out -> PASS: enchilada read-only SMMUv2 display-bank survey (10 test groups) plus the existing 7+3 groups; (2) clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow -O2 -c MsmDsiSmmu.c (exit 0), clang++ -std=c++20 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror -Wdeprecated-volatile on MsmDsiSmmu.h (exit 0), and clang -std=c11 -target arm64-apple-darwin -mgeneral-regs-only -O2 -c MsmDsiSmmu.c (exit 0, 2912 B object); plus porting-record.py check -> 15 areas and check-enchilada-archives-linked.py -> PASS 4/4. Requires TMP/TEMP=work/tmp/ctmp and tools/llvm-mingw/bin on PATH.", "Stage 3 layer-3 prerequisite mode-2 host verification (two independent): (1) python scripts/check-enchilada-msm-dsi-host.py -> PASS: enchilada read-only SMMUv2 display-bank survey (11 test groups) plus the 7+3 groups; (2) clang++ -std=c++20 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror -Wdeprecated-volatile on package/EnchiladaBacklightProbe.cpp (with the local pexpert stub) exit 0, plus strict C11 and arm64 -mgeneral-regs-only compiles of MsmDsiSmmu.c, porting-record.py check (15 areas) and check-enchilada-archives-linked.py (4/4). Mode 1 behavior is kept byte-identical.", "Stage 3 layer 3a host verification (two independent): (1) python scripts/check-enchilada-msm-dsi-host.py -> PASS: enchilada brightness transmit (32-bit gate, clean, DCS bytes, publish) (7 test groups) plus the 7+3+11 groups; the fake-MMIO test proves an address above 4 GiB is refused before ANY register write or clean, clean runs before TRIG_DMA, and the long-write DMA bytes are 03 00 39 c0 51 03 ff ff. (2) strict clang -std=c11 -Wall -Wextra -Werror -pedantic -Wconversion -Wsign-conversion -Wshadow compile of MsmDsiBrightness.c exit 0, -target arm64-apple-darwin -mgeneral-regs-only object exit 0, clang++ -std=c++20 -Wdeprecated-volatile -Werror header syntax exit 0, py_compile of both scripts, porting-record.py check (15 areas) and check-enchilada-archives-linked.py (4/4) all PASS. scripts/build-enchilada-msm-dsi.py now compiles 6 objects (adds MsmDsiBrightness.c).", "Stage 3 layer 3b three independent verifications (all green): (1) clang++ -std=c++20 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror -Wdeprecated-volatile on EnchiladaBacklightProbe.cpp with local IOKit stubs (onework/tmp/dsi-shim-stubs) — this caught and fixed a real ++ on a volatile-qualified counter, the CI #207 -Wdeprecated-volatile lesson, using a non-volatile counter + empty asm volatile memory clobber; (2) the full host battery scripts/check-enchilada-msm-dsi-host.py (7 transport + 3 session + 11 SMMU + 7 brightness groups), scripts/check-enchilada-archives-linked.py (4 force-loaded archives) and porting-record.py check --device (15 structured areas); (3) work/tmp/verify_layer3b_wiring.py static diff vs the device-verified f566e737 baseline (mode 1/2 unchanged) + Dwc3Gadget.cpp proven allocation/clean API tokens + one-shot send + CPU-spin body. No CI compile and NO flash yet (先核验再上机)."]
findings = [
    'FINAL STATE (2026-11-08): CI run 42451762272 completed success and the flashed kernel (23d2428b69d5 + evidence record 794cead5) emitted 510 L st=7 rows, req=0, lvl=512, impersonated=1, max=0x3ff, rc=0 on fresh boot_id 549546031. Two independent device verifiers PASS (L-row decode + raw-field re-derivation from the exact source revision, boot freshness, monotonic counters, four unchanged controls). Proves the OS-facing service registers and impersonates AppleARMBacklight with the enchilada 0..1023 range. Does NOT prove a measured panel luminance change (no optical readback) and CoreBrightness userspace acceptance is UNCONFIRMED (req=0). Detail: evidence/backlight211mode4.md.',
    'Stage 3 layer 3d-beta DEVICE-VERIFIED (backlight211mode4, CI #42451762272): 510 L rows, stages [7]. the service reached stage 7 (Published): registerService() ran after impersonate() impersonate() succeeded on device (impersonated=1), i.e. the built-in AppleARMBacklight metaclass was found and the service answers its conformance query published IODisplayParameters.brightness.max = 0x3ff (1023), the enchilada DCS range — not shengs 2047 no setProperties() requests were observed (req=0) — userspace acceptance (CoreBrightness/backboardd) is therefore UNCONFIRMED; the service published correctly but no brightness change was driven from userspace Verified by two independent device scripts (verify_device_mode4.py L-row decode + verify_device_mode4_independent.py source-revision re-derivation + boot freshness + control boots console206 st=0 / backlight208 st=3 / backlight209mode2 st=4 / backlight210mode3 st=5).','Stage 3 layer 3d-beta [HISTORICAL STATE, superseded by CI #211 + backlight211mode4]: WRITTEN and HOST-VERIFIED (at that time NOT CI-compiled, NOT flashed): EnchiladaBacklight : IOService is deliberately THIN (smallest IOKit ABI surface), delegating all brightness logic to the layer-3d-alpha pure-C MsmDsiControl core (0..1023 clamp, 16.16 FadePeriod, 16 ms linear fade) and the DEVICE-VERIFIED layer-3b transmit path. Two independent local verifications are GREEN: (1) compile/syntax + host battery + checker + guard + py_compile, exercising BOTH ptrauth branches; (2) semantic invariants vs the device-verified remote baseline (mode 1/2/3 bodies byte-identical, dispatcher, 1023 range in code, non-blocking setProperties, text_bytes Mach-O parser unit test). Does NOT prove the real XNU ABI compiles (local stubs are not equivalent per CI #207), runtime getMetaClassWithName / IOObjectConformsTo / CoreBrightness / backboardd acceptance, or any measured brightness change; those need a CI build + device verification. Class name MUST NOT be AppleARMBacklight (duplicate metaclass panic int-229); max=1023 NOT sheng 2047.', 'Stage 3 layer 3d-alpha SETTLED the 2047-vs-1023 scale mismatch (HOST-VERIFIED, read-only, NO flashing): msm_dsi_control_clamp() maps every CoreBrightness/OS value into the DCS 0..1023 range so no out-of-range DCS packet can be emitted; msm_dsi_control_fade_ms() reproduces sheng setProperties() ((FadePeriod_16.16*1000)>>16, cap 5000 ms) in 64-bit so 0xffffffff cannot 32-bit overflow; request()/step() implement the 16 ms linear fade over injected now_ms with clock rollback treated as elapsed=0; publish() places the published max at stats[7]=1023 (NOT 2047) so the L row self-checks on device. Pointer-to-volatile parameters avoid the C++20 -Wdeprecated-volatile trap (CI #207 lesson). Does NOT prove runtime runtime getMetaClassWithName / IOObjectConformsTo / CoreBrightness / backboardd acceptance or any measured brightness change; those need the layer 3d-beta IOService plus CI + device verification.', 'Stage 3 layer 3d PREREQUISITE SETTLED (HOST-VERIFIED, read-only byte audit, NO flashing; scripts/check-enchilada-applearmbacklight-metaclass.py + evidence/applearmbacklight-metaclass.md): two independent checks. (1) The stock iPad7,1 kernelcache (44.3 MiB) contains 16 x AppleARMBacklight, 4 x backlight-control, 2 x IODisplayParameters, 4 x CoreBrightness, the full driver personality (IOClass=AppleARMBacklight / IOProviderClass=IOPlatformDevice / IONameMatch=backlight / backlight-control=true), and method symbols (handleMessageGated / isDarkBoot / setBacklightEnableGated); the CI #210 built kernel that actually boots contains 13 x AppleARMBacklight and 3 x site.AppleARMBacklight metaclass-registration records, so getMetaClassWithName("AppleARMBacklight") has a valid target and sheng slot-7 impersonate() is viable. (2) Four independent device ADT copies have 0 backlight nodes (and 0 backlight,pwm nodes), so the built-in driver will NOT auto-instantiate and EnchiladaBacklight is the sole AppleARMBacklight. Scale mismatch to handle in code: sheng max=2047 vs enchilada DCS 0..1023 (publish max=1023, clamp). Does NOT prove runtime getMetaClassWithName / IOObjectConformsTo / CoreBrightness / backboardd acceptance (closed-source, needs layer-3d CI + device verification).', "Stage 3 layer 2.5 DEVICE-VERIFIED (backlight208, CI #208 kernel 2ba47b86853b3b1d): flashing with enchilada-backlight=1 produced 510 L rows all st=3 (Mapped) with req=336..600 (1 Hz polls), while the console206 control has 510 all-zero rows. The seven published registers decode exactly to mainline dsi_ctrl_enable() command-mode values (CTRL=0x1f5, CMD_DMA_CTRL=0x14000000, TRIG_CTRL=0x4, CMD_CFG0=0x100008, CMD_CFG1=0x13c2c, CLK_CTRL=0x23f, STATUS0=0x0/0x5 with CMD_DMA_BUSY always 0); 0 rows violate the constants, so XNU genuinely maps and reads the firmware-owned DSI0 at 0xae94004. Boot/userland/CDC-ACM console intact (COM5 appeared, watchdog auto-return at 641 s, write_errors=0). This stage writes nothing and triggers no DMA; lvl=0 by design.", "Linux v6.12 sdm845-oneplus-common.dtsi contains no backlight/wled/ktd3136/lm3697 nodes for this board, and the three device DTBs' strings contain zero backlight hits; the 73 bl_ctrl_* hits in Mu-Silicium/Resources/DTBs/enchilada.dts belong to 16 other panel variants in the multi-panel table.", "The sofef00 entry at enchilada.dts:2613-2664 is bl_ctrl_dcs with bl-min 0x01 / bl-max 0x3ff, which matches mainline's 1023-step DCS brightness. sheng's two KTZ8866 I2C controllers (0x11 on QUP SE1/SE2) DO NOT apply here.", "BootLog.c already defines the L st=%d req=%d lvl=%d a=%d b=%d xerr=%d irq=%x ea=%x eb=%x err=%d row and BootProgressStubs.c:65 has a weak definition, but AppleARMBacklight.cpp / BacklightProbe.cpp / DisplayTimingProbe.cpp do not exist in this repository; the L row therefore reads all zeros (console206: L st=0 req=0 lvl=0).", "Stage 3 layer 1 DCS packet builder (drivers/NativeDsiBacklight/DsiDcs.c) verified twice locally: host test PASS 'enchilada DSI DCS backlight transport (7 test groups)', strict -Wconversion -Wsign-conversion -Wshadow -pedantic compile exit 0, and an independent byte dump gives 39 03 00 00 51 03 ff for brightness 1023 ch0 (DCS long write, word count 3), b9 03 00 00 51 02 00 for 512 ch2, and 15 53 20 00 for WRITE_CONTROL_DISPLAY 0x20. The non-large mipi_dsi_dcs_set_display_brightness() uses the REVERSED byte order and must NOT be used for sofef00.", "Stage 3 layer 2 (drivers/NativeMsmDsi/MsmDsiCmd.c) verified twice locally from two independent sources: (1) vendor DTS enchilada.dts:3404 qcom,mdss_dsi_ctrl0@ae94000 / :2635 dma-trigger=trigger_sw / :2619 dsi_cmd_mode, (2) Linux v6.12 dsi_cfg.c sdm845_dsi_cfg io_start 0xae94000 + io_offset 4 and dsi.xml/dsi_host.c registers+DMA sequence. The 6G_HW_VERSION at offset 0 shifts every other register +4 (runtime MMIO base 0xae94004). dsi_cmd_dma_add(): data[0..2]=header[1],header[2],DI; data[3]=0x80|0x40(long); payload; 0xff pad to len=(size+3)&~3 -> long write 8 bytes 03 00 39 c0 51 03 ff ff, short write 4 bytes 53 20 15 80 (NO padding). msm_dsi_host_cmd_xfer_commit(): DMA_BASE, DMA_LEN, TRIG_DMA=1. Busy poll must be a CPU spin, NOT XNU IODelay/WFE (RootCommands.h:22). Host test: PASS 'enchilada MDSS DSI0 command-channel transport (7 test groups)'; strict -Wconversion -Wsign-conversion -Wshadow -pedantic compile exit 0; independent dump byte-identical to mainline; recipe py_compile exit 0; both C units also compile clean as arm64-apple-darwin -mgeneral-regs-only objects.", "Stage 3 layer 2.5 (read-only runtime probe): two independent verifications passed locally. (1) check-enchilada-msm-dsi-host.py runs both test binaries -> PASS command-channel transport (7 groups) + PASS read-only runtime session (3 groups; FakeDsi proves 7 registers each read exactly once at the dsi.xml offsets and writes==0). (2) clang++ -std=c++17 -target arm64-apple-darwin -fsyntax-only -Wall -Wextra -Werror on EnchiladaBacklightProbe.cpp exit 0 (PE_parse_boot_argn has C linkage via pexpert.h __BEGIN_DECLS:42). Design cross-checked against device-proven staged probes (EnchiladaTouchProbe.cpp stage 1 read only, EnchiladaCpuFreq.cpp mode 1 read only) and the strong/weak symbol pattern: armcpu_map_physical strong extern C in ArmCpu.cpp:207; native_backlight_stats strong volatile int32_t[10] overrides BootProgressStubs.c:65 weak char[4096], matching BootLog.c:174 type. BootProgressStubs.c kept CRLF (167 lines) and .symbols kept LF; BootProgress.c:161 weak_import + :1272 1 Hz call. NO hardware claim: not flashed, L st=3 row not yet observed.", "CMD-DMA address open question for layer 3: Linux v6.12 dsi_host.c dsi_tx_buf_alloc_6g() uses msm_gem_kernel_new + msm_gem_get_and_pin_iova (MDSS SMMU IOVA), not a plain physical address as v2 dma_alloc_coherent did; enchilada DTS dsi_ctrl0 node has no iommus property (neighbouring rot nodes do). Sending a brightness packet also needs dc civac + dsb sy cache maintenance (Dwc3Gadget.cpp:306-313).", "CI verification (run #207, 2026-11-07, commit 7adf35f7): the real macos-26 kernel build compiled all 19 other archives successfully and failed ONLY in build-enchilada-msm-dsi.log with two C++20 -Werror,-Wdeprecated-volatile errors that a local -std=c++17 stub-header syntax check could not catch: (1) MsmDsiSession.h:63 volatile-qualified array parameter 'volatile int32_t stats[10]' and (2) EnchiladaBacklightProbe.cpp:99 '++gPolls' on a volatile object. Fixed by spelling the parameter as a pointer to volatile ('volatile int32_t *stats', keeping concurrent-read semantics) and replacing ++ with an explicit read+assign ('gPolls = gPolls + 1'). Re-verified locally with the CI-equivalent 'clang++ -std=c++20 -Wdeprecated-volatile -Werror' (exit 0), strict C11 compile of MsmDsiSession.c (exit 0), and the full host runner (both test binaries PASS). This is the '先核验再上机' discipline: no flash until the real kernel compiles.", "Stage 3 layer-3 prerequisite (HOST-VERIFIED only): MsmDsiSmmu.c survey passes two independent host verifications (10 fake-MMIO test groups: geometry decoders, Bypass/Translate/S2CR-bypass verdicts, id+mask matching, read-only with every read < window, null refusals, 10-slot pack, exact six-stream list; plus strict C11 / C++20 -Wdeprecated-volatile / arm64 -mgeneral-regs-only compiles). Decision/rationale: mainline 6G DSI DMA base is an SMMU IOVA but this board's display stream IDs differ from sheng and no device diagnostic exists, so a READ-ONLY device survey must confirm bypass/translation BEFORE the first DCS packet (先核验再上机); this module is code + host tests only, NOT wired to a runtime mode and NOT flashed.", "Stage 3 layer-3 prerequisite mode-2 (HOST-VERIFIED ONLY): the gated enchilada-backlight=2 read-only runtime probe is wired and passes two independent host verifications (11 SMMU test groups including the new volatile L-row publish helper; C++20 -Wdeprecated-volatile full-shim syntax; strict C11; arm64 object; checker 15 areas; guard 4/4). Mode 1 (st=3, backlight208) is unchanged. NOT yet CI-compiled in the real macOS/Xcode XNU headers and NOT yet flashed: the SMMU bypass/translation verdict on the real enchilada device is still UNKNOWN (先核验再上机).", "Stage 3 layer-3 prerequisite MODE-2 DEVICE-VERIFIED (backlight209mode2, CI #209 kernel 2b14dc4ad678): enchilada-backlight=2 flashed the gated read-only SMMU survey. 510 L rows all st=4 (Surveyed), req=337..599 (263 distinct 1 Hz polls), one coherent decoded tuple: num_cb=45 global_pages=64, bypass=2 translating=0, verdict=1 (Bypass), first_s2cr=0x0 (TYPE=0, CBNDX=0), first_sctlr=0xe0 (M=0 translation OFF), first_cbar=0x10003, first_ttbr0_lo=0x0, first_stream=0x880 (enchilada MDP display SID, not sheng 0x1c00/0x1c02). Two independent verifiers PASS: verify_device_mode2.py (stages [4], verdict {Bypass}, controls console206 [0] / backlight208 [3]) and verify_device_mode2_independent.py (fresh boot_id 554983992, re-derives physical/bypass from raw S2CR.TYPE/SCTLR.M/CBNDX, asserts enchilada-only stream set). DEVICE CONCLUSION: the display context bank has translation OFF, so a CPU physical address is safe for REG_DSI_DMA_BASE; the physical-vs-IOVA blocker is RESOLVED. No register write, no DMA, no brightness change in this stage.", "Stage 3 layer 3a (HOST-VERIFIED ONLY): a new load-bearing hardware constraint was found during the AppleARMBacklight shape survey — REG_DSI_DMA_BASE is a 32-bit register (dsi_host.c:2245 u32 dma_base, dsi.xml width 32), so a bypassed physical address must fit in 32 bits. The mode-2 device survey (backlight209mode2) confirmed Bypass/physical is safe but did NOT reveal where a fresh IOBufferMemoryDescriptor lands; the 32-bit gate therefore defers that question to runtime and refuses safely. Layer 3a passes two independent host verifications (7 new test groups + strict C11/arm64/C++20 compiles + checker + guard) but is NOT CI-compiled under real XNU headers and NOT flashed; no register write, no DMA, no brightness change has occurred on device from this unit.", "Stage 3 layer 3b HOST-VERIFIED ONLY: the enchilada-backlight=3 first-write runtime probe is wired (IOBufferMemoryDescriptor low DMA buffer + armcpu_map_physical(0xae94000,0x400)+4 + dc civac/dsb sy clean + msm_dsi_brightness_send) with modes 1/2 proven unchanged. A new local -fsyntax-only IOKit stub set (work/tmp/dsi-shim-stubs: pexpert/pexpert.h, kern/task.h, IOKit/IOMemoryDescriptor.h, IOKit/IOBufferMemoryDescriptor.h) lets the C++20 -Wdeprecated-volatile check run locally before CI; the CI #207 lesson is why the local check uses the exact -std=c++20 -Wdeprecated-volatile -Werror flags. LOAD-BEARING open question that mode 3 settles on device: whether a fresh IOBufferMemoryDescriptor physical address is below 4 GiB (NativeUfs.cpp:1197 warns high on the sibling SoC, but enchilada-facts/parsed.txt carveouts are all < 4 GiB). The L row will report st=5 (transmit OK) or st=-2 (AddrTooHigh, needs the NativeUfs.cpp:1092-1161 kExtraIova=0x10000000 stage-1 SMMU IOVA fallback) or st=-4 (DMA busy timeout). NOT CI-compiled, NOT flashed, NO hardware claim.", "Stage 3 layer 3b DEVICE-VERIFIED (backlight210mode3, CI #210 kernel c745da6776d4, evidence/backlight210mode3.md): flashing with enchilada-backlight=3 produced 510 L rows all st=5 (Tx), lvl=512, dma_len(a)=8, dma_addr_lo(b)=-1375625216 = 0xae01a000 (a CPU physical address BELOW 4 GiB), rc(xerr)=0, sent(irq)=1, addr_high(ea)=0, dma_err(eb)=0. The FIRST real DCS brightness packet was committed to the DSI0 CMD-DMA engine once and the engine reported completion (CMD_MODE_DMA_BUSY cleared, no timeout, CTRL restored); the 32-bit REG_DSI_DMA_BASE gate PASSED on device so the NativeUfs.cpp:1092-1161 kExtraIova=0x10000000 stage-1 SMMU IOVA fallback is NOT needed. Two independent verifiers PASS (packed stage decode + raw-field re-derivation with max(sent+addr_high+dma_err)=1 one-shot over ALL rows) and controls are unchanged (console206 st=0 / backlight208 st=3 / backlight209mode2 st=4). This is the first WRITE and the first DMA in the whole backlight stack. It does NOT prove a measured brightness change on the panel (no framebuffer/photo/light-sensor readback) nor continuous control (fixed one-shot level 512): the OS-facing AppleARMBacklight IOService (layer 3d) still does not exist."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls (brightness slider, DCS SET_DISPLAY_BRIGHTNESS, FadePeriod) work."]
limits = [
    'FINAL STATE (2026-11-08): stage 3 display work is CI-compiled and device-observed. Remaining honest limits: no optical brightness readback, CoreBrightness userspace acceptance UNCONFIRMED (req=0), and which ptrauth branch the CI SDK selected is not observable from the L row. All earlier limits entries below are HISTORICAL and superseded by CI #211 + backlight211mode4.',
    'Layer 3d-beta is now CI-compiled and device-observed, but a real panel luminance change is NOT measured (no optical readback); userspace CoreBrightness acceptance is CONFIRMED only if req>0 was observed. Both are stated honestly in evidence/backlight211mode4.md.','Layer 3d-beta [HISTORICAL STATE, superseded by CI #211 + backlight211mode4]: was HOST-VERIFIED ONLY: no CI build under real macOS/Xcode XNU headers yet (stubs are not ABI-equivalent, CI #207), NOT flashed, NO L-row produced on device, NO runtime metaclass lookup / CoreBrightness acceptance / measured brightness change yet. The 8-archive-object late-objcopy recipe, the enchilada-backlight=4 gate, and the enchilada_backlight_transmit hook are all host-verified but await CI + device verification. The real XNU ABI (ptrauth vs non-ptrauth branch selection, OSMetaClass macros, IOService signatures) can ONLY be settled by CI. Modes 1/2/3 remain DEVICE-VERIFIED and byte-identical to the e200f1ab remote blob.', 'Layer 3d-alpha is pure C + host tests ONLY: no IOKit IOService class, no OSMetaClass, no metaclass lookup, no register access, no L-row produced on device. It has NOT been CI-compiled under real macOS/Xcode XNU headers and NOT flashed. The layer 3d-beta EnchiladaBacklight : IOService class body, its late-object objcopy (--remove-section=__DATA,__mod_init_func --globalize-symbol=__GLOBAL__sub_I_EnchiladaBacklight.cpp), the 16 ms fade work loop bound to msm_dsi_brightness_send(), and the runtime metaclass-lookup / CoreBrightness acceptance check are all still pending.', "No OS-facing brightness service exists: no IODisplayParameters/brightness/backlight-control publication. The DCS packet bytes (layer 1), the MSM DSI0 CMD DMA transmit path (layer 2), and the read-only runtime probe (layer 2.5) are constructed and host-verified; layer 2.5 is now DEVICE-VERIFIED (backlight208: 510 L rows st=3, seven live DSI0 registers matching mainline command-mode constants, control console206 all zeros). NO packet reaches the panel yet: layer 2.5 deliberately writes nothing and triggers no DMA, and the 1 Hz probe is gated by enchilada-backlight=1 (default off). Sending a brightness packet still needs the CMD-DMA address question (physical vs MDSS SMMU IOVA) and cache maintenance settled. Layer 3 (AppleARMBacklight-facing IOService + the transmit-side runtime probe) is still required. A cold-boot full-controller reprogram is deliberately NOT done because the panel is already lit by the UEFI GOP framebuffer.", "Layer-3 prerequisite read-only SMMU survey (MsmDsiSmmu.c) is now CI-compiled (CI #209, real macOS/Xcode XNU headers, 5-object archive PASS) and DEVICE-VERIFIED (backlight209mode2: 510 L rows st=4, verdict=Bypass). The CMD-DMA physical-vs-IOVA question is RESOLVED: the enchilada display context bank has SCTLR.M=0 (translation OFF), so a CPU physical address is safe for REG_DSI_DMA_BASE. The survey wrote nothing (no wr callback) and triggered no DMA. Still unproven: an actual brightness change, DCS packet transmission, and the layer-3 AppleARMBacklight IOService.", "Layer 3a (pure-C transmit orchestrator) and layer 3b (gated enchilada-backlight=3 C++ shim) are HOST-VERIFIED ONLY: compiled with local stubs, host-tested and statically diffed against the device-verified baseline, but NOT yet CI-compiled under real macOS/Xcode XNU headers and NOT flashed. No real DCS brightness packet has reached the panel, no brightness change has been observed, and it is still UNKNOWN whether the kernel DMA allocation lands below the 32-bit REG_DSI_DMA_BASE limit on this device. The layer-3d AppleARMBacklight-facing IOService does not exist. Only layers 1 / 2 / 2.5(mode 1) / mode-2 survey are DEVICE-VERIFIED so far.", "Layer 3a (pure-C transmit orchestrator) and layer 3b (gated enchilada-backlight=3 C++ shim) are now CI-COMPILED (CI #210, real macOS/Xcode XNU headers, 6-object archive PASS) and DEVICE-VERIFIED (backlight210mode3: 510 L rows st=5, one DCS packet sent at level 512, DMA_BASE physical address 0xae01a000 < 4 GiB, rc=0). Remaining limit: there is still NO measured brightness change on the panel (the harness has no framebuffer/photo/light-sensor readback), NO continuous brightness control (fixed one-shot level 512), and NO OS-facing AppleARMBacklight IOService / IODisplayParameters.brightness / backlight-control / 16 ms fade (layer 3d). Modes 1/2/3 are all gated (default off) and the transmit is one-shot; a cold-boot full-controller reprogram is deliberately NOT done because the panel is already lit by the UEFI GOP framebuffer."]
