  '[ROUND 56, procedure 15/15] Re-derive instead of re-assert. Read the pinned gdsc sources, encode the descriptor -> (status register, masks) function in AdrenoGdscDecode.c, then cross-check it in Python from the same pinned bytes (scripts/verify-enchilada-gdsc-decode.py -> GDSC_DECODE_CROSS: PASS, 69 checks) so the C module and the upstream bytes are verified against EACH OTHER, not against a shared literal.',
  '[ROUND 57, procedure 16/16] Derive the SEQUENCE too, not just the constants. Round 56 made the status register a function of the descriptor; round 57 reads gdsc_enable() (:259-315) and gdsc_disable() (:317-364) out of the same pinned bytes and re-expresses their statement order as an ordered, fixed-size step plan (adreno_gdsc_plan_enable/disable/cpu_enable). The Python cross verifier rebuilds each plan from the flags alone and only then compares, so C and upstream are checked against EACH OTHER (GDSC_DECODE_CROSS: PASS, 98 checks).',
  '[ROUND 58 2026-11-11, HOST-VERIFIED] Composed the round-57 GDSC step plans with the round-51 power-up plan: the guarded bit of every genpd step now equals the CPU performs zero GDSC register writes for that domain, derived and asserted in both directions by AdrenoPowerUpGdscGuardMatchesWrites.',
  '[ROUND 59 2026-11-11, HOST-VERIFIED] A630 GMU TEARDOWN order derived from pinned Linux v6.12 a6xx_gmu_stop() (a6xx_gmu.c:1184-1217) and the GX-before-CX hardware constraint (gdsc.c:590, a6xx_gmu.c:1205). The stop body emits GX put (:1209-1210), then clk_bulk_disable_unprepare (:1212), then the CX put LAST (:1214), gated by pm_runtime_active (:1189). AdrenoPowerDownV1 encodes exactly that 3-op order: GX(guarded) - clocks(4) - CX. It is NOT the round-51 power-up plan reversed: power-up enables clocks LAST while teardown disables them in the MIDDLE, and no clk_set_rate exists in the stop path so rates are never restored.',
  '[ROUND 59 2026-11-11, CI-VERIFIED] CI #230 (run 43034488610, dispatch 14:01:28Z, success 14:26:22Z, device head b4579fd5) proved the 13th and 14th A630 archive units build and link inside a real XNU kernel, which the local host suite cannot show (different toolchain, SDK and link step). Artifact verification runs in two independent domains: scripts/verify-ci-230-adreno.py parses the downloaded artifacts (archive line, object count, sha256 of the pinned inputs, kernel Mach-O size/magic/sha256, 9 required symbols, absence of AdrenoPowerDownV1, stage3=plan present and stage3=exec absent), and a .NET Invoke-RestMethod pass re-reads the run, job and artifact metadata from the GitHub API.',
  '[ROUND 60 2026-11-11, CI-VERIFIED] CI #231 (run 43043000108, dispatch 14:54:20Z, success 15:17:58Z, device head 0e11f1b3) proved the 15th A630 archive unit builds and links inside a real XNU kernel, which the local host suite cannot show (different toolchain, SDK and link step). Artifact verification runs in two independent domains: scripts/verify-ci-231-adreno.py parses the downloaded artifacts (archive line, object count, kernel Mach-O size/magic/sha256, 13 required symbols including all nine AdrenoPowerDownV1 exports, stage3=plan present and stage3=exec absent), and a .NET Invoke-RestMethod pass re-reads the run, job, step list and artifact metadata from the GitHub API.',
  '[ROUND 65 2026-11-12, CI-VERIFIED] CI #232 (run 43142322338, dispatch 02:34:09Z, success 02:53:40Z, device head e2adac8e) proved the 20th A630 archive unit AdrenoMetalSeamV1.c and the four consolidated ROUND 61-64 units build and link inside a real XNU kernel (libEnchiladaAdreno.a 20 objects sha256 678e1c6219cc110d, kernel.macho 126066688 B sha256 a69f8e7dbba316, all 14 metal-seam exports plus 13 earlier unit names present). Two independent verifications: scripts/verify-ci-232-adreno.py parses the downloaded artifacts (45 checks) and a .NET Invoke-RestMethod pass re-reads run, job, step list and artifact metadata (14 checks).',
  '[ROUND 66 2026-11-12, CI-VERIFIED] CI #233 (run 43158161524, dispatch 2026-11-12T04:57:42Z, success 2026-11-12T05:12:13Z, device head 6e50eea85593) proved the 21st A630 archive unit AdrenoDarwinKmdAbiV1/AdrenoDarwinKmdAbiV1.c builds and links inside a real XNU kernel (libEnchiladaAdreno.a 21 objects sha256 a1d20d90bb7a75d2, kernel.macho 126070784 B sha256 18bcb8e25b43, all 8 darwin-kmd exports plus 15 earlier unit names present). Two independent verifications: scripts/verify-ci-233-adreno.py parses the downloaded artifacts and a .NET Invoke-RestMethod pass re-reads run, job, step list and artifact metadata.',
'[HISTORICAL, kept for traceability] Follow /zh/porting/gpu for the selected OS ABI; sheng 6 archives (adreno740-kits, accelerator, gmu, gmu-votes, gpu-smmu, dts/inputs) are the upstream method reference.',
]
findings = [
  '[ROUND 116 AND 117 2026-11-14, HOST-VERIFIED / COMMENT CORRECTION + OPT-IN BYTE BUILD, NOTHING EXECUTED ON THE PHONE] Two rounds that change nothing about what the port can DO and everything about whether the two build modes can be told apart honestly. NO SMC issued, no PAS executed, NO MMIO, no device run, no flash, no reboot, no device-state change. (a) ROUND 116 - THE OLD WARNING CONFLATED TWO DIFFERENT ACTIONS. The ROUND 113 commentary said, in effect, never run generate-zap-blob.py before CI. That was too broad and would have blocked the only honest way to test the byte path. It is now split into the TWO REAL BUILD MODES, distinguished by ONE criterion: whether the firmware bytes EXIST - NOT by whether the build is red or green. DEFAULT (no bytes): no header is generated, the fallback branch in EnchiladaAdrenoProbe.cpp is LIVE, the kernel logs blob=absent, and the regression gate in check-enchilada-adreno-probe.py compiles exactly THIS case against an include directory that provably lacks the header. This is the mode every ordinary CI run is in, and the absence is a REAL build condition rather than an accident to paper over. OPT-IN (bytes): a HUMAN dispatches the workflow and supplies the bytes, generate-zap-blob.py runs ON PURPOSE, the header exists, and the fallback is compiled out. That is expected and correct. WHAT REMAINS FORBIDDEN is therefore narrower than the old wording: it is running the generator to turn a RED DEFAULT build GREEN. Doing that manufactures the header, the regression gate then tests the WRONG branch, and the absent-header path goes back to being unbuilt and unverified everywhere - which is precisely how CI #247 stayed invisible. A red default build is a real finding: fix the code, do not feed it bytes. The ROUND 116 change is PROSE ONLY and that was verified by counting: 46 insertions and 13 deletions, of which every added line is a comment, so the non-comment code change is ZERO lines. The ROUND 113 gate still fires: both mutations re-trigger it (re-injecting the sentinel define reproduces the seven undeclared identifiers, removing the unused attributes reproduces the four -Werror,-unused-const-variable errors). (b) ROUND 117 - AN OPT-IN BUILD THAT ACTUALLY CARRIES THE BYTES. Four files. The generator gained --firmware-dir and --require-bytes. board.toml archives gained a line running the generator BEFORE build-enchilada-adreno.py, and the position IS the ordering guarantee because kernel.py runs build_archives (:188) before the kernel link (:189). The workflow gained a zap_firmware_b64 INPUT and a step that decodes it. The probe verifier grew from 20 to 26 assertions. THE LOAD-BEARING PLATFORM FACT, recorded because it cost real time and will cost it again: `{tree}` CANNOT be used in a board.toml archives entry. kernel.py substitutes {tree} ONLY for component: specs (:128-129); a plain script entry goes through shlex.split at :132 with NO substitution, so a literal {tree} would be handed to the generator and fail to open a file that does not exist. What works is a RELATIVE path, because kernel.py runs each archive with cwd = the build tree (:141), so `.cache/firmware` there means <tree>/.cache/firmware - and the tree carries a junction back to the device repository .cache/firmware, which is what makes bytes written by a CI step visible at that path. The explicit --firmware-dir is still required rather than relying on the generator defaults, because inside the tree ROOT is <tree>, so ROOT-relative guesses resolve under out/. A SECOND TRAP, IN resolve_firmware_dir(): it returns the first candidate that ACTUALLY HOLDS BOTH input files, not the first that merely EXISTS. The distinction is not pedantic - in CI `.cache/firmware` always exists because the workflow and the junction create it, and it is EMPTY on a no-bytes run, so an exists-check would have silently masked the local extraction directory and made the opt-in path unreachable. When nothing holds the bytes it falls back to the first candidate so the error message names a sensible path. AN INPUT, NOT A SECRET, and the reason is a measured fact: the device repository has NO secrets (secrets total_count = 0), so a secrets.ZAP_FIRMWARE reference would resolve to the empty string forever and the opt-in could never work at all. The workflow description says so in place. THE PAYLOAD IS FIXED-LAYOUT AND LENGTH-CHECKED: base64 of a630_zap.mdt (6684 B) immediately followed by a630_zap.b02 (1968 B), i.e. 8652 raw bytes and therefore 11536 base64 characters. The injection step refuses any other decoded length with an explicit error BEFORE the kernel build starts, and it verifies the layout by splitting at exactly 6684. It then prints the sha256 of the two files it wrote, so the run log proves WHICH bytes were used without ever printing them. The generator independently re-checks size AND sha256 against scripts/data/adreno-a630-device-firmware.json, so a bad decode fails there too rather than much later inside a link. THE DEFAULT PATH IS BYTE-FOR-BYTE UNCHANGED, and that was proven rather than asserted: running the generator with an empty firmware directory produces a 2118 B header whose sha256 is 1a33c81d3a3da09af238e30a247afe2b8da09296f3adda39cf051517ff1b67c2, which is IDENTICAL to the header already in the tree. So a no-bytes CI run cannot differ from the pre-117 build because of this change. For completeness the opt-in path was exercised too: with the real bytes it emits 56906 B declaring present=1, mdt=6684 and seg=1968. (c) WHAT THIS ROUND DOES NOT DO. It does not prove the byte path works END TO END - that needs a dispatched run carrying the payload, which is a separate action. It does not put any firmware BYTE into the repository: the header is gitignored (.gitignore:91), .cache/ is gitignored (:13), and this record carries sizes and hashes only. And it does not move any gate: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0, and stage 5 remains blocked. Carrying bytes to the right memory is a precondition for a PAS call, not a PAS call. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and the token file location; recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 113 2026-11-14, HOST-VERIFIED / BUILD-BREAK REPAIR, NOTHING EXECUTED] ROUND 113 fixes the TWO defects that made CI #247 fail at step 15 Build kernel, and adds the regression gate that would have caught them locally. NO SMC issued, no PAS executed, NO MMIO, no firmware loaded, no flash, no reboot, no device-state change. WHY THIS ROUND EXISTS: ROUND 112 dispatched CI to settle whether the exported SMC symbol reaches the linked image - the one claim local tooling could not test - and CI failed EARLIER than that question: the probe did not compile at all, so no kernel was ever linked and no symbol could be examined. Two independent defects were stacked, and the second was only visible after the first was fixed. (a) DEFECT 1, A GUARD THAT DISARMED ITS OWN FALLBACK. package/EnchiladaAdrenoProbe.cpp used to read: include the generated header when __has_include says it is there, OTHERWISE `#define ADRENO_ZAP_BLOB_V1_H`. But ADRENO_ZAP_BLOB_V1_H is exactly the sentinel the immediately following `#ifndef ADRENO_ZAP_BLOB_V1_H` tests. Defining it in the else branch therefore announced to the fallback that a real header had been included, at the precise moment none had been, so the entire fallback block of constants was SKIPPED. The compiler then reported SEVEN undeclared identifiers, at :890 kAdrenoZapRegionPhys, :891 kAdrenoZapSegBytes, :922 kAdrenoZapRegionPhys, :939 kAdrenoZapBlobPresent, :940 kAdrenoZapSegBytes, :941 kAdrenoZapRegionPhys and :942 kAdrenoZapRegionBytes - line numbers as reported by CI #247. THE LINE READ LIKE a harmless this-branch-is-handled marker and was in fact the opposite. (b) DEFECT 2, ONLY VISIBLE AFTER DEFECT 1 WAS GONE. With the sentinel removed the file still failed: the four fallback placeholders kAdrenoZapMdtSha256, kAdrenoZapSegSha256, adreno_zap_mdt and adreno_zap_seg were defined but never read in that translation unit, so both real builders - which compile with -Werror (build-enchilada-adreno.py:35 and check-enchilada-adreno-probe.py:30) - failed them as -Wunused-const-variable. THE LOAD-BEARING DETAIL, and the reason this was invisible for so long: the SAME declarations in the GENERATED header do NOT trigger the warning, because clang suppresses unused-const-variable for declarations that arrive through an #include. A fallback written inline in the .cpp gets no such treatment. Verified this round both ways: the real header included and never used compiles clean, while the inline fallback without the attribute produces exactly those four errors. They are therefore marked __attribute__((unused)) - not cosmetic, load-bearing. (c) THE GUARD NOW DOES THE MINIMUM AND SAYS WHY. The else branch no longer defines anything: absence of the header simply leaves the sentinel undefined, so the following #ifndef is TRUE and the fallback block runs. The comment that replaces the old lines records the trap by name so it cannot be reintroduced by someone tidying up. (d) A REGRESSION GATE THAT REPRODUCES THE CI CONDITION LOCALLY. scripts/check-enchilada-adreno-probe.py gained a check that builds the probe against an ISOLATED include directory which it first ASSERTS lacks AdrenoZapBlobV1.h, using the same strict warning set. That is the state every CI host is in and the state no developer tree is in, which is what made this class of bug invisible. probe went from 18 to 20 checks. TWO MUTATIONS were run to prove the gate bites rather than merely passing: re-injecting the sentinel define reproduces all seven undeclared identifiers, and removing the unused attributes reproduces all four -Wunused-const-variable errors. Both revert to clean. (e) THE REAL LESSON: THIS PROJECT FIRST ENVIRONMENT-DIFFERENCE FAILURE. Every local gate was GREEN while CI was RED, and none of them was wrong - they were answering a different question. On this host the gitignored generated header EXISTS as a 2118 B absent stub, so __has_include was TRUE, the header was included, and the fallback never ran. CI does a clean checkout of a repository that gitignores that header and has no step that generates it, so __has_include was FALSE and the fallback ran - badly. The probe check 18/18, the host suite 31/31 and all 71 verifiers passed before CI was dispatched, and all of them were honest; none of them compiled the file in the condition CI compiles it in. That is now the gate above. (f) THE WRONG FIX, RECORDED SO IT IS NOT ATTEMPTED. Do NOT make a future red build green by running scripts/generate-zap-blob.py before CI. That manufactures the header, so the fallback branch is never exercised, and this exact class of bug becomes invisible again - while CI would still not be testing what CI is for. The absence of the header is a REAL build condition, not an accident to be papered over: the fallback exists to make that condition compile HONESTLY, with present=0 and the log line reading blob=absent, rather than to hide it. The commentary in both the probe and the gate states this explicitly. VERIFICATION THIS ROUND: the probe check is 20/20 rc 0. Independently of that gate, the probe was compiled with strict flags in BOTH conditions - header absent from the include path rc 0, header present rc 0 - so the two branches are both exercised rather than one being assumed. The two mutation results above are reproduced in this round own logs. HONEST BOUNDARY UNCHANGED: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0. THIS ROUND FIXED A BUILD BREAK; IT STILL DID NOT PROVE THE SMC SYMBOL REACHES THE LINKED IMAGE. That assertion from ROUND 110 remains UNCLOSED and still needs a green CI artifact to settle - repairing the compile is a precondition for asking the question, not an answer to it. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and the token file location; recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 110 AND 111 2026-11-14, HOST-VERIFIED / EXPORT + WIRING + ASSERTION REPAIR, NOTHING EXECUTED] ROUND 110 gives stage 7 a REAL way to reach the secure world for the first time - an exported SMC entry point - and ROUND 111 closes a protection gap that export created. Even so NOTHING WAS SENT: no SMC issued, no PAS executed, NO MMIO, no firmware loaded, no flash, no reboot, no device-state change, no CI dispatch. The phone was not touched. (a) ROUND 110 - THE SCM ASM IS NOW REACHABLE, AND THE EXPORT WAS DESIGNED AROUND A TRAP. drivers/ArmCpu/ArmCpu.cpp 60624 to 65046 B. The single SCM asm block was factored into scm4(fn, info, a2, a3, a4) so that x4 becomes a PARAMETER, and the original four-argument scm() was reduced to `return scm4(fn, info, a2, a3, 0)` - x4 pinned to 0 exactly as that function always did. The FIVE device-proven call sites are unchanged character for character. The file now contains exactly THREE real `smc #0` instructions - :149 in scm4, :865 in psciCall, :974 in the PSCI SYSTEM_RESET path - and the other two textual occurrences are comments. That count was re-derived here rather than quoted. The new export is `extern C int32_t armcpu_scm_call(fn, arginfo, a2, a3, a4, uint64_t *transport_ret, uint64_t *secure_result)` plus `extern C int32_t armcpu_scm_busy`, carrying x0 = fn, x1 = arginfo, x2 = args[0] = the peripheral, x3 = args[1], x4 = args[2] (the mem_setup size) and x5 = 0. Outputs: transport_ret receives smc a0, secure_result receives smc a1, which is the P6:204 mapping ROUND 108 established. THE RETURN CONVENTION IS DELIBERATELY NOT `return a0`, and this must not be simplified later: it returns 0 when the SMC WAS ISSUED (outputs valid) and -16 = -EBUSY when it was NOT (outputs untouched). The reason is that a0 is a secure-world status and EVERY u64 is a legal one, so folding the refusal into the return value would make this port refuse to send indistinguishable from the secure world actually rejecting - the exact conflation this whole line of work exists to avoid. A caller that sees 0 has learned only that the call went out; whether it SUCCEEDED is secure_result == 0. CONCURRENCY: no mutex, and the reasoning is the design decision, not an omission. A mutex can sleep and stage 7 may run where sleeping is not acceptable, so re-entrancy of the PAS three-stage sequence is blocked with a single __atomic_exchange_n on armcpu_scm_busy instead. The premise is that stage 7 runs on the monitor kernel thread started at package/BootProgress.c:1315 while scmDisableCrashdump runs earlier in ArmCpu::start (:589), so those two have a defined ORDER rather than concurrency; what remains is the sequence re-entering itself. The five existing call sites still go through the old scm() and were not touched. STAGE 7 WIRING: a weak_import declaration named armcpu_scm_call sits in the same extern C block and for the same reason as the existing armcpu_map_physical, and zapBridgeCall adapts the export contract to the transport struct. A REAL transport is constructed only when ALL THREE hold: armed (enchilada-pas-exec=1) AND the symbol address is non-null AND the plan resolved. Otherwise the probe prints the plan and names the reason in a `why=` field whose values are not-armed, transport-symbol-unavailable and plan-unresolved, with a row prefix distinguishing exec from armed-no-symbol from armed-not-executed. Transport and the secure result are reported per stage in separate fields t0= s0= t1= s1= t2= s2= and are NEVER collapsed into one number, because ROUND 108 proved they come from different registers. RISK REGISTERED, NOT FIXED: the deadline reset at :974 hard-codes `smc #0` and does NOT consult the DT /psci method, while psciCall at :856 does branch on it. On this phone psci_method is smc so it is harmless today, but on an HVC platform that path would issue down the wrong conduit. Left as a recorded hazard rather than an unrequested change. (b) ROUND 111 - THE EXPORT EXPOSED A GAP AND THE GAP IS NOW CLOSED PROPERLY. To avoid the stage-4 and stage-5 generic dereference-STORE regex, ROUND 110 spelled the bridge write as out_result0[0] = ... instead of *out_result0 = ... . The net effect was that the ONE function-pointer write in that function became UNPOLICED, because that regex matches `*x =` and does NOT match `x[0] =` - behaviour re-confirmed here by running both forms through the actual pattern. A generic regex cannot be widened to catch the subscript form without also firing on legitimate array writes, so the fix is a SCOPE-AND-ENUMERATE assertion rather than a bigger pattern. scripts/verify-enchilada-probe-stage6.py 16743 to 21227 B slices the zapBridgeCall body and then asserts, INSIDE that body: (a) no dereference-store, reusing the stage-4/stage-5 pattern unchanged; (b) the ONLY permitted pointer writes are to out_result0 and to the cookie b, with every other receiver enumerated and named in the failure message; (c) no volatile access, no reinterpret_cast, no wr32/write32/out32/mmio/writel/readl/IOConnectCall/IOServiceOpen primitives; (d) no call to the window adapter write path AdrenoGpuccWindowV1Mmio, AdrenoCallerV1Run, gpucc_udelay or armcpu_map_physical; (e) that it DOES call armcpu_scm_call, which is its only hardware effect. stage-6 went from 98 to 122 checks. The stage-4 and stage-5 guards are verbatim identical to each other and to their previous text; nothing was relaxed. MUTATION EVIDENCE, reproduced INDEPENDENTLY THIS ROUND RATHER THAN TAKEN FROM THE REPORT: injecting `{ uint64_t *other = 0; other[0] = 7; }` into the bridge makes the verifier FAIL with the message naming the offending receiver, and it is caught by the NEW rule specifically - this is the exact form the old generic regex cannot see. Restoring the file returns rc 0 and the sha256 returns to its pre-test value, so the injected bytes did not survive. ROUND 110 also had a second self-inflicted hazard that was fixed rather than shipped: its first draft of the comment spelled out the two EXECUTE marker strings that verify-ci-246 forbids, and that check scans the linked image where comments are not stripped; the wording now describes them without reproducing them. (c) THE CI READ-ONLY BOUNDARY IS INTACT, INDEPENDENTLY CHECKED. verify-ci-246 lines 204-206 forbid six strings: _writel( , _readl( , _IOServiceOpen , _IOConnectCallMethod , _qcom_scm_call and adreno_zap_shader_load. All six are absent from both drivers/ArmCpu/ArmCpu.cpp and package/EnchiladaAdrenoProbe.cpp at SOURCE level, and all six are absent from the compiled probe object at BYTE level. The key question - whether the new export accidentally matches the forbidden pattern - was settled by checking the SUBSTRING RELATION directly rather than trusting a report: _qcom_scm_call is NOT a substring of _armcpu_scm_call (find returns -1), because the divergence begins at the character after the leading underscore. The compiled probe object shows the expected shape: it references _armcpu_scm_call as UNDEFINED (a weak import waiting for the kernel to supply it) and defines the bridge locally. The DEFINITION side, `T _armcpu_scm_call`, was confirmed in source but COULD NOT be confirmed in a locally compiled object, because ArmCpu.cpp includes IOKit/IOCPU.h and this host has no XNU SDK, so that TU is an XNU-headers-only compile and only CI can produce its object - stated plainly here rather than implied. No verify-ci-*.py was modified: all 20 of them are byte-identical to the previous remote revision. The four stage verifiers keep their original (stage < 1u || stage > 6u) mask, checked 4 of 4, so stage 7 did not widen the accepted boot-arg domain. VERIFICATION THIS ROUND, ALL RE-RUN: probe 18/18 rc 0; host 31/31 suites rc 0 with the banner still reading without sanitizers because this host clang fails the sanitizer self-test, a toolchain limitation and not a code defect; all 71 scripts/verify-*.py PASS rc 0, with the record verifier fed ead5834edce79b4b3ceb5108d6dca6e57496ee90 giving PASS (28 checks, 0 failures). THE 71/71 BASELINE IS NOT 70/71 AND NOT A BY-DESIGN FAILURE: that verifier compares its argument against the revision RECORDED for its evidence document, so an unargumented sweep reports 70/71 and that number is an artifact of the harness. Stage verifier counts: stage3 40/40, stage4 49/49, stage5 40/40, stage6 122/122. Counts re-derived from source: build units 31 = 1 cpp_rec + 30 c_rec, host TESTS 31, host SOURCES 30, verify-*.py 71. CONFIG_XNU_NATIVE_ADRENO stays n. ArmCpu.cpp is now 65046 B by design, which is the one count this round INTENTIONALLY changed. INDEX DISCIPLINE, FOURTH ROUND RUNNING: 4 files had an index that no longer matched the worktree, which this push mechanism turns into SILENT data loss because it takes the PATH LIST from the index and the CONTENT from the worktree. All were restaged with `git add -- <path>` and each verified with git ls-files -s against git hash-object before the push. (d) WHAT THIS DOES AND DOES NOT MEAN. Stage 7 can now reach the secure world IF a future round enables it on hardware. It has NOT been enabled: simulated or not, the transport is only constructed under a boot-arg key that this round did not set, no device run happened, and the reachability is a LINK-TIME fact, not a demonstrated call. HONEST BOUNDARY UNCHANGED: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0, and none of this unblocks stage 5. Having a callable transport is not having a successful authentication. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and the token file location; recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 109 2026-11-14, HOST-VERIFIED / PROBE + GENERATOR + SAFETY AUDIT, NOTHING EXECUTED] ROUND 109 corrects one implicit assumption from ROUND 107 about what the .mdt actually contains, arms a two-key stage-7 probe that still cannot call the secure world, adds a firmware-blob generator that fails loudly instead of plausibly, and audits the blast radius of doing any of it. NO SMC issued, NO PAS executed, NO MMIO, NO firmware loaded, NO flash, NO reboot, no device-state change, NO CI dispatch. (a) THE SPLIT IMAGE, AND A CORRECTION TO ROUND 107. Re-reading the REAL a630_zap.mdt (6684 B) program headers shows ph[1].p_offset = 4096 with filesz 6536 and ph[2].p_offset = 12288 with filesz 1968, so ph[2] ENDS at 14256 while the file is only 6684 B: THE LOADABLE SEGMENT PAYLOAD IS NOT INSIDE THE .mdt AT ALL. The .mdt carries the ELF header (148 B) plus the hash segment (6536 B) and nothing else; the segment bytes live in a630_zap.b02 (1968 B). The real split is therefore .mdt for qcom_scm_pas_init_image and .b02 for the gpu_region load. ROUND 107 concluded that a relocatable single segment needs 1968 B and that the 8192 B region is sufficient - THAT CONCLUSION STANDS - but ROUND 107 verified only the segment METADATA (filesz == memsz == 1968) and never checked whether those bytes were reachable from the file it named, so a reader could have concluded that embedding the .mdt alone is enough. It is not: embedding the .mdt supplies init_image and leaves the region empty. Both artifacts are needed, which is why the generator emits two arrays. (b) STAGE 7 IS ARMED BEHIND TWO KEYS AND STILL CANNOT EXECUTE. The probe accepts enchilada-adreno=6 as before and a NEW second key enchilada-pas-exec=1. With the first key alone it prints the full three-stage plan and the row stage7=armed-not-executed; only with the second key does it even call adreno_zap_pas_execute. EVEN THEN NOTHING IS SENT: the transport handed to the executor is a ZERO-INITIALISED struct adreno_zap_transport, so its call pointer is NULL, adreno_zap_transport_ready fails and the executor returns kAdrenoZapExecNoTransport with stages_run == 0. The interlock is honest at two independent levels - the boot arg gates the ATTEMPT, the still-missing ArmCpu export gates the CALL - and transport status is reported in a separate field from the secure world result[0], never collapsed into one number, because ROUND 108 established they come from different registers (a0 versus a1). GUARD PRESERVATION, stated because the opposite would be a silent weakening: the four probe verifiers still contain the ORIGINAL (stage < 1u || stage > 6u) mask, verified by grep this round, so stage 7 did not widen the accepted boot-arg domain. Stage 7 lives INSIDE the existing stage >= 6 block and is gated by its own key. A HAZARD THIS ROUND CREATED AND THEN FIXED: the first draft of the probe comment spelled out the two EXECUTE marker strings that verify-ci-246 forbids. That check scans the LINKED IMAGE and comments are not stripped, so a comment would have tripped it. The comment was rewritten to describe the markers without reproducing them, and an assertion now pins that. The read-only forbidden-symbol list itself was NOT relaxed. (c) THE GENERATOR FAILS LOUDLY, NOT PLAUSIBLY. scripts/generate-zap-blob.py emits two arrays: adreno_zap_mdt for init_image and adreno_zap_seg for the region. It validates BOTH byte count and sha256 of each input against scripts/data/adreno-a630-device-firmware.json and raises REFUSED on any mismatch. When the bytes are absent the output is present=0, both declared lengths 0, both digests all-zero, and each array EXACTLY ONE zero byte; the self-check asserts that no large all-zero array exists. --require-bytes turns the absent case into REFUSED. THE DESIGN INTENT, quoted because it is the whole point: a consumer that ignores the present flag and reads the arrays anyway receives one zero byte, NOT a plausible all-zero firmware - the failure must be obvious rather than silent. Output is deterministic, so the generated header is reproducible from the inputs and its own content is never the record. (d) BLAST-RADIUS AUDIT: THE WORST CASE IS RECOVERABLE. Three INDEPENDENT fallbacks exist, and independence is the claim being made: (1) the APSS hardware watchdog (qcom,apss-wdt-sdm845 at 0x17980000, bark 16 s and bite 32 s at 32768 Hz, ArmCpu.cpp:108-115) is PURE MMIO and NEVER traverses SMC, so it still fires if the SMC path is the thing that broke; (2) the misc BCB is armed to boot-recovery; (3) boot_a md5 ca8ddd7a5af345636cad8c5bf645fee2 is identical on the wire, in the backup and in the expectation. An SMC refusal is a SYNCHRONOUS RETURN CODE in x0, NOT an exception - supported by scmDisableCrashdump() issuing 8 SMC calls every boot with 509 of 509 device snapshots showing its output afterwards, and by ENCHILADA BARK appearing 0 times and CrashDump 0 times across 774 log files. The blast radius is the GPU subsystem itself: a scan of the whole device tree for phandle 0x2a7 returns exactly THREE textual hits, verified this round - the phandle definition at enchilada.dts:25184, the single real consumer memory-region = <0x2a7> on qcom,kgsl-hyp at :23614, and one PCIe interrupt-map cell value at :22804 that is not a phandle and is excluded as a false positive - so exactly ONE node actually references this region. The region sits in ordinary DRAM, is re-carved every boot, and is therefore SELF-HEALING on the next boot. RISKS RECORDED, NOT BURIED, and each one is why the fallbacks above must stay independent: boot_reset_watchdog() returns 1 on enchilada, so there is NO hypervisor watchdog fallback; enchilada-deadline travels through smc #0 and therefore SHARES THE PAS PIPE and CANNOT be counted as an independent fallback; and risk number one is that scmDisableCrashdump() itself issues SMC, so a broken SMC channel would leave the SDI and download-mode bits uncleared and a bite could land in Qualcomm CrashDump Mode instead of a clean reset. (e) COMPLIANCE. The .gitignore now carries /drivers/NativeAdreno/AdrenoZapBlobV1.h and *.bak. The first closes a REAL risk chain rather than a theoretical one: the generated header says DO NOT COMMIT and claims to be gitignored, and until this round NO RULE COVERED IT, so a regenerate followed by an unqualified git add -A would have pushed OEM-signed firmware into a public history that cannot be rewritten. The file on disk today is the ABSENT stub (present=0, 2118 B, both arrays one zero byte, zero proprietary bytes) so nothing was ever at risk in practice, but the rule is what keeps that true. The second rule covers porting.toml.round46.bak. Verified: check-ignore returns rc 0 for both, the index is 521 files with NO AdrenoZapBlobV1.h entry, no firmware bytes, no work/ path and no .bak path. VERIFICATION THIS ROUND, ALL RE-RUN: probe 18/18 rc 0; host 31/31 suites rc 0 with the banner still reading without sanitizers because this host clang fails the sanitizer self-test, a toolchain limitation and not a code defect; all 71 scripts/verify-*.py PASS with rc 0. THE 71/71 BASELINE IS NOT 70/71 AND NOT A BY-DESIGN FAILURE: verify-enchilada-gmu-caller-v1-record.py needs one 40-hex revision and COMPARES IT AGAINST THE REVISION RECORDED for its evidence document, so feeding ead5834edce79b4b3ceb5108d6dca6e57496ee90 gives PASS (28 checks, 0 failures) while feeding the branch head fails. Counts re-derived from source: build units 31 = 1 cpp_rec + 30 c_rec, host TESTS 31, host SOURCES 30, verify-*.py 71. CONFIG_XNU_NATIVE_ADRENO stays n, ArmCpu.cpp stays 60624 B, and no verify-ci-*.py was modified. The verify-ci-218-differential.py SSL flake seen in earlier rounds did not recur (24 of 24 checks PASS standalone). INDEX DISCIPLINE, RECORDED BECAUSE THIS PROJECT HAS LOST TIME TO IT THREE ROUNDS RUNNING: 4 files had an index that no longer matched the worktree at integration time, which this push mechanism turns into SILENT data loss rather than an error, since the script takes the PATH LIST from the index and the CONTENT from the worktree. All 4 were restaged with `git add -- <path>` (never `git add -A`, which had previously staged the whole build tree) and each verified with git ls-files -s against git hash-object before the push. HONEST BOUNDARY UNCHANGED: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0, and none of this unblocks stage 5. A probe that is armed behind two keys and an executor that receives a NULL transport have still never asked the secure world anything. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and the token file location; recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 108 2026-11-14, HOST-VERIFIED / PIN + CORRECTIVE, NOTHING EXECUTED] ROUND 108 pins the file that SETTLES the (a0, a1) question, and the answer CONTRADICTS the register layout this port had implemented in ROUND 106 and 107. NO SMC issued, NO PAS executed, NO MMIO, NO firmware loaded, NO flash, NO reboot, no device-state change, NO CI dispatch. (a) NEW PIN P6 - THE MAPPING IS NO LONGER AN INFERENCE. drivers/firmware/qcom/qcom_scm-smc.c is now pinned at 5356 B, sha256 e9121b279b3813b8ca3e0ac27fdcbe367b1e12cbfcbf39d75c754d3bc88f8c45, in the source cache the verifiers read (.cache/adreno-a630-source/...). P6 is numbered P6 because the existing pin set ends at P4: there is no P5 in that table, and the P5 that appears inside the zap-auth verifier A11 domain is a DIFFERENT numbering used for mdt_loader.c, not a member of this pin list. A DEFECT FOUND WHILE DOING IT, recorded because it affects reproducibility rather than this round only: P1 through P5 were NEVER in any fetch script - all five fetch-*.py contain no qcom_scm and no mdt_loader reference at all - so they had been placed into the cache by hand. P6 is therefore the FIRST SCM source that is inside a reproducible list, because it was added to scripts/data/adreno-a630-inputs.json (linux.files 8 to 9 entries) and that is the file fetch-adreno-a630-sources.py actually reads. (b) TWO REAL ERRORS IN THIS PORT OWN CONTRACT, FIXED IN CODE AND NOT MERELY IN PROSE. These SUPERSEDE the ROUND 106 and ROUND 107 implementations, so a reader who learned the call shape from those records must relearn it from this one. ERROR 1, THE REGISTER LAYOUT WAS SHIFTED BY ONE SLOT. P6:35 defines SCM_SMC_FIRST_REG_IDX 2, P6:171 sets smc.args[1] = desc->arginfo, and P6:172-173 copies desc->args[i] into smc.args[i + 2]. The register map is therefore x0 = the CALL_VAL composed with the function id, x1 = arginfo, x2 = args[0] = the peripheral id (P2:710), x3 = args[1], x4 = args[2]. ROUND 106 and 107 placed the PERIPHERAL in x1 and the payload in x2, which is wrong in a particularly nasty way: arginfo carries the argument COUNT in its low bits, so sending arginfo 13 where the peripheral belongs ships a call whose declared arity and payload disagree. The secure world would reject it, and this port would then have recorded that rejection as a POLICY denial - a wrong NEGATIVE conclusion, the most expensive kind here because it would have retired the whole K3 route on a self-inflicted malformed call. Fixed by changing the typedef parameter names to the register names, the executor packing, and every test assertion, with each slot asserted SEPARATELY so a future one-slot shift cannot pass. ERROR 2, result[0] COMES FROM a1 AND NOT FROM a0. P6:204 reads res->result[0] = smc_res.a1, P6:205-206 carry a2 and a3 into result[1] and result[2], and P6:209 returns (long)smc_res.a0 ? qcom_scm_remap_error(smc_res.a0) : 0 so a0 is the TRANSPORT STATUS, remapped to a negative errno, while a1 is the secure world result. P6:200 additionally returns early on a transport failure, so on that path res is never populated at all. The SEMANTIC model this port already had - both channels must be zero, and a zero transport return is not success - is CORRECT and is strengthened rather than weakened: the two channels are derived from DIFFERENT registers, which is exactly why they must be reported separately. What was wrong is the naive reading that a0 IS result[0]. Combined with P2:729 return ret ?: res.result[0], the whole rule is (a0 ?: a1). MUTATION EVIDENCE, recorded because an assertion nobody has tried to break is not evidence: restoring the shifted layout in the executor makes 11 zap-auth test assertions FAIL, and rewriting P6:204 to read result[0] = smc_res.a0 makes the verifier FAIL on 3 checks including the sha256 mismatch. Both revert to PASS. The assertions therefore DISCRIMINATE and are not decorative. (c) A NEW HARDWARE FACT THAT CONSTRAINS THE EXPORT PLAN. drivers/ArmCpu/ArmCpu.cpp pins x4 and x5 to 0 in its scm(