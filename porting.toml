  '[ROUND 65 2026-11-12] Metal establishment-chain inputs: oneplus6-ios/work/UniXNU/drivers/Adreno740/NativeAdrenoABI.h (7733 B, sha256 20ac9298bb390d86788c1fc58155e1f9581ffa942e222752efc95c67cb5670d2, generation-independent versioned kernel/user-client wire ABI), oneplus6-ios/work/UniXNU/docs/porting/gpu.md section 1 (matching-generation backend before frontend), Mesa freedreno_devices.py GPUId(630) a6xx_base/a6xx_gen1, the sha-pinned Linux v6.12 a6xx_catalog.c A630 entry (0x06030001/2, ADRENO_6XX_GEN1, SZ_1M, a630_zap.mdt), and the vendored enchilada.dts (sha256 e590ee32...) qcom,chipid 0x6030001 / highest-bank-bit 0x0f / ubwc-mode 0x02 / pas-id 0x0d.',
  "[ROUND 44] Upstream io contract pinned from the sha-pinned Linux v6.12 a6xx_gmu.c: gmu_read/gmu_write = readl/writel(mmio + (offset << 2)) - WORD-offset addressing (a6xx_gmu.h:104-152); gmu->rscc = mmio + 0x23000 (a6xx_gmu.c:1771); RSC ucode via gmu_write_rscc(gmu, REG_A6XX_RSCC_SEQ_MEM_0_DRV0, ...) :590-594; PDC ucode via pdc_write(seqptr, REG_A6XX_PDC_GPU_SEQ_MEM_0, ...) :601-605; setup_pdc writes REG_A6XX_PDC_GPU_SEQ_START_ADDR=0 then REG_A6XX_PDC_GPU_ENABLE_PDC=0x80000001 :641-643; PDC offsets pinned in scripts/data/adreno-a630-pdc-inputs.json (6 sources, 3 trees, ENCHILADA_PDC_OFFSETS_VERIFY PASS 200 + ENCHILADA_PDC_SECOND_VERIFY PASS 28).",
  "[ROUND 38] [SUPERSEDES the '3 vendor-signed ZAP blobs absent' premise] One reversible READ-ONLY ext4 mount of the phone's own vendor_a partition (TWRP 3.4.0-3, uid=0) exposed /vendor/firmware/ containing the full A630 set: a630_gmu.bin 32768 B, a630_sqe.fw 31980 B, a630_zap.b00 148 B, a630_zap.b01 6536 B, a630_zap.b02 1968 B, a630_zap.elf 14256 B, a630_zap.mdt 6684 B; all pulled read-only via adb pull; proprietary bytes stay out of the repo (gitignored work/tmp/a630-device-fw/), the durable manifest is scripts/data/adreno-a630-device-firmware.json.",
  'Stage 5 (2026-11-08) HOST-VERIFIED audit: enchilada is Adreno A630 (6xx GEN1, legacy GMU HFI v1 / SPTPRAC), NOT sheng SM8550 A740 (7xx GEN2). Three independent research passes: Linux v6.12 drivers/gpu/drm/msm/adreno/a6xx_catalog.c + a6xx_gmu.c, the vendor DTB Mu-Silicium/Resources/DTBs/enchilada.dts, and https://unixnu.com/zh/porting/gpu section 1.',
  'Round 20 (2026-11-09) HOST-VERIFIED A630 register map: 8 SHA-pinned Linux v6.12 torvalds A6XX sources (scripts/data/adreno-a630-inputs.json, fetched by scripts/fetch-adreno-a630-sources.py into gitignored .cache/), derived by scripts/derive-a630-hwinit.py using UniXNU upstream scripts/derive-a740-hwinit.py exact first-file-wins A6XX variant resolution. Verbatim differences: A630 GMU CGC 0x09309/0x0930a/0x0930b vs sheng A740 0x23b09/0x23b0a/0x23b0b; 105 a630_hwcg entries vs 54; 32 a630_protect writes vs 46; 4 A7XX-only registers (CP_BV_APRIV_CNTL, CP_LPAC_APRIV_CNTL, CP_BV_RB_RPTR_ADDR, GRAS_NC_MODE_CNTL with variants="A7XX-") correctly excluded.',
  'Round 21 (2026-11-09) HOST-VERIFIED GPU board inputs: the vendored Mu-Silicium enchilada.dts (784857 B, sha256 e590ee3273499ee4230760aea9195073c0c195242eee11c95570e174ec202275, present in 4 byte-identical local copies) is the SAME DTB behind the device-verified stage-3 sofef00 bl_ctrl_dcs node (:2661), stage-4 touch and stage-7 gauge facts. GPU uses a DEDICATED kgsl SMMU arm,smmu-kgsl@5040000 (compatible qcom,smmu-v2, reg <0x5040000 0x10000>, #iommu-cells=<0x01> SID only NO mask, phandle 0x1ac), NOT apps_smmu @0x15000000 (#iommu-cells=2, phandle 0x29, the unit flash #8 surveyed). Context-bank SIDs: gfx3d_user=0, gfx3d_secure=2/1, gmu_user=4, gmu_kernel=5; ALL GPU iommus use 0x1ac, NONE use 0x29. GPU reg <0x5000000 0x40000 0x5061000 0x800 0x509e000 0x1000>, qcom,chipid=<0x6030001>, IRQ 300; qcom,gmu reg <0x506a000 0x30000 0xb200000 0x300000>, IRQs 304/305; qcom,kgsl-hyp pas-id=0x0d (GPU_PAS_ID 13), firmware a630_zap.',
  '[SUPERSEDED 2026-11-09, Round 21, kept for traceability] ROUND 20 recorded "this board DTS could NOT be fetched (Mu-Silicium/Resources 404), so the GPU SMMU SID/mask and context bank are NOT verified; do not assert a stream id." WRONG: the 404 was a subagent FETCH failure, not an absent file. The DTB is local (see the Round 21 input above). The "UNVERIFIED / do not assert a stream id" claim is RETRACTED. See evidence/stage5-gpu-a630-board.md.',
  'Round 22 (2026-11-09) HOST-VERIFIED power-domain safety correction: the Round-21 next step "read a safe register (RBBM_STATUS 0x210) on device" is UNSAFE as literally written and is SUPERSEDED. The pinned vendored enchilada.dts shows qcom,kgsl-3d0@5000000 (:23666 regulator-names "vddcx\0vdd", :23667 vddcx-supply 0x1a4, :23668 vdd-supply 0x2a9) and arm,smmu-kgsl@5040000 (:13967 vdd-supply 0x1a4, :13969 gcc_gpu_memnoc_gfx_clk) sharing the SAME gpu_cx rail, which resolves to qcom,gdsc@0x509106c (regulator-name gpu_cx_gdsc, :604 phandle 0x1a4); the second rail is qcom,gdsc@0x509100c (gpu_gx_gdsc, :620 phandle 0x2a9). Both are switchable collapse controllers, so a cold CPU bus read of 0x5000000/0x506a000/0x5040000 is a hang risk, NOT a safe probe. Contrast apps-smmu@0x15000000 (:13980 qcom,skip-init, NO vdd-supply, NO clocks), which firmware leaves up - exactly why the flash #8 read-only survey there was safe. Upstream orders the same way: sha-pinned a6xx_gmu.c (c14fbb25...) :1033 pm_runtime_get_sync(gmu->dev), :1041 (gmu->gxpd), :1047 clk_bulk_prepare_enable, :811 a6xx_rpmh_start, :815 a6xx_gmu_fw_load, :877 a6xx_gmu_start, :882 a6xx_gmu_gfx_rail_on, :889 a6xx_sptprac_enable (0x778000 at :373), :894 a6xx_gmu_hfi_start; a6xx_gpu.c (c3347937...) :1291 pm_runtime_get_sync then :1296 msm_gpu_hw_init -> :1204 a6xx_hw_init. The device was DISCONNECTED this round (no COM port), so this is a host-side correction only.',
  '[ROUND 28 2026-11-10, HOST-VERIFIED] GPU domain-state safe-read design. Round 22 proved the GPU 0x5000000, GMU 0x506a000 and kgsl SMMU 0x5040000 windows sit in the collapsible gpu_cx/gpu_gx domain, which forbids a cold read but yields no measurement. This round asks the narrower question: which GPU-adjacent register stays readable with the domain collapsed? Answer, from sha-pinned Linux v6.12: the GDSC status register, because gdsc.c:103-117 gdsc_poll_status() polls it DURING a transition (STATUS_POLL_TIMEOUT_US 1500), so a block cannot poll a register that dies with the thing it switches. Register decode comes from gpucc-sdm845.c:119-139 plus gdsc.c:66-71, and it CORRECTS a natural misreading of the DTB: the gpu_cx_gdsc node advertises reg <0x509106c 0x04> (:596) but that is the CONTROL register. gdsc.c:66-71 prefers gds_hw_ctrl when set, and gpucc-sdm845.c:121 sets .gds_hw_ctrl = 0x1540, so the CX STATUS register is 0x05091540 with test BIT(31) (PWR_ON_MASK). The GX node sets POLL_CFG_GDSCR (:611), so its status is gdscr + CFG_GDSCR_OFFSET(0x4) = 0x05091010 with GDSC_POWER_UP_COMPLETE BIT(16) and POWER_DOWN_COMPLETE BIT(15). The cx node hw-ctrl-addr <0x1a> (:597) is a VENDOR REGISTER INDEX, not an address. Rails: qcom,gpucc@5090000 reg <0x5090000 0x9000> (:6225) on vdd_cx 0x1b pm8998_s9_level (:10864) and vdd_mx 0x8d pm8998_s6_level (:10817); qcom,gfxcc@5090000 on vdd_gfx 0x1d pm8005_s1_level (:11505). Those are PMIC rails, not the GDSCs they regulate, which is why GPUCC survives collapse. Pinned inputs: gpucc-sdm845.c 5176 B sha256 80c2fbef5c65df98..., gdsc.c 15019 B sha256 e1210770ad3e4406..., gdsc.h 2863 B sha256 ba487640dc1a0acb...',
  '[ROUND 29 2026-11-10, HOST-VERIFIED] The four NativeAdreno C modules are now a CI-built -force_load archive. Before this round they were built by NOTHING: scripts/check-enchilada-adreno-host.py compiled them against host stubs, while configs/enchilada_defconfig:36 force-loaded exactly six archives and board.toml [kernel] archives had no build-enchilada-adreno*.py entry, so the kernel CI never saw them. A header the kernel clang rejects or an object that does not link would have surfaced only after a flash. Added scripts/build-enchilada-adreno.py (5 objects: the shim plus AdrenoDomainState.c / AdrenoPowerGate.c / AdrenoBoardInputs.c / AdrenoCatalog.c, all with -mgeneral-regs-only), package/EnchiladaAdrenoProbe.cpp, host-only stub headers scripts/data/iokit-stub/{IOKit/IOLib.h,pexpert/pexpert.h} declaring exactly IOLog / snprintf / PE_parse_boot_argn, and scripts/check-enchilada-adreno-probe.py (18 host checks: arm64 Mach-O for all 5 objects, enchilada_adreno_poll defined, no unexpected undefined symbol, every cast volatile-qualified, no store through a pointer). Wiring: defconfig gained the 7th -Wl,-force_load, board.toml gained the 23rd builder, package/BootProgress.c declares enchilada_adreno_poll() weak_import and calls it from the 1 Hz monitor loop. package/BootProgressStubs.c is UNTOUCHED because weak_import plus a strong definition in a force-loaded archive needs no stub. [SUPERSEDED 2026-11-10, Round 30: CI run 42726356348 (#217) was dispatched on this tree and concluded success; see evidence/stage5-gpu-ci-217.md] No CI run was dispatched and no device was present (accurate when written in Round 29, now retracted).',
  '[ROUND 30 2026-11-10, CI-VERIFIED BUILD/LINK] Kernel CI run 42726356348 (#217) was dispatched on the Round-29 tree (device repo checkout confirmed at adb15ad5c3043cd9a6c0b72fef0bba151518c575) and concluded success: 23 of 23 job steps green, Build kernel 00:20:43Z to 00:30:14Z. Three artifacts were uploaded. Domain A (-logs artifact) contains exactly one adreno archive log, enchilada/logs/archive-23-build-enchilada-adreno.log, whose entire content is PASS: libEnchiladaAdreno.a (5 objects, sha256 24b9b6eec7f70413); all 9 build-enchilada- logs report success (7 force-loaded + 2 exempt storage/verified-root builders), and none of the 23 archive logs has a hard failure marker. Domain B (-kernel artifact) is a single 126,013,440-byte Mach-O 64 image (magic 0xfeedfacf) containing _enchilada_adreno_poll exactly once in the symbol table plus the enchilada-adreno boot-arg, the 1 Hz replay format, the GPUCC verdict label, cx_on, libEnchiladaAdreno and the 4 freestanding module prefixes. A linked symbol is the decisive proof that -force_load took effect. Reproduce with scripts/verify-ci-217-adreno.py (27/27 checks PASS, two independent artifacts agree). No device was present, nothing was flashed, no register was read.',
  '[ROUND 31 2026-11-10, HOST-VERIFIED] A630 legacy GMU HFI v1 transport gap closed as a code model. Upstream oneplus6-ios/work/UniXNU/kits/AdrenoFirmware/AdrenoHfi.h:23 declares MODERN-only nonlegacy GMU HFI support and therefore EXCLUDES the A630 (Linux v6.12 a6xx_gmu.c:1736-1738 marks gmu->legacy = true, HFI v1 / SPTPRAC). Broad source lookup grounded 7 load-bearing deltas in the sha-pinned a6xx_hfi.c (22853 B, sha256 f62c802d25475b86ac05cc58df012e088230ed64a0e9319456eb20ebb40c9faa): 2 queues / 120 B table (modern 3 queues / 168 B), response queue type 0xa04 (modern 0xa01), NO 4-dword read/write index alignment, NO 0xfafafafa write padding, legacy startup INIT/FW_VERSION/PERF_TABLE_V1/BW_TABLE/TEST (no CORE_FW_START/START), supported_version 0x100A0000 (v1.10), wire header (seqnum<<20)|(count<<8)|id with ACK matched on ret_header seqnum and F2H error id 100 having its code at dword 1. Implemented as freestanding pure-C drivers/NativeAdreno/AdrenoHfiV1.h/.c, 7 host test groups / 94 checks, and an independent source cross-verifier (46 checks). No device present, no MMIO, no firmware, no kernel caller.',
  '[ROUND 32 2026-11-10, CI-VERIFIED BUILD/LINK] Kernel CI run 42743495901 (#218) concluded success on the round-31 tree (device repo head bce4c5886b71c4c057b7126b3b67f3ad34a2f780). The -logs artifact archive-23-build-enchilada-adreno.log is exactly PASS: libEnchiladaAdreno.a (6 objects, sha256 c39ed4de2c954b34) - SIX objects versus the FIVE of CI #217 (42726356348, sha256 24b9b6eec7f70413), which proves the 6th object drivers/NativeAdreno/AdrenoHfiV1.c from round 31 was built by the kernel own clang. The -kernel artifact kernel.macho is a 126,017,536-byte Mach-O 64 (magic 0xfeedfacf) containing all nine _AdrenoHfiV1* symbols plus the legacy step-name strings PERF_TABLE_V1 / FW_VERSION / BW_TABLE; CI #217 had ZERO such symbols and was 126,013,440 bytes. Two independent verifications reproduce this: scripts/verify-ci-218-hfi-v1.py -> CI218_HFI_V1_VERIFY: PASS (35 checks, two independent artifact domains agree), and scripts/verify-ci-218-differential.py -> CI218_DIFFERENTIAL_VERIFY: PASS (24 checks, discriminates against the CI #217 baseline). Device still disconnected (CIM/DOTNET/REG/PnP all report no present COM port), nothing flashed, no register read. gpu stays host-verified: an observed CI build+link is NOT a device measurement.',
  '[ROUND 33 2026-11-10, HOST-VERIFIED] A630 legacy GMU firmware-load gap closed as a code model, the parallel of Round 31 HFI v1. Broad lookup (m12247) contrasted upstream sheng work/UniXNU/kits/AdrenoFirmware/AdrenoFirmware.c AdrenoFirmwarePlanGmu() - a MODERN segmented GMU image: a 16-byte block_header {addr,size,type,value} iterated into ITCM/DTCM/icache/dcache/dummy with region validation across two passes - with the sha-pinned Linux v6.12 a6xx_gmu.c:739-750 LEGACY path: if (gmu->legacy) { if (fw_image->size > 0x8000) return -EINVAL; gmu_write_bulk(gmu, REG_A6XX_GMU_CM3_ITCM_START, (u32*) fw_image->data, fw_image->size); return 0; } - ONE flat ITCM bulk write to 0xc00, NO block_header parse, NO region validation (a6xx_gmu.xml:45-46 GMU_CM3_ITCM_START 0xc00 / GMU_CM3_DTCM_START 0x1c00; a6xx_gmu.c:733-734 itcm_base 0x0 / dtcm_base 0x40000). a6xx_gmu.c:821-826 cold-boot writes CM3_FW_INIT_RESULT 0, CM3_BOOT_CONFIG 0x02, HFI_QTBL_ADDR (GMU IOVA), HFI_QTBL_INFO 1. a6xx_gpu.c:17 GPU_PAS_ID 13; :720-740 exact SQE whereami predicate (((buf[0]&0xf)==0xa && (buf[2]&0xf)>=1) || (buf[0]&0xfff)>=0x190) on the MAPPED BO (msm_gem_get_vaddr at :700). Catalog a6xx_catalog.c:897 .zapfw a630_zap.mdt (signed split chain) vs :1047-1049 three MODULE_FIRMWARE public blobs. Three public blobs were observed from ONE reachable mirror (endlessm/linux-firmware@master) via TWO independent network paths (jsdelivr + GitHub API base64) with identical bytes/sha: qcom/a630_sqe.fw 34188 B sha256 1c21b527d9183487..., qcom/a630_gmu.bin 32768 B sha256 da8d9b1b1f5c1a0b... (exactly 0x8000, passes the legacy sanity gate), qcom/sdm845/a630_zap.mbn 14256 B sha256 4aef4aff842b7db4...; official mirrors were UNREACHABLE (git.kernel.org SSL timeout, DroidX-Projects 404, raw.githubusercontent.com RemoteDisconnected, GitHub API torvalds/linux 404) so these are OBSERVATIONS, NOT canonical/official. Device offline (3 independent methods), nothing flashed, no register read. gpu stays host-verified.',
  '[ROUND 35 2026-11-10, DEVICE-VERIFIED SUB-RESULT] The first real-device GPU evidence of this port. User m33324 asked when device verification could happen and authorized the first real-device WRITE of the session (misc + system_b flash, reboot, capture, decode). The phone was in TWRP recovery (27f4f45d, ro.twrp.version 3.4.0-3, uid=0 root, Linux 4.9.179-perf+) with NO XNU CDC-ACM VID_1209&PID_0001 COM port, so the flash channel was the fastboot/test-cycle path and the evidence channel was the persisted SHLOG window. The READ-ONLY GPUCC GDSC probe package/EnchiladaAdrenoProbe.cpp already existed (round 28/29), default-OFF behind PE_parse_boot_argn(enchilada-adreno), five safety predicates before armcpu_map_physical, one volatile 32-bit load per register, ZERO stores. CI #219 (42762559936, success, 7 objects sha256 859f426865f9da2a) built the kernel; a single-variable payload variant gpuprobe219 used the device-verified flash #8 arg line minus enchilada-smmu=1 plus enchilada-adreno=1 (49 items / 988 of 1000 bytes), wdog=3, deadline=900, --no-reset. Two independent PRE-FLASH verifiers PASS (20 checks + source/CI re-derivation). Flash: misc 0.064s, system_b 4.342s, fastboot boot boot-108.img 0.151s, automatic return to recovery after 941s, 32 MiB window pulled read-only, BCB re-armed. NEW boot_id 0x205050d2 (decimal 542134482), uptime 899s, slots 1730, write_errors 0. 300 identical 1 Hz replays: enchilada-adreno: rc=0 GPUCC=5090000 size=9000 cx=00005ff4 gx=00088400 cx_on=0 gx_on=0 gx_off=1 verdict=cx-DOWN steps_left=9 (replay t=600..899 attempt=1). NO refusal line, so all five safety predicates passed on device and the two reads did not hang. Two independent DEVICE verifications PASS: scripts/verify-gpuprobe-device-1.py (25 checks, raw binary + flash log + CI sha chain) and scripts/verify-gpuprobe-device-2.py (36 checks, decoded text + header + source READ-ONLY contract). gpu AREA status STAYS host-verified: this is a narrow power-domain precondition, not a GPU driver.',
  '[ROUND 48 2026-11-11, HOST-VERIFIED] The stage-2 observation is sourced from the round-48 two-domain pre-flight: Domain 1 = pinned a6xx_gmu.c line contracts (R48_PREFLIGHT_FINAL PASS, GENERAL_7 warm/cold discriminator :1067); Domain 2 = register XML offsets independently (RSCC_CONTROL_REQ 0x9307, RSCC_CONTROL_ACK 0x9308, CM3_FW_INIT_RESULT 0x501c, CM3_BOOT_CONFIG 0x5001, CM3_CFG 0x502d, GENERAL_7 0x51cc, CM3_ITCM_START 0xc00); Domain 3 = pinned DTB qcom,gmu reg <0x506a000 0x30000 0xb200000 0x300000> with pdc=base+0x90000 (0xb290000) and pdc_seq=base+0x290000 (0xb490000) inside the single downstream 3 MiB window, legacy RSCC = gmu_mmio + 0x23000 = 0x508d000 (R48_DTB_GMU_CONTRACT PASS).',
  '[ROUND 49 2026-11-11, DEVICE-VERIFIED] Flash #11 (CI #226 kernel) recovered the full msgbuf window via TWRP dd and confirmed the stage-2 replay fix: both rows replay 1 Hz.',
