limits = ["No OS-facing brightness service exists: no IODisplayParameters/brightness/backlight-control publication. The DCS packet bytes (layer 1), the MSM DSI0 CMD DMA transmit path (layer 2), and the read-only runtime probe (layer 2.5) are constructed and host-verified; layer 2.5 is now DEVICE-VERIFIED (backlight208: 510 L rows st=3, seven live DSI0 registers matching mainline command-mode constants, control console206 all zeros). NO packet reaches the panel yet: layer 2.5 deliberately writes nothing and triggers no DMA, and the 1 Hz probe is gated by enchilada-backlight=1 (default off). Sending a brightness packet still needs the CMD-DMA address question (physical vs MDSS SMMU IOVA) and cache maintenance settled. Layer 3 (AppleARMBacklight-facing IOService + the transmit-side runtime probe) is still required. A cold-boot full-controller reprogram is deliberately NOT done because the panel is already lit by the UEFI GOP framebuffer.", "Layer-3 prerequisite read-only SMMU survey (MsmDsiSmmu.c) is now CI-compiled (CI #209, real macOS/Xcode XNU headers, 5-object archive PASS) and DEVICE-VERIFIED (backlight209mode2: 510 L rows st=4, verdict=Bypass). The CMD-DMA physical-vs-IOVA question is RESOLVED: the enchilada display context bank has SCTLR.M=0 (translation OFF), so a CPU physical address is safe for REG_DSI_DMA_BASE. The survey wrote nothing (no wr callback) and triggered no DMA. Still unproven: an actual brightness change, DCS packet transmission, and the layer-3 AppleARMBacklight IOService.", "Layer 3a (pure-C transmit orchestrator) and layer 3b (gated enchilada-backlight=3 C++ shim) are HOST-VERIFIED ONLY: compiled with local stubs, host-tested and statically diffed against the device-verified baseline, but NOT yet CI-compiled under real macOS/Xcode XNU headers and NOT flashed. No real DCS brightness packet has reached the panel, no brightness change has been observed, and it is still UNKNOWN whether the kernel DMA allocation lands below the 32-bit REG_DSI_DMA_BASE limit on this device. The layer-3d AppleARMBacklight-facing IOService does not exist. Only layers 1 / 2 / 2.5(mode 1) / mode-2 survey are DEVICE-VERIFIED so far.", "Layer 3a (pure-C transmit orchestrator) and layer 3b (gated enchilada-backlight=3 C++ shim) are now CI-COMPILED (CI #210, real macOS/Xcode XNU headers, 6-object archive PASS) and DEVICE-VERIFIED (backlight210mode3: 510 L rows st=5, one DCS packet sent at level 512, DMA_BASE physical address 0xae01a000 < 4 GiB, rc=0). Remaining limit: there is still NO measured brightness change on the panel (the harness has no framebuffer/photo/light-sensor readback), NO continuous brightness control (fixed one-shot level 512), and NO OS-facing AppleARMBacklight IOService / IODisplayParameters.brightness / backlight-control / 16 ms fade (layer 3d). Modes 1/2/3 are all gated (default off) and the transmit is one-shot; a cold-boot full-controller reprogram is deliberately NOT done because the panel is already lit by the UEFI GOP framebuffer."]
next_action = ["Stage 3 layer-3 prerequisite mode-2: DONE and DEVICE-VERIFIED (evidence/backlight209mode2.md, CI #209, test-cycle.py backlight209mode2 --wait-return 900). 510 L rows st=4, verdict=Bypass, translation OFF confirmed on the real device before any DMA (先核验再上机). The CMD-DMA physical-vs-IOVA blocker is RESOLVED: a CPU physical address is safe, so layer 3 can proceed with dc civac + dsb sy cache maintenance and msm_dsi_cmd_send().", "Stage 3 layer 2.5 device verification: DONE (evidence/backlight208.md, CI #208, test-cycle.py backlight208 --wait-return 900). All 510 L rows st=3 with coherent live DSI0 register values; the read-only probe proved XNU can map and read the firmware-owned DSI0 before any write (先核验再上机).", "Stage 3 layer 3: implement the sheng AppleARMBacklight OS-facing IOService shape (class name, IODisplayParameters.brightness / backlight-control / backboardd properties, 16 ms fade work loop, late-object linkage) and the transmit-side runtime probe that allocates a DMA-coherent buffer with IOBufferMemoryDescriptor (physical addresses now device-confirmed safe, backlight209mode2), does dc civac + dsb sy cache maintenance, and calls msm_dsi_cmd_send() on brightness writes. Then dispatch CI (kernel+payload), flash, and verify a real brightness change on device.", "Stage 3 layer 3a: DONE (HOST-VERIFIED, commit pending) — MsmDsiBrightness.c/.h pure-C brightness-transmit orchestrator with the 32-bit DMA_BASE gate, dc civac/dsb sy clean hook, and L st=5 publish; 6th archive object; 7 new host test groups. layer 3b (since DONE, HOST-VERIFIED): a gated enchilada-backlight=3 C++ shim that allocates a physically-contiguous IOBufferMemoryDescriptor (retry/relocate until (phys>>32)==0 so the 32-bit gate passes), maps DSI0 at 0xae94004, supplies the dc civac + dsb sy clean callback, and calls msm_dsi_brightness_send(); keep mode 1/2 byte-identical. Then CI-compile under real macOS/Xcode XNU headers, flash, and verify a real brightness change (先核验再上机). Layer 3d (EnchiladaBacklight : IOService, NEVER named AppleARMBacklight, slot-7 impersonation + late-object) follows after the transmit path is device-proven.", "Stage 3 layer 3b: DONE (HOST-VERIFIED, NOT CI-compiled / NOT flashed) — enchilada-backlight=3 first-write shim with one-shot msm_dsi_brightness_send, device-proven IOKit DMA allocation, dc civac/dsb sy clean, CPU-spin delay, and the 32-bit DMA_BASE gate; mode 1/2 byte-identical (static diff vs f566e737). NEXT (layer 3c, not yet done): dispatch CI to compile the 6-object archive + shim under real macOS/Xcode XNU headers (CI #207 taught local stubs are insufficient), verify kernel.macho contains the mode-3 symbols, register a test-cycle.py variant, build the enchilada-backlight=3 payload (997/1000 B with --drop sheng-gpu-addon=1), flash and read the L st=5 / st=-2 / st=-4 row with two independent device verifiers, then write evidence/backlight*mode3.md + porting.toml device evidence + push. If the device reports st=-2 (AddrTooHigh) the kernel allocation is above 4 GiB and the NativeUfs.cpp:1092-1161 stage-1 SMMU IOVA fallback is required before any brightness packet. Layer 3d (EnchiladaBacklight : IOService, NEVER named AppleARMBacklight, slot-7 impersonation + late-object) follows only after the transmit path is device-proven.", "Stage 3 layer 3b: DONE and DEVICE-VERIFIED (evidence/backlight210mode3.md, CI #210, test-cycle.py backlight210mode3 --wait-return 900). 510 L rows st=5, one DCS brightness packet (level 512) committed to the DSI0 CMD-DMA engine with rc=0; the 32-bit DMA_BASE gate passed with a physical address 0xae01a000 below 4 GiB, so no stage-1 SMMU IOVA fallback is required. NEXT (layer 3d, not yet done): implement the sheng-shaped OS-facing IOService — class EnchiladaBacklight : IOService (NEVER named AppleARMBacklight: duplicate metaclass panics, int-229), slot-7 impersonation via OSMetaClass::getMetaClassWithName(OSSymbol::withCString(\"AppleARMBacklight\")), publish IODisplayParameters.brightness {min,max=1023,value} + backlight-control=true + NativeSandboxGrantProcess=\"backboardd\", setProperties() with FadePeriod 16.16 and a 16 ms fade work loop, late-object linkage (--remove-section=__DATA,__mod_init_func --globalize-symbol=__GLOBAL__sub_I_<name>.cpp). Open UNCERTAIN risks to settle on device: whether AppleARMBacklight's metaclass is loaded on enchilada/iPadOS-17.7.11 (IOObjectConformsTo / CoreBrightness / backboardd are closed source) and the 2047-vs-1023 scale mismatch (sheng KTZ8866 kMaxLevel=2047 vs enchilada DCS 1023 — publish max=1023 or scale, never feed 2047 to dsi_dcs_set_brightness_large). Each item still needs its own CI compile + device verification + evidence (每步两次验证、先核验再上机). Then continue the official 8-stage order: stages 1/2/4/5/6/7 remaining components (ArmSmmu4K, touch, GPU Adreno A630, Wi-Fi WCN3990 / Bluetooth / baseband, audio/battery/cpufreq)."]
