[[area]]
id = "memory"
status = "device-verified"
components = ["ArmSmmu4K", "RamBlock"]
paths = ["drivers/NativeUfs/SmmuTakeover.h", "drivers/NativeDwc3/Dwc3SmmuPlan.h", "drivers/NativeDwc3/tests/Dwc3Smmu.cpp", "drivers/NativeRamBlock/**", "drivers/NativeSmmu/**", "package/EnchiladaSmmuProbe.cpp", "scripts/check-enchilada-smmu-host.py", "scripts/build-enchilada-smmu.py", "evidence/stage1-smmu-kit.md", "evidence/stage1-smmu-survey.md", "evidence/stage1-smmu-device.md", "enchilada-facts/parsed.txt"]
inputs = ["apps_smmu 0x15000000 size 0x80000; firmware SMMU bypass slots: UFS stream 0x100 mask 0xf at slot 5 / bank 2, DWC3 stream 0x740 at slot 6 / bank 4; 6 GiB DRAM, 4.75 GiB owned memory, kt_fixed_zones=120.", "SMMUv2 register offsets are corroborated three times in this tree: sCR0 0x000 and the firmware bypass check in drivers/NativeUfs/SmmuTakeover.h:141-148; sIDR0 0x020, sIDR1 0x024, sGFSR 0x048, SMR 0x800+4n, S2CR 0xc00+4n in drivers/NativeUfs/NativeUfs.cpp:862-944; sIDR2 0x028 in drivers/NativeDwc3/Dwc3SmmuPlan.h:47. Window base/size from Dwc3Registers.h:35-36 and NativeUfs.cpp:432.", "The UFS stream id is a BOARD input, not a constant: the vendor DTB says iommus = <&apps_smmu 0x100 0xf> and the flashed boot args carry native-ufs-smmu-stream=0x100 native-ufs-smmu-mask=0xf, which NativeUfs.cpp:201-202 parses. sheng's 0x60 is only a fallback default."]
configuration = ["[payload] dram_size=0x180000000; CONFIG_NATIVE_RAM_BLOCK=y; CONFIG_NATIVE_CS_HASH_CACHE=y; CONFIG_XNU_EXTRA_LD_ARCHIVES force-loads libEnchiladaSmmu.a; SMMU takeover adopts firmware bypass entries rather than creating stage-1 contexts; the stage-1 survey is default off behind enchilada-smmu=1."]
procedure = ["SmmuTakeover.h:141 (fixed) compares the observed p.smr, not a recomputed ufsSmmuSmr(stream, mask); Dwc3SmmuPlan.h is a permissive planner that saves the UEFI-written SMR including mask bits; configureUfsSmmu validates SMR/S2CR/CB before touching hardware.", "Stage-1 survey: python scripts/check-enchilada-smmu-host.py --cc <clang> --cxx <clang++> --out <dir> compiles the freestanding C11 core and asserts it from C++17 over a fake register file; work/tmp/verify_smmu_survey_2.py re-derives every constant from other files in the tree, proves the read-only contract from the API shape, compiles with -fno-builtin at -O0 and -O2, and links an independent harness with a translation-enabled fixture.", "Device run: boot payload-smmu2.img with enchilada-smmu=1 on the CI #215 kernel, let the deadline=900 fall back, then collect the 32 MB window read-only (work/tmp/collect_smmu2.py) and decode it."]
findings = ["console178/179/183 stalled at kStageSmmu with 'firmware UFS stream mapping changed': the shared check recomputed the SMR, which differs for DWC3 because UEFI writes mask bits (b4q.dts:20074 qcom,handoff-smrs).", "console183 exposed the real cause with 'now=00800020/52000042 cb=6f6f6c6c' (ASCII text): inspect() local OSSharedPtr<IOMemoryMap> was destroyed on return, so the gadget thread read an unmapped VA. Maps were promoted to file scope (gGccMap/gCoreMap/gPhyMap/gSmmuMap), matching ArmCpu.cpp:159 and NativeUfs.cpp:1089.", "A regression assert in Dwc3Smmu.cpp pins the mask-bit case; a Python simulation reproduced the old failure and the new pass.", "Stage-1 survey is host-verified in two independent ways: 14 test groups over a fake SMMUv2 register file (including a negative control proving sheng's 0x60 pair cannot match the board entry), and a second harness that re-derives the register map from NativeUfs.cpp and Dwc3SmmuPlan.h and classifies a translation-enabled UFS stream plus a faulting DWC3 stream. Derived geometry on the SDM845 values this port has observed (sIDR0 0x40000080, sIDR1 0x50000040, sIDR2 0x00005111) is 128 slots, 64 banks, 64 global pages, stride 4096; sIDR1 bit 31 (64 KiB padding) is refused rather than guessed, per NativeUfs/tests/SmmuTakeover.cpp:33.", "First device run (flash #6) reported 'ufs=none' on real hardware. That was this driver defect, not hardware: the core hardcoded sheng default 0x60 while the board boots with 0x100 + mask 0xf. The fix makes the pair caller-supplied (defaults 0x100 / 0x000f) and has the kernel shim re-read native-ufs-smmu-stream / native-ufs-smmu-mask, so the two drivers cannot disagree; testDefaultTargetsAreTheBoardPair pins both directions.", "Flash #7 (same args, corrected kernel as the only variable) reported 'enchilada-smmu: rc=0 SS slots=76 banks=45 pages=64 exids=0 valid=8 t0=8 t1=0 t2=0 scr0=002a0406 gfsr=00000000 ufs=5/2/bypass usb=6/4/bypass'. ufs went from none to 5/2/bypass, so the correction is proven on hardware, and usb=6/4/bypass independently matches the DWC3 planner line 'G smmu slot=6 bank=4 plan=80000740/00000004' from console206 through a completely separate code path.", "Flash #8 (CI #216 kernel, kit linked as the ONLY variable vs flash #7) ran ArmSmmu4KCheckFaultedStreams on hardware: K pre=10/10 r=13/17 w=0 v=0/0 f=0/0 id0=4c017e4c -- Busy on both streams, zero stores; the gate on stage-1 programming is now measured rather than assumed."]
completion = ["Every handoff region is accounted for, each enabled DMA engine (UFS, DWC3) accesses its allocated range with a documented cache policy, and the firmware bypass entries are proven unchanged on device.", "A read-only survey of the SMMUv2 identification registers and every stream-match slot is host-verified in two ways and device-verified on enchilada: real geometry 76 slots / 45 banks / 64 pages, 8 bypass entries, no global fault, and both the UFS and DWC3 streams located in their expected context banks."]
limits = ["ArmSmmu4K is now LINKED and its read-only preflight (ArmSmmu4KCheckFaultedStreams) ran on device: it reported Busy=10 on both the UFS and DWC3 streams with zero writes (w=0), because the board is in the firmware bypass handoff. That Busy is the gate on programming a stage-1 context -- the target streams must first be made to fault. No stage-1 context, no DVM/ATS, no per-stream isolation is implemented yet.", "The device evidence verifies the READ path and the firmware handoff state, not translation: all 8 attached streams are in bypass (t0=8, t1=t2=0) and sCR0 002a0406 keeps translation disabled, which is the expected bootloader-handoff shape rather than a driver that enables anything.", "The survey re-emits its verdict once per second because the kernel msgbuf is a 128 KB ring that saturated at 101.2 s / 87.7 s / 58.8 s across three measured boots; the replay performs no MMIO, so one physical measurement appears 289 times (distinct verdicts = 1)."]
next_action = ["Program a real stage-1 context for the display scanout bank now that the measured geometry (76 slots / 45 banks / 64 pages, stride 4096) is known, keeping the UFS/DWC3 bypass entries intact. PRECONDITION established by the device-verified ArmSmmu4K preflight: the target streams must first be made to fault (the kit returns Busy=10 on the current bypass handoff), then ownership can be taken. Follow the kit AGENTS.md rule that hardware observations are reported separately from build results."]
