limits = [
  '[ROUND 65 2026-11-12, BOUNDARY] AdrenoMetalSeamV1 is NOT a GPU driver and NOT a Metal frontend: it maps no register, allocates no BO, maps no IOVA, powers no domain, loads no firmware, publishes no MTLDevice and is reachable from no IOKit user client. It does NOT unblock stage 5: the A6XX_GEN1 backend, TrustZone PAS auth, kgsl SMMU context and OS Metal/IOSurface ABI remain open and CONFIG_XNU_NATIVE_ADRENO=n is unchanged. The archive has NOT been rebuilt locally because this Windows workspace lacks the recorded XNU ios-obj tree; only macOS CI can link the 20th object. No device run, no flash, no CI result and no MMIO this round; gpu area STAYS host-verified.',
  "[ROUND 44, narrowing ROUND 42 blockers] Bus adapter is HOST-VERIFIED translation logic only: no MMIO window was mapped on any device, no clock/regulator/power action, no GMU start, no firmware load; the adapter has no kernel caller; CONFIG_XNU_NATIVE_ADRENO=n is unchanged. CI inclusion: scripts/build-enchilada-adreno.py units += AdrenoGmuBootV1.c + AdrenoGmuBusV1.c (archive grows 7 -> 9 objects, kernel.macho +8192 B) so kernel CI compiles the full backend chain, but the objects are compiled-not-executed on hardware; the round-42 note that BootV1 is 'not a CI object' is superseded by this round.",
