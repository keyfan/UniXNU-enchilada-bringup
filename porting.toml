  '[ROUND 101 2026-11-13, DEVICE-VERIFIED] The SMMU row now has its first input and the remaining work on it is concrete instead of exploratory. ias=48 means the TCR/TTBR words are computable for real (they already are: tcr=a0100080, tcr2=00038011, both matching round 83 derivation exactly), so what stands between this row and a programmed context is exactly two artifacts nobody has written: an ASID allocator and a populated LPAE page table. ORDER FROM HERE, unchanged in shape and now narrower: (1) the ASID allocator - an 8-bit field on this part (VMID16 clear), so a small bitmap over the 256 SIDs is sufficient, and it must be owned by whoever programs the bank; (2) the LPAE page table - 4 KiB granule is the supported and simplest of the three the part reports, and TTBR1 is the geometry this device derives, so the table must be built for the TTBR1 shape rather than assumed TTBR0; (3) then, and only then, the nine-write sequence from round 83 with the words this round measured into, followed by a TLB invalidate; (4) the stream must be made to fault for the context to receive traffic, which is the condition now living in adreno_iommu_admit_program() and still unmet (round 53 Busy=10). Nothing in (1)-(4) can be advanced by reading more of the vendor driver, and none of it needs the boot guarantee beyond what is already scripted.',
