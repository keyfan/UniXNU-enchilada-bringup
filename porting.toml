  '[ROUND 56, procedure 15/15] Re-derive instead of re-assert. Read the pinned gdsc sources, encode the descriptor -> (status register, masks) function in AdrenoGdscDecode.c, then cross-check it in Python from the same pinned bytes (scripts/verify-enchilada-gdsc-decode.py -> GDSC_DECODE_CROSS: PASS, 69 checks) so the C module and the upstream bytes are verified against EACH OTHER, not against a shared literal.',
  '[ROUND 57, procedure 16/16] Derive the SEQUENCE too, not just the constants. Round 56 made the status register a function of the descriptor; round 57 reads gdsc_enable() (:259-315) and gdsc_disable() (:317-364) out of the same pinned bytes and re-expresses their statement order as an ordered, fixed-size step plan (adreno_gdsc_plan_enable/disable/cpu_enable). The Python cross verifier rebuilds each plan from the flags alone and only then compares, so C and upstream are checked against EACH OTHER (GDSC_DECODE_CROSS: PASS, 98 checks).',
  '[ROUND 58 2026-11-11, HOST-VERIFIED] Composed the round-57 GDSC step plans with the round-51 power-up plan: the guarded bit of every genpd step now equals the CPU performs zero GDSC register writes for that domain, derived and asserted in both directions by AdrenoPowerUpGdscGuardMatchesWrites.',
  '[ROUND 59 2026-11-11, HOST-VERIFIED] A630 GMU TEARDOWN order derived from pinned Linux v6.12 a6xx_gmu_stop() (a6xx_gmu.c:1184-1217) and the GX-before-CX hardware constraint (gdsc.c:590, a6xx_gmu.c:1205). The stop body emits GX put (:1209-1210), then clk_bulk_disable_unprepare (:1212), then the CX put LAST (:1214), gated by pm_runtime_active (:1189). AdrenoPowerDownV1 encodes exactly that 3-op order: GX(guarded) - clocks(4) - CX. It is NOT the round-51 power-up plan reversed: power-up enables clocks LAST while teardown disables them in the MIDDLE, and no clk_set_rate exists in the stop path so rates are never restored.',
  '[ROUND 59 2026-11-11, CI-VERIFIED] CI #230 (run 43034488610, dispatch 14:01:28Z, success 14:26:22Z, device head b4579fd5) proved the 13th and 14th A630 archive units build and link inside a real XNU kernel, which the local host suite cannot show (different toolchain, SDK and link step). Artifact verification runs in two independent domains: scripts/verify-ci-230-adreno.py parses the downloaded artifacts (archive line, object count, sha256 of the pinned inputs, kernel Mach-O size/magic/sha256, 9 required symbols, absence of AdrenoPowerDownV1, stage3=plan present and stage3=exec absent), and a .NET Invoke-RestMethod pass re-reads the run, job and artifact metadata from the GitHub API.',
  '[ROUND 60 2026-11-11, CI-VERIFIED] CI #231 (run 43043000108, dispatch 14:54:20Z, success 15:17:58Z, device head 0e11f1b3) proved the 15th A630 archive unit builds and links inside a real XNU kernel, which the local host suite cannot show (different toolchain, SDK and link step). Artifact verification runs in two independent domains: scripts/verify-ci-231-adreno.py parses the downloaded artifacts (archive line, object count, kernel Mach-O size/magic/sha256, 13 required symbols including all nine AdrenoPowerDownV1 exports, stage3=plan present and stage3=exec absent), and a .NET Invoke-RestMethod pass re-reads the run, job, step list and artifact metadata from the GitHub API.',
  '[ROUND 65 2026-11-12, CI-VERIFIED] CI #232 (run 43142322338, dispatch 02:34:09Z, success 02:53:40Z, device head e2adac8e) proved the 20th A630 archive unit AdrenoMetalSeamV1.c and the four consolidated ROUND 61-64 units build and link inside a real XNU kernel (libEnchiladaAdreno.a 20 objects sha256 678e1c6219cc110d, kernel.macho 126066688 B sha256 a69f8e7dbba316, all 14 metal-seam exports plus 13 earlier unit names present). Two independent verifications: scripts/verify-ci-232-adreno.py parses the downloaded artifacts (45 checks) and a .NET Invoke-RestMethod pass re-reads run, job, step list and artifact metadata (14 checks).',
  '[ROUND 66 2026-11-12, CI-VERIFIED] CI #233 (run 43158161524, dispatch 2026-11-12T04:57:42Z, success 2026-11-12T05:12:13Z, device head 6e50eea85593) proved the 21st A630 archive unit AdrenoDarwinKmdAbiV1/AdrenoDarwinKmdAbiV1.c builds and links inside a real XNU kernel (libEnchiladaAdreno.a 21 objects sha256 a1d20d90bb7a75d2, kernel.macho 126070784 B sha256 18bcb8e25b43, all 8 darwin-kmd exports plus 15 earlier unit names present). Two independent verifications: scripts/verify-ci-233-adreno.py parses the downloaded artifacts and a .NET Invoke-RestMethod pass re-reads run, job, step list and artifact metadata.',
'[HISTORICAL, kept for traceability] Follow /zh/porting/gpu for the selected OS ABI; sheng 6 archives (adreno740-kits, accelerator, gmu, gmu-votes, gpu-smmu, dts/inputs) are the upstream method reference.',
]
findings = [
  '[ROUND 158 2026-11-16, HOST-VERIFIED / READ-ONLY STATE SNAPSHOT, NOTHING EXECUTED ON THE PHONE] A READ-ONLY SNAPSHOT THAT MAY DECIDE WHETHER THIS PORT NEEDS PAS AT ALL. NO SMC issued, no MMIO write, no device run. === THE REASONING THAT PROMPTED IT === Round 154 decompressed the Windows UEFI payload down to its real firmware (LZMA guided section, 27,641,800 bytes) and found a device tree inside it carrying a zap-shader node whose firmware-name is qcom/sdm845/oneplus6/a630_zap.mbn. Round 156 parsed the STOCK device tree from this phone (415,955 bytes, 12454 properties) and found /soc/qcom,kgsl-hyp with compatible qcom,pil-tz-generic, qcom,pas-id <13>, qcom,firmware-name a630_zap and memory-region phandle 0x2a9 resolving to /reserved-memory/gpu_region@0x8c415000 reg 0x8c415000 + 0x2000. So PAS with id 13 against that same 8 KiB region is the ORIGINAL CONFIGURATION of this hardware, not something the port invented. Round 157 then extracted 111 function names from the Windows SCM driver and found NO pas, NO pil, NO init_image, NO mem_setup, NO auth_and_reset, but a full Secure App vocabulary: SecAppLoadSyscall, SecAppSendSyscall, SecAppMemMngSendSyscall, QuerySecAppId, plus RegisterGfxInterfaceSyscall and GfxSmmuFaultCallback. The hypothesis that follows is that the zap handshake may already have been completed BEFORE this kernel runs, in which case the port has been knocking on a door that is closed because the room is already occupied. === WHAT THIS ROUND DOES: ASK THE SILICON, WITHOUT TOUCHING IT === A stage-7-adjacent read-only snapshot prints one new row, gputate=, carrying: the GPUCC GX status word, gxon, gxb16, whether SECVID was read at all, and then RBBM_SECVID_TRUST_CNTL, TSB_CNTL, TSB_TRUSTED_BASE and TSB_TRUSTED_SIZE, then the SMMU GR0 SCTLR plus context-bank-0 TTBR0 and TTBR1. THE GATE MATTERS MORE THAN THE FIELDS: the probe own header has said since round 51 that reading a powered-off block is a bus read to a clockless block that can hang the CPU, so the SECVID reads sit behind if (gxon) and the GPU core window is mapped ON DEMAND only inside that branch. When GX is down the row still prints, svt_read stays 0, and no GPU-core register is touched at all. That is a hard constraint, not a style choice. === A TASKING CORRECTION RECORDED === The tasking said the GX up bit is BIT(31). THAT IS WRONG and the implementer caught it: BIT(31) is ADRENO_DOMAIN_CX_ON_BIT, while ADRENO_DOMAIN_GX_ON_BIT is 16 and ADRENO_DOMAIN_GX_OFF_BIT is 15, pinned to gdsc.c:31 GDSC_POWER_UP_COMPLETE and gdsc.c:32 POWER_DOWN_COMPLETE. Using 31 for GX would have read the CX bit and reported a GX that was never up. The pinned predicate adreno_domain_gx_is_on() is used instead of a hand-rolled mask. === THE READING RULE, WRITTEN BEFORE THE RUN === GX up means UEFI or the bootloader already powered the GPU domain, so the port may need only to adopt state rather than to build it. GX down means the full chain is still ahead. SMMU TTBR nonzero means somebody already installed a page table. SECVID_TRUST_CNTL equal to zero means the trusted memory range is disabled, which is what upstream does on the no-zap fallback path; nonzero means it is still enforced. === HOW THE STAGE MASK WAS PRESERVED === The new work sits INSIDE the existing stage >= 6 branch rather than introducing a stage 8, because four verifiers assert the boot-arg mask is exactly stage < 1u || stage > 6u and this round is forbidden from weakening them. Two of those verifiers count SMMU dereferences, so their counts were extended to allow the new gated snapshot read as its own pinned occurrence, which is the same accommodation rounds 146 and 152 already needed and is not a mask change. === VALIDATION === probe 26 of 26; host 31 suites; stage3 40, stage4 52, stage5 40, stage6 289; zap-auth 306; full sweep 70 of 71 with the same by-design record verifier needing its 40-hex argument. Counts unchanged at 30 C units, 31 suites, 71 verifiers. Three mutations are caught: removing the GX gate, never setting svt_read, and forcing gx to a constant. The row buffer is 340 bytes against a worst case near 140. === WHAT THIS DOES NOT PROVE === It proves nothing yet: no SMC was issued and no register was read this round. It does not prove that UEFI loaded the zap, only that the original device tree expects PAS and that the Windows SCM driver never asks for it. It does not prove that a powered GX would mean a usable GPU. And it does not explain the measured v13=0 or t0=0xFFCFFFBB, which remain unexplained device facts.',
  '[ROUND 145-146 2026-11-15, DEVICE-VERIFIED / A HANDLE THAT MAY NOT BE ONE, NOTHING CONCLUDED] ROUND 145 MEASURED A REPLY THAT LOOKS LIKE SUCCESS AND PROBABLY IS NOT, AND ROUND 146 BUILDS THE CHEAPEST TEST THAT CAN TELL. One SMC was issued for the create probe in round 145; round 146 issued none. === WHAT ROUND 145 MEASURED, VERBATIM === sbcr=0 sbc0=57 sbr=2 sb2=8587eb18 sbB=5b/8587eb18. Group A sent four all-ones arguments and got status 0x57 with a2=0x8587EB18. Group B sent four zeros and got status 0x5B with the SAME a2=0x8587EB18. av2=1 sb=0, p13=0/0 v13=0, t0=0xffffffffffcfffbb, meta=ad913000, ct=std and x1ok=1 all still hold. === TWO FACTS ESTABLISHED === (1) The secure world DOES WRITE a2. The two groups sent different values in x2 (all-ones versus all-zeros) and received the same a2, so a2 is not our input passing through. (2) The secure world DOES PARSE the arguments. The status differs between the groups, 0x57 against 0x5B, so the argument encoding is not ignored wholesale. Both of those are real and neither was known before round 145. === WHY sbr=2 MUST NOT BE REPORTED AS SUCCESS === A genuine create mints a NEW handle per call, or it fails. Two creates returning the identical 0x8587EB18 is anomalous on its face: either that value is a fixed system-wide identifier rather than this call creation, or a2 is carrying a diagnostic rather than a handle. Worse, this port has now issued TWO SHM_BRIDGE_CREATE calls and ZERO SHM_BRIDGE_DELETE calls, so if the value really is a bridge this port has left one behind. The honest reading of round 145 is therefore: a2 is written and not pass-through, and that is all that is established. It is NOT evidence that a bridge was granted. === THE JUDGE WAS MINE AGAIN, AND WRONG AGAIN, IN A NEW WAY === Round 143 had no row for clean-transport-plus-nonzero-status and said inconclusive. Round 144 added a row that treats a nonzero handle as evidence of a suspicious success. Both times the table asked the wrong question. The question is not whether a2 is nonzero; it is whether a2 denotes a NEWLY MINTED, DELETABLE object. Round 146 asks that instead. Recording this because two consecutive judge defects in the same direction is a pattern, not bad luck: I kept writing tables that could only see what I already expected. === ROUND 146 AND ITS TEST: DELETE THE VALUE WE GOT === SHM_BRIDGE_DELETE takes exactly ONE argument, the handle, with arginfo ARGS(1) and cmd 0x1D, so unlike the four-argument create there is no encoding to guess. And qcom_scm.c:1419-1431 passes a NULL result pointer to qcom_scm_call, so the transport ret IS the whole verdict: a0==0 means the handle was accepted. A successful delete proves 0x8587EB18 was a real handle and cleans up whatever we left behind. A parameter-style rejection proves it was never a handle, which means the round 145 reading was a misreading and the shmbridge line ends there. Either outcome is decisive and either outcome is cheap. === THE JUDGE FOR DELETE, WRITTEN BEFORE THE RUN === a0==0 maps to valid=1, a real handle. The parameter-rejection family maps to valid=0: EINVAL_ARG, EINVAL_ADDR, EOPNOTSUPP, ERROR, ENODEV, and the secure-world 0xFFCFFFxx code, all tested on the low 32-bit word because the 40-bit comparison bug fixed in round 144 is exactly the mistake that would silently turn every rejection into an unknown. A wrapper refusal of -16 or -22 means no SMC was made and maps to -1. Anything else is reported verbatim as -1 with no inference. === VALIDATION === probe 26 of 26; host 31 suites; stage3 40, stage4 49, stage5 40, stage6 269; zap-auth 306; full sweep of 71 verifiers with 70 passing and the same by-design record verifier needing its 40-hex argument. Counts unchanged at 30 C units, 31 suites, 71 verifiers. Three mutations were run and all three are caught: sending handle 0, flipping the judge polarity, and forcing the verdict to a constant. ArmCpu.cpp was NOT touched this round because the round 144 export armcpu_scm_call5_r already returns a2. === WHAT THIS DOES NOT PROVE === It does not prove 0x8587EB18 is or is not a handle; that is precisely what the next run measures. It does not discover the four-argument create encoding, which exists nowhere in pinned sources. It does not prove that a valid bridge would change the PAS outcome, and v13=0 remains a policy answer from PAS_IS_SUPPORTED that a memory-protection mechanism cannot overrule by itself. Round 146 issued no SMC, so nothing in it is a measurement.',
  '[ROUND 143-144 2026-11-15, DEVICE-VERIFIED / A DIFFERENT KIND OF REFUSAL, NOTHING CONCLUDED] ROUND 143 PUT THE SHM_BRIDGE_CREATE REACHABILITY QUESTION TO THE PHONE AND GOT BACK AN ANSWER THAT REFUSED TO FIT THE PRE-REGISTERED TABLE; ROUND 144 READS THE FIELD WE OMITTED AND MAKES THE NEXT QUESTION DECIDABLE. One SMC was issued for the create probe in round 143; round 144 issued none. === WHAT THE PHONE SAID === sbcr=0 sbc0=0x57 sbr=-1, measured verbatim: sbcr=0 sbc0=57 sbr=-1, with av2=1 sb=0 still true, p13=0/0 v13=0 still true, t0=0xffffffffffcfffbb still true, meta=ad912000 below 4 GiB, ct=std, x1ok=1. === THE FACT THAT MATTERS, AND WHY IT IS A NEW KIND OF FAILURE === Compare the two refusals this port has now measured. SHM_BRIDGE_CREATE returned a0=0 with a1=0x57: the transport completed cleanly and the SECURE WORLD ACTUALLY ANSWERED with a status value. PAS init_image returned a0=0xFFCFFFBB with a1=0: the transport itself carried the error family and the secure result was never written at all. THOSE ARE DIFFERENT LAYERS. The bridge command is ALIVE - it reaches secure business logic - whereas the PAS call is refused before that. Any summary that lumps them together as both-failed is wrong. === THE JUDGE WAS MINE AND IT WAS TOO NARROW === sbr=-1 is not a property of the phone; it is a property of the table I wrote in advance. That table covered a parameter-rejection family, an explicit not-supported, and a transport refusal where no SMC was made. It had no row for clean transport plus a nonzero positive secure status, so the reading fell through to inconclusive. Recording this because the honest statement is that the EXPERIMENT was valid and the INTERPRETER was incomplete, and those must not be conflated. === THE FIELD WE OMITTED, AND WHY IT MATTERS === qcom_scm-smc.c:204-206 maps smc a1 to result[0], a2 to result[1], a3 to result[2]; qcom_scm.c:1412-1415 takes the bridge HANDLE from result[1] and returns result[0] as the status. This port had only ever captured a0 and a1, so 0x57 was read as a status while the handle in a2 was never looked at. If 0x57 means partial success the handle may already be sitting there unused. ArmCpu.cpp now carries a2: ScmResult is {a0,a1,a2}, scm5 returns {x0,x1,x2}, and armcpu_scm_call5_r exposes the third output. The eight scmDisableCrashdump assignments and the armcpu_scm[8] log remain byte-for-byte as they were, which was the condition for touching that file at all. === THE PROPERTY TEST: DOES 0x57 DEPEND ON THE ARGUMENTS === Round 144 sends SHM_BRIDGE_CREATE twice: group A with four all-ones arguments, which is what produced 0x57, and group B with four zeros. If the status changes between the groups then the secure world parsed the arguments, which means the encoding is worth reverse-engineering. If it stays 0x57 then the answer is a command-level status independent of arguments and the parameter search is finished before it starts. That is a two-valued question for the price of one more SMC, and it is the cheapest way to decide whether the remaining work has any target. === THE CORRECTED JUDGE, WRITTEN BEFORE THE RUN === It now takes the handle as an input, because the handle is evidence. transport nonzero maps to 0, the command is not reachable. Clean transport with a clean status maps to 3, the bridge was actually granted. Clean transport, nonzero status and a nonzero handle maps to 2, status rejected but a handle came back. Clean transport, nonzero status and a zero handle maps to 1, reachable but rejected. The wrapper refusing with -16 or -22 still maps to -1 because no SMC was made. === VALIDATION === probe 26 of 26; host 31 suites; stage3 40, stage4 49, stage5 40, stage6 256; zap-auth 306; full sweep of 71 verifiers with 70 passing and the same by-design record verifier needing its 40-hex argument. Counts unchanged at 30 C units, 31 suites, 71 verifiers. Four mutations were run and all four are caught: forcing the handle to zero, reusing group A arguments for group B, swapping the 2 and 1 verdicts, and treating a zero status as reachable. === WHAT THIS DOES NOT PROVE ===It does not prove what 0x57 means. It does not prove the bridge was granted. It does not discover the four arguments encoding, which does not exist anywhere in pinned sources because shm_bridge_create has no callers there. It does not prove a successful bridge would change the PAS outcome, and v13=0 remains a policy answer from PAS_IS_SUPPORTED that a memory-protection mechanism cannot overrule on its own. Round 144 issued no SMC, so none of its fields are measurements yet.',
  '[ROUND 142 2026-11-15, HOST-VERIFIED / GATE ONE OF TWO, NOTHING EXECUTED ON THE PHONE] WIDENS THE SCM TRANSPORT TO CARRY x5 AND TURNS THE SHM_BRIDGE_CREATE QUESTION INTO A REACHABILITY TEST RATHER THAN A GUESS AT FOUR UNKNOWN ARGUMENTS. NO SMC issued, no PAS, no MMIO, no device run. === WHY x5 HAD TO BE WIDENED === ROUND 141 measured av2=1 and sb=0, so the secure world does support the shmbridge feature and ENABLE succeeds. The next step upstream is SHM_BRIDGE_CREATE, and qcom_scm.c:1391-1405 builds it with QCOM_SCM_ARGS(4, VAL, VAL, VAL, VAL), so its FOURTH argument ns_vmids travels in x5. The transport had x5 hard-pinned to zero since round 110 because none of the three PAS stages needs it, which made a four-argument call physically unsendable. scm5 is now the single register-bearing asm block carrying a5, and scm4 and scm are thin wrappers that pass a5=0, so every existing call site is byte-for-byte unchanged. armcpu_scm_call keeps its old signature and semantics and a new armcpu_scm_call5 exposes the widened form; both take the same non-blocking busy flag, and the eight scmDisableCrashdump calls plus the armcpu_scm[8] log remain the untouched device-proven baseline. === THE MORE IMPORTANT DECISION: TEST REACHABILITY BEFORE GUESSING ARGUMENTS === shm_bridge_create has NO CALLERS anywhere in the pinned tree; there are only the definition and the EXPORT_SYMBOL in qcom_scm.c and the prototypes in the two qcom_scm headers. That means the real layout of pfn_and_ns_perm_flags, ipfn_and_s_perm_flags, size_and_flags and ns_vmids is NOT derivable from anything we have pinned. Implementing the create against invented bit layouts would be guessing dressed as engineering. So round 142 sends SHM_BRIDGE_CREATE ONCE with four obviously bogus arguments (all 0xFFFFFFFF) and reads how the secure world reacts. That is a two-valued question for the price of one SMC: a parameter-style rejection means the command is REACHABLE and the remaining work is to learn the encoding, while an explicit not-supported means the command is NOT reachable and the line stops there without studying anything. === A REAL BUG FOUND IN THE JUDGE WHILE FINISHING IT === The first draft tested the 0xFFCFFFxx family as (transport_error & 0xFFFF0000) == 0xFFCFFF0000. THAT CAN NEVER BE TRUE: the mask yields a 32-bit quantity and the right-hand side needs 40 bits, so for the measured value the left side is 0xFFCF0000 and the comparison fails. Every reply in that family would have fallen through as neither reachable nor not-allowed, which is exactly the worst outcome for a one-shot experiment. The test is now done on the low 32-bit word with a 32-bit pattern, and the two REAL measurements were checked against both forms: old form False for both 0xFFCFFFBB and 0xFFCFFFF6, new form True for both, while INTERRUPTED, EOPNOTSUPP and the near-miss 0xFFCF1234 stay False. A judge that silently classifies its own real observations as unclassifiable is worse than no judge. === THE READING RULE FOR THE NEXT RUN === sbr=1 means the 0xFFCFFFxx parameter-rejection family answered, so the command is reachable and the next round learns the argument encoding. sbr=0 means EOPNOTSUPP or ENODEV, an explicit refusal, and the shmbridge path ends. sbr=-1 covers a transport refusal where no SMC was made, and the 0/0 reply, both of which are inconclusive and must be printed verbatim rather than interpreted. === VALIDATION === probe check 26 of 26 in both build modes; host 31 of 31 suites; stage3 40, stage4 49, stage5 40, stage6 240; zap-auth 306; full sweep of 71 verifiers with 70 passing and the same single by-design record verifier that needs its 40-hex argument. Counts unchanged at 30 C units, 31 suites, 71 verifiers. === WHAT THIS DOES NOT PROVE === It does not prove SHM_BRIDGE_CREATE is reachable; that is what the next run measures. It does not discover the argument encoding, which is not present in any pinned source. It does not prove that a reachable create followed by a correct bridge would make pas_init_image succeed, and v13=0 remains a policy answer from PAS_IS_SUPPORTED that a memory-protection mechanism cannot overrule on its own. Nothing here is a measurement: no SMC was issued this round.',
  '[ROUND 139-140 2026-11-15, HOST-VERIFIED / ONE LAST HYPOTHESIS MADE TESTABLE, NOTHING EXECUTED ON THE PHONE] A WIDE SEARCH FOR A PAS WORKAROUND FOUND EXACTLY ONE NEW MECHANISM WORTH TESTING, AND THIS ROUND MAKES IT ASKABLE. NO SMC issued, no PAS, no MMIO, no device run. === WHAT THE WIDE SEARCH COVERED, AND WHAT IT HIT === Downloaded upstream master sources over the network because our pin is v6.12: adreno_gpu.c, a6xx_gpu.c, qcom_pas.c, qcom_pas.h, and master sdm845.dtsi. Also searched the local tree for every PAS mention (65 hits) and tried postmarketOS and Mesa upstream, BOTH OF WHICH RETURNED AN ANTI-BOT CHALLENGE PAGE rather than content, so those two are recorded as NOT CHECKED rather than as absent. === FINDING 1, THE REAL ONE: UPSTREAM SPLIT PAS OUT OF qcom_scm === Master adreno_gpu.c includes linux/firmware/qcom/qcom_pas.h and calls qcom_pas_auth_and_reset, while our pin calls qcom_scm_pas_auth_and_reset. The new qcom_pas_prepare_and_auth_reset docstring says the preparation step sets up a shmbridge over the firmware memory BEFORE TrustZone accesses that memory for authentication. That is the opposite of what our pinned qcom_scm.c says, which is that for PIL calls the hypervisor creates SHM Bridges on behalf of Linux so Linux must not create them, and that passing a buffer already inside an SHM Bridge will make the call fail. So the platforms upstream now supports are platforms where the kernel must create the bridge itself. IF enCHILADA IS ONE OF THOSE, the stage-0 failure is a missing shmbridge rather than a policy refusal. THAT IF IS THE WHOLE POINT OF ROUND 140 AND IT IS NOT PROVEN EITHER WAY. === FINDING 2, A COINCIDENCE THAT MUST NOT BE MISREAD === SHMBRIDGE_RESULT_NOTSUPP is 4 (qcom_scm.c:115) and our probe reports rc=4. These are the same digit and nothing else: our 4 is kAdrenoZapExecStageFailed from our own AdrenoZapExecStatus enum, not a value returned by the secure world. The secure value is p13 a1, which read 0. Any future report that treats the two fours as related is wrong. === WHAT WAS BUILT: A ZERO-ARGUMENT PROBE, CHOSEN BECAUSE IT IS THE SMALLEST POSSIBLE QUESTION === qcom_scm_shm_bridge_enable (qcom_scm.c:1363-1389) is the upstream function Linux itself uses to ask whether the bridge feature exists. It takes NO arguments: svc 0x0C, cmd 0x1C, owner SIP, no arginfo, no args. Its answer is result[0]: 0 means success, 4 means explicitly not supported. The probe therefore adds two stage-7 fields, av2 for whether SVC_MP/0x1C exists at all and sb for what SHM_BRIDGE_ENABLE answers, both printed UNCONDITIONALLY the way p13 is, both issued BEFORE p13, and neither wired into the PAS three-stage chain at all. Constants are pinned to qcom_scm.c:112, :115 and :119 and the FNID is derived rather than written: FNID(0x0C, 0x1C) = (0x0C << 8) | 0x1C = 0x0C1C, so x0 = 0xC2000000 | 0x0C1C = 0xC2000C1C. The captain recomputed that independently and got the same word. === THE READING RULE, FIXED BEFORE THE RUN SO IT CANNOT BE BENT AFTERWARDS === av2=0 means the command does not exist, which ends the shmbridge path and with it the PAS line. av2=1 with sb=0 means the bridge feature answers success, which would make a full implementation worth one more round. av2=1 with sb=4 is an explicit not-supported. av2=1 with any other sb is an unknown value to be reported verbatim and NOT interpreted. === MUTATION EVIDENCE === Six mutations were run and all six are caught, but one was NOT caught at first: writing the literal 4u for sb passed the initial assertions, and the check had to be strengthened before it fired. That is the same class of gap recorded in rounds 127 and 129: an assertion that finds a name or a value in the text is not the same as an assertion that governs how the value is produced. The final assertion requires sb to be computed from the transport rather than written. === VALIDATION === probe check 26 of 26; host 31 of 31 suites with the zap/PAS group at 11 and 0 failures; stage3 40, stage4 49, stage5 40, stage6 240; zap-auth 306 checks; full sweep of 71 verifiers with 0 failures. Counts unchanged at 30 C units, 31 suites, 71 verifiers. The PAS three-stage executor was NOT touched, ArmCpu.cpp was NOT touched, and the two deliberate stub gates plus the four stage masks are intact. === WHAT THIS DOES NOT PROVE === It does not prove the shmbridge hypothesis. It does not prove enchilada is a platform where the kernel must create the bridge. It does not prove that a successful SHM_BRIDGE_ENABLE would make pas_init_image succeed, because the bridge has to be created over the specific firmware buffer and that is a different call with four arguments. It does not resolve the v13=0 reading, which remains a policy answer from the PAS_IS_SUPPORTED query. Most importantly, no SMC was issued this round, so nothing here is a measurement.',
  '[ROUND 135-137 2026-11-14, HOST-VERIFIED / DOCUMENTATION CLOSE-OUT OF THE (B) ROUTE, NO CODE CHANGED] ROUND 137 writes the ROUND 136 decisive DT evidence into evidence/stage5-gpu-pas-device.md (new section eleven) and HANDOFF.md (new section 6.8 plus the section 12 first sentence), and corrects the ROUND 134 wording that had passed over this point. HARD CONSTRAINT MET: only the three documents changed, no code, no flash, no SMC, no MMIO. ROUND 135 proposed that upstream might have a path that does not depend on PAS. THAT IS NOW DISPROVED. A degraded manual path does exist in the pinned a6xx_gpu.c:1157-1181, but its only entry gate is ret == -ENODEV at a6xx_gpu.c:1172, which adreno_gpu.c:48-51 returns only when the DT zap-shader node is missing or unavailable. Our device DT declares the node (notes/dt/sdm845-oneplus-common.dtsi:483 has a &gpu_zap_shader override) and the a630_zap.mdt/.b00/.b01/.b02 firmware is fully on hand under work/tmp/a630-device-fw/, so of_device_is_available is true, the PAS path is taken (a6xx_gpu.c:819 adreno_zap_shader_load(gpu, GPU_PAS_ID)) and -ENODEV is never returned. The ROUND 136 DT evidence (captain verified online, recorded here as an event): upstream master arch/arm64/boot/dts/qcom/sdm845.dtsi:4965 declares gpu_zap_shader: zap-shader with memory-region = &gpu_mem, while the pinned v6.12 sdm845.dtsi (151,194 B) has ZERO zap hits (re-grepped locally, 0 hits). The GPU driver code did not change at all: upstream a6xx_gpu.c master and the pinned v6.12 share the SAME sha256 c33479377574ed19, so the degraded path exists on every version and is meant only for devices whose DT declares no zap. CONCLUSION: SDM845 is designed to run zap; our device must run PAS, and forcing SECVID_TRUST_CNTL = 0 (a6xx_gpu.c:1181) without feeding zap is exactly the upstream crash horribly branch (a6xx_gpu.c:1177). The ROUND 134 stop-loss therefore holds and is now on HARDER ground: not only is the PAS service absent (avail=1 plus v13=0), there is ALSO no legal workaround (declared zap forces PAS, so the degraded path cannot enter). CORRECTION OF MY OWN ROUND 135 JUDGMENT: I suggested retrying INTERRUPTED via the non-atomic path. Even if that retry were sound it would not change the verdict, because v13=0 is the secure reply and a retry cannot obtain a different policy answer. ALSO RECORDED: the pinned base DT lags the version that supports the SDM845 GPU. ROUND 107 recorded the dangling &gpu_zap_shader reference as a typo in the reference document, but the real cause is that the pinned base sdm845.dtsi is OLDER than the version declaring the node. Consulting master then would have surfaced the zap design ~29 rounds earlier. All ROUND 134 honest boundaries are preserved untouched: t0=1 cause un-explained, v13=0 is a secure reply not an inference, stage 1/2 never executed, modeled=9 / satisfied=0 / BLOCKED and CONFIG_XNU_NATIVE_ADRENO=n unchanged, and the record neither claims PAS passed nor claims the GPU works.',
  '[ROUND 133-134 2026-11-14, DEVICE-VERIFIED / PAS 13 IS NOT SUPPORTED ON THIS MACHINE AND s0 WAS NEVER A VERDICT: THE (B) ROUTE STOPS HERE] Final round of this sub-route. NO code change, no flash this round (round 133 did the last device run). THE ROUND 133 DEVICE ROW, VERBATIM (318 bytes): stage7=exec why=- armed=1 exec_key=2 sym=1 blob=embedded seg=1968 region=8c415000+2000 stages=3 seq_ok=1 mdt_ck=0980cf98 seg_ck=5a8c8234 mdt_len=6684 x0=42000201/42000202/42000205 rc=4 ran=1 calls=1 t0=1 s0=82 t1=0 s1=0 t2=0 s2=0 p13=0/0 v13=0 t0r=1 meta=ad914000 avail=1 av0=0/1 x1s=82 ct=std x1ok=1. Source artifact work/tmp/r133_window.bin, 33,554,432 B, sha256 2a4b51e3a381c6ed79e84ca7c47fb4129b66f0932b3d957315bc30afcc99e136, single boot (stage7= 1 line, Darwin Kernel Version 1 line, ct=std 1 line), with panic(cpu, BARK, BITE and CrashDump all 0 and scm avail 509 lines over ONE distinct tuple with ZERO -99 sentinels. === THREE INDEPENDENT SIGNALS, ALL POINTING THE SAME WAY === (1) avail=1 PLUS p13=0/0 GIVING v13=0 MEANS THE COMMAND EXISTS AND THE PERIPHERAL IS UNSUPPORTED. This had to be split in that order for a reason: a 0/0 reply from the p13 probe is EQUALLY consistent with the query command simply not existing, in which case the secure world answered nothing and the reading says nothing about peripheral 13. Round 129 therefore built an is_call_available discriminator FIRST, and round 130 used it on the phone to pin avail=1 (av0=0/1, a1=1 nonzero, per the !!res.result[0] polarity at P2:368). With the command proven present, p13=0/0 becomes v13=0, a REAL UNSUPPORTED, not an absent command and not a failed query. Note the two polarities are OPPOSITE - avail answers YES on a nonzero a1 while p13 answers NO on a zero a1 - which is the trap round 129 pinned in code, in the host test and in a dedicated mutation. (2) ct=std WITH x0=42000201 (bit 31 clear) AND t0 STILL 1 MEANS INTERRUPTED IS UNRELATED TO CALL TYPE. qcom_scm_call() reaches scm_smc_call(dev, desc, res, false) so atomic is false, and qcom_scm-smc.c:160 chooses FAST_CALL only when atomic; upstream therefore issues these PAS calls as STD_CALL 0x42000201. This port had been issuing FAST_CALL 0xC2000201 since round 123, differing in bit 31 and nothing else. Round 131-132 made the call type switchable through the contract layer (adreno_zap_smc_base_with_call_type gates its input, moves ONE bit, then re-gates its output, so a hand-flipped bit 31 cannot silently corrupt the owner field in bits 24-29 or the SMC_64 bit at 30), reusing the existing boot argument because the command line was already at 991 of 1000 bytes and a new switch would not fit. Round 133 set pas-exec=2 and the phone printed ct=std with x0=42000201/42000202/42000205 - all three bit 31 clear - and t0 IDENTICALLY 1. The counter-evidence is recorded with it: is_call_available is issued atomically (FAST_CALL) at qcom_scm.c:254 and it SUCCEEDED, so FAST_CALL demonstrably does reach the secure world; FAST was never established to be wrong here, it was a candidate and it is now retired. (3) s0 EQUALS x1s EQUALS 0x82 WITH x1ok=1 MEANS s0 IS AN ECHO, NOT A VERDICT. This is the finding that matters most and it is a defect of the INSTRUMENT, not of any single reading. === HOW THE ECHO WAS FOUND, IN FULL, INCLUDING THE STEP THAT WAS WRONG === ROUND 130 added x1s as a pure comparison field beside s0, without changing how s0 is read, to test whether s0=0x82 is the secure world answering or our own arginfo coming back untouched. BUT x1s WAS ASSIGNED FROM THE WRONG CALL: s7x1s came from s7sup.arginfo, where s7sup is the PAS_IS_SUPPORTED probe whose arginfo is 0x01, while stage 0 init_image sends 0x82. The comparison crossed TWO DIFFERENT CALLS, and the device row proves it - round 130 printed x1s=1 beside s0=82. THE CONSEQUENCE OF THAT DEFECT IS THE CRITICAL PART: on the strength of s0 != x1s round 130 appeared to REFUTE the echo hypothesis. That refutation was FALSE, because the x1 being compared was not the x1 init_image sent. A comparison field aimed at the wrong call is worse than no comparison at all, because it manufactures certainty. ROUND 131 FIXED THE SOURCE and rejected the obvious shortcut. x1s now comes from s7rep.stage[InitImage].arginfo, which required adding an arginfo field to adreno_zap_pas_stage_result, filled in the .c from THE SAME arg_info VARIABLE HANDED TO THE TRANSPORT (transport_ret = t->call(t->cookie, plan.x0, arg_info, ...); out->stage[i].arginfo = arg_info;) so the field observes WHAT WAS SENT rather than restating a constant. Assigning the contract constant directly was refused because it would equal the constant by construction, turning the assertion into a tautology and destroying the only evidence the field exists to provide. Four assertions forbid the probe-arginfo form, a literal 0x82 and a direct constant assignment, and require the read to happen after execute. A NEW x1ok= cross-checks against the pinned constant and distinguishes the two ways it can be zero: the chain never ran, versus a drifted plan. ROUND 133 CONFIRMED IT ON THE PHONE: x1s=82, x1ok=1, s0=82, therefore s0 == x1s with the comparison now aimed at the same call. The monitor never writes a1, so a1 retains the arginfo we put in x1. === EVERY EARLIER s0 READING IS VOID === All interpretation of s0 from round 123 through round 130 is withdrawn. In particular round 128 wrote that s0 changing from 0 to 0x82 meant the secure channel had also changed - IT DID NOT. There is no evidence the secure channel changed at all; what changed is what WE sent. An honest limit is recorded rather than explained away: x1 ALREADY carried arginfo 0x82 at round 123, because round 108 established the x0/x1/x2/x3 register map (x1 = arginfo) BEFORE round 123. So the 0 to 0x82 change CANNOT be attributed to the round 108 layout fix. What demonstrably changed between round 123 and round 128 in what we sent was the metadata ADDRESS, from the empty reserved region 0x8C415000 to a real DMA buffer at 0xad90f000 after the round 127 defect fix, and a0 went from 0xFFCFFFF6 to 1. Why a1 differed is NOT attributed here. === WHY THIS IS A STOP AND NOT ANOTHER RETRY === Two of the strongest candidate explanations were tested on the phone and both were retired. Round 124 argued the failure might be a parameter gap: the probe was passing the empty 8 KiB reserved region as the metadata address, and nothing in the tree ever wrote firmware into it. That was a real defect (D1) and round 127 fixed it with armcpu_dma_alloc_writable, a writable physically contiguous buffer, landing at 0xad90f000. t0 changed from 0xFFCFFFF6 to 1 and the call STILL FAILED. Round 129-133 then retired the call type. With avail=1 plus v13=0 standing, the remaining explanation is not a parameter at all: THIS MACHINE SECURE WORLD DOES NOT PROVIDE A PAS SERVICE FOR PERIPHERAL 13. === WHAT DOES NOT CHANGE === modeled=9 / satisfied=0 / BLOCKED is UNCHANGED (AdrenoGen1BackendV1.c:542-543); CONFIG_XNU_NATIVE_ADRENO is still n (configs/enchilada_defconfig:40); the GPU has still never rendered a frame. PAS is one gate inside K3, which is one of twelve prerequisites, so even a PASS would not have incremented satisfied. Of the four hard blockers in evidence/stage5-gpu-metal-publish.md:126-132 only the second was engaged: the A6XX GEN1 kernel backend, the kgsl SMMU stage-1 context, and the macOS frontend plus Metal/IOSurface ABI are untouched. HONEST BOUNDARIES THAT MUST BE CARRIED FORWARD: the cause of INTERRUPTED (t0=1) is NOT explained - only that it is unrelated to call type; v13=0 is the secure world answer to whether peripheral 13 is supported, NOT an inference about why it refuses; stages 1 and 2 NEVER RAN, so they must never be described as rejected; and this round does NOT prove PAS impossible on any device, only that THIS machine does not offer the service. === WHAT SURVIVES AS REUSABLE ENGINEERING ASSETS === armcpu_dma_alloc_writable, a writable physically-contiguous buffer export proven to land on the phone; scm4, the four-argument SCM transport with the five existing call sites unchanged character for character; the three-stage PAS contract with pinned arginfo, fnid and polarities; the is_call_available discriminator and its subordinate v13 rule; six new verifier assertions; and the s0 echo lesson itself, which is the cheapest and most general of them. === THE METHOD LESSON, WHICH OUTLASTS THE RESULT === This was a SYSTEMATIC ERROR IN THE OBSERVATION TOOL, it survived three rounds, and it was found by adding a comparison reading INSIDE THE SAME CALL rather than by staring harder at the value. When the only window onto the other side is a register, the first question is whether the value is one we left there ourselves. A refutation is only as strong as the correctness of what it compares against. === NEXT DIRECTION === The (B) route stops. The port moves to software rendering: text_fixup so CIContext returns a software context, or the prebuilt berga-tools EAGL shim, both of which serve (A) UI does not fall over and NEITHER of which involves the Adreno, so no such work may be described as (B) the Adreno renders. If this line is ever revisited it needs a device whose secure world actually offers the PAS service, verified with the avail and p13 probes BEFORE any PAS call is issued, or a Qualcomm signing chain.',
  '[ROUND 131-132 2026-11-14, HOST-VERIFIED / TWO READINGS MADE DECIDABLE, NOTHING EXECUTED ON THE PHONE] MAKES THE LAST TWO OPEN QUESTIONS ANSWERABLE IN ONE RUN. NO SMC issued, no PAS, no MMIO, no device run. === DEFECT 1 FOUND BY THE R130 VERIFIER AND CONFIRMED HERE: x1s WAS READING THE WRONG CALL === Round 130 printed x1s to test whether s0=0x82 is really the secure world answering or merely our own arginfo echoed back, but s7x1s was assigned from s7sup.arginfo, and s7sup comes from the PAS_IS_SUPPORTED probe whose arginfo is 0x01. The stage-0 arginfo is 0x82. The comparison therefore crossed TWO DIFFERENT CALLS, and x1s=1 on the device row proves it. Consequence, stated plainly: round 130 s0 != x1s did NOT refute the echo hypothesis, because the thing compared was not the x1 that init_image sent. === THE FIX, AND WHY NOT THE OBVIOUS SHORTCUT === x1s now comes from s7rep.stage[InitImage].arginfo. That required adding an arginfo field to adreno_zap_pas_stage_result, filled in the .c from THE SAME arg_info VARIABLE HANDED TO THE TRANSPORT: transport_ret = t->call(t->cookie, plan.x0, arg_info, ...); out->stage[i].arginfo = arg_info; so the field observes WHAT WAS SENT rather than restating a constant. The shortcut of assigning the contract constant directly was REJECTED for a good reason: it would equal the constant by construction, turning the assertion into a tautology and destroying the only evidence this field exists to provide. Four assertions forbid the probe-arginfo form, a literal 0x82, and a direct constant assignment, and require the read to happen after execute. A new x1ok= is cross-checked against the contract constant and distinguishes the two ways it can be zero: the chain never ran, versus a drifted plan. === DEFECT 2: THE CALL TYPE. A REAL DIVERGENCE, NOT YET PROVEN TO BE THE CAUSE === qcom_scm_call() reaches scm_smc_call(dev, desc, res, false), so atomic is false, and qcom_scm-smc.c:160 selects FAST_CALL only when atomic. Upstream therefore issues the three PAS calls as STD_CALL 0x42000201 while this port has been issuing FAST_CALL 0xC2000201 since round 123, differing in bit 31 and nothing else. THE COUNTER-EVIDENCE IS RECORDED WITH IT: is_call_available is issued at qcom_scm.c:254 with atomic=true, i.e. FAST_CALL, and it succeeded (avail=1), so FAST_CALL demonstrably does reach the secure world. FAST is not established to be wrong here; it is a candidate explanation for t0=1 alongside others. === ZERO EXTRA COMMAND-LINE BYTES, AND THAT CONSTRAINT DROVE THE DESIGN === The command line was already at 991 of 1000 bytes with 9 to spare. A new switch (enchilada-pas-calltype=std, 27 bytes) and a shortened one (pas-std=1, 11 bytes) BOTH overflow it. So the switch reuses the existing argument: pas-exec=1 keeps FAST_CALL byte for byte as rounds 127 to 130 had it, and pas-exec=2 selects STD_CALL. Round 132 sets the value to 2. The measured joined length is 991 before and after, so this experiment costs nothing on the command line. === THE RECAST GOES THROUGH THE CONTRACT LAYER, NOT A RAW BIT FLIP === The base word carries the owner in bits 24 to 29 and the SMC_64 bit at 30 alongside the FAST_CALL bit at 31, so flipping bit 31 by hand would silently corrupt a neighbour while still leaving a value that LOOKS like a plausible base. adreno_zap_smc_base_with_call_type() gates its input, moves the single bit, then re-gates its output, and a self-check asserts the result differs from the base by exactly one bit. The FAST path is wrapped in a conditional so pas-exec=1 changes nothing at the byte level, enforced by an assertion that there is no unconditional recast plus a mutation. === NEW FIELDS === x1s is now the stage-0 x1 and x1ok says whether it matches the pinned constant; ct=%s reports fast or std READ BACK from the base rather than echoed from the local switch. Deliberately, the avail and p13 probes do NOT follow ct and stay on FAST: both already produced answers on FAST in rounds 129 and 130, and changing them would add two more variables to a run whose whole purpose is to move one. === MUTATIONS: EIGHT OF EIGHT ON THE FIRST PASS === Both required mutations were caught by the probe verifier: reverting x1s to the probe arginfo, and forcing the call type to fast. Two more were caught only by the host tests: a recast that also cleared SMC_64, and a version that failed to record arginfo. Against round 129, where the first pass caught only four of eight, the difference was running BOTH verifier layers from the start and aiming each mutation at the executing path rather than at a comment or the wrong file. === A REGRESSION I INTRODUCED AND FIXED, RECORDED BECAUSE IT IS INSTRUCTIVE === My first draft mentioned the numeric base word in a COMMENT inside the derivation area. The full sweep immediately reported two failures in verify-enchilada-zap-auth.py, which requires that literal to appear in the .c in exactly two non-functional places; a comment counts. That verifier is right for a reason worth keeping: a literal sitting beside the derivation path is precisely what the next person copies. === VALIDATION === probe 26 of 26 in both build modes; host 31 of 31; stage3 40, stage4 49, stage5 40, stage6 220; zap-auth 306; mdt 196; full sweep 70 of 71 with the same pre-existing by-design record verifier. Counts unchanged at 30 C units, 31 suites, 71 verifiers. ArmCpu.cpp untouched at mtime 18:58. Command line measured 991 of 1000 bytes with the pas-exec entry reading 2 and the adreno entry reading 6. === WHAT THE NEXT RUN WILL SHOW, AND WHAT IT WILL NOT === Two readings become judgeable. Echo: s0 and x1s now come from the same call, so equal values (82 and 82) would make s0 suspiciously our own arginfo and would disqualify it as a secure-world verdict, while unequal values would refute the echo hypothesis. Call type: ct=fast or ct=std is printed on the row and the x0 word visibly changes from c2000201 to 42000201. NEITHER IS A RESOLUTION: this round does not prove STD_CALL makes PAS succeed, does not prove that x1s=0x82 means echo, does not prove the added arginfo field leaves outside consumers untouched, and above all does NOT prove the changes behave as designed on the phone, because no SMC was issued this round at all.',
  '[ROUND 129 2026-11-14, HOST-VERIFIED / DISCRIMINATOR BUILT, NOTHING EXECUTED ON THE PHONE] MAKES THE ROUND 128 READING DECIDABLE INSTEAD OF ASSUMED. NO SMC issued, no PAS, no MMIO, no device run. WHAT THIS FIXES. ROUND 128 read p13=0/0 and concluded v13=0, i.e. PAS 13 unsupported. That conclusion was not earned: a 0/0 reply is equally consistent with the query command simply not existing, in which case the secure world answered nothing at all and the reading says nothing about PAS 13. Linux never makes this mistake because it runs __qcom_scm_is_call_available first and skips the call when the command is absent; our probe called the command directly. === A TASKING ERROR, CORRECTED FROM THE PINNED SOURCE === I told the round to probe with svc=QCOM_SCM_SVC_INFO(0x01). THAT IS WRONG: qcom_scm.h defines QCOM_SCM_SVC_INFO as 0x06 and 0x01 is QCOM_SCM_SVC_BOOT. The tree own working call corroborates it: ArmCpu.cpp passes 0xC2000601, and decoding that gives owner 0x02, svc 0x06, cmd 0x01; had svc really been 0x01 the word would read 0xC2000101. The round used 0x06 and pinned it in the verifier so a regression to 0x01 is caught by mutation. === WHAT WAS BUILT === (1) adreno_zap_is_call_available_call() and ..._verdict() in the contract layer, emitted through the EXISTING armcpu_scm_call and placed BEFORE the p13 probe with an assertion on the order. scmAvailable could not be reused because it is static at ArmCpu.cpp:163 and the hard constraint forbids touching that file this round; its error encoding is also designed for the eight-slot armcpu_scm log and borrowing it would have mixed two error spaces. (2) THE POLARITIES ARE OPPOSITE AND THAT IS THE TRAP: p13 answers NO when a1==0, is_call_available answers YES when a1 is ANY nonzero value, per the !!res.result[0] idiom at P2:368. Getting this backwards inverts the whole conclusion, so it is pinned in code, in the host test and in the verifier, with a dedicated mutation for it. (3) v13 is now SUBORDINATE TO avail. The rule is one line: v13 may only be 0 when avail==1. When the command is absent or the availability query itself failed, the same 0/0 reply DEGRADES TO -1, no conclusion. One deliberate asymmetry: avail==0 with a1==1 still reports 1, because answering supported at all already proves the command exists, and using may-not-exist to deny it would aim the doubt the wrong way. The two-argument verdict keeps its old behaviour byte for byte; the three-argument form is an addition, not a replacement, and assertions hold both. (4) x1s= is printed beside s0 and is a pure COMPARISON field. The reading of s0 is untouched, enforced by an assertion that stage[0].secure_result still appears in the code. The echo hypothesis that x1s exists to test: init_image sends arginfo 0x82 in x1, and ROUND 128 read a1 as 0x82, exactly equal, so the value read back from a1 may be our own arginfo returned untouched rather than anything the secure world said. Making that decidable is the whole purpose; NO conclusion about it is drawn this round. (5) A NOTE RECORDING THAT t0=1 MUST NOT BE RETRIED, placed in the bridge contract comment with four verbatim P6 citations. The reason is upstream semantics, not caution: qcom_scm-smc.c retries INTERRUPTED only on the atomic path, while PAS takes the non-atomic path whose retry loop tests only QCOM_SCM_V2_EBUSY(-12), so a0==1 there is a TERMINAL answer, not a please-resend. Adding a retry would both contradict upstream and corrupt the ran and calls counters. (6) s7Row and the stage-7 replay buffer grew 384 to 512 because the recomputed worst case with the new fields is 437 and snprintf would have truncated exactly the diagnostics this round produces. Five real rows measured 285 to 317 bytes. === THE READING ORDER FOR THE NEXT RUN, WRITTEN INTO THE SOURCE === avail=0: command absent, v13 must be -1 no matter what p13 says, which is precisely what ROUND 128 could not distinguish. avail=1: command present, so p13=0/0 giving v13=0 is a real unsupported. avail=-1: the query itself failed, equally inconclusive, and NOT an absent. s0 versus x1s equal: suspect echo. === MUTATION EVIDENCE, INCLUDING FOUR MUTATIONS THAT FIRST SURVIVED === Ten mutations, all caught in the end, but the first pass caught only four of eight and the escapes were instructive. Two were METHOD errors: one edited the .c file while the probe verifier only reads .cpp and .h strings, although the host test did catch it; the other produced a variant that failed to COMPILE for an unrelated reason and was recorded as not caught when the mutant never ran at all. Two were REAL assertion gaps, both the same shape as the ROUND 127 lesson: the assertion checked that a NAME APPEARS IN THE FILE rather than that the PATH IS ACTUALLY TAKEN. The rule now stated explicitly: a mutation must be run against BOTH verifier layers, and an assertion must govern the code rather than find it in the text. === VALIDATION === probe check 26 of 26 in both build modes; host 31 of 31; stage3 40, stage4 49, stage5 40, stage6 202; zap-auth 306; mdt 196; full sweep 70 of 71 with the same pre-existing by-design record verifier. Counts unchanged at 30 C units, 31 suites, 71 verifiers. ArmCpu.cpp untouched at mtime 18:58. No bytes gives blob=absent, p13=0/0, v13=-1, avail=-1, av0=0/0, x1s=0, meta=0; bytes present gives blob=embedded with the expected checksums. === WHAT THIS DOES NOT PROVE === It does NOT prove whether ROUND 128 v13=0 was the command-absent case or the genuine-unsupported case: the discriminator is built, the discrimination needs a device run. It does not prove s0 is an echo, only that equality would make it suspicious. It does not prove what is_call_available will answer for 0x0207. It does not prove the 0x01 svc is impossible in every monitor, only that the pinned source and this tree working call say 0x06. Most importantly, avail=-1 in the host build is the value for NOT ASKED, not a result of asking.',
  '[ROUND 125-127 2026-11-14, HOST-VERIFIED / ATTRIBUTION + FIX, NOTHING EXECUTED ON THE PHONE] THREE ROUNDS THAT TURN ONE FAILED CALL INTO AN EXPLAINED ONE AND FIX THE DEFECT THEY FOUND. NO SMC issued, no PAS executed, no MMIO, no device run. === ROUND 125: WHAT THE FAILURE ACTUALLY WAS === ROUND 123 issued the three PAS calls for the first time (ran=1 calls=1) and stage 0 returned t0=0xFFCFFFF6 with rc=4 (kAdrenoZapExecStageFailed), so stages 1 and 2 never ran. THREE QUESTIONS ANSWERED, and one of them CORRECTED A CLAIM I HAD ALREADY WRITTEN INTO EVIDENCE. (a) SOURCE = secure world raw a0, proven: pinned qcom_scm-smc.c only ever loads smc_res.a0 from the smc #0 x0 register and never assigns it. NOT a QCOM_SCM_* family member (all 8 codes in the internal qcom_scm.h compared one by one, none equal). NOT produced by our wrapper: armcpu_scm_call returns only 0, -16 or -EINVAL and passes a0 through, and the probe only increments calls on rc==0, which the device row closes out at calls=1. (b) THE HIGH HALF OF t0 IS FABRICATED BY US, NOT REPORTED BY THE SILICON: EnchiladaAdrenoProbe.cpp return static_cast<int>(transport & 0xFFFFFFFFu) truncates to 32 bits and the print then sign-extends. A secure world returning 0x00000000FFCFFFF6 would print the identical row. So every inference drawn from the all-ones high half, including the one in my own first evidence draft, is void. (c) SEMANTICS = NOT DETERMINED. The pinned TZ interface header documents these three PAS calls only as Zero on success; a negative value on failure and never enumerates the negatives. A full search of the pinned tree, the 5806-line scm_sip_interface.h, the whole workspace and Mu-Silicium found no definition of 0xFFCFFFF6. Recorded as not found, NOT as does not exist. === ROUND 125 ALSO CORRECTED MY OWN CALL-ORDER CLAIM === I had written that upstream loads the MDT into the region BEFORE init_image. THE PINNED SOURCE SAYS THE OPPOSITE: mdt_loader.c calls qcom_mdt_pas_init (which contains init_image) first and __qcom_mdt_load (which writes the segments) second, and qcom_mdt_pas_init never touches mem_region at all. Had the wrong reading been acted on, the next round would have tried write the region first and retried, which would still fail because init_image looks at a different buffer entirely. === THE REAL DEFECT (D1), PROVEN === qcom_scm.c allocates its OWN dma_alloc_coherent buffer, memcpy the metadata into it, and passes only that buffer physical address. It never uses an address supplied by the caller. The probe was passing kAdrenoZapRegionPhys (0x8C415000) as the metadata address, and the whole repository contains exactly two #defines of that address and ZERO write sites, so the buffer it pointed at never held the metadata. A comment in the probe claimed the bytes get written into gpu_region; that described something never implemented, and ROUND 120 READ-ONLY checksum only ever proved the bytes reached the IMAGE, which is a different statement. === ROUND 126: MAKE THE QUESTION ANSWERABLE === (1) pas_is_supported(13) diagnostic added, field p13=<a0>/<a1> v13=<verdict>, printed UNCONDITIONALLY on the stage-7 row so PAS support can be answered without arming the three-stage chain. THE VERDICT LIVES IN a1, not a0: the pinned reply structure puts verdict second and the request structure carries exactly one field. v13 has THREE values: 1 supported, 0 unsupported, -1 NO CONCLUSION. The last is deliberate: a0 nonzero (the SMC did not complete) and a1 outside {0,1} (the reply is not an answer) both map to -1, and nothing is ever folded into a no, because folding an unrecognised a1 to zero would manufacture a policy refusal out of a bad read. (2) mem_setup size: NO SECOND PARSER WAS WRITTEN. Investigation showed qcom_mdt_get_size and qcom_mdt_pas_init accumulate min and ALIGNed max word for word identically, and AdrenoMdtV1 already has adreno_mdt_get_size() asserted to 0x1000 against the real blob. Writing another would be the same number in two places, which is the drift surface this line has been closing. Instead the probe calls the existing function and the contract layer gained a RULE, adreno_zap_pas_mem_setup_span_ok(), with 8 assertions. On the real 6684-byte blob: span=0x1000, min=0x5000, and span_ok(...,1968)=0 catches the ROUND 125 defect, while 0x2000 is ALSO rejected, which shows it is a rule rather than a constant. (3) A REAL DEFECT FIXED THAT WAS NOT IN ANY TASKING: stage 7 had been overwriting stage 6 replay buffer. setId1Replay(s7Row) wrote gId1Replay, the buffer stage 6 also writes at a later point in the same poll, and replay emits only one copy, so the PAS row was precisely the row most likely to be lost to ring wrap. The replay mechanism exists to prevent exactly that. Stage 7 now has its own gId1ReplayStage7[384] and setStage7Replay(); gId1Replay[300] was left alone because a stage-6 assertion pins it verbatim. === ROUND 127: THE FIX, AND THE DECISION IT FORCED === armcpu_map_physical cannot allocate: it maps an address that already exists, with kIODirectionIn. The tree already contains the right precedent twice (EnchiladaBacklightProbe.cpp and Dwc3Gadget.cpp both use IOBufferMemoryDescriptor with kIOMemoryPhysicallyContiguous and have run on the phone), but using it directly in the probe would have collided with two DELIBERATE gates in check-enchilada-adreno-probe.py: the stub must hold exactly two headers and exactly IOLog plus snprintf plus two PE_parse_boot_argn, and that file docstring says the stub must not silently widen. Those two gates were LEFT BYTE-FOR-BYTE UNCHANGED. Instead ArmCpu.cpp gained one new export, armcpu_dma_alloc_writable, placed beside armcpu_map_physical so the two can be compared, and the probe reaches it through a weak_import. The only change on the probe side is one more name in that file allowed set, which is a designed extension point the same one ROUND 110 used for armcpu_scm_call, not one of the two gates. THE 4 GiB DECISION AND ITS COST, STATED PLAINLY: the landing side of a fresh IOBufferMemoryDescriptor is UNCERTAIN here, documented in MsmDsiBrightness.h. Rather than truncate the high half and hand the secure world a WRONG address that would produce a plausible-looking policy refusal, or gamble on TrustZone translating an address above 4 GiB, the probe REFUSES with why=meta-above-4gib. That refusal is not a proof that such an address cannot work; it is a refusal to test it blindly. The cost is real: if the allocator lands above 4 GiB the next run measures NOTHING. The mitigation is the meta=<phys> field, printed unconditionally so the landing side is observable WITHOUT arming PAS. === VERIFIER HARDENING, AND THE TWO MUTATIONS THAT FIRST SLIPPED THROUGH === stage6 grew from 139 to 172 checks. Eight mutations were run and all eight are now caught, BUT THE FIRST PASS CAUGHT ONLY SIX, and both escapes are worth recording. M5 prefixed the guard with false && and survived, because the assertion only looked for the substring (s7metaPhys >> 32) != 0 and else if (false && ...) still contains it: the assertion has to govern the test, not merely find it in the text. M8 swapped the physically-contiguous flag and survived, and that was not a weak assertion but a BAD MUTATION: the flag appears three times in ArmCpu.cpp (two comments, one real argument) and replace(...,1) hit a comment. Mutations have to hit the executing path; passing once is not enough. === CI BOUNDARY === All six symbols verify-ci-246 forbids remain absent, and _qcom_scm_call and armcpu_dma_alloc_writable are verified in BOTH directions not to be substrings of each other. That verifier asserts presence of a list and absence of six names; it has no assumption that the symbol set equals something, so a new export cannot trip it. No verify-ci-*.py was modified. === VALIDATION === probe check 26 of 26 in both build modes; host suite 31 of 31; stage3 40, stage4 49, stage5 40, stage6 172; mdt 196; zap-auth 306; full sweep 70 of 71 with the same single by-design record verifier that needs its 40-hex argument. Counts unchanged at 30 C units, 31 suites, 71 verifiers. Both build modes checked: no bytes gives blob=absent, p13=0/0, v13=-1, meta=0; bytes present gives blob=embedded, mdt_ck=0980cf98, mdt_len=6684. === WHAT THIS DOES NOT PROVE === It does NOT prove ArmCpu.cpp compiles. This host has no complete XNU tree (sys/_symbol_aliasing.h is a build product), so the API shape was checked line by line against the real headers but compile and link can only be proven by CI. That is the single most load-bearing unknown of these three rounds. It does not prove the allocation succeeds, does not prove the landing side is below 4 GiB, does not prove an address above 4 GiB would fail, does not prove init_image will now pass, and does not prove the never-released buffer is safe: that leak is deliberate and acceptable only because this port calls once per boot.',
  '[ROUND 121-124 2026-11-14, DEVICE-VERIFIED / PAS ISSUED TO THE SECURE WORLD FOR THE FIRST TIME, AND IT FAILED AT STAGE 0, NOTHING WRITTEN TO ANY PARTITION, NO CODE CHANGED] This is the first time this port has ever put a PAS call in front of TrustZone, and the result is negative in a very specific way that must not be rounded up. WHAT WAS BUILT AND PROVEN FIRST (ROUND 121, CI-VERIFIED): the firmware bytes finally REACH the image. ROUND 120 had found the reason they never did - package/EnchiladaAdrenoProbe.cpp declared adreno_zap_mdt[6684] and adreno_zap_seg[1968] and NEVER READ them, so clang dropped both arrays as dead data and PAS could not have worked no matter how correct the contract layer was. Round 120 added zapFnv1a() to walk both arrays byte by byte, which forces emission and doubles as a real integrity check printed in the stage-7 row. Round 121 drove the opt-in path through real CI with extra_firmware_b64 (11536 chars -> 8652 B) landing in device/.cache/firmware, generate-zap-blob.py producing AdrenoZapBlobV1.h at 56906 B with 11/11 self-checks, and then PROVED the bytes are inside kernel.macho by byte-substring search rather than by size or inference: find(full .mdt 6684 B) -> 271172 HIT, find(full .b02 1968 B) -> 277856 HIT, the two arrays byte-adjacent (271172 + 6684 = 277856) so they form one contiguous 8652 B blob. Three independent corroborations: llvm-nm gives __ZL14adreno_zap_mdt at fffffff007046344 and __ZL14adreno_zap_seg at fffffff007047d60, and subtracting the __TEXT vmaddr fffffff007004000 yields EXACTLY 271172 and 277856, the same two offsets find() reported; __TEXT,__const grew 265400 -> 274048 (+8648, i.e. 8652 minus a 4-byte alignment); and the negative control - the SAME find() run against the round-119 artifact - returns -1 for both files and the round-119 image contains ZERO adreno_zap symbols against two in round 121. The unchanged file size (126,128,128 B, identical to round 119) was specifically falsified as a no-op: both builds are exactly 30793 page-aligned pages and the 8652 B increment did not cross a page boundary, while round 119 was NOT all-zero in that range (8151 non-zero bytes, its __const tail). ROUND 122 ran that byte-carrying image on the phone WITHOUT the second key and got blob=embedded, mdt_ck=0980cf98, seg_ck=5a8c8234, mdt_len=6684 with ran=0 calls=0 - and the two checksums were recomputed independently on the host from the real firmware files with FNV-1a 32 and matched BIT FOR BIT, with negative controls (empty -> 811c9dc5, single zero byte -> 050c5d1f) proving the whole array is walked rather than a prefix. THE EXPERIMENT ITSELF (ROUND 123): second key enchilada-pas-exec=1 added (boot args 970 -> 991 of 1000, the key costs 21 bytes with its separator), CI #251 (run 43579455091, success, 10m39s, device 22d16dc5 changing board.toml only) re-verified the byte property on the new tree (find .mdt -> 271172, find .b02 -> 277856, still adjacent), system_b flashed with the 150,994,944 B payload, boot-r16.img booted in memory, device returned to TWRP by itself 30 s later. THE ROW, verbatim: stage7=exec why=- armed=1 exec_key=1 sym=1 blob=embedded seg=1968 region=8c415000+2000 stages=3 seq_ok=1 mdt_ck=0980cf98 seg_ck=5a8c8234 mdt_len=6684 x0=c2000201/c2000202/c2000205 rc=4 ran=1 calls=1 t0=ffffffffffcffff6 s0=0 t1=0 s1=0 t2=0 s2=0. DECODED HONESTLY, PER STAGE AND PER CHANNEL: t is smc a0 (transport) and s is smc a1 (secure result[0]), reported separately because P2:729 return ret ?: res.result[0] collapses them. Stage 0 pas_init_image (0x0201) returned t0 = 0xffffffffffcffff6 = -3145738, so STAGE 0 FAILED AT THE TRANSPORT LAYER. Stage 1 pas_mem_setup (0x0202) and stage 2 pas_auth_and_reset (0x0205) NEVER RAN - ran=1 calls=1 means exactly one SMC was issued - so their t=0 s=0 are the INITIAL ZEROS the executor writes before the loop, NOT acceptances. s0=0 likewise CANNOT be read as the secure world accepting: zapBridgeCall() returns -1 without writing out_result0 whenever the transport refuses, so 0 is the untouched initial value. The value is NOT -EBUSY: -EBUSY is 0xfffffffffffffff0 and the measured value is 0xffffffffffcffff6; the probe truncates smc a0 to 32 bits at EnchiladaAdrenoProbe.cpp:356, so this is a secure-world status and not an errno. rc=4 is kAdrenoZapExecStageFailed (AdrenoZapAuthV1.h:524), i.e. fail-closed worked as designed. THE MEANING OF t0 IS UNPARSED and this record does not claim to know it. WHY THE FAILURE IS NOT THE CHANNEL: in the SAME boot the window carries 509 scm avail lines with ONE distinct tuple (sdi=1 dl=0 wr=1 sdi=0 tcsr=10 dl=-1 wr=0 tcsr=0) and ZERO -99 never-executed sentinels, and 509 counts snapshots of the 1 Hz text replay, not 509 calls. DEVICE SAFETY: zero panic(cpu, zero Debugger message, zero BARK, zero BITE, zero CrashDump in the 32 MiB window; BCB re-armed to boot-recovery; boot_a md5 unchanged; slot still _a. A CORRECTION THIS ROUND OWES THE NEXT MODEL: an earlier draft of evidence/stage5-gpu-pas-device.md claimed the stage-7 row was reproduced across TWO DIFFERENT boots, citing a kernel timestamp 34.754237. That claim is WITHDRAWN. No artifact anywhere in work/tmp (848 files up to 64 MiB searched byte-wise) contains 34.754237 except the two markdown files quoting the draft itself; the two REAL boots carry 33.197772 (round 122, ran=0) and 35.573027 (round 123, ran=1); and the draft is dated 17:30, before the payload it would have needed was even on disk (18:03:03). The row TEXT is byte-identical and still correct as text - what cannot stand is its claim to be a second independent run. Reproducibility therefore drops from DEVICE-VERIFIED to UNVERIFIED, and the honest statement is: in exactly one traceable boot, t0 = 0xffffffffffcffff6. A PRECONDITION GAP WAS LOCATED, AND IT IS NOT THE PROVEN CAUSE: pas_init_image args[1] must be the physical address of the METADATA (ELF header plus hash segment), but the probe passes kAdrenoZapRegionPhys = 0x8C415000 (EnchiladaAdrenoProbe.cpp:1008-1010), the 8 KiB reserved region. Measured facts: nothing in the translation unit ever writes firmware into that region (every memcpy/memmove/bcopy/wr32/store hit in EnchiladaAdrenoProbe.cpp is a COMMENT; the arrays are only read by zapFnv1a at :1026/:1028), adreno_mdt_loader_available() returns 0 and its comment says nothing reads a630_zap.bNN from anywhere, and init_image x3 and mem_setup x3 are THE SAME ADDRESS in this call (AdrenoZapAuthV1.c:1296,1300) although upstream they are two different things. So a retry of PAS is gated on building a real metadata buffer and a load path - a LARGER piece of work than PAS itself - rather than on re-sending the SMC. ROUTE DECISION: THE (B) ROUTE STOPS HERE. modeled=9 / satisfied=0 / BLOCKED is UNCHANGED (AdrenoGen1BackendV1.c:542-543), CONFIG_XNU_NATIVE_ADRENO is still n (configs/enchilada_defconfig:40), and the GPU has still never rendered a frame - and that is correct, because PAS is one gate inside K3 which is one of twelve prerequisites, so even a PASS would not have incremented satisfied. Only the second of the four hard blockers in evidence/stage5-gpu-metal-publish.md:126-132 was touched; the A6XX GEN1 kernel backend, the kgsl SMMU stage-1 context, and the macOS frontend plus Metal/IOSurface ABI are untouched. With t0 unparsed the next attempt cannot be DESIGNED, only brute-forced, and every attempt is a live secure-world interaction. The port therefore moves to software rendering (text_fixup / berga-tools) and any such goal must be stated as (A) UI does not fall over, NEVER as (B) the Adreno renders. This is not a claim that PAS is impossible: t0 may be exactly the parameter gap above. But maybe-fixable is not a reason to keep spending.',
  '[ROUND 120 2026-11-14, HOST-VERIFIED / FIRMWARE REACHES THE IMAGE, NOTHING EXECUTED ON THE PHONE] CLOSES THE LAST BREAK IN THE OPT-IN BYTE PIPELINE. WHY: ROUND 119 drove the whole opt-in path end to end through real CI (input -> base64 decode -> length check -> device/.cache/firmware -> generator present=1 at 56906 B) and then found the firmware STILL absent from kernel.macho. ROOT CAUSE (real defect, reproduced): package/EnchiladaAdrenoProbe.cpp declared adreno_zap_mdt[6684] and adreno_zap_seg[1968] as static const and then NEVER READ them - the probe consumed only the kAdrenoZap macros, so clang treated both arrays as dead data and dropped them. Measured: a real opt-in header produced a 15040-byte object with no adreno_zap_mdt / adreno_zap_seg symbol and neither the 6684-byte .mdt nor the 1968-byte .b02 present anywhere in it. The contract layer was never the problem; nobody used the bytes. WHY NOT THE CHEAP FIX: recording the header digest string would have put the DIGEST in the image, not the BYTES, and PAS needs the bytes themselves (they get written into gpu_region at 0x8c415000). WHAT WAS DONE: zapFnv1a() walks BOTH arrays byte by byte (FNV-1a 32-bit, freestanding, no libc, no table) and the two sums are printed in the stage-7 row as mdt_ck=/seg_ck= plus mdt_len=. Three properties, each deliberate: (1) it FORCES the whole array to be emitted, because a byte-at-a-time read through a loop the compiler cannot fold means the data must exist; (2) it is a genuinely useful integrity check - the bytes about to be handed to the secure world are summarised before PAS is issued, so a mismatch against the pinned sha256 becomes visible instead of mysterious; (3) it runs on the NON-EXECUTING path - the row prints whether or not enchilada-pas-exec is set, so the question did-the-bytes-reach-the-image is answerable without arming a secure-world call. Those two questions are now decoupled. READ-ONLY BY CONSTRUCTION: the loop only loads from the arrays, never stores through a pointer, which is what keeps stage-4/5 no-store assertions meaningful instead of something this function had to be excused from. EMPTY CASE SAFE BY ARITHMETIC: with kAdrenoZapBlobPresent 0 both lengths are 0, both loops never execute and both sums stay at the FNV offset basis 0x811c9dc5 - a fixed recognisable empty value, not a misleading 0, and no special case to get wrong. MEASURED AFTER THE FIX (captain re-ran both conditions independently): OPT-IN header 56906 B -> object 23608 B with BOTH symbols in __TEXT,__const (adreno_zap_mdt at 0x192d, adreno_zap_seg at 0x3349) and the COMPLETE 6684-byte .mdt found at offset 7013 and the COMPLETE 1968-byte .b02 at offset 13697. DEFAULT (no bytes) -> object 14640 B, both arrays correctly absent, which is smaller than the pre-fix 15032-byte object because the one-byte dummies fold away too: the empty case wastes nothing. MUTATION EVIDENCE (assertions have discriminating power): the loop bound bytes -> 1 fails R120 the loop bound is the LENGTH PARAMETER bytes, not a literal; data[i] -> data[0] fails R120 the checksum never hard-codes data[0]. Both restore to a byte-identical file. LITERAL CORRECTION ON THE RECORD: ROUND 119 tasking asked the verifier to look for blob=present in the payload volume. That string does not exist and never did - the probe prints blob=%s with embedded or absent, and the row is device-runtime IOLog, so it is not in the volume at all. The tasking was wrong, not the code; the code was NOT changed to emit present, and verify-enchilada-probe-stage6.py now asserts the word is embedded/absent and explicitly NOT present. VALIDATION: probe check 26 of 26 rc=0; host suite rc=0 (without sanitizers); stage3 40, stage4 49, stage5 40, stage6 122 all rc=0; full sweep 71 scripts, 70 PASS plus the one by-design record verifier that needs its 40-hex argument. Counts unchanged: 30 C units, 31 suites, 71 verifiers. CONFIG_XNU_NATIVE_ADRENO stays n. NO SMC issued, no PAS executed, no MMIO write, no device run. STILL NOT DONE: the firmware has not yet been carried through a real CI build with the byte input, so the end-to-end image proof is still owed; and PAS_AUTH_AND_RESET has still never been issued on the phone.',
  '[ROUND 116 AND 117 2026-11-14, HOST-VERIFIED / COMMENT CORRECTION + OPT-IN BYTE BUILD, NOTHING EXECUTED ON THE PHONE] Two rounds that change nothing about what the port can DO and everything about whether the two build modes can be told apart honestly. NO SMC issued, no PAS executed, NO MMIO, no device run, no flash, no reboot, no device-state change. (a) ROUND 116 - THE OLD WARNING CONFLATED TWO DIFFERENT ACTIONS. The ROUND 113 commentary said, in effect, never run generate-zap-blob.py before CI. That was too broad and would have blocked the only honest way to test the byte path. It is now split into the TWO REAL BUILD MODES, distinguished by ONE criterion: whether the firmware bytes EXIST - NOT by whether the build is red or green. DEFAULT (no bytes): no header is generated, the fallback branch in EnchiladaAdrenoProbe.cpp is LIVE, the kernel logs blob=absent, and the regression gate in check-enchilada-adreno-probe.py compiles exactly THIS case against an include directory that provably lacks the header. This is the mode every ordinary CI run is in, and the absence is a REAL build condition rather than an accident to paper over. OPT-IN (bytes): a HUMAN dispatches the workflow and supplies the bytes, generate-zap-blob.py runs ON PURPOSE, the header exists, and the fallback is compiled out. That is expected and correct. WHAT REMAINS FORBIDDEN is therefore narrower than the old wording: it is running the generator to turn a RED DEFAULT build GREEN. Doing that manufactures the header, the regression gate then tests the WRONG branch, and the absent-header path goes back to being unbuilt and unverified everywhere - which is precisely how CI #247 stayed invisible. A red default build is a real finding: fix the code, do not feed it bytes. The ROUND 116 change is PROSE ONLY and that was verified by counting: 46 insertions and 13 deletions, of which every added line is a comment, so the non-comment code change is ZERO lines. The ROUND 113 gate still fires: both mutations re-trigger it (re-injecting the sentinel define reproduces the seven undeclared identifiers, removing the unused attributes reproduces the four -Werror,-unused-const-variable errors). (b) ROUND 117 - AN OPT-IN BUILD THAT ACTUALLY CARRIES THE BYTES. Four files. The generator gained --firmware-dir and --require-bytes. board.toml archives gained a line running the generator BEFORE build-enchilada-adreno.py, and the position IS the ordering guarantee because kernel.py runs build_archives (:188) before the kernel link (:189). The workflow gained a zap_firmware_b64 INPUT and a step that decodes it. The probe verifier grew from 20 to 26 assertions. THE LOAD-BEARING PLATFORM FACT, recorded because it cost real time and will cost it again: `{tree}` CANNOT be used in a board.toml archives entry. kernel.py substitutes {tree} ONLY for component: specs (:128-129); a plain script entry goes through shlex.split at :132 with NO substitution, so a literal {tree} would be handed to the generator and fail to open a file that does not exist. What works is a RELATIVE path, because kernel.py runs each archive with cwd = the build tree (:141), so `.cache/firmware` there means <tree>/.cache/firmware - and the tree carries a junction back to the device repository .cache/firmware, which is what makes bytes written by a CI step visible at that path. The explicit --firmware-dir is still required rather than relying on the generator defaults, because inside the tree ROOT is <tree>, so ROOT-relative guesses resolve under out/. A SECOND TRAP, IN resolve_firmware_dir(): it returns the first candidate that ACTUALLY HOLDS BOTH input files, not the first that merely EXISTS. The distinction is not pedantic - in CI `.cache/firmware` always exists because the workflow and the junction create it, and it is EMPTY on a no-bytes run, so an exists-check would have silently masked the local extraction directory and made the opt-in path unreachable. When nothing holds the bytes it falls back to the first candidate so the error message names a sensible path. AN INPUT, NOT A SECRET, and the reason is a measured fact: the device repository has NO secrets (secrets total_count = 0), so a secrets.ZAP_FIRMWARE reference would resolve to the empty string forever and the opt-in could never work at all. The workflow description says so in place. THE PAYLOAD IS FIXED-LAYOUT AND LENGTH-CHECKED: base64 of a630_zap.mdt (6684 B) immediately followed by a630_zap.b02 (1968 B), i.e. 8652 raw bytes and therefore 11536 base64 characters. The injection step refuses any other decoded length with an explicit error BEFORE the kernel build starts, and it verifies the layout by splitting at exactly 6684. It then prints the sha256 of the two files it wrote, so the run log proves WHICH bytes were used without ever printing them. The generator independently re-checks size AND sha256 against scripts/data/adreno-a630-device-firmware.json, so a bad decode fails there too rather than much later inside a link. THE DEFAULT PATH IS BYTE-FOR-BYTE UNCHANGED, and that was proven rather than asserted: running the generator with an empty firmware directory produces a 2118 B header whose sha256 is 1a33c81d3a3da09af238e30a247afe2b8da09296f3adda39cf051517ff1b67c2, which is IDENTICAL to the header already in the tree. So a no-bytes CI run cannot differ from the pre-117 build because of this change. For completeness the opt-in path was exercised too: with the real bytes it emits 56906 B declaring present=1, mdt=6684 and seg=1968. (c) WHAT THIS ROUND DOES NOT DO. It does not prove the byte path works END TO END - that needs a dispatched run carrying the payload, which is a separate action. It does not put any firmware BYTE into the repository: the header is gitignored (.gitignore:91), .cache/ is gitignored (:13), and this record carries sizes and hashes only. And it does not move any gate: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0, and stage 5 remains blocked. Carrying bytes to the right memory is a precondition for a PAS call, not a PAS call. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and the token file location; recorded by sha256 c408902f55fc8c08af543fb67e21bc8a45558b53b31fb47db55fb2353485e637, 47986 B, 559 lines, 13 sections. The ROUND 106 disposition stands.',
  '[ROUND 113 2026-11-14, HOST-VERIFIED / BUILD-BREAK REPAIR, NOTHING EXECUTED] ROUND 113 fixes the TWO defects that made CI #247 fail at step 15 Build kernel, and adds the regression gate that would have caught them locally. NO SMC issued, no PAS executed, NO MMIO, no firmware loaded, no flash, no reboot, no device-state change. WHY THIS ROUND EXISTS: ROUND 112 dispatched CI to settle whether the exported SMC symbol reaches the linked image - the one claim local tooling could not test - and CI failed EARLIER than that question: the probe did not compile at all, so no kernel was ever linked and no symbol could be examined. Two independent defects were stacked, and the second was only visible after the first was fixed. (a) DEFECT 1, A GUARD THAT DISARMED ITS OWN FALLBACK. package/EnchiladaAdrenoProbe.cpp used to read: include the generated header when __has_include says it is there, OTHERWISE `#define ADRENO_ZAP_BLOB_V1_H`. But ADRENO_ZAP_BLOB_V1_H is exactly the sentinel the immediately following `#ifndef ADRENO_ZAP_BLOB_V1_H` tests. Defining it in the else branch therefore announced to the fallback that a real header had been included, at the precise moment none had been, so the entire fallback block of constants was SKIPPED. The compiler then reported SEVEN undeclared identifiers, at :890 kAdrenoZapRegionPhys, :891 kAdrenoZapSegBytes, :922 kAdrenoZapRegionPhys, :939 kAdrenoZapBlobPresent, :940 kAdrenoZapSegBytes, :941 kAdrenoZapRegionPhys and :942 kAdrenoZapRegionBytes - line numbers as reported by CI #247. THE LINE READ LIKE a harmless this-branch-is-handled marker and was in fact the opposite. (b) DEFECT 2, ONLY VISIBLE AFTER DEFECT 1 WAS GONE. With the sentinel removed the file still failed: the four fallback placeholders kAdrenoZapMdtSha256, kAdrenoZapSegSha256, adreno_zap_mdt and adreno_zap_seg were defined but never read in that translation unit, so both real builders - which compile with -Werror (build-enchilada-adreno.py:35 and check-enchilada-adreno-probe.py:30) - failed them as -Wunused-const-variable. THE LOAD-BEARING DETAIL, and the reason this was invisible for so long: the SAME declarations in the GENERATED header do NOT trigger the warning, because clang suppresses unused-const-variable for declarations that arrive through an #include. A fallback written inline in the .cpp gets no such treatment. Verified this round both ways: the real header included and never used compiles clean, while the inline fallback without the attribute produces exactly those four errors. They are therefore marked __attribute__((unused)) - not cosmetic, load-bearing. (c) THE GUARD NOW DOES THE MINIMUM AND SAYS WHY. The else branch no longer defines anything: absence of the header simply leaves the sentinel undefined, so the following #ifndef is TRUE and the fallback block runs. The comment that replaces the old lines records the trap by name so it cannot be reintroduced by someone tidying up. (d) A REGRESSION GATE THAT REPRODUCES THE CI CONDITION LOCALLY. scripts/check-enchilada-adreno-probe.py gained a check that builds the probe against an ISOLATED include directory which it first ASSERTS lacks AdrenoZapBlobV1.h, using the same strict warning set. That is the state every CI host is in and the state no developer tree is in, which is what made this class of bug invisible. probe went from 18 to 20 checks. TWO MUTATIONS were run to prove the gate bites rather than merely passing: re-injecting the sentinel define reproduces all seven undeclared identifiers, and removing the unused attributes reproduces all four -Wunused-const-variable errors. Both revert to clean. (e) THE REAL LESSON: THIS PROJECT FIRST ENVIRONMENT-DIFFERENCE FAILURE. Every local gate was GREEN while CI was RED, and none of them was wrong - they were answering a different question. On this host the gitignored generated header EXISTS as a 2118 B absent stub, so __has_include was TRUE, the header was included, and the fallback never ran. CI does a clean checkout of a repository that gitignores that header and has no step that generates it, so __has_include was FALSE and the fallback ran - badly. The probe check 18/18, the host suite 31/31 and all 71 verifiers passed before CI was dispatched, and all of them were honest; none of them compiled the file in the condition CI compiles it in. That is now the gate above. (f) THE WRONG FIX, RECORDED SO IT IS NOT ATTEMPTED. Do NOT make a future red build green by running scripts/generate-zap-blob.py before CI. That manufactures the header, so the fallback branch is never exercised, and this exact class of bug becomes invisible again - while CI would still not be testing what CI is for. The absence of the header is a REAL build condition, not an accident to be papered over: the fallback exists to make that condition compile HONESTLY, with present=0 and the log line reading blob=absent, rather than to hide it. The commentary in both the probe and the gate states this explicitly. VERIFICATION THIS ROUND: the probe check is 20/20 rc 0. Independently of that gate, the probe was compiled with strict flags in BOTH conditions - header absent from the include path rc 0, header present rc 0 - so the two branches are both exercised rather than one being assumed. The two mutation results above are reproduced in this round own logs. HONEST BOUNDARY UNCHANGED: modeled=9 / satisfied=0 / BLOCKED, CONFIG_XNU_NATIVE_ADRENO=n, the gpu area stays host-verified, the GPU has NEVER rendered, adreno_zap_auth_ready() is still derived and still 0. THIS ROUND FIXED A BUILD BREAK; IT STILL DID NOT PROVE THE SMC SYMBOL REACHES THE LINKED IMAGE. That assertion from ROUND 110 remains UNCLOSED and still needs a green CI artifact to settle - repairing the compile is a precondition for asking the question, not an answer to it. HANDOFF.md v2 (workspace handoff, NOT a repository file): still ONEPLUS/HANDOFF.md, still outside the device repository, still deliberately unpublished because it quotes local absolute Windows paths and 