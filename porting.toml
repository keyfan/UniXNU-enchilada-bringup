limits = [
    'FINAL STATE (2026-11-08): stage 3 display work is CI-compiled and device-observed. Remaining honest limits: no optical brightness readback, CoreBrightness userspace acceptance UNCONFIRMED (req=0), and which ptrauth branch the CI SDK selected is not observable from the L row. All earlier limits entries below are HISTORICAL and superseded by CI #211 + backlight211mode4.',
    'Layer 3d-beta is now CI-compiled and device-observed, but a real panel luminance change is NOT measured (no optical readback); userspace CoreBrightness acceptance is CONFIRMED only if req>0 was observed. Both are stated honestly in evidence/backlight211mode4.md.','Layer 3d-beta [HISTORICAL STATE, superseded by CI #211 + backlight211mode4]: was HOST-VERIFIED ONLY: no CI build under real macOS/Xcode XNU headers yet (stubs are not ABI-equivalent, CI #207), NOT flashed, NO L-row produced on device, NO runtime metaclass lookup / CoreBrightness acceptance / measured brightness change yet. The 8-archive-object late-objcopy recipe, the enchilada-backlight=4 gate, and the enchilada_backlight_transmit hook are all host-verified but await CI + device verification. The real XNU ABI (ptrauth vs non-ptrauth branch selection, OSMetaClass macros, IOService signatures) can ONLY be settled by CI. Modes 1/2/3 remain DEVICE-VERIFIED and byte-identical to the e200f1ab remote blob.', 'Layer 3d-alpha is pure C + host tests ONLY: no IOKit IOService class, no OSMetaClass, no metaclass lookup, no register access, no L-row produced on device. It has NOT been CI-compiled under real macOS/Xcode XNU headers and NOT flashed. The layer 3d-beta EnchiladaBacklight : IOService class body, its late-object objcopy (--remove-section=__DATA,__mod_init_func --globalize-symbol=__GLOBAL__sub_I_EnchiladaBacklight.cpp), the 16 ms fade work loop bound to msm_dsi_brightness_send(), and the runtime metaclass-lookup / CoreBrightness acceptance check are all still pending.', "No OS-facing brightness service exists: no IODisplayParameters/brightness/backlight-control publication. The DCS packet bytes (layer 1), the MSM DSI0 CMD DMA transmit path (layer 2), and the read-only runtime probe (layer 2.5) are constructed and host-verified; layer 2.5 is now DEVICE-VERIFIED (backlight208: 510 L rows st=3, seven live DSI0 registers matching mainline command-mode constants, control console206 all zeros). NO packet reaches the panel yet: layer 2.5 deliberately writes nothing and triggers no DMA, and the 1 Hz probe is gated by enchilada-backlight=1 (default off). Sending a brightness packet still needs the CMD-DMA address question (physical vs MDSS SMMU IOVA) and cache maintenance settled. Layer 3 (AppleARMBacklight-facing IOService + the transmit-side runtime probe) is still required. A cold-boot full-controller reprogram is deliberately NOT done because the panel is already lit by the UEFI GOP framebuffer.", "Layer-3 prerequisite read-only SMMU survey (MsmDsiSmmu.c) is now CI-compiled (CI #209, real macOS/Xcode XNU headers, 5-object archive PASS) and DEVICE-VERIFIED (backlight209mode2: 510 L rows st=4, verdict=Bypass). The CMD-DMA physical-vs-IOVA question is RESOLVED: the enchilada display context bank has SCTLR.M=0 (translation OFF), so a CPU physical address is safe for REG_DSI_DMA_BASE. The survey wrote nothing (no wr callback) and triggered no DMA. Still unproven: an actual brightness change, DCS packet transmission, and the layer-3 AppleARMBacklight IOService.", "Layer 3a (pure-C transmit orchestrator) and layer 3b (gated enchilada-backlight=3 C++ shim) are HOST-VERIFIED ONLY: compiled with local stubs, host-tested and statically diffed against the device-verified baseline, but NOT yet CI-compiled under real macOS/Xcode XNU headers and NOT flashed. No real DCS brightness packet has reached the panel, no brightness change has been observed, and it is still UNKNOWN whether the kernel DMA allocation lands below the 32-bit REG_DSI_DMA_BASE limit on this device. The layer-3d AppleARMBacklight-facing IOService does not exist. Only layers 1 / 2 / 2.5(mode 1) / mode-2 survey are DEVICE-VERIFIED so far.", "Layer 3a (pure-C transmit orchestrator) and layer 3b (gated enchilada-backlight=3 C++ shim) are now CI-COMPILED (CI #210, real macOS/Xcode XNU headers, 6-object archive PASS) and DEVICE-VERIFIED (backlight210mode3: 510 L rows st=5, one DCS packet sent at level 512, DMA_BASE physical address 0xae01a000 < 4 GiB, rc=0). Remaining limit: there is still NO measured brightness change on the panel (the harness has no framebuffer/photo/light-sensor readback), NO continuous brightness control (fixed one-shot level 512), and NO OS-facing AppleARMBacklight IOService / IODisplayParameters.brightness / backlight-control / 16 ms fade (layer 3d). Modes 1/2/3 are all gated (default off) and the transmit is one-shot; a cold-boot full-controller reprogram is deliberately NOT done because the panel is already lit by the UEFI GOP framebuffer."]
