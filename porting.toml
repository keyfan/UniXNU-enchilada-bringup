configuration = ["CONFIG_XNU_EXTRA_LD_ARCHIVES force-loads libNativeDwc3.a; native-dwc3-probe=3 activates the gadget; VID 0x1209 / PID 0x0001, CDC-ACM with 1 control + 2 bulk + 1 interrupt endpoint; 9600 default line coding, host-set 115200 echoed back."]
procedure = ["Local: build-enchilada-dwc3.py compiles Dwc3Gadget.cpp + NativeDwc3.cpp under -Werror; CI archives it; on device the gadget thread waits for boot_log_rounds, applies the VBUS override, soft-resets the core, programs EP0, answers SETUP requests, and streams the boot log over bulk IN."]
findings = ["The board is USB2-only with no UCSI/eUSB2/QMP PHY, so sheng's QcomDwc3 (AppleUSBXDCI/AppleUSBXHCI stack, USB3 10 Gbps, Mac pairing) is not applicable; a self-contained CDC-ACM gadget was implemented instead.", "QSCRATCH VBUS override (HS_PHY_CTRL 0x10 bit20 UTMI_OTG_VBUS_VALID + bit28 SW_SESSVLD_SEL, SS_PHY_CTRL 0x30 bit24 LANE0_PWR_PRESENT) was the key that changed ev from 0 to 20 and USBLNKST from 4 to 3; without it the controller never saw a session.", "Windows' usbser.sys needs both the SERIAL_STATE carrier (DSR|DCD = 0x0003, 10-byte notification) and a GET_LINE_CODING that echoes the just-written rate; missing either one produces 'The semaphore timeout period has expired.' on SerialPort.Open()."]
completion = ["The host enumerates the device, opens the COM port, and bidirectional byte flow is confirmed with a matching source revision."]
limits = ["This is a vendor-specific CDC-ACM gadget, not Apple's USB device/host stack; no USB3, no host mode, no trust/pairing dialog, no lockdown.", "QcomDwc3 is listed as the intended catalog component but is not linked."]
