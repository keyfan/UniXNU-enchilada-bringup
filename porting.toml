  '[ROUND 77 2026-11-12, HONEST BOUNDARY] A DERIVATION MODEL is not a map. AdrenoVaMapV1 issues no MMIO, allocates no page table, maps nothing and emits no VA; adreno_va_map_ready() is derived from the three-blocker mask and is 0, so it flips only when all three genuinely exist. board-va-map is modelled=1 / satisfied=0 for exactly that reason, recorded the same way cp-ring, zap-auth and kgsl-smmu-stage1 were before their rules were written down. The GPU and GMU address spaces are kept strictly distinct because their names and owners differ in the pinned sources, and the verifier proves the two end values differ for every plausible ias rather than trusting the comment. No device run, no flash, m39510 NOT exercised, CONFIG_XNU_NATIVE_ADRENO=n, the A630 client GPU windows stay all-zero; the gpu area STAYS host-verified and this does NOT unblock stage 5.',
