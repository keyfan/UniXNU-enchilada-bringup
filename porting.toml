  '[ROUND 74 2026-11-12, HOST-VERIFIED] AdrenoMdtV1 supplies the XNU-side replacement for the rules behind zap-auth steps S6 (qcom_mdt_get_size) and S7 (qcom_mdt_load), and validates them against the REAL a630_zap.mdt pulled read-only from this phone in round 38 - not against a mock. TWO sha256 pins: drivers/soc/qcom/mdt_loader.c 12182 B and include/linux/soc/qcom/mdt_loader.h 2179 B. FOUR RULES encoded: (1) mdt_phdr_valid (:21-33) requires p_type == PT_LOAD AND (p_flags & TYPE_MASK) != TYPE_HASH AND p_memsz != 0, three INDEPENDENT conditions; (2) qcom_mdt_get_size (:76-103) is ALIGN(max(p_paddr+p_memsz), 4K) - min(p_paddr) over VALID phdrs ONLY - never the file size and never a sum; (3) the split naming (:35-68) REPLACES the last three characters with bNN, so a630_zap.mdt -> a630_zap.b01; (4) the metadata rule (:126-176) needs e_phnum >= 2, phdrs[0] NOT PT_LOAD, the hash segment being the first phdr whose TYPE bits are HASH, and SPLIT iff ehdr_size + hash_size == the file size. Constants from the header: TYPE_MASK 7<<24, TYPE_HASH 2<<24, RELOCATABLE BIT(27). WHAT THE REAL BLOB SAYS (measured): 6684 B, ELF32 LE, e_machine 0xa4 EM_HEXAGON 164 AT BYTE 18 (not aarch64 - round 38 correction holds), e_phoff 52, e_phentsize 32, e_phnum 3; ph[0] type 0 filesz 148 memsz 0 INVALID; ph[1] type 0 off 4096 filesz 6536 memsz 8192 INVALID; ph[2] type 1 paddr 0x5000 filesz 1968 memsz 1968 VALID and RELOCATABLE. Region size 4096; p_filesz sum 8652. THREE CROSS-CHECKS ALL HOLD: (a) the three p_filesz values 148/6536/1968 are EXACTLY the device a630_zap.b00/.b01/.b02 sizes recorded in round 38 - the verifier asserts this against scripts/data/adreno-a630-device-firmware.json rather than a constant; (b) ehdr_size 148 + hash_size 6536 = 6684 = the whole file, so this MDT takes the SPLIT branch and its PAS metadata blob is the entire .mdt, not a 148-byte slice; (c) only ONE of three segments is loadable, so get_size answers 4096 from a 6684-byte container while the p_filesz sum is 8652 -