  '[ROUND 105 2026-11-14, HOST-VERIFIED + DEVICE-SOURCED / READ-ONLY AUDIT] K3 SIGNING-CHAIN FEASIBILITY (evidence/stage5-gpu-k3-feasibility.md). WHY: user m04891 asked for next options, chose m04898 the READ-ONLY K3 feasibility audit (no code, no flash, no reboot, no device-state change, no CI dispatch), to decide whether the whole (B) "Adreno 真的参与渲染" route is worth further investment. RESULT: K3 is re-classified from BLOCKED / hardest single piece to CONDITIONALLY FEASIBLE / IMPLEMENTABLE-WITH-EFFORT. THREE HISTORICAL CLAIMS CORRECTED. (1) The 3 vendor-signed ZAP blobs are NOT absent: ROUND 38 pulled SEVEN proprietary blobs read-only from this exact phone vendor_a (a630_gmu.bin 32768 B, a630_sqe.fw 31980 B, a630_zap.b00/.b01/.b02 = 148/6536/1968 B, a630_zap.elf 14256 B, a630_zap.mdt 6684 B), sizes and sha256 re-verified this round against scripts/data/adreno-a630-device-firmware.json; feasibility.md:35 absent meant workspace/public-mirror only and porting.toml:475 ROUND 38 SUPERSEDES it. The signed split MDT/b00/b01/b02 chain is device-vendor-only and this device HAS it, so the cannot-forge-an-OEM-signature objection does not apply to these authentic blobs. (2) "no SCM transport in XNU" (stage5-gpu-zap-auth.md:134) and "XNU has no qcom_scm equivalent" (this file, ROUND 74 line) are FALSE AT THE MECHANISM LEVEL: drivers/ArmCpu/ArmCpu.cpp:119-158 defines static ScmResult scm() with __asm__ volatile smc #0 (:134), scmDisableCrashdump() issues real SMC32-SIP fids 0xC2000109/0xC2000110/0xC2000501/0xC2000502 and stores 8 results in armcpu_scm[8]; :607-616 calls it under enchilada-wdog=3; package/BootReset.c:46-50 prints them. DECISIVE DEVICE PROOF (new this round): a fresh scan of the already-pulled authoritative round-103 UTF-8 32 MiB window (work/tmp/r103_stage6_window.bin, the SAME window that carries stage6=id1 tcr=b5100080) shows 509 identical snapshots of "scm avail sdi=1 dl=0 wr=1 sdi=0 tcsr=10 dl=-1 wr=0 tcsr=0", ONE distinct tuple, NO -99 never-executed sentine