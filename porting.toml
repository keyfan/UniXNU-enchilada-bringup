  { kind = "source", reference = "drivers/NativeMsmDsi/MsmDsiBrightness.c", result = "Stage 3 layer 3a: pure-C (freestanding, no libc) brightness-transmit orchestrator: 32-bit REG_DSI_DMA_BASE refusal gate (refuse when (phys>>32)!=0 before any register write), clean(va,len) cache-maintenance hook between DMA-buffer fill and trigger, layer-1 dsi_dcs_set_brightness_large -> layer-2 msm_dsi_cmd_prepare/commit/wait_idle/restore, L st=5 publish; CTRL restored even on timeout." },
  { kind = "source", reference = "drivers/NativeMsmDsi/MsmDsiBrightness.h", result = "Stage 3 layer 3a API: msm_dsi_brightness_send()/msm_dsi_brightness_publish(), result/counters structs, stage enums (Tx=5, NoIo=-1, AddrTooHigh=-2, Packet=-3, Dma=-4); documents the two independent verifications (vendor DTS + Linux v6.12; device SMMU bypass) and the dc civac + dsb sy rationale." },
